- change_summary: "## Analysis of `_nearest_neighbor_mapper_v3` for the Given Config\n\
    \n### 1. Key Weaknesses of the Current Nearest-Neighbor Approach\n\n**a) Greedy,\
    \ single-anchor nearest-neighbour packing**  \nFor every layer after the first,\
    \ the mapper chooses the chiplet that received the largest share of the *previous*\
    \ layer as the \u201Canchor\u201D and then allocates capacity purely by increasing\
    \ hop distance from that single anchor. This ignores the fact that the previous\
    \ layer\u2019s output activations are distributed across *many* chiplets (according\
    \ to that layer\u2019s percentage split). Communicating activations from all those\
    \ source chiplets to the new layer\u2019s destination chiplets now incurs a weighted\
    \ sum of distances \u2013 the algorithm never computes nor minimises this cost.\n\
    \n**b) No global load\u2011balancing or fragmentation avoidance**  \nThe algorithm\
    \ fills chiplets in strict distance order (closest first, then outward rings).\
    \ Once a chiplet is completely filled, the next\u2011closest is used. This leads\
    \ naturally to a \u201Cblob\u201D of densely packed weights near the starting\
    \ anchor while more distant chiplets remain empty. Later layers that are large\
    \ may then need to use far\u2011away chiplets, creating an unnecessarily scattered\
    \ layout and poor inter\u2011layer locality. In extreme cases, the greedy packing\
    \ could even fail to map a model despite sufficient total capacity because the\
    \ filled\u2011up local region cannot accommodate a subsequent large layer (though\
    \ in this config with 96 large CMOS chiplets, total capacity is unlikely to be\
    \ the bottleneck, but fragmentation still hurts communication efficiency).\n\n\
    **c) Blind to I/O placement**  \nThe 10\xD710 mesh has four I/O chiplets at the\
    \ corners. When mapping a network like VGG16, input activations must enter from\
    \ an I/O and final results must be sent to an I/O. The current mapper:\n* For\
    \ the first layer, selects the starting chiplet based solely on available memory\
    \ and a static \u201Cperformance\u201D metric \u2013 it never considers proximity\
    \ to any I/O.\n* For the last layer, it again only cares about where the previous\
    \ layer\u2019s maximum\u2011share chiplet is, ignoring the cost of sending results\
    \ back to an I/O.\nThis can add unnecessary hops to the critical data\u2011injection\
    \ and result\u2011collection phases.\n\n**d) Over\u2011simplified \u201Cfailure\u201D\
    \ tolerance**  \nThe mapper declares a mapping failure if `resources_remaining\
    \ - 10 > 0`, using a magic number 10 as a tolerance for rounding errors. The origin\
    \ of 10 is unclear; it may reject valid mappings that could be completed with\
    \ a small over\u2011allocation or accept mappings that are actually slightly infeasible.\
    \ A proper, config\u2011aware tolerance (e.g., a fraction of one chiplet\u2019\
    s capacity unit) would be safer.\n\n**e) Ignores layer\u2011type driven communication\
    \ volume**  \nConvolutional layers have far larger activation volumes than fully\u2011\
    connected layers, making the distance between successive conv layers much more\
    \ performance\u2011critical. The mapper treats all layers identically, so it may\
    \ waste large distances on early, high\u2011volume conv layers while later, low\u2011\
    volume FC layers get preferential close placement.\n\n**f) Static, pre\u2011computed\
    \ shortest\u2011path lookup used only as scalar distance**  \nThe mapper uses\
    \ a simple hop\u2011count distance without considering the actual network topology\u2019\
    s bandwidth, routing congestion, or the fact that multiple concurrent flows (if\
    \ pipelining were used, though here `non\u2011pipelined` mode is set) would contend.\
    \ Even in the non\u2011pipelined case, a more careful distance model (e.g., Manhattan\
    \ distance on a mesh) is already captured by hop count, but the mapper does not\
    \ exploit the regular grid to bias placement toward the center or to avoid edges.\n\
    \n### 2. Specific Opportunities for Improvement Given This Config\n\n**a) Multi\u2011\
    source aware starting\u2011chiplet selection**  \nInstead of using only the previous\
    \ layer\u2019s maximum\u2011share chiplet, compute the **weighted centroid** (by\
    \ percentage) of all source chiplets. Choose the starting chiplet for the new\
    \ layer that minimises the **total communication cost** for the previous layer\u2019\
    s activations, i.e., `argmin_{c} \u03A3_{s} (ps * dist(s, c))` where `ps` is the\
    \ percentage of the previous layer on source `s`. This directly reduces inter\u2011\
    layer activation movement.\n\n**b) I/O\u2011aware first/last layer placement**\
    \  \n* For the first layer, bias the starting chiplet toward the nearest I/O that\
    \ will inject input data.  \n* For the final output layer, ensure the layer\u2019\
    s mapped chiplets are close to an I/O (or prefer the I/O\u2011adjacent corner\
    \ chiplet as the anchor).  \nOn the 10\xD710 mesh with corner I/Os, this can cut\
    \ several hops from the critical path.\n\n**c) Global compaction and load balancing\
    \ heuristic**  \nAfter selecting a per\u2011layer anchor, rather than a pure distance\u2011\
    ordered fill, use a **bounded expansion** that spreads the layer only to chiplets\
    \ that are not yet heavily occupied, while still respecting a distance budget.\
    \ For example, prefer chiplets within `K` hops that have high free capacity, and\
    \ only expand beyond `K` when necessary. This creates a more balanced \u201Cfootprint\u201D\
    \ over the mesh and reduces later hot\u2011spot formation.\n\n**d) Topology\u2011\
    aware spatial packing**  \nThe 10\xD710 mesh is a regular grid. Instead of ordering\
    \ candidates by generic shortest\u2011path distance, one could use a **Moore\u2011\
    neighbourhood expansion** (i.e., expanding outward in Manhattan rings) to create\
    \ compact, rectangular\u2011like clusters that map better to the underlying mesh\
    \ routing. This naturally preserves locality and can reduce average distance.\n\
    \n**e) Communication\u2011cost\u2011driven layer splitting**  \nCurrently the\
    \ partitioner splits layers along output channels *after* the mapper has assigned\
    \ percentages. The mapper could be extended to **explicitly minimise** the post\u2011\
    mapping communication cost for the *current* layer\u2019s output partitions to\
    \ the *next* layer\u2019s chips. This would turn the problem into a mini\u2011\
    assignment that could be solved with a simple greedy or Hungarian\u2011like algorithm,\
    \ given that the next layer\u2019s placement is also being determined.\n\n**f)\
    \ Remove magic tolerance**  \nReplace the hard\u2011coded `10` with a dynamic\
    \ tolerance based on the smallest capacity unit of a chiplet (e.g., 1% of `chiplet.get_capacity_unit_size()`).\
    \ This prevents false failures and makes the mapper more robust to any chiplet\
    \ size.\n\n### 3. Data/Signals the Mapper Currently Ignores That It Should Use\n\
    \n| **Ignored data/signal** | **How it should be used** |\n|--------------------------|---------------------------|\n\
    | **I/O chiplet coordinates** | Prioritise proximity to the input I/O for the\
    \ first layer and to an output I/O for the final layer(s). |\n| **Previous layer\u2019\
    s full percentage distribution** (list of (chiplet, %)) | Compute a weighted communication\
    \ cost to all source chiplets when choosing the anchor for the next layer, not\
    \ just the maximum\u2011share chiplet. |\n| **Activation volume per layer** (e.g.,\
    \ output feature\u2011map size \xD7 bits_per_activation) | Weight the importance\
    \ of locality by the number of bits that must be communicated; give higher priority\
    \ to shortening distances for layers with large activation volumes (conv layers).\
    \ |\n| **Layer type (conv/FC/attention)** | Conv layers have spatial locality\
    \ in their output channels; placing them close together helps. FC layers are smaller;\
    \ they can be placed farther apart. Use a type\u2011dependent distance budget.\
    \ |\n| **Chiplet occupancy / fragmentation state** | Even for CMOS chiplets (units\
    \ = weights), the current allocation ignores fragmentation. Monitoring the *number\
    \ of weight units left* vs. *available capacity* could guide how aggressively\
    \ to fill a chiplet vs. spreading across multiple lightly\u2011filled chiplets\
    \ to avoid later \u201Cfull\u2011chiplet\u201D bottlenecks. |\n| **Network topology\
    \ regularity** (grid coordinates) | Instead of generic shortest\u2011path distances,\
    \ exploit the mesh\u2019s Manhattan geometry to impose a preferred expansion direction\
    \ (e.g., keep the mapped set convex) and avoid edge\u2011of\u2011mesh chiplets\
    \ that have fewer neighbours. |\n| **Capacity\u2011unit granularity (weight unit\
    \ size)** | Use `get_capacity_unit_size()` when setting tolerance for failure;\
    \ the magic number 10 ignores that different chiplet types may have very different\
    \ unit sizes (here it\u2019s 1 weight). The tolerance should scale accordingly.\
    \ |\n| **Performance metric value** | Currently used only as a secondary tie\u2011\
    breaker when selecting the first\u2011layer anchor. It could be used more actively:\
    \ e.g., prefer chiplets with higher compute capability (if heterogeneous) to handle\
    \ the largest percentage of compute\u2011heavy layers. |\n| **Weight\u2011loading\
    \ strategy (all\u2011at\u2011once)** | While not critical during runtime, the\
    \ one\u2011time weight\u2011loading phase could benefit from proximity to the\
    \ I/O that streams weights. The mapper could place the most weight\u2011heavy\
    \ layers close to an I/O to reduce initial loading time, but this is a secondary\
    \ optimisation. |\n| **Communication mode (non\u2011pipelined)** | In non\u2011\
    pipelined mode, layers execute sequentially with no overlap. Therefore **all**\
    \ source\u2011destination communications happen sequentially; the total execution\
    \ time is dominated by the slowest transfer. The mapper could explicitly minimise\
    \ the **maximum** inter\u2011chiplet distance across all layer boundaries (minimax)\
    \ rather than just the nearest\u2011neighbour cost. |\n\n**Summary**  \nThe current\
    \ mapper is a simple, single\u2011anchor nearest\u2011neighbour packer that completely\
    \ ignores I/O placement, multi\u2011source inter\u2011layer communication, activation\
    \ volume, and global load balancing. For the given 10\xD710 mesh with 96 homogeneous\
    \ CMOS chiplets and a weight\u2011stationary VGG16 workload, these deficiencies\
    \ can lead to unnecessarily long inter\u2011layer communication paths, especially\
    \ for early high\u2011volume conv layers and for the final I/O interactions. Addressing\
    \ the gaps above\u2014particularly incorporating all source chiplet distances,\
    \ I/O proximity, and a load\u2011balancing expansion policy\u2014would significantly\
    \ reduce communication latency and improve overall simulation performance."
