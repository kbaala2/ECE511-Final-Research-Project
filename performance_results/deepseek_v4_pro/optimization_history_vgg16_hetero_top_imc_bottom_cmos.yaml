- change_summary: "**Mapping Weakness Analysis & New Optimization Strategy**  \n*Based\
    \ on the provided config (10\xD710 mesh, 96 CMOS chiplets, VGG16, non\u2011pipelined\
    \ execution)*\n\n---\n\n### 1. Key weaknesses of the current nearest\u2011neighbor\
    \ approach (relevant to this config)\n\n- **Single\u2011anchor greediness**: Only\
    \ the maximum\u2011share chiplet of the previous layer dictates the next layer\u2019\
    s placement; the weighted communication cost to all source chiplets is ignored.\
    \  \n- **Unconstrained blob expansion**: Chiplets are filled in strict hop\u2011\
    distance order, creating dense, early\u2011filled clusters that later starve nearby\
    \ chiplets for subsequent large layers \u2013 this forces those layers to scatter\
    \ far away.  \n- **I/O blindness**: The first layer chooses its anchor solely\
    \ by available memory, never considering proximity to an injection I/O. The last\
    \ layer(s) are placed near the previous layer\u2019s max chip, ignoring distance\
    \ to an egress I/O.  \n- **Magic\u2011number failure tolerance**: The `resources_remaining\
    \ \u2013 10 > 0` check uses a hard\u2011coded tolerance unrelated to the chiplet\u2019\
    s weight\u2011unit granularity.  \n- **Uniform treatment of layers**: High\u2011\
    volume convolutional activations are not given priority over low\u2011volume FC\
    \ connections.  \n- **Topology under\u2011utilization**: The regular mesh geometry\
    \ is not exploited to create compact, convex clusters; edge chiplets are not de\u2011\
    prioritised.  \n\n---\n\n### 2. Specific improvement opportunities given this\
    \ config\n\n- **Weighted multi\u2011source anchor selection**: Replace the single\u2011\
    max anchor with the chiplet that minimises \u03A3 (source_% \xD7 hop_distance)\
    \ across all source chiplets of the previous layer.  \n- **I/O\u2011aware first\
    \ & last layer placement**: For the first layer, bias the anchor toward the nearest\
    \ injection I/O. For the final output layer, similarly force placement close to\
    \ any I/O.  \n- **Bounded\u2011expansion packing with capacity balancing**: After\
    \ choosing an anchor, expand only within a distance budget while preferring chiplets\
    \ with high remaining capacity; this prevents early over\u2011consolidation and\
    \ maintains free space for later layers.  \n- **Exploit Manhattan geometry**:\
    \ Use Moore\u2011neighbourhood rings to build rectangular, contiguous footprints\
    \ that map well to the mesh.  \n- **Activation\u2011volume weighting**: Scale\
    \ the \u201Clocality importance\u201D of each inter\u2011layer edge by the size\
    \ of its activation tensor (feature map size \xD7 bits_per_activation), giving\
    \ higher priority to keeping conv\u2011to\u2011conv transitions close.  \n- **Replace\
    \ magic tolerance**: Use a failure threshold based on a small fraction of the\
    \ chiplet\u2019s capacity\u2011unit size (e.g., `0.01 * chiplet.get_capacity_unit_size()`).\
    \  \n\n---\n\n### 3. Critical data/signals the mapper currently ignores\n\n| **Ignored\
    \ signal**                        | **Why it matters**                       \
    \                                                                            \
    \                                   |\n|-------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------|\n\
    | I/O chiplet coordinates                   | Input and output data must traverse\
    \ the distance to an I/O; placing first/last layers nearby cuts critical latency.\
    \                                      |\n| Full source distribution of previous\
    \ layer | The real communication cost is a weighted sum over all source chiplets,\
    \ not just the one with the largest share.                                   \
    \      |\n| Activation volume per layer               | Conv layers generate huge\
    \ data movement; minimising their inter\u2011layer hop distance yields disproportionate\
    \ latency benefits.                             |\n| Layer type (conv vs. FC)\
    \                  | Conv layers should be packed tighter; FC layers, which are\
    \ smaller and generate less data, can tolerate larger distances.             \
    \                  |\n| Chiplet occupancy balance / fragmentation | A highly unbalanced\
    \ fill leads to early exhaustion of a local region, forcing later large layers\
    \ to map far away.                                        |\n| Grid regularity\
    \ (2D coordinates)          | Exploiting Manhattan distances and avoiding edge\
    \ chips (fewer neighbours) can create more compact and communication\u2011friendly\
    \ clusters.                  |\n| Capacity\u2011unit granularity (weight\u2011\
    unit size) | The failure tolerance must scale with the actual unit size to avoid\
    \ spurious failures.                                                         \
    \        |\n| Non\u2011pipelined execution mode              | In this mode, the\
    \ slowest inter\u2011layer transfer dominates total latency; the mapper should\
    \ minimise the *maximum* hop distance across layer boundaries.   |\n\n---\n\n\
    ### New Optimization Strategy (Different from Previous Attempts)\n\nThe two previous\
    \ attempts (based on the analysis excerpts) likely incorporated multi\u2011source\
    \ anchor selection and I/O awareness but still suffered from the fundamental \u201C\
    blob\u201D expansion that fragments capacity and forces later layers apart. Because\
    \ those refinements yielded *no latency improvement*, a **more radical placement\
    \ paradigm** is needed.\n\n**Proposed strategy: Linear Pipeline Placement along\
    \ a Hamiltonian Path from Input I/O to Output I/O**\n\n*Concept*: Instead of letting\
    \ each layer freely choose its anchor from the previous layer\u2019s maximum\u2011\
    share chiplet, we pre\u2011define a **total chip ordering** that forms a spatial\
    \ pipeline through the mesh, starting near the injection I/O and ending near an\
    \ egress I/O. All layers are then **mapped sequentially** along this path, ensuring\
    \ that every layer\u2019s weight\u2011holding chiplets are **physically adjacent\
    \ (or overlapping) in the pipeline order**. This guarantees that data always flows\
    \ forward with minimal hop distance (ideally 1\u20132 hops) and completely avoids\
    \ the fragmentation\u2011induced scatter.\n\n**Key implementation steps**:\n1.\
    \ **Compute a Hamiltonian path** (or a space\u2011filling curve, such as a snake\
    \ scan) that visits every compute chiplet exactly once, while keeping the start\
    \ point close to the injection I/O and the end point close to an output I/O. For\
    \ a 10\xD710 mesh with I/Os at the four corners, a simple row\u2011major snake\
    \ scan from the top\u2011left corner (C1) to the bottom\u2011right corner (C100)\
    \ works well, as it passes near two I/Os.\n\n2. **Assign each layer\u2019s weight\
    \ units sequentially** along this path. Maintain a pointer `current_chiplet` and\
    \ allocate the required weight units for layer *i* starting from that chiplet,\
    \ moving forward through the ordered list. If a chiplet does not have enough remaining\
    \ capacity, the layer \u201Cspills\u201D to the next chiplets in the path. This\
    \ ensures that all weight storage for a layer resides in a contiguous segment\
    \ of the path.\n\n3. **Inter\u2011layer locality**: Because successive layers\
    \ are placed in adjacent (or overlapping) path segments, the hop distance between\
    \ the source chiplets of layer *i* and the destination chiplets of layer *i+1*\
    \ is limited to at most the length of the overlapping segment or the gap between\
    \ the tail of *i* and the head of *i+1* \u2013 typically 0\u20112 hops. This directly\
    \ minimises the average and maximum communication distances.\n\n4. **Handle varying\
    \ layer sizes**: The path is long enough (96 chiplets) to accommodate all VGG16\
    \ layers, even the huge FC layers, because chiplets can hold weights from multiple\
    \ overlapping layers. If a layer is very large, it simply spans many consecutive\
    \ chiplets; the next layer begins immediately after the previous one finishes,\
    \ so the pipeline advances naturally.\n\n5. **First/last layer alignment**: The\
    \ first layer\u2019s start is intentionally set to the chiplet nearest the injection\
    \ I/O; the final layer\u2019s tail ends near an egress I/O. This removes the need\
    \ for I/O\u2011specific anchor heuristics.\n\n**Why this is different**: Previous\
    \ attempts enhanced the existing greedy anchor\u2011based approach, but they could\
    \ not overcome the fundamental tendency to create dense local blobs and then fragment\
    \ the rest. The pipeline strategy enforces **global spatial contiguity and monotonic\
    \ progression** from input to output, a property that the greedy method cannot\
    \ guarantee. It trades some packing flexibility (which in this over\u2011provisioned\
    \ mesh is not a bottleneck) for **hard locality guarantees**, which directly attack\
    \ the root cause of high communication latency.\n\n**Expected impact**: With non\u2011\
    pipelined execution, the total runtime is dominated by the slowest inter\u2011\
    layer communication. By bounding that distance to \u22642 hops for every layer\
    \ transition, the overall latency should drop substantially, even if some weight\u2011\
    loading overhead increases slightly (which is one\u2011time and therefore negligible\
    \ in steady\u2011state inference). This strategy is simple to implement, deterministically\
    \ hierarchical, and completely side\u2011steps the fragmentation problems of the\
    \ nearest\u2011neighbor approach."
