- change_summary: "### 1. Key Weaknesses of the Current Nearest-Neighbor Approach\n\
    \n**a) Single-anchor, greedy hop-distance packing**  \nAfter the first layer,\
    \ the mapper selects the chiplet that received the largest share of the *previous*\
    \ layer as the \u201Canchor,\u201D then allocates the new layer\u2019s capacity\
    \ in increasing hop distance from that anchor. This entirely ignores the fact\
    \ that the previous layer\u2019s output activations are spread across **multiple**\
    \ chiplets according to its own distribution. The resulting total inter\u2011\
    layer communication cost is proportional to the *weighted* distance over all source\
    \ chiplets, not just the single anchor, yet the mapper never computes or minimises\
    \ this true cost.\n\n**b) Unbalanced fill creating fragmentation and scattered\
    \ footprints**  \nThe mapper fills chiplets strictly in order of proximity to\
    \ the anchor (closest first, then outward rings). This creates dense \u201Cblobs\u201D\
    \ of allocated weights near the anchor while more distant chiplets remain largely\
    \ empty. Later layers, especially large ones, are forced to either pack tightly\
    \ into whatever local space remains or scatter far away when the local region\
    \ is exhausted. The resulting mapping exhibits poor locality between successive\
    \ layers and may unnecessarily increase average hop counts.\n\n**c) Completely\
    \ blind to I/O placement**  \nThe 10\xD710 mesh has four I/O chiplets at the corners.\
    \ The first layer\u2019s anchor is chosen based solely on available memory and\
    \ a secondary tie\u2011breaker metric; no consideration is given to the I/O that\
    \ will inject input data. The last layer(s) are placed near the previous layer\u2019\
    s maximum\u2011share chiplet, ignoring the distance needed to send final results\
    \ back to an I/O. This adds avoidable hops to the critical data\u2011ingress and\
    \ result\u2011egress phases.\n\n**d) Magic\u2011number tolerance for mapping failure**\
    \  \nThe condition `resources_remaining - 10 > 0` uses a fixed threshold of 10\
    \ crossbar/weight units to declare failure. The origin of 10 is arbitrary and\
    \ unrelated to the actual capacity\u2011unit granularity (here 1 weight unit for\
    \ CMOS). This can cause spurious rejections of feasible mappings or acceptance\
    \ of slightly infeasible ones, undermining reliability.\n\n**e) Equal treatment\
    \ of layers with vastly different communication volumes**  \nConvolutional layers\
    \ in VGG16 produce far larger activation volumes than fully\u2011connected layers\
    \ do. The mapper, however, applies the same placement logic to every layer, so\
    \ high\u2011volume conv\u2011to\u2011conv transitions may receive no better locality\
    \ than low\u2011volume FC\u2011to\u2011FC ones, wasting communication energy and\
    \ latency on the most expensive transfers.\n\n**f) Static shortest\u2011path distances\
    \ without topology exploitation**  \nThe mapper uses generic all\u2011pairs shortest\u2011\
    path lengths. While hop count on a mesh is already Manhattan distance, the algorithm\
    \ never exploits the regular grid geometry to prefer convex, centrally located\
    \ clusters or to avoid edge\u2011of\u2011mesh chiplets that have fewer neighbours\
    \ and therefore higher average distances for future expansions.\n\n### 2. Specific\
    \ Opportunities for Improvement Given This Config\n\n**a) Multi\u2011source communication\u2011\
    cost minimisation**  \nInstead of using only the previous layer\u2019s maximum\u2011\
    share chiplet, compute the **weighted centroid** of all source chiplets. For each\
    \ candidate anchor chiplet `c`, compute the total communication cost `\u03A3_s\
    \ (pct_s \xD7 dist(s, c))`, where `pct_s` is the previous layer\u2019s percentage\
    \ on source `s`. Choose the anchor that minimises this cost, then perform bounded\
    \ expansion from there. This directly reduces the dominant inter\u2011layer activation\
    \ movement.\n\n**b) I/O\u2011aware first\u2011 and last\u2011layer placement**\
    \  \n- First layer: bias the anchor selection toward the nearest I/O chiplet(s)\
    \ that will provide the input activation stream (e.g., the closest corner).  \n\
    - Last output layer: similarly bias the mapping to ensure the aggregated result\
    \ is close to at least one I/O.  \nFor a 10\xD710 mesh, this can save several\
    \ hops on the critical path, which is particularly impactful in the non\u2011\
    pipelined execution mode where total latency is dominated by the slowest link.\n\
    \n**c) Load\u2011balanced, bounded\u2011expansion packing**  \nRather than a pure\
    \ distance\u2011ordered fill, use a **capacity\u2011balanced expansion** within\
    \ a configurable hop\u2011radius. Prefer chiplets that have high free capacity\
    \ within the radius, and only expand beyond the radius when necessary. This prevents\
    \ early over\u2011consolidation, leaves nearby capacity available for later layers,\
    \ and yields more uniform chiplet utilisation, ultimately reducing fragmentation\
    \ and long\u2011range communication.\n\n**d) Regular\u2011grid spatial compaction\
    \ (Moore\u2011neighbourhood)**  \nExploit the mesh topology explicitly: begin\
    \ expansion from the selected anchor using **Manhattan\u2011distance concentric\
    \ rings** (Moore neighbourhood). Prefer placing the entire layer within a compact\
    \ rectangle or convex cluster. This inherent regularity maps naturally to physical\
    \ mesh routing and minimises internal hop distances within the layer\u2019s footprint.\n\
    \n**e) Communication\u2011cost\u2011aware layer partitioning linkage**  \nCurrently\
    \ the layer partitioner splits output channels *after* the mapper has fixed the\
    \ percentages. A future improvement could feed back estimated next\u2011layer\
    \ placement to guide the current layer\u2019s distribution, effectively solving\
    \ a mini\u2011assignment problem that minimises total communication for the produced\
    \ activations to the next layer\u2019s destination chiplets.\n\n**f) Remove magic\
    \ tolerance**  \nReplace the hard\u2011coded `10` with a dynamic tolerance equal\
    \ to, for example, `0.01 \xD7 chiplet.get_capacity_unit_size()` (or some small\
    \ fraction of the unit). This makes the failure check scale with the actual capacity\
    \ granularity, preventing false positives/negatives.\n\n### 3. Data/Signals the\
    \ Mapper Currently Ignores That It Should Use\n\n| **Ignored data/signal**   \
    \                | **How it should be used** |\n|--------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n\
    | **I/O chiplet coordinates and identity**  | Prioritise proximity to the input\
    \ I/O for the first layer and to an output I/O for the final layer(s), reducing\
    \ critical ingress/egress latency.                     |\n| **Previous layer\u2019\
    s full percentage distribution** | Compute a weighted communication cost to all\
    \ source chiplets, not just the single max\u2011share chiplet, when selecting\
    \ the anchor for the next layer.            |\n| **Activation volume per layer**\
    \ (e.g., output feature map size \xD7 bits_per_activation) | Weight the locality\
    \ importance by the number of bits that must traverse the network; give higher\
    \ priority to minimising distance for layers with large output activations (mostly\
    \ early conv layers). |\n| **Layer type (conv vs. FC vs. attention)** | Use a\
    \ type\u2011dependent distance budget; conv layers, which generate dense activations,\
    \ should be packed more tightly together, while smaller FC layers can tolerate\
    \ greater distances. |\n| **Chiplet occupancy / fragmentation state** | Track\
    \ not only how many capacity units remain but also how fragmented the free space\
    \ is. Prefer spreading a layer across multiple lightly\u2011filled chiplets to\
    \ avoid later \u201Cfull\u2011chiplet\u201D bottlenecks. |\n| **Network topology\
    \ regularity (grid coordinates)** | Exploit the mesh\u2019s Manhattan geometry\
    \ to create convex, centrally\u2011located clusters and to penalise edge\u2011\
    of\u2011mesh chiplets that have fewer neighbours and thus higher expansion costs.\
    \ |\n| **Capacity\u2011unit granularity (weight unit size)** | Use `get_capacity_unit_size()`\
    \ to set the failure tolerance accurately; the current magic number 10 assumes\
    \ a fixed unit that may not hold for all chiplet types. |\n| **Performance metric\
    \ value**              | Currently used only as a secondary tie\u2011breaker;\
    \ it could steer the largest percentage of compute\u2011heavy layers toward higher\u2011\
    performance chiplets if the system were heterogeneous. |\n| **Weight\u2011loading\
    \ strategy (`all_at_once`)** | While not runtime\u2011critical, loading all weights\
    \ at start-up benefits from placing weight\u2011heavy layers close to the I/O\
    \ that supplies the weights, reducing initialisation time. |\n| **Communication\
    \ mode (`non\u2011pipelined`)**  | In non\u2011pipelined mode, layers execute\
    \ sequentially with no overlap; total execution time is dictated by the *maximum*\
    \ inter\u2011chiplet distance. The mapper should explicitly minimise the worst\u2011\
    case (minimax) distance across all layer boundaries. |\n\nBy addressing these\
    \ ignored signals and moving beyond a single\u2011anchor greedy fill, the next\
    \ iteration of the mapper can significantly reduce the measured latency and produce\
    \ a more efficient, scalable mapping for this 10\xD710 CMOS\u2011dominated mesh\
    \ running VGG16."
