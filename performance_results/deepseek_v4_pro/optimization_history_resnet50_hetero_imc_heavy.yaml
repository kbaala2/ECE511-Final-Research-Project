- change_summary: "**1. Key weaknesses of the current nearest\u2011neighbor approach**\n\
    \n- **Greedy, step\u2011by\u2011step chain mapping**  \n  The mapper processes\
    \ layers sequentially, anchoring each new layer on the chiplet that received the\
    \ largest fraction of the *immediately previous* layer. There is no global overview:\
    \ the entire mapping depends on the first\u2011layer choice and then on a single\
    \ \u201Cbest neighbour\u201D chain. This works poorly for a deep, branching network\
    \ like ResNet\u201150, where one early mis\u2011placement forces an entire tail\
    \ of layers into a sub\u2011optimal region.\n\n- **Proximity\u2011driven clustering,\
    \ under\u2011utilisation of mesh**  \n  Because the algorithm fills the nearest\u2011\
    neighbour with available capacity before moving outward, layers tend to lump together\
    \ on a small cluster of chiplets. With 96 high\u2011capacity CMOS tiles (2.46\u202F\
    M weights each), many tiles remain nearly empty. This creates communication hotspots,\
    \ memory fragmentation, and unnecessary long\u2011distance hops for later layers\
    \ that could have been spread out.\n\n- **Complete disregard for inter\u2011layer\
    \ communication volume**  \n  The mapper never examines `input_activation` (the\
    \ size of the activation tensor that travels between layers). Two layers that\
    \ exchange a huge tensor are placed as if they were exchanging a few bytes; a\
    \ small layer may be pushed far away from its producer, adding worst\u2011case\
    \ latency to a minor data transfer, while a large activation is forced over multiple\
    \ hops.\n\n- **No awareness of residual (skip) connections**  \n  ResNet\u2011\
    50\u2019s skip connections mean that layer **N** receives data not only from layer\
    \ **N\u20111** but also from an earlier layer. By tying every layer\u2019s placement\
    \ to its immediate predecessor, the mapper can place a layer far from the earlier\
    \ stage that feeds the skip path, forcing the residual addition to travel across\
    \ the mesh. This directly increases latency for critical data paths.\n\n- **Network\
    \ congestion and bandwidth ignored**  \n  Only the hop distance (shortest path\
    \ length) is used. The 10\xD710 mesh has many shared links; placing many communicating\
    \ pairs on the same shortest\u2011path routes can saturate links, yet the mapper\
    \ has no notion of load\u2011balancing across the network.\n\n- **No explicit\
    \ handling of partitioned sub\u2011layer geometry**  \n  When a layer must be\
    \ split across multiple chiplets, the algorithm allocates portions in the order\
    \ of nearest\u2011neighbour distance. The resulting set of chiplets is not guaranteed\
    \ to be compact\u2014sub\u2011layers may be spread in a line or across the mesh,\
    \ making the all\u2011to\u2011all communication needed for partial\u2011result\
    \ aggregation far more expensive than a tight cluster.\n\n- **IO corner locations\
    \ not used**  \n  The first layer\u2019s starting chiplet is chosen solely on\
    \ maximum memory and performance metric, irrespective of its Manhattan distance\
    \ to any of the four corner IO tiles. This wastes an opportunity to minimise the\
    \ initial broadcast latency for the large input activations of ResNet\u201150.\n\
    \n**2. Specific opportunities for improvement given this configuration**\n\n-\
    \ **Incorporate activation sizes into placement cost**  \n  The workload file\
    \ provides `input_activation` per layer. By weighting the distance cost with the\
    \ activation volume, the mapper can prioritise co\u2011location of heavy\u2011\
    communicating pairs. This is a direct, low\u2011computational\u2011cost change\
    \ that can dramatically reduce overall data movement.\n\n- **Add an IO\u2011aware\
    \ initial placement**  \n  For the very first layer, choose the chiplet that has\
    \ sufficient capacity and the smallest Manhattan distance to **any** IO corner.\
    \ This minimises the first\u2011hop latency for loading the massive input activation\
    \ into the compute mesh.\n\n- **Introduce a lightweight global optimisation pass**\
    \  \n  Instead of a purely greedy sequential mapping, apply a simple iterative\
    \ improvement (e.g., simulated annealing or a genetic algorithm) that permutes\
    \ layer\u2011to\u2011chiplet assignments while respecting capacity. Even a few\
    \ hundred iterations can escape local minima, especially important for a network\
    \ with skip\u2011connections where pairwise distances must be optimised globally.\n\
    \n- **Use the layer graph explicitly**  \n  Build the data\u2011flow graph from\
    \ the model definition (considering both sequential edges and skip connections).\
    \ For each layer, define a cost that sums the weighted distances to all its *inputs*\
    \ (not just the previous layer). This ensures that a layer with a skip connection\
    \ is placed near both its direct predecessor and the source of the skip.\n\n-\
    \ **Force compact partitioning geometry**  \n  When a layer must be split, select\
    \ chiplets that form a contiguous block (e.g., a 2\xD72 square) using a moment\u2011\
    based clustering of available chips. This reduces the aggregation cost for partial\
    \ outputs.\n\n- **Balance memory occupancy, not just fill greedy**  \n  Instead\
    \ of saturating one tile before involving its neighbour, the mapper can aim for\
    \ a uniform occupancy level (e.g., keep all tiles below 80\u202F% utilisation)\
    \ so that small, later layers can be co\u2011located with their producers without\
    \ wasting far\u2011away capacity. This avoids scattering tiny layers across the\
    \ mesh.\n\n- **Aggressively use the performance metric for load balancing**  \n\
    \  The chiplet nodes carry a `performance` attribute (active metric). Currently\
    \ this is only a last\u2011resort tie\u2011breaker. Instead, use it to assign\
    \ computationally heavy layers to faster tiles, treating it as a cost factor proportional\
    \ to a layer\u2019s MAC count. This can reduce the cycle count on the critical\
    \ path.\n\n**3. Data/signals the mapper currently ignores that it should use**\n\
    \n| Ignored signal | Available in | Why it matters |\n|----------------|--------------|----------------|\n\
    | Activation tensor size per layer | `layer_info['input_activation']` (model_metrics)\
    \ | Provides the actual communication volume; placement cost must scale with bytes\
    \ moved. |\n| Layer connectivity graph (skip/branch edges) | Model definition\
    \ (workload CSV) | ResNet\u201150\u2019s residuals require that non\u2011consecutive\
    \ layers be placed closely; ignoring them creates long skip paths. |\n| IO chiplet\
    \ positions (mesh corners) | `system.chiplet_network` node type/coordinates |\
    \ Initial and final layers should be near corners to minimise input loading and\
    \ output collection latency. |\n| Chiplet compute throughput (performance metric)\
    \ | `chiplet_network` node attribute \u201Cperformance\u201D | Can be used to\
    \ assign large layers to faster tiles, improving load balance and wall\u2011clock\
    \ time. |\n| Available bandwidth / link congestion | Not directly available, but\
    \ can be derived from mesh topology and estimated traffic | Without link\u2011\
    load awareness, the mapper may create hot\u2011spots that become performance bottlenecks.\
    \ |\n| Layer execution time estimate | Derived from MAC count and chiplet speed\
    \ | Enables true workload distribution across the 96 tiles, preventing some tiles\
    \ from being over\u2011subscribed while others idle. |\n| Memory capacity utilisation\
    \ distribution | Already partially read, but only for the first layer | Should\
    \ be used as a soft constraint across all layers to preserve co\u2011location\
    \ opportunities for small layers. |\n| Partition sub\u2011placement geometry (compactness)\
    \ | Not considered | Squarish, contiguous sub\u2011clusters reduce partial\u2011\
    sum communication inside split layers. |"
