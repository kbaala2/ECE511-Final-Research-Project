- change_summary: "## Analysis of `_nearest_neighbor_mapper_v3` for the Given Configuration\n\
    \n### 1. Key weaknesses of the current nearest-neighbor approach\n\n1. **Greedy,\
    \ single-path chain mapping**  \n   Each layer takes its starting chiplet from\
    \ the previous layer\u2019s dominant tile (the one with the largest percentage).\
    \ There is no global view; the entire mapping is chained from one first-layer\
    \ decision. For a deep network like ResNet-50 this forces all layers into a narrow\
    \ corridor, ignoring that the mesh offers 96 equally capable tiles.\n\n2. **Proximity\u2011\
    driven memory fill creates hotspots**  \n   The sorting criterion `(distance,\
    \ -available_memory, -metric)` steers the algorithm to saturate the nearest chiplet\
    \ first before moving to the next neighbour. This leads to a small set of densely\
    \ filled chiplets while most of the 96 CMOS tiles remain under\u2011utilised.\
    \ The resultant clustering causes communication hotspots and leaves far\u2011\
    away, almost empty tiles for later layers, increasing hop counts.\n\n3. **Complete\
    \ blindness to inter\u2011layer communication volume**  \n   The mapper never\
    \ uses `input_activation` \u2013 the size of the tensor that actually travels\
    \ between layers. Placement decisions treat a 100\u202FKiB activation the same\
    \ as a 10\u202FMiB one. In a weight\u2011stationary architecture, activation movement\
    \ dominates latency; ignoring its magnitude makes the mapping insensitive to real\
    \ performance bottlenecks.\n\n4. **Spatial fragmentation when a layer must be\
    \ split**  \n   When a layer is partitioned across multiple chiplets (due to capacity\
    \ constraints), the sub\u2011layers are allocated in nearest\u2011neighbour order\
    \ along the distance\u2011sorted list. The resulting set of chiplets can be a\
    \ sprawling string rather than a compact rectangular cluster, increasing the cost\
    \ of aggregating partial output channels.\n\n5. **Ignorance of residual (skip)\
    \ connections**  \n   ResNet\u201150\u2019s residual additions mean that layer\
    \ *N* receives data from both layer *N\u20111* and an earlier layer. The mapper\
    \ always anchors layer *N* to the primary chiplet of layer *N\u20111*, placing\
    \ it potentially far from the source of the skip. The extra hop distance for the\
    \ residual path adds latency directly to the critical forward path.\n\n6. **IO\
    \ corner chips ignored for first/last layers**  \n   The mesh has four IO chiplets\
    \ at the corners. The starting chiplet for the very first layer is chosen purely\
    \ on available memory and `performance` metric; its Manhattan distance to any\
    \ corner is never considered. This wastes an easy win: placing the first layer\
    \ near a corner would cut the initial activation broadcast latency.\n\n7. **No\
    \ network congestion/bandwidth awareness**  \n   Only the static shortest\u2011\
    path hop count is used. In a 10\xD710 mesh, many shared links can become oversubscribed\
    \ if multiple heavy\u2011communicating pairs use the same routes. The mapper never\
    \ estimates link load, so it can create bottlenecks despite short paths.\n\n8.\
    \ **Memory balance across the mesh is not optimised**  \n   While the mapper uses\
    \ remaining capacity, it does not enforce a distribution policy. The greedy fill\
    \ leaves a few tiles near 100% and many near 0%, which prevents co\u2011location\
    \ of small layers with their producers and forces tiny layers onto far\u2011away\
    \ empty tiles.\n\n---\n\n### 2. Specific opportunities for improvement given this\
    \ configuration\n\n| Opportunity | How it leverages the config |\n|-------------|-----------------------------|\n\
    | **Activation\u2011weighted distance minimization** | Use `input_activation`\
    \ from the workload to multiply the hop distance when evaluating placement candidates.\
    \ Heavily communicating pairs will naturally be pulled together, directly reducing\
    \ the largest data movements. |\n| **IO\u2011aware first\u2011layer selection**\
    \ | For the first layer, choose the chiplet with sufficient capacity that minimises\
    \ Manhattan distance to the nearest IO tile. This simple rule cuts input distribution\
    \ latency with zero added complexity. |\n| **Global optimisation pass (e.g., simulated\
    \ annealing)** | The 96\u2011node mesh and ResNet\u201150\u2019s ~50 main layers\
    \ create a search space small enough for a light\u2011weight global optimisation.\
    \ Iteratively permute layer\u2011to\u2011chiplet assignments while respecting\
    \ capacity, using a cost function that sums activation\u2011weighted distances\
    \ for all data edges. |\n| **Layer graph modelling (DAG)** | Construct the full\
    \ data\u2011flow graph including skip connections. For each layer, sum the weighted\
    \ distances to **all** its input sources; this ensures layers with residual inputs\
    \ are placed near both predecessor and skip source. |\n| **Compact sub\u2011layer\
    \ clustering** | When a layer must be split, select a set of chiplets that form\
    \ a contiguous block (e.g., 2\xD72 square) by applying a simple greedy cluster\
    \ algorithm on the set of available tiles. This cuts aggregation communication\
    \ dramatically. |\n| **Softer memory\u2011fill policy** | Instead of filling one\
    \ chiplet to 100%, stop at a threshold (e.g., 80%) and spill to the next neighbour.\
    \ This preserves space for future small layers to co\u2011locate, avoiding scattering.\
    \ |\n| **Performance\u2011metric\u2011driven load balancing** | Exploit the `performance`\
    \ node attribute more aggressively: weight MAC counts by the chiplet\u2019s metric\
    \ to distribute heavy layers onto faster tiles, using it as a primary sorting\
    \ key rather than only a tie\u2011breaker. |\n| **Link\u2011congestion estimates\
    \ via greedy deflection** | While not directly available, the mapper can estimate\
    \ per\u2011link load by summing activation sizes crossing each edge. A simple\
    \ penalty for routes that exceed a threshold can be added to move traffic off\
    \ hot links. |\n\n---\n\n### 3. Data/signals the mapper currently ignores that\
    \ it should use\n\n| Ignored signal | Available from | Why critical |\n|----------------|----------------|--------------|\n\
    | `input_activation` size | `layer_info['input_activation']` in `model_metrics`\
    \ | Determines actual communication volume; must be the primary weight in any\
    \ distance cost to minimise total data movement. |\n| Full layer connectivity\
    \ (skip edges) | Workload CSV / model definition graph | Residual connections\
    \ create non\u2011sequential dependencies; ignoring them creates long\u2011hop\
    \ residual paths that directly increase latency. |\n| IO chiplet coordinates (corners)\
    \ | `system.chiplet_network` node types | First and last layers should be near\
    \ corners to minimise the initial input and final output transfer latency. |\n\
    | Chiplet compute throughput metric | `chiplet_network` node attribute `performance`\
    \ | Can be used to assign heavy layers to faster tiles, better load distribution,\
    \ and lower wall\u2011clock time. |\n| Per\u2011link load / congestion | Can be\
    \ derived by accumulating activation sizes on shortest paths | Avoids creating\
    \ oversubscribed mesh routes, a primary source of contention in a 10\xD710 regular\
    \ topology. |\n| Memory occupancy distribution (variance) | Already read but only\
    \ for selection, not for balancing | Should be used as a soft constraint to preserve\
    \ co\u2011location room and avoid extreme variance that forces tiny layers far\
    \ away. |\n| Sub\u2011layer placement geometry | Not considered | When splitting\
    \ a layer, the resulting set of chiplets should be forced into a compact cluster;\
    \ otherwise partial\u2011sum communication cost explodes. |\n| Layer execution\
    \ time estimate | Derived from MAC count and per\u2011chiplet speed | Enables\
    \ true workload\u2011level load balancing across all 96 tiles, preventing any\
    \ single chiplet from becoming the bottleneck. |\n\n---\n\n### A different optimisation\
    \ strategy (recommendation)\n\nInstead of incrementally tweaking the nearest\u2011\
    neighbor heuristic, adopt a **two\u2011phase global\u2011optimisation approach**:\n\
    \n1. **Seeded initial placement**  \n   - Place the first layer at the chiplet\
    \ with sufficient memory that is closest to an IO corner.  \n   - Propagate through\
    \ the layer graph (including skip edges) using a greedy placement that minimises\
    \ the sum of activation\u2011weighted distances to *all* feeding layers, while\
    \ respecting capacity.  \n   - Explicitly enforce that split layers occupy compact\
    \ tile clusters (via a simple breadth\u2011first traversal from the starting chiplet).\n\
    \n2. **Iterative improvement via fast simulated annealing**  \n   - Define a cost\
    \ function:  \n     `cost = \u03A3_{edge (u\u2192v)} (activation_size * hop_distance)\
    \ + \u03BB * memory_imbalance_penalty + \u03BC * congestion_penalty`  \n   - In\
    \ each iteration, randomly swap two layers (or move a layer to a free chiplet)\
    \ if capacity allows.  \n   - Accept moves that reduce cost with high probability,\
    \ and occasionally accept worse moves to escape local minima.  \n   - Use the\
    \ chiplet\u2019s `performance` metric to bias swaps that move heavy layers onto\
    \ faster tiles.\n\nThis strategy directly addresses all identified weaknesses,\
    \ is feasible within the configuration (96 tiles), and differs from the simple\
    \ \u201Cchain and fill\u201D method attempted in previous iterations. It can dramatically\
    \ reduce activation movement and balance both memory and network load."
