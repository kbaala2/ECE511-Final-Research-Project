- change_summary: "**1. Key weaknesses of the current nearest\u2011neighbor approach**\n\
    \n* **Greedy, sequential decision making** \u2013 The mapper assigns one layer\
    \ at a time with no global planning. The placement of each layer depends only\
    \ on the chiplet that received the largest fraction of the *previous* layer. This\
    \ \u201Cchain\u201D mapping cannot optimize the overall layout for a deep network\
    \ like ResNet\u201150; one poor early decision irrevocably constrains all later\
    \ placements.\n* **Proximity bias leads to clustering and imbalance** \u2013 The\
    \ algorithm fills the chiplet nearest to the previous hotspot first, then moves\
    \ outward. This tends to pack many layers onto a small set of chiplets, leaving\
    \ most of the 96 CMOS tiles under\u2011utilised, creating memory fragmentation\
    \ and potential communication hotspots.\n* **Ignores inter\u2011layer data volumes**\
    \ \u2013 The mapper never examines the size of the activations that flow between\
    \ layers. Placement decisions are made solely on *distance* and *memory*, without\
    \ considering how many bytes must be moved. This is a critical omission for a\
    \ weight\u2011stationary architecture where all movement is activation traffic.\n\
    * **Unaware of skip connections or branching** \u2013 ResNet\u201150 contains\
    \ residual (skip) connections. The mapper processes layers in their sequential\
    \ order and always anchors the next layer to the *immediately preceding* layer\u2019\
    s primary chiplet. A later layer that receives a skip from an earlier layer may\
    \ end up far from the layer that actually supplies its main input, incurring unnecessary\
    \ long\u2011distance communication.\n* **No consideration of network congestion\
    \ or bandwidth** \u2013 Only the hop\u2011count (shortest path length) is used.\
    \ The actual mesh topology, link sharing, and potential for contention under heavy\
    \ traffic are ignored. A placement that looks good in terms of distance can still\
    \ cause oversubscribed links.\n* **Primitive partitioning logic** \u2013 When\
    \ a layer must be split across multiple chiplets, the sub\u2011layers are assigned\
    \ in nearest\u2011neighbour order from the starting chiplet. They are not guaranteed\
    \ to form a compact cluster; the resulting chiplets may be spread in a line, increasing\
    \ the communication cost for partial\u2011sum gathering.\n* **No utilisation of\
    \ IO chiplet locations** \u2013 The four IO tiles at the corners are the entrances\
    \ for initial input and final output. The mapper places the first layer on the\
    \ chiplet with the most free memory, which could be far from any corner, wasting\
    \ the opportunity to minimise the first\u2011hop latency for large input activations.\n\
    \n**2. Specific opportunities for improvement given this configuration**\n\n*\
    \ **Use activation sizes to weight placement decisions** \u2013 The workload CSV\
    \ already includes `input_activation` for each layer. The mapper can incorporate\
    \ that as a cost weight: prefer to place layers that exchange large tensors on\
    \ the same or adjacent chiplets, while small activations may tolerate longer distances.\
    \ This would directly reduce average communication latency.\n* **Implement a multi\u2011\
    pass or iterative improvement (e.g., simulated annealing)** \u2013 With only 96\
    \ chiplets and a known mesh, even a light\u2011weight global search (swap layers\
    \ between tiles, re\u2011anchor on IO corners) can find much better mappings than\
    \ a single greedy pass, especially for a network with skip connections.\n* **Explicitly\
    \ model the data\u2011flow graph** \u2013 Instead of treating the model as a linear\
    \ sequence, use the DAG from the model definition. Place layers such that both\
    \ sequential *and* skipping edges are short; assign a combined distance cost for\
    \ all active output edges of a layer.\n* **First\u2011layer placement near an\
    \ IO corner** \u2013 The starting chiplet for the very first layer should be the\
    \ one with sufficient memory that is closest to *any* IO chiplet on the mesh (Manhattan\
    \ distance to the nearest corner). This cuts the initial data distribution latency.\n\
    * **Place partitioned sub\u2011layers in a compact cluster** \u2013 After deciding\
    \ the set of chiplets for a split layer, ensure they form a contiguous block (e.g.,\
    \ a 2\xD72 or 3\xD71 rectangle) to minimise the all\u2011to\u2011all communication\
    \ needed when aggregating partial output channels.\n* **Balance memory load across\
    \ the mesh** \u2013 Instead of filling a tile completely before moving to its\
    \ neighbour, the mapper could target a uniform memory occupancy, leaving room\
    \ for co\u2011location of small layers that consume very little capacity. This\
    \ avoids creating distant placements for tiny layers that could have been hosted\
    \ on the same chiplet as their producer.\n* **Leverage the performance metric\
    \ from chiplet graph** \u2013 The active metric (\u201Cperformance\u201D) is currently\
    \ only a tiebreaker. If it encodes compute speed or energy efficiency, use it\
    \ more heavily to prefer chiplets that deliver higher throughput for large layers,\
    \ while offloading small layers to slower (or less favourable) tiles.\n\n**3.\
    \ Data / signals the mapper currently ignores that it should use**\n\n| Ignored\
    \ signal | Available in | Why it matters |\n|----------------|--------------|----------------|\n\
    | Activation tensor size per layer | `layer_info['input_activation']` | Determines\
    \ communication volume; large activations should avoid long paths. |\n| Layer\
    \ connectivity graph (skip/branch edges) | Model definition / workload CSV structure\
    \ | Residual connections require that non\u2011sequential neighbours be placed\
    \ closely. |\n| IO chiplet positions (corners of 10\xD710 mesh) | `system.chiplet_network`\
    \ (node attributes) | First/last layers should be near I/O to reduce input loading\
    \ and result collection latency. |\n| Chiplet compute throughput / power metrics\
    \ | Node attribute `active_metric` (currently only a tiebreaker) | Could be used\
    \ to assign heavy layers to faster tiles for load balancing. |\n| Available link\
    \ bandwidth and congestion state | Not directly available, but can be inferred\
    \ from topology and traffic estimates | Prevents oversubscription of busy mesh\
    \ routes. |\n| Estimated execution time per layer | Can be derived from MACs and\
    \ chiplet speed | Enables true load balancing across all available compute tiles.\
    \ |\n| Memory capacity utilisation percentage | Already partially used, but not\
    \ for balancing | Should discourage \u201Cfull\u201D tiles early in the mapping\
    \ to preserve co\u2011location opportunities for future small layers. |\n| Partition\
    \ sub\u2011placement geometry | Not considered | Must ensure that chiplets hosting\
    \ fractions of the same layer form a contiguous, low\u2011diameter set. |"
