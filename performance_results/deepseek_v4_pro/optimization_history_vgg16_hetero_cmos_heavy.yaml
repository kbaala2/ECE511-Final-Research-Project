- change_summary: "### 1. Key Weaknesses of the Current Nearest\u2011Neighbor Approach\n\
    \n- **Decoupled allocation and actual weight consumption**  \n  The mapper assigns\
    \ percentages of a layer to chiplets based on a coarse \u201Cweight units\u201D\
    \ model, but the partitioner later translates those percentages into integer numbers\
    \ of output channels. Rounding can drastically alter the real weight footprint.\
    \ For example, a 10% allocation on a chiplet may become 2 output channels out\
    \ of 128, while 10\u202F% of the layer\u2019s weights might be much smaller. This\
    \ mismatch causes over\u2011 or under\u2011utilisation of chiplet capacity that\
    \ the mapper never sees, leading to **silent capacity violations** or wasted resources.\n\
    \n- **No load\u2011balancing across partitions of the same layer**  \n  In a weight\u2011\
    stationary CMOS chiplet, the time to compute a partition is proportional to the\
    \ number of MACs assigned to it. The mapper fills the nearest chiplets with whatever\
    \ capacity remains, often creating severely unbalanced partitions (e.g., one chiplet\
    \ gets 60\u202F% of a heavy layer, another gets 5\u202F%). The slowest chiplet\
    \ dictates the layer\u2019s completion time, so this **uneven partitioning extends\
    \ latency** far beyond what a balanced split would require.\n\n- **Over\u2011\
    splitting layers unnecessarily**  \n  The algorithm processes chiplets in nearest\u2011\
    neighbor order, giving each a chunk until resources are exhausted. This often\
    \ scatters a single layer across many chiplets (sometimes 10+), even when a smaller\
    \ set could hold the whole layer. Each additional chiplet adds multicast source/destination\
    \ points, inflating both broadcast traffic and partial\u2011sum collection cost,\
    \ and **stress\u2011tests the non\u2011pipelined mesh**.\n\n- **Output\u2011channel\
    \ partitioning breaks alignment between consecutive layers**  \n  The partitioner\
    \ always splits along output channels. For two consecutive convolutional layers,\
    \ the output channels of layer L become the input channels of layer L+1. If the\
    \ partitioning of L and L+1 are not aligned to the same chips, every activation\
    \ must cross the network, generating massive inter\u2011layer data movement. The\
    \ mapper uses only the previous layer\u2019s largest chiplet as a seed, **ignoring\
    \ the possibility of keeping producer\u2011consumer pairs on identical sets of\
    \ chiplets**.\n\n- **Greedy capacity assignment causes fragmentation and path\u2011\
    dependency**  \n  Early layers hog the closest chiplets, leaving small residual\
    \ capacity pockets that are unusable for large later layers. This **forces later\
    \ layers to fragment even further**, increasing communication and making the mapping\
    \ heavily dependent on the arbitrary initial chiplet chosen (effectively random\
    \ in a homogeneous system).\n\n- **Ignores compute\u2011unit parallelism and activation\
    \ buffering constraints**  \n  The mapper treats capacity only as available weight\
    \ memory, but a chiplet\u2019s MAC/cycle throughput and input buffer size are\
    \ finite. A partition that fits in weight memory may still **exceed the chiplet\u2019\
    s ability to process its input in a timely manner**, or may require more activation\
    \ buffer than available, leading to backpressure and stalling that the placement\
    \ does not anticipate.\n\n- **Static tie\u2011breaker metrics are meaningless\
    \ in a homogeneous mesh**  \n  The `active_metric` attribute and memory\u2011\
    based sorting degenerate to random choices, adding **noise without any performance\
    \ benefit**, yet the entire mapping chain follows this arbitrary first\u2011chiplet\
    \ decision.\n\n### 2. Specific Opportunities for Improvement Given This Config\n\
    \n- **Unify capacity allocation and partition rounding**  \n  Instead of a two\u2011\
    step process, the mapper could directly assign integer output\u2011channel counts\
    \ to chiplets while tracking the actual weight units consumed. This would eliminate\
    \ the rounding mismatch and guarantee that the final partition fits exactly without\
    \ waste.\n\n- **Constrained load balancing within each layer**  \n  When splitting\
    \ a layer, enforce a maximum imbalance ratio (e.g., no chiplet gets more than\
    \ 2\xD7 the MACs of the lightest\u2011loaded one). Sort candidate chiplets by\
    \ distance but **only allocate channel counts that satisfy the balance constraint**,\
    \ filling the nearest ones while keeping the workload even. This keeps all chiplets\
    \ busy for roughly the same time, shortening the layer\u2019s critical path.\n\
    \n- **Channel\u2011aligned layer\u2011pair mapping**  \n  For any consecutive\
    \ layers that can be co\u2011located (i.e., whose output channels equal the next\
    \ layer\u2019s input channels), map them to **identical sets of chiplets with\
    \ identical channel slices**. This eliminates inter\u2011layer activation traffic\
    \ entirely for those pairs. The mapper can attempt this as a first\u2011class\
    \ strategy: after mapping layer L to chiplet set S, try to map L+1 to the same\
    \ set; only resort to a new placement if capacity is insufficient.\n\n- **Limit\
    \ the maximum number of partitions per layer**  \n  Introduce a ceiling on the\
    \ number of chiplets a single layer can be split across (e.g., \u2264\u202F4).\
    \ If the nearest chiplets cannot accommodate the whole layer within that limit,\
    \ pre\u2011emptively release capacity from slightly more distant but larger contiguous\
    \ blocks, using a bin\u2011packing heuristic. This reduces communication fan\u2011\
    out.\n\n- **Global, forward\u2011backward propagation of mapping constraints**\
    \  \n  Perform a quick scan of the whole model to determine the total capacity\
    \ required. Reserve blocks of chiplet memory for later layers that are known to\
    \ be large. This can be implemented as a **pre\u2011reservation phase** that allocates\
    \ major layers on high\u2011capacity areas, then finer\u2011grained filling for\
    \ smaller layers, avoiding fragmentation.\n\n- **Incorporate a lightweight congestion\
    \ cost**  \n  For the non\u2011pipelined 10\xD710 mesh, pre\u2011compute a simple\
    \ traffic\u2011demand model: if a layer L is partitioned across set A and layer\
    \ L+1 on set B, the total data volume is multiplied by the pairwise hop counts\
    \ summed across all links. Use this as a cost function to compare alternative\
    \ placements for a layer, not just the previous seed.\n\n- **Use I/O\u2011chiplet\
    \ proximity for the first and last layers**  \n  Place the initial convolution\
    \ near one corner I/O chiplet and the final classifier near another corner, reducing\
    \ the on\u2011chip+trip length for the entire inference stream without disrupting\
    \ the overall mapping.\n\n### 3. Data/Signals the Mapper Currently Ignores but\
    \ Should Use\n\n| Ignored Signal | Description | Why Essential |\n|----------------|-------------|---------------|\n\
    | **Actual weight count per output\u2011channel slice** | The number of weights\
    \ associated with a given partition of output channels (depends on filter size\
    \ and input channels). | The mapper treats capacity in \u201Cweight units\u201D\
    \ but never knows the real weight cost of an integer channel count, causing the\
    \ mismatch described above. |\n| **MAC\u2011per\u2011cycle capacity of each chiplet**\
    \ | The theoretical maximum multiply\u2011accumulate operations per second on\
    \ the chiplet. | Critical for load balancing; ensures that the assignment of output\
    \ channels does not create a compute bottleneck. |\n| **Activation buffer size\
    \ per chiplet** | The amount of on\u2011chip memory available for input feature\
    \ maps. | When a layer is split, each partition receives a complete input map\
    \ (or a portion of spatial dimensions if partitioned differently). The mapper\
    \ must avoid exceeding this buffer to prevent backpressure. |\n| **Full partition\
    \ map of the previous layer** | The complete set of chiplet IDs and their assigned\
    \ output\u2011channel slices for the immediately preceding layer. | Allows the\
    \ mapper to try to place the next layer on exactly the same chiplet set with aligned\
    \ slices, eliminating inter\u2011layer traffic. |\n| **Layer\u2011pair channel\
    \ correspondence** | Whether the output channels of layer L exactly match the\
    \ input channels of layer L+1 (typical for sequential conv/FC layers). | Determines\
    \ whether channel\u2011aligned co\u2011location is possible and how much communication\
    \ can be avoided. |\n| **Number of chiplets currently used for a layer** | Real\u2011\
    time count of assigned partitions during allocation. | Needed to enforce a maximum\
    \ partition limit and to decide if it\u2019s worth using an additional chiplet\
    \ versus expanding an existing partition. |\n| **Chiplet\u2011to\u2011chiplet\
    \ link load estimation** | Number of concurrent flows that will cross each mesh\
    \ link under the current partial mapping. | Enables avoidance of hotspots; a simple\
    \ usage counter per link could guide the mapper away from already congested regions.\
    \ |\n| **Weight\u2011loading footprint (all\u2011at\u2011once)** | Though weights\
    \ are loaded once, the mapper could favor chiplets that are completely empty for\
    \ weight\u2011storage reasons, but also ensure that the sum of stored weights\
    \ does not exceed capacity; this is already checked but rounding violations go\
    \ unnoticed. |\n| **Rounding error magnitude per layer** | The difference between\
    \ the mapper\u2011assigned percentage and the actual percentage inferred from\
    \ the rounded channel count. | Could be used to automatically adjust remaining\
    \ capacity after partitioning, preventing silent over\u2011allocation. |\n\nBy\
    \ integrating these signals, the mapper can transform from a blind, greedy nearest\u2011\
    neighbor engine into a **load\u2011balanced, channel\u2011aligned, capacity\u2011\
    accurate placement** that dramatically cuts VGG16 inference latency on the 96\u2011\
    chiplet CMOS mesh."
