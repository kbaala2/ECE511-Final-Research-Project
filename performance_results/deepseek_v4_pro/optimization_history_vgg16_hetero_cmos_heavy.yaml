- change_summary: "### 1. Key Weaknesses of the Current Nearest-Neighbor Approach\n\
    \nThe `_nearest_neighbor_mapper_v3` is a greedy, layer\u2011by\u2011layer placement\
    \ algorithm that **does not model the actual communication flow**, **ignores global\
    \ resource balancing**, and **lacks lookahead**. Its main shortcomings:\n\n- **Unaware\
    \ of true communication demands**  \n  It chooses a single \u201Cstarting chiplet\u201D\
    \ for each layer (the dominant chiplet of the previous layer) and sorts candidates\
    \ by hop distance from that node. However, when a layer is split across multiple\
    \ chiplets (as is common for large layers on CMOS), the **input activations must\
    \ be gathered from all chips hosting the previous layer**, not just the largest\
    \ chunk. The current heuristic treats the starting chiplet as the sole data source,\
    \ leading to potentially **large, overlooked many\u2011to\u2011many traffic**\
    \ that the mesh topology must support.\n\n- **Greedy capacity allocation without\
    \ global planning**  \n  The algorithm allocates each layer\u2019s requirements\
    \ by filling the nearest available chiplets in order, without considering future\
    \ layers. This can **fragment chiplets**\u2014leaving small, hard\u2011to\u2011\
    use capacity pockets\u2014and may **pre\u2011empt critical resources** that would\
    \ be better suited for later, larger layers.\n\n- **No consideration of layer\
    \ size or type differentiation**  \n  All layers are mapped with the same distance\u2011\
    memory\u2011metric priority. For small layers, spreading across many chiplets\
    \ adds unnecessary broadcast/reduce overhead; for huge layers, splitting is inevitable\
    \ but the mapper doesn\u2019t balance the number of chiplets used against communication\
    \ cost.\n\n- **Over\u2011reliance on a static node \u201Cmetric\u201D**  \n  The\
    \ `active_metric` attribute from the chiplet network (performance/energy) is used\
    \ as a tiebreaker but its meaning and value are opaque. In a 10\xD710 homogeneous\
    \ CMOS\u2011heavy mesh, this likely **does not capture dynamic performance differences**\
    \ and adds noise to the mapping decisions.\n\n- **Ignores the non\u2011pipelined\
    \ communication model**  \n  The simulation uses Garnet in non\u2011pipelined\
    \ mode, meaning every message contends for network resources. The mapper\u2019\
    s hop\u2011count distance ignores **link bandwidth, injection rate limits, and\
    \ potential hotspots** that arise when many flows concentrate on the same region.\n\
    \n- **No awareness of weight\u2011stationary overheads**  \n  Weight\u2011stationary\
    \ CMOS requires **input activations to be broadcast** to all chiplets that hold\
    \ a partition of a layer, and **partial outputs must be collected**. The mapper\
    \ neither accounts for the extra multicast/broadcast patterns nor tries to **co\u2011\
    locate partitions** to reduce wire\u2011length.\n\n- **First\u2011layer starting\
    \ point chosen arbitrarily**  \n  The initial chiplet is selected by sorting on\
    \ (available memory, metric). In a homogeneous system with uniform resources,\
    \ this effectively becomes a random choice, yet all subsequent placements chain\
    \ from it, locking the entire mapping into a path that may not be globally optimal.\n\
    \n### 2. Specific Opportunities for Improvement Given This Config\n\n- **Incorporate\
    \ data\u2011flow awareness**  \n  Instead of pinning to the previous layer\u2019\
    s maximum chunk, compute the **set of all source chiplets** from the previous\
    \ layer\u2019s mapping and weigh the placement of the next layer\u2019s partitions\
    \ by the **total activation volume that must be communicated**. For example, minimize\
    \ \u2211(data_volume \xD7 hop_distance) for each candidate chiplet or use a gravity\
    \ model.\n\n- **Use a global capacity\u2011aware heuristic**  \n  Implement a\
    \ **progressive resource reservation**: when placing a large layer, reserve capacity\
    \ on nearby chiplets for future layers that will logically follow, avoiding fragmentation.\
    \ Alternatively, adopt a **bin\u2011packing style** that leaves contiguous free\
    \ blocks on chiplets or on the mesh.\n\n- **Optimize partition granularity** \
    \ \n  The mapper could **constrain the minimum percentage per chiplet** (e.g.,\
    \ no less than 10%) to avoid spreading a layer too thinly, reducing the number\
    \ of multicast destinations. The partitioner\u2019s rounding adjustment should\
    \ also be designed to preserve load balance, perhaps by using a smarter distribution\
    \ of the rounding error.\n\n- **Leverage mesh\u2011specific properties**  \n \
    \ With a regular 10\xD710 mesh, you can pre\u2011compute not just hop counts but\
    \ also **expected congestion levels** under random uniform traffic or use a simple\
    \ analytical model of network saturation. This data can replace the raw hop\u2011\
    distance sort with a **congestion\u2011aware cost function**.\n\n- **Joint placement\
    \ of consecutive layers**  \n  For weight\u2011stationary CMOS, consecutive layers\
    \ often share a producer\u2011consumer relationship. Map them **pairwise** so\
    \ that the output partitions of layer L align with the input needs of layer L+1,\
    \ drastically reducing data movement. This could be done by **clustering layer\
    \ pairs** or by a forward\u2011backward propagation of mapping constraints.\n\n\
    - **First\u2011layer placement strategy**  \n  Instead of a simple max\u2011memory\
    \ tiebreaker, **evaluate several candidate starting chiplets** using a quick dummy\
    \ run of the first few layers and pick the one that yields the best overall communication\
    \ cost. This avoids the entire mapping being shackled to an unlucky first choice.\n\
    \n### 3. Data/Signals the Mapper Currently Ignores but Should Use\n\n| Ignored\
    \ Signal                     | Why It Matters                                \
    \                                                  |\n|------------------------------------|-------------------------------------------------------------------------------------------------|\n\
    | **Activation volume per layer**    | Determines the actual number of bytes to\
    \ be sent/received; critical for weighting communication cost. |\n| **Distribution\
    \ of previous layer\u2019s mapping** | The identity and size of *all* chips hosting\
    \ the previous layer\u2019s partitions, not only the largest, define the true\
    \ traffic sources. |\n| **Number of partitions for each layer** | Affects multicast\
    \ fan\u2011out and gather complexity; the mapper should trade off parallelism\
    \ against communication overhead. |\n| **Layer type and filter dimensions** |\
    \ Conv layers with large filters may benefit from different splitting strategies\
    \ (e.g., weight vs. input\u2011channel vs. output\u2011channel). |\n| **Chiplet\
    \ occupancy history**      | Tracking which chiplets have been used heavily may\
    \ reveal thermal or contention hotspots not captured by instantaneous free capacity.\
    \ |\n| **Network bandwidth/link capacity**| In non\u2011pipelined Garnet, over\u2011\
    subscription of certain links can cause backpressure; a flow\u2011based view prevents\
    \ oversubscription. |\n| **Weight\u2011loading strategy (all\u2011at\u2011once)**\
    \ | Affects initial mapping but also indicates that weight memory is static; however,\
    \ spreading weights across more chiplets increases the total storage footprint\
    \ and may exceed per\u2011chiplet limits in edge cases\u2014should be monitored.\
    \ |\n| **IO chiplet locations (corners)** | Off\u2011chip communication cost (e.g.,\
    \ for activation batching) could influence whether to place the first/last layer\
    \ near corners. |\n| **Intra\u2011layer partial sum collection** | For output\u2011\
    channel partitioning, each chiplet produces a subset of outputs; if a subsequent\
    \ layer combines them, the mapper should plan a **reduction tree** instead of\
    \ forcing all traffic to a single point. |\n\nBy integrating these signals, the\
    \ mapper could evolve from a purely topological nearest\u2011neighbor greedy algorithm\
    \ into a **data\u2011aware, congestion\u2011conscious placement** that significantly\
    \ reduces inference latency on a large 10\xD710 mesh with non\u2011pipelined communication."
