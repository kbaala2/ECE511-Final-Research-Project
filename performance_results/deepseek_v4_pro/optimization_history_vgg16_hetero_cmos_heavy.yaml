- change_summary: "### 1. Key Weaknesses of the Current Nearest-Neighbor Approach\n\
    \nThe `_nearest_neighbor_mapper_v3` method is a **greedy, layer\u2011by\u2011\
    layer placement** that treats each layer in isolation, only using the previous\
    \ layer\u2019s largest partition as the placement anchor. In a weight\u2011stationary,\
    \ non\u2011pipelined CMOS system on a 10\xD710 mesh, this leads to:\n\n- **Ignorance\
    \ of Many\u2011to\u2011Many Communication**  \n  When a layer is split across\
    \ multiple chiplets, its *input activations must be shipped to every chiplet holding\
    \ a partition of that layer*. The mapper uses only the largest previous\u2011\
    layer chiplet as a starting point, ignoring the full set of source nodes. The\
    \ resulting multicast patterns, and the reverse gather for partial output collection,\
    \ are unoptimized and can create severe hotspot congestion.\n\n- **Layer\u2011\
    Level Fragmentation**  \n  The allocator fills the nearest available chiplet capacity\
    \ until the layer\u2019s requirements are met. This can leave many chiplets with\
    \ small, unusable residual capacity while simultaneously forcing subsequent layers\
    \ to split across more chiplets than necessary, inflating both weight storage\
    \ overhead and communication volume.\n\n- **No Global Resource Vision**  \n  Early\
    \ layers might greedily consume chiplet capacity that would be far more valuable\
    \ for later, larger layers, leading to suboptimal overall distribution of the\
    \ 96 identical CMOS chiplets. The lack of any look\u2011ahead or backward propagation\
    \ means the mapping is path\u2011dependent and brittle.\n\n- **Homogeneous\u2011\
    System Tie\u2011Breakers Add Noise**  \n  With all CMOS chiplets identical, the\
    \ `active_metric` and memory\u2011based sorting degenerates to an effectively\
    \ random initial placement, which then dictates the entire mapping chain, often\
    \ leading to unnecessarily long communication paths.\n\n- **Neglect of Weight\u2011\
    Stationary Execution Cost**  \n  The mapper does not account for the **inference\u2011\
    time data movement** that actually determines latency: broadcasting input feature\
    \ maps, collecting partial sums, and redistributing them for the next layer. In\
    \ non\u2011pipelined Garnet, these many\u2011to\u2011many flows directly compete\
    \ for mesh link bandwidth.\n\n- **Inconsistent with Non\u2011Pipelined Network\
    \ Constraints**  \n  Hop\u2011count distance alone ignores link capacity, injection\
    \ rate limitations, and the fact that many concurrent flows can saturate certain\
    \ mesh regions. The resulting mapping can suffocate localised areas of the mesh.\n\
    \n### 2. Specific Opportunities for Improvement Given This Config\n\nGiven that\
    \ previous attempts have not improved latency, a **fundamentally different placement\
    \ philosophy** is required\u2014moving from greedy per\u2011layer allocation to\
    \ a **global data\u2011flow\u2011driven partitioning and embedding**.\n\n- **Model\
    \ the Entire Inference as a Task\u2011Flow Graph**  \n  Treat every partition\
    \ of every layer as a node, with directed edges weighted by the amount of activation\
    \ data transferred. Then perform a **quadratic placement (force\u2011directed)\
    \ or spectral embedding** of this task graph onto the 10\xD710 mesh, minimising\
    \ \u2211(data_volume \xD7 distance\xB2). This would automatically co\u2011locate\
    \ producer\u2011consumer partitions and spread high\u2011traffic links across\
    \ the mesh.\n\n- **Determine the Optimal Number of Partitions per Layer**  \n\
    \  Before physical placement, solve a partitioning problem that balances **computation\
    \ parallelism** against **communication cost**. For a 2.46M\u2011weight CMOS chiplet,\
    \ large layers like VGG16\u2019s Conv4\u20113 (\u22487M weights) may need 3 chiplets;\
    \ splitting into many more adds unnecessary broadcast/reduce traffic. A design\u2011\
    space exploration can choose a partition factor for each layer that minimises\
    \ an estimated total latency proxy.\n\n- **Use Recursive Bisection Mapping** \
    \ \n  Bisect the task graph and the 10\xD710 mesh concurrently (e.g., with METIS\u2011\
    style logic), ensuring that tightly connected partitions fall into physically\
    \ close mesh regions. This naturally minimises global wirelength and balances\
    \ mesh link utilisation.\n\n- **Explicitly Model Multicast and Reduce Trees**\
    \  \n  Instead of haphazard broadcast, plan explicit **distribution trees** (e.g.,\
    \ using a mesh\u2011aware Steiner tree) for input activations and **reduction\
    \ trees** for partial output sums. Embed these trees during placement so that\
    \ they avoid overloading central mesh links.\n\n- **First\u2011Layer and Last\u2011\
    Layer Proximity to I/O**  \n  The 4 I/O chiplets at corners could become the injection\
    \ point for the first layer\u2019s input and the sink for the final output. Place\
    \ the first and last layers\u2019 chiplets near the corners to minimise off\u2011\
    chip transfer distance without harming the overall mapping\u2014this can be baked\
    \ into the global placement cost function.\n\n### 3. Data/Signals the Mapper Currently\
    \ Ignores but Should Use\n\nTo enable the global placement strategy, the mapper\
    \ must leverage signals that are currently discarded:\n\n| Ignored Signal    \
    \                 | Required for Global Mapping                              \
    \                                                                 |\n|------------------------------------|--------------------------------------------------------------------------------------------------------------------------|\n\
    | **Activation Data Volume per Edge** | The exact number of bytes flowing from\
    \ each CI chiplet (partition) to each CJ chiplet in consecutive layers. Essential\
    \ for weighting placement edges. |\n| **Full Partition Map of Preceding Layer**\
    \ | The set of all chiplet IDs holding previous\u2011layer partitions, not only\
    \ the largest one, so that multicast sources are known. |\n| **Fan\u2011Out /\
    \ Fan\u2011In of Each Partition** | Number of destinations a chiplet must send\
    \ to (or receive from) affects network contention; placement should minimise this\
    \ or distribute the load. |\n| **Layer Type and Partitioning Dimension** | Whether\
    \ the layer is split along output channels, input channels, or spatial dimensions\
    \ directly impacts data\u2011flow topology (e.g., output\u2011channel split requires\
    \ a reduction for the next FC/Conv layer). |\n| **Chiplet Location in the Mesh**\
    \ | The global cost function already uses distances, but a global placer must\
    \ also account for link bandwidth sharing\u2014e.g., the number of flows crossing\
    \ each mesh link. |\n| **Weight\u2011Stationary Cost Model** | The all\u2011at\u2011\
    once weight loading means weights are static, but **during inference**, each chiplet\u2019\
    s input buffer size and network injection/ejection rates bound performance. A\
    \ queuing\u2011theoretic cost model would help. |\n| **Proximity to I/O Chiplets**\
    \ | Not used at all; placing the network\u2019s entry/exit points near the corners\
    \ can save several hops for every inference, a small but consistent gain. |\n\
    | **Residual Capacity Distribution** | Instead of just available units, the **pattern\
    \ of free space across chiplets** (which chiplet is completely empty, which is\
    \ nearly full) influences the flexibility for later layers\u2014a global placer\
    \ can use this as a soft constraint. |\n\nBy integrating these signals into a\
    \ **simultaneous task\u2011graph embedding** (e.g., via force\u2011directed placement\
    \ or simulated annealing of partition assignments), the mapper can escape the\
    \ greedy local\u2011optimum trap and achieve a mapping that genuinely minimises\
    \ end\u2011to\u2011end inference latency on the 10\xD710 non\u2011pipelined mesh."
