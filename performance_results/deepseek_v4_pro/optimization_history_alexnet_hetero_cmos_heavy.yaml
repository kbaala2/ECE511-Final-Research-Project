- change_summary: "**Analysis of `_nearest_neighbor_mapper_v3`**  \n\n### 1. Key Weaknesses\
    \ of the Current Nearest-Neighbor Approach  \n\n1. **Greedy Layer-by-Layer Without\
    \ Lookahead**  \n   Each layer is placed independently, using only the previous\
    \ layer\u2019s largest chiplet as the starting point. This leads to *fragmentation*\
    \ and blocks that drift into remote regions, forcing later layers to incur high\
    \ communication cost. A suboptimal early decision can chain\u2011react across\
    \ the entire depth of AlexNet.\n\n2. **Misleading Starting Chiplet Heuristic**\
    \  \n   The mapper uses the chiplet with the largest *percentage* of the previous\
    \ layer, ignoring that many chiplets contribute output activations. The true communication\
    \ footprint is distributed, and the dominant chiplet is not necessarily the centroid.\
    \ This creates unnecessary multi\u2011hop traffic for a large share of intermediate\
    \ data.\n\n3. **Simplistic (Distance, Free Memory, Performance) Sorting**  \n\
    \   The chiplets are sorted by `(distance, -available_memory, -performance_metric)`.\
    \ Distance is treated as the primary cost, but with no weighting by data volume,\
    \ this often forces a layer onto a chiplet with minuscule free capacity just to\
    \ save one hop, causing excessive splitting and increased global traffic.  \n\n\
    4. **Zero Inter\u2011Layer Communication Volume Awareness**  \n   The mapper does\
    \ not consider the *size* of the activation tensors. In AlexNet, the first conv\
    \ layer and the final fc layers involve massive data movements; a few extra hops\
    \ for a small tensor is negligible, but the same hop count for large volumes is\
    \ devastating.  \n\n5. **Ignorance of I/O Chiplet Locations**  \n   The 4 corner\
    \ I/O chiplets are completely excluded from placement logic. The first layer\u2019\
    s input (raw image) and the last layer\u2019s output (classification) must travel\
    \ from/to these corners, yet the mapper never biases placement toward them. This\
    \ can add a long diagonal trip across the 10\xD710 mesh, dominating latency. \
    \ \n\n6. **No Congestion or Link\u2011Load Metrics**  \n   The algorithm does\
    \ not track cumulative traffic load on network links. It can repeatedly place\
    \ layers along the same hot\u2011spot path, causing blocking and throttling that\
    \ the Garnet simulator will penalize heavily, especially under the non\u2011pipelined\
    \ model and `blocking_age_threshold` of 10.\n\n---\n\n### 2. Specific Opportunities\
    \ for Improvement Given This Config  \n\nGiven a 10\xD710 mesh with 96 homogeneous\
    \ CMOS\u2011Compute chiplets (2.46\u202FM weights each) and 4 corner I/O chiplets:\n\
    \n- **Global Placement with Volume\u2011Weighted Communication Cost**  \n  Replace\
    \ the greedy algorithm with an offline global optimizer (e.g., simulated annealing\
    \ or a fast ILP) that jointly places all layers. The cost function should be a\
    \ sum of `(hop distance) \xD7 (inter\u2011layer data volume)` plus penalty for\
    \ exceeding chiplet capacity. Even a simple search with backtracking would greatly\
    \ improve locality.\n\n- **Proximity to I/O Chiplets**  \n  Force the first layer\
    \ (input) and the last layer (output) to be placed near an I/O chiplet. This can\
    \ be done by adding a bias term in the cost function or by seeding the global\
    \ optimizer with initial clusters around each corner.\n\n- **Communication\u2011\
    Aware Layer Partitioning**  \n  Instead of always partitioning conv layers along\
    \ output channels (which requires partial\u2011sum aggregation), consider splitting\
    \ along input channels or spatial dimensions (height/width) to *reduce* cross\u2011\
    chiplet communication. Coupling partitioning with placement decisions would allow\
    \ the algorithm to choose a partitioning scheme that minimizes data movement.\n\
    \n- **Traffic\u2011Cost\u2011Driven Chiple Selection**  \n  Replace the simple\
    \ `(distance, -memory, -perf)` sort with a composite cost: `\u03B1\xB7distance\
    \ + \u03B2\xB7(1 \u2013 normalized_available_memory)`, where \u03B1 and \u03B2\
    \ are layer\u2011specific and proportional to output activation volume. This avoids\
    \ wasting large memory gaps just to save one pointless hop.\n\n- **Pipeline\u2011\
    Stage Clustering**  \n  Identify logical stages (e.g., conv blocks) and place\
    \ them in contiguous rectangular regions of the mesh. This reduces hop count for\
    \ intra\u2011stage communication and better exploits the bisection bandwidth.\n\
    \n- **Congestion\u2011Aware Mapping**  \n  Maintain a running estimate of link\
    \ burden (packets per link) as mapping proceeds, using the known inter\u2011layer\
    \ data sizes. The cost function can then discourage placements that would overload\
    \ already\u2011busy paths, thus preventing hot spots.\n\n- **Exploit Mesh Symmetry\
    \ for Large Layers**  \n  For very large layers (e.g., the first conv layer of\
    \ AlexNet), the mapper can deliberately spread the partitions across multiple\
    \ rows/columns to utilize parallel paths, instead of forcing everything into a\
    \ tight cluster that saturates a few links.\n\n---\n\n### 3. What Data/Signals\
    \ the Mapper Currently Ignores That It Should Use  \n\nThe following information\
    \ is available (or easily derived) from the simulation framework but is completely\
    \ unused by `_nearest_neighbor_mapper_v3`:\n\n| Ignored Signal | Source | Impact\
    \ if Used |\n|---------------|--------|----------------|\n| **Inter\u2011layer\
    \ activation tensor sizes** | Model definitions / workload file | Weighting hop\
    \ count by byte volume would dramatically reduce network congestion. |\n| **I/O\
    \ chiplet positions and ingress/egress traffic** | System object knows which chiplets\
    \ are I/O and their coordinates | Placing input/output layers near corners cuts\
    \ first/last hop latency. |\n| **Weight\u2011loading burst volume** | Weight\u2011\
    stationary, all\u2011at\u2011once loading | A far\u2011away placement causes a\
    \ one\u2011time traffic spike; for short jobs this matters. |\n| **Remaining contiguous\
    \ memory blocks per chiplet** | `current_available_crossbars` | Preferring chips\
    \ with larger free blocks avoids unnecessary splitting. |\n| **Network link congestion\
    \ (cumulative packet count)** | Simulator / simple analytic model | Avoiding already\u2011\
    busy paths prevents throttling under non\u2011pipelined comm. |\n| **Compute latency\
    \ vs. communication latency trade\u2011off** | CMOS chiplet compute bandwidth,\
    \ network bandwidth | For compute\u2011bound layers, a slightly longer path may\
    \ be acceptable if it balances memory capacity. |\n| **Pipeline parallelism potential**\
    \ | Layer dependency graph | Layers with no data dependency could be overlapped,\
    \ but the mapper ignores this. |\n| **Weight\u2011storage locations** | Chip weight\
    \ loading source (if not uniform) | Could co\u2011locate weights and computation\
    \ to avoid sustained DRAM\u2192chiplet traffic after initial load. |\n\n---\n\n\
    **Proposed *Different* Optimization Strategy**  \n\nGiven the previous attempt\
    \ (iteration\u202F1) yielded no improvement (latency unchanged at ~106\u202F943\u202F\
    cycles), the na\xEFve local optimizations (e.g., tweaking tie\u2011breaking) were\
    \ insufficient. A different strategy must address the root cause: the **greedy,\
    \ volume\u2011blind, and I/O\u2011unaware placement**.  \n\n**Strategy: Two\u2011\
    Phase Mapping with Global Volume\u2011Weighted Clustering**  \n\n1. **Phase\u202F\
    1 \u2013 Layer Clustering using Data\u2011Volume Graph**  \n   - Build a weighted\
    \ directed graph of layers, where edge weight = activation tensor size (in bytes).\
    \  \n   - Perform spectral clustering or a balanced min\u2011cut to partition\
    \ layers into *pipeline groups*, each of which will be assigned to a distinct\
    \ region of the mesh.  \n   - Bias the first and last groups toward the I/O corners\
    \ by adding virtual attachments.\n\n2. **Phase\u202F2 \u2013 Region\u2011Constrained\
    \ Global Placement**  \n   - For each group, solve a small **quadratic assignment**\
    \ or simulated annealing sub\u2011problem to place the layers within its assigned\
    \ region, minimizing a cost that is `sum_{layers} (hop_dist from layer i to i+1)\
    \ \xD7 (activation volume)`.  \n   - Enforce chiplet capacity constraints explicitly\
    \ in the objective.  \n   - After placement, use the existing `LayerPartitioner`\
    \ but allow an alternative splitting mode (input\u2011channel split for conv layers)\
    \ when it reduces the number of chiplets that must aggregate partial sums.\n\n\
    This approach introduces global awareness, incorporates data\u2011volume and I\u2011\
    O proximity, and avoids the catastrophic chain of errors caused by greedy step\u2011\
    by\u2011step anchoring. It can be implemented by extending `ModelMapper` with\
    \ a new `global_cluster_mapper` method that calls the clustering and constrained\
    \ placement routines before executing any partition.\n\nThe expected outcome is\
    \ a substantial reduction in total communication distance (and thus latency) because\
    \ large\u2011volume transfers will stay short and the entire network\u2019s ingress/egress\
    \ paths will be minimized. Given that the previous local tweak failed, this structural\
    \ change is the necessary next step."
