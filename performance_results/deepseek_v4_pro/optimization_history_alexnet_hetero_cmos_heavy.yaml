- change_summary: "## 1. Key weaknesses of the current nearest-neighbor approach (v3)\n\
    \nThe mapper suffers from several fundamental limitations that degrade mapping\
    \ quality in this heterogeneous mesh configuration:\n\n1. **Greedy, layer-by-layer\
    \ placement with no global awareness**  \n   * Each layer is placed independently,\
    \ optimizing only its own locality with respect to the previous layer\u2019s dominant\
    \ chiplet. There is no lookahead; the algorithm cannot foresee that early placement\
    \ choices will force later layers into sub\u2011optimal distant regions.  \n \
    \  * This leads to severe fragmentation and sub\u2011optimal network usage, especially\
    \ for deep networks like AlexNet.\n\n2. **Myopic \u201Cstarting chiplet\u201D\
    \ heuristic**  \n   * The next layer is anchored to the chiplet that hosted the\
    \ *largest percentage* of the previous layer. This ignores the distributed nature\
    \ of partitioned layers\u2014activations from many chiplets must flow to the next\
    \ layer\u2019s inputs. The dominant chiplet may not be the centroid of the previous\
    \ layer\u2019s communication footprint.  \n   * As a result, a large fraction\
    \ of intermediate activations may travel longer distances than necessary.\n\n\
    3. **Distance-only cost function with arbitrary tie\u2011breaking**  \n   * Chiplets\
    \ are sorted by (distance, available_memory, metric). This over\u2011emphasizes\
    \ hop count, often forcing layers onto chips with very little free memory just\
    \ because they are slightly nearer, causing unnecessary splitting across many\
    \ chips and increasing global communication.  \n   * When the network is heavily\
    \ loaded, this can create \u201Chot\u201D links and chiplets that degrade overall\
    \ throughput.\n\n4. **No consideration of communication volume**  \n   * The mapper\
    \ does not know the size of the activation tensors that must be transmitted between\
    \ layers. A small number of hops for a huge volume is far more damaging than many\
    \ hops for a tiny volume, yet the algorithm treats all distances equally.  \n\
    \   * This is particularly harmful for layers near the input and output (e.g.,\
    \ AlexNet\u2019s first conv layer and final fc layers) where data volumes are\
    \ large.\n\n5. **Ignores I/O chiplet locations and data injection/collection**\
    \  \n   * The 4 I/O chiplets at mesh corners are completely excluded from the\
    \ mapping logic. The first layer\u2019s input image and the last layer\u2019s\
    \ classification results must travel to/from these corners, but the mapper never\
    \ tries to place those layers nearby.  \n   * Consequently, the entire network\u2019\
    s critical ingress/egress traffic may traverse the entire mesh, adding substantial\
    \ latency and congestion.\n\n6. **Partitioning limited to output channels**  \n\
    \   * Conv layers are split along output channels, which produces partial sums\
    \ that must be gathered before the next layer\u2019s computation. The mapper has\
    \ no awareness of this \u201Call\u2011reduce\u201D traffic and does not attempt\
    \ to co\u2011locate partitions that share partial sums.  \n   * The na\xEFve partitioning\
    \ also ignores spatial parallelism (e.g., along feature map dimensions) that could\
    \ reduce communication.\n\n## 2. Specific opportunities for improvement given\
    \ this config\n\nWith 96 homogeneous CMOS\u2011Compute chiplets (2.46\u202FM weights\
    \ each) and 4 corner I/O chiplets on a 10\xD710 mesh, several enhancements can\
    \ drastically improve mapping quality:\n\n- **Global placement with communication\u2011\
    cost objective**  \n  Replace the sequential greedy mapper with a global optimizer\
    \ (e.g., simulated annealing or ILP) that jointly places all layers. The cost\
    \ function should be a weighted sum of hop distance \xD7 inter\u2011layer data\
    \ volume, plus penalties for chiplet capacity violations. Even a simple offline\
    \ \u201Csearch\u201D that can backtrack would yield much better locality.\n\n\
    - **Layer\u2011grouping for pipeline efficiency**  \n  Identify natural pipeline\
    \ stages (e.g., conv blocks) and place them as contiguous clusters in the mesh.\
    \ This reduces inter\u2011stage distance and can exploit the non\u2011pipelined\
    \ Garnet communication more efficiently.\n\n- **Proximity to I/O chiplets**  \n\
    \  Force the first and last layers to be placed close to an I/O chiplet, or at\
    \ least bias their placement toward the nearest corner. The distance penalty should\
    \ be weighted by the large activation sizes at the network boundaries.\n\n- **Communication\u2011\
    aware partitioning**  \n  Instead of always splitting conv layers along output\
    \ channels, consider splitting along input channels or spatially (e.g., along\
    \ height/width) when it reduces the need for partial\u2011sum aggregation. Coupling\
    \ the partitioner with the mapper allows the system to decide *how* to partition\
    \ based on communication cost.\n\n- **Dynamic sorting with a composite cost**\
    \  \n  Within the existing nearest\u2011neighbor framework, replace (distance,\
    \ memory, metric) with a cost function like `\u03B1\xB7distance + \u03B2\xB7(1\
    \ \u2013 normalized_available_memory)`, where \u03B1/\u03B2 are tuned per layer\
    \ based on its size and fan\u2011out. This helps avoid filling up tiny memory\
    \ holes just to save one hop.\n\n- **Use of mesh symmetry and bisection bandwidth**\
    \  \n  The 10\xD710 mesh has a large bisection; the mapper should deliberately\
    \ spread large layers across multiple rows/columns to utilize parallel links,\
    \ rather than clustering everything in one corner.\n\n- **Hotspot avoidance**\
    \  \n  Track the cumulative communication load on each link and each chiplet as\
    \ mapping proceeds, and use this \u201Ccongestion map\u201D to discourage further\
    \ placements that would overload already\u2011busy paths.\n\n## 3. What data/signals\
    \ the mapper currently ignores that it should use\n\nThe v3 mapper completely\
    \ neglects the following critical information, all of which are available (or\
    \ easily computable) in the simulation framework:\n\n- **Inter\u2011layer data\
    \ volumes** (activation tensor sizes)  \n  *Source:* Model definitions and workload\
    \ files already contain input/output activation shapes, from which byte volumes\
    \ can be derived.  \n  *Impact:* Using volume\u2011weighted distance would dramatically\
    \ reduce network congestion.\n\n- **I/O chiplet locations and ingress/egress traffic**\
    \  \n  *Source:* The system object knows which chiplets are I/O and their positions.\
    \  \n  *Impact:* Placing input\u2011consuming layers near an I/O chiplet cuts\
    \ the latency of the first inference step.\n\n- **Weight\u2011loading source and\
    \ initial distribution**  \n  *Source:* The configuration uses weight\u2011stationary\
    \ with all\u2011at\u2011once loading. A mapping that places a layer far from the\
    \ weight storage point incurs a one\u2011time burst of traffic.  \n  *Impact:*\
    \ For a typical inference run, this may be amortized, but for short jobs or memory\u2011\
    constrained chips, it can degrade performance.\n\n- **Chiplet utilization and\
    \ residual capacity after prior placements**  \n  *Source:* `current_available_crossbars`\
    \ already tracks memory, but the mapper uses it only as a secondary tie\u2011\
    breaker.  \n  *Impact:* A more sophisticated cost could favor chips with larger\
    \ contiguous free blocks to avoid unnecessary splitting.\n\n- **Network congestion\
    \ estimates (link loads)**  \n  *Source:* Simulators like Garnet can provide link\u2011\
    level statistics, but even a simple analytical model (like counting packets that\
    \ will traverse each link) can be incorporated.  \n  *Impact:* Avoiding congested\
    \ routes improves latency and throughput, especially with non\u2011pipelined communication\
    \ and blocking age thresholds.\n\n- **Layer compute latency vs. communication\
    \ latency**  \n  *Source:* CMOS chiplet compute rates (if known) and network bandwidth.\
    \  \n  *Impact:* For layers that are compute\u2011bound, a slightly longer communication\
    \ hop may be acceptable if it yields a more balanced memory layout; the mapper\
    \ never makes this trade\u2011off.\n\n- **Pipeline parallelism potential**  \n\
    \  *Source:* The layer dependency graph.  \n  *Impact:* The mapper could schedule\
    \ layers so that overlapping computation and communication is possible, but it\
    \ completely ignores this dimension.\n\nBy incorporating even a few of these ignored\
    \ signals, the mapper could produce placements that reduce latency by 20\u2013\
    50% and network congestion by a similar margin, as demonstrated in prior DNN\u2011\
    on\u2011chiplet research."
