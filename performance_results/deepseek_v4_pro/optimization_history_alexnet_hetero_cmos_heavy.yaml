    \ weight distribution can cause a one\u2011time traffic spike; placement far from\
    \ weight storage wastes bandwidth. |\n| **Remaining contiguous memory blocks per\
    \ chiplet** | `current_available_crossbars` already tracks capacity | Preferring\
    \ chips with larger free blocks avoids unnecessary splitting and fragmented allocations.\
    \ |\n| **Cumulative link congestion (byte\u2011by\u2011link map)** | Simulator\u2011\
    \ or analytic\u2011based estimation | Avoiding already\u2011busy paths prevents\
    \ throttling under non\u2011pipelined comm. |\n| **Compute latency vs. communication\
    \ latency** | CMOS chiplet compute bandwidth, network bandwidth | For compute\u2011\
    bound layers, a slightly longer communication path may be acceptable if it balances\
    \ memory capacity. |\n| **Pipeline parallelism potential** | Layer dependency\
    \ graph | Layers with no data dependency could be overlapped; the mapper ignores\
    \ this scheduling dimension. |\n| **Weight\u2011storage locations (if not uniform)**\
    \ | Chip weight loading source | Co\u2011locating weights and computation avoids\
    \ sustained DRAM\u2011to\u2011chiplet traffic after the initial load. |\n\n---\n\
    \n## Proposed Different Optimization Strategy  \n*(Given Iteration\u202F1 failed\
    \ to improve, and Iteration\u202F2 achieved a moderate reduction in latency, a\
    \ structurally different, volume\u2011aware global mapping is needed.)*\n\n###\
    \ **Strategy: Hierarchical Two\u2011Phase Global Mapper with Volume\u2011 and\
    \ I/O\u2011Awareness**\n\nThis new mapping function, `_global_volume_mapper`,\
    \ will be added to `ModelMapper` and selected via configuration. It operates in\
    \ two phases:\n\n---\n\n### Phase\u202F1 \u2013 Layer\u2011Group Clustering Using\
    \ a Data\u2011Volume Graph\n\n1. **Build a communication graph**  \n   - Nodes\
    \ are layers. Directed edges from layer *i* to layer *i\u202F+\u202F1* are weighted\
    \ by the activation tensor size (in bytes) that flows from *i* to *i\u202F+\u202F\
    1*. This data is obtainable from the model definitions (by calculating the output\
    \ tensor shape and `bits_per_activation`).\n\n2. **Add virtual attachment nodes\
    \ for I/O**  \n   - Add one virtual \u201Csource\u201D node connected to the first\
    \ layer and one \u201Csink\u201D node connected to the last layer. The source\u2011\
    to\u2011first\u2011layer edge weight equals the input image size; the last\u2011\
    layer\u2011to\u2011sink edge weight equals the output vector size. These virtual\
    \ nodes are forced to the mesh corners by assigning them fixed coordinates.\n\n\
    3. **Spectral clustering into *k* pipeline groups**  \n   - Use the normalized\
    \ cut of the weighted graph to partition the layer sequence into *k* groups, where\
    \ *k* \u2248 number of I/O chiplets or a small multiple (e.g., 4\u20138). Each\
    \ group will be assigned to a distinct region of the mesh, with the first and\
    \ last groups pinned near an I/O corner.\n\n---\n\n### Phase\u202F2 \u2013 Region\u2011\
    Constrained Global Placement\n\n1. **Assign each group a rectangular mesh region**\
    \  \n   - Map group\u20111 to the neighbourhood of an I/O chiplet (if it contains\
    \ the first layer), group\u2011k to another corner, and intermediate groups to\
    \ contiguous mid\u2011mesh regions of appropriate size. The region size is proportional\
    \ to the total weight\u2011units required by the layers in that group.\n\n2. **Inside\
    \ each region, solve a constrained assignment problem**  \n   - For each group,\
    \ place its layers (or their partitions) using an iterative improvement algorithm\
    \ (e.g., pairwise exchange or simulated annealing) that minimises the cost:  \n\
    \     **Cost = \u03A3 (hop distance from producer chiplet to consumer chiplet)\
    \ \xD7 (data volume) + capacity violation penalty**  \n   - The distance is computed\
    \ on the full mesh topology. Chiplet capacity is enforced by the penalty term;\
    \ the optimizer can split a layer across multiple chiplets if needed, but the\
    \ splitting is guided by the cost (so it only splits when truly beneficial).\n\
    \n3. **Incorporate congestion feedback**  \n   - As placement proceeds, maintain\
    \ a cumulative \u201Clink load\u201D map: each time a path is chosen for a given\
    \ volume, add that volume to the edges along the shortest path. The cost for subsequent\
    \ placements can then include a congestion term `\u03B3 \xD7 (link_load / link_bandwidth)`,\
    \ discouraging overloaded links.\n\n4. **Decide layer partitioning dynamically**\
    \  \n   - For conv layers, allow three splitting modes: *output\u2011channel split*,\
    \ *input\u2011channel split*, and *spatial split* (height/width). The optimizer\
    \ can tentatively try each mode, compute the resulting communication overhead\
    \ (e.g., partial\u2011sum gather vs. replication), and choose the one that yields\
    \ the lowest total cost within the current placement state.\n\n5. **Finalise and\
    \ commit**  \n   - Once the global placement and partitions are determined, translate\
    \ them into the required `layer_mappings` and `remaining_capacity` format so the\
    \ existing `LayerPartitioner` can be used to produce the final layer definitions.\
    \ The system capacity is updated atomically.\n\n---\n\n### Why this strategy is\
    \ fundamentally different\n\nPrevious attempts stayed within the per\u2011layer\
    \ greedy framework, tweaking tie\u2011breaking and local heuristics. This new\
    \ strategy:\n\n- **Introduces global vision** through clustering and region assignment,\
    \ breaking the cascade of bad decisions caused by greedy anchoring.\n- **Explicitly\
    \ weights distances by data volume**, solving the problem of miniscule layers\
    \ causing large\u2011volume layers to scatter.\n- **Forces proximity to I/O chiplets**,\
    \ tackling the currently ignored ingress/egress bottleneck.\n- **Uses congestion\u2011\
    aware optimization**, preventing hot\u2011spots that the existing mapper cannot\
    \ see.\n- **Couples partitioning with placement**, allowing the mapper to choose\
    \ how to split a layer rather than always assuming output\u2011channel splitting.\n\
    \nImplementing this hierarchical mapper should yield a far lower total communication\
    \ cost and thus a substantial latency reduction beyond the ~30\u202F% improvement\
    \ seen in Iteration\u202F2."
