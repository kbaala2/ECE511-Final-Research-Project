- change_summary: "## Analysis of `_nearest_neighbor_mapper_v3` Weaknesses\n\n###\
    \ 1. Key weaknesses\n- **Single\u2011chiplet bias** \u2013 The greedy allocator\
    \ fills one chiplet completely before moving to another, creating compute hotspots\
    \ and leaving other resources idle. A layer that could be parallelised over several\
    \ chiplets is forced to run on a single node.\n- **IGo\u2011blind first\u2011\
    layer anchor** \u2013 The first layer chooses the chiplet with the largest free\
    \ capacity alone, ignoring the corner I/O chiplets that are the entry points for\
    \ input data and weight loads. This can increase initialisation latency.\n- **One\u2011\
    source inter\u2011layer locality** \u2013 For layers after the first, only the\
    \ chiplet that received the largest fraction of the previous layer is used as\
    \ the distance source. The full distribution of the preceding layer\u2019s allocations\
    \ is discarded, leading to potentially poor aggregation of traffic.\n- **Rigid\
    \ candidate ordering** \u2013 Sorting by (distance, free memory, metric) means\
    \ a slightly farther chiplet with dramatically more free capacity will always\
    \ lose. There is no real trade\u2011off between proximity and load balancing.\n\
    - **Topological ignorance** \u2013 Edge and corner chiplets have lower degree\
    \ and more constrained paths; the mapper treats them identically to centre nodes,\
    \ which can create congestion bottlenecks.\n- **No lookahead** \u2013 Capacity\
    \ is consumed eagerly, so a small early layer can occupy a prime central location\
    \ that later large layers would benefit from, fragmenting the mapping and increasing\
    \ average hop count.\n- **Weight\u2011loading cost omitted** \u2013 In a weight\u2011\
    stationary, \u201Call_at_once\u201D scheme, the one\u2011time movement of weights\
    \ from I/O to compute chiplets can be significant. This overhead is never considered\
    \ during placement.\n- **Communication volume neglected** \u2013 The mapper sees\
    \ hop distance but not the amount of data that will travel those hops (activation\
    \ sizes). Large\u2011volume layers should be placed more carefully.\n\n### 2.\
    \ Opportunities given the 96\u2011CMOS + 4\u2011corner\u2011IO configuration\n\
    - With four I/O chiplets at the corners, the first layer can be placed to minimise\
    \ the weighted sum of distances to all I/O ports, cutting both input streaming\
    \ and initial weight\u2011loading latency.\n- Because all compute chiplets are\
    \ homogeneous CMOS, layer splitting along output channels can easily be enforced\
    \ to exploit parallelism. Early AlexNet CONV layers with large MACs would benefit\
    \ from spreading over several chiplets.\n- The large FC layers at AlexNet\u2019\
    s end demand substantial weight storage. Reserving a contiguous block of central\
    \ chiplets (high degree, short average path) for those layers would prevent them\
    \ from being pushed to the edges.\n- Activation sizes vary widely: early layers\
    \ have huge feature maps while later ones are small. This information can be used\
    \ to weigh the importance of distance, making the mapper more sensitive to real\
    \ communication volume.\n- Occupancy ratios can serve as a load\u2011balancing\
    \ signal, not just a binary free/full indicator. A channel that is 90\u202F% full\
    \ but very close might still be inferior to one that is 50\u202F% full and two\
    \ hops away, because the latter reduces fragmentation.\n\n### 3. Signals currently\
    \ available but ignored\n| Signal | Present in data | Used? |\n|--------|----------------|-------|\n\
    | I/O chiplet coordinates & distances | system topology | No |\n| Full distribution\
    \ of previous layer allocations | `layer_mappings[-1][1]` (list of (id, pct))\
    \ | Only max-id used |\n| Expected activation traffic volume | `layer_info['input_activation']`\
    \ (activation size in elements) | No |\n| Occupancy fraction (not just free/occupied)\
    \ | computed but only used to exclude full chiplets | No |\n| Node degree / mesh\
    \ position | networkx graph degrees | No |\n| Layer type (conv vs. fc) for natural\
    \ split axis | layer_type | Only for capacity calc; no parallelism decision |\n\
    | Total weight size per layer | `layer_info['num_weights']` | Only for capacity\
    \ checks; not for loading cost |\n| Allowed chiplet list / preference flags |\
    \ `preference` dict (partially) | Only \u201Callowed_chiplet_ids\u201D used; no\
    \ split\u2011factor or reservation hints |\n\n---\n\n## Proposed New Optimisation\
    \ Strategy\n\n**\u201CService\u2011Level\u2011Aware Partitioned Mapping with I/O\
    \ Proximity and Reservation\u201D**\n\nThis strategy modifies the core nearest\u2011\
    neighbour mapper to address the weaknesses above while reusing the existing partitioner.\
    \ The key changes:\n\n1. **First\u2011layer placement: multi\u2011IO cost**  \n\
    \   Compute a composite score for every compute chiplet:\n   ```\n   score = \u03B1\
    \xB7(1 / avg_dist_to_all_IO) + \u03B2\xB7free_capacity_ratio + \u03B3\xB7performance_metric\n\
    \   ```\n   where `avg_dist_to_all_IO` is the mean hop distance to the four corner\
    \ I/O chiplets. This balances proximity to data sources, available memory, and\
    \ chiplet quality.\n\n2. **Inter\u2011layer source: weighted centre\u2011of\u2011\
    mass**  \n   For layer L, use *all* chiplet allocations of layer L\u20111 as sources,\
    \ weighted by their percentage or, better, by the product of percentage and the\
    \ activation volume that chiplet will send (activation size \xD7 percentage).\
    \ Compute for every candidate chiplet a weighted average distance `avg_dist =\
    \ \u03A3 (weight_i \xD7 dist(candidate, chiplet_i))`. This anchors the new layer\
    \ near the traffic origin.\n\n3. **Candidate ranking: multi\u2011criteria scoring**\
    \  \n   For each candidate chiplet `c`, build a score:\n   ```\n   sc = w1\xB7\
    (1/(1+avg_dist)) + w2\xB7free_capacity_ratio + w3\xB7(1 - occupancy) + w4\xB7\
    (degree/n_max_degree) + w5\xB7metric\n   ```\n   Sort candidates by descending\
    \ `sc`. This allows a configurable trade\u2011off between locality, load balance,\
    \ topology, and hardware metric.\n\n4. **Forced layer splitting (parallelism)**\
    \  \n   Introduce a parameter `min_splits` (default 1). Even if a layer would\
    \ fit on a single chiplet, the mapper will spread it over the top\u2011N candidates\
    \ in proportion to their free capacity (or in equal parts). This prevents single\u2011\
    chiplet bottlenecks for compute\u2011heavy layers. For CMOS chiplets, splitting\
    \ along output channels is natural and low\u2011overhead.\n\n5. **Capacity reservation\
    \ for large FC layers**  \n   Before mapping any layer, estimate the total weight\
    \ budget required by the biggest layers (e.g., AlexNet FC6/FC7). Mark a contiguous\
    \ region of central chiplets as \u201Creserved\u201D for those layers. Early small\
    \ layers are placed elsewhere, preserving prime locations for the heavy communication\
    \ that will occur later.\n\n6. **Weight\u2011loading cost term**  \n   For each\
    \ candidate chiplet, compute the minimal hop distance to any I/O chiplet and add\
    \ a penalty proportional to the layer\u2019s weight size. This term is included\
    \ in the scoring function when the chiplet is considered for a layer whose weights\
    \ will be loaded all at once.\n\n### Expected Impact\n- **Latency reduction**\
    \ by placing the first layer closer to all I/O corners, improving both data injection\
    \ and weight pre\u2011loading.\n- **Better load balance** because forced splitting\
    \ and occupancy\u2011aware scoring prevent a single chiplet from becoming a compute\
    \ hotspot.\n- **Lower inter\u2011layer communication cost** through proper multi\u2011\
    source aggregation, reducing the average number of hops activations must travel.\n\
    - **Avoiding fragmentation** via reservation, ensuring that large FC layers sit\
    \ in low\u2011diameter positions.\n- **Configurability** \u2013 the weights `w1\u2026\
    w5` and `min_splits` can be tuned or driven by the existing `preference` dictionary\
    \ (e.g., \u201Cperformance\u201D \u2192 high w1, low min_splits; \u201Cenergy_efficiency\u201D\
    \ \u2192 reverse).\n\n### Implementation sketch (modifications to `_nearest_neighbor_mapper_v3`\
    \ only)\n\n```python\ndef _service_level_aware_mapper(self, model_layer_info,\
    \ system, preference,\n                                current_available_crossbars,\
    \ layer_mappings,\n                                shortest_paths):\n    # 1.\
    \ Determine whether this is the first layer to use I/O proximity,\n    #    else\
    \ compute weighted avg distance from previous layer distributions.\n    # 2. Build\
    \ candidate scores using\n    #      - distance (avg_dist or IO avg),\n    # \
    \     - free capacity ratio,\n    #      - occupancy (1 - used/total),\n    #\
    \      - degree factor,\n    #      - performance metric,\n    #      - weight-loading\
    \ distance (if weights not yet loaded).\n    # 3. Sort candidates by score.\n\
    \    # 4. If min_splits > 1, select min_splits top candidates and distribute\n\
    \    #    the layer proportionally to their free capacity (or equally), ensuring\n\
    \    #    no chiplet exceeds its available units.\n    # 5. Perform the usual\
    \ capacity update and rounding adjustment.\n```\n\nThis strategy is low\u2011\
    risk because it builds on the existing partitioning mechanism, only changes the\
    \ candidate selection logic, and adds no structural changes to the simulation.\
    \ The required signals are already present in the layer definitions and network\
    \ graph. By switching to this mapper (or making it selectable via `mapping_function`),\
    \ the tool can directly exploit the large homogeneous CMOS array and corner\u2011\
    I/O topology for AlexNet\u2011like workloads."
