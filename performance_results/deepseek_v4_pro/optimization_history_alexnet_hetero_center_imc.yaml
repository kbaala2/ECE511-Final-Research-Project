- change_summary: "## 1. Key weaknesses of the current nearest\u2011neighbor approach\n\
    \n- **Greedy single\u2011chiplet fill** \u2013 The allocator tries to place an\
    \ entire layer on one chiplet, splitting only when forced. This creates severe\
    \ compute hotspots and leaves the vast majority of the 96 CMOS chiplets idle during\
    \ any given layer.\n- **Ignorance of I/O position** \u2013 The first layer is\
    \ placed on the chiplet with most free capacity, without regard for the four corner\
    \ I/O chiplets that inject data and weights. Early weight\u2011loading and input\u2011\
    streaming distances can be large.\n- **Lossy inter\u2011layer locality** \u2013\
    \ For layer\u202FN, only the single chiplet that received the largest fraction\
    \ of layer\u202FN\u20111 is used as the distance source. The actual multi\u2011\
    source traffic pattern (weighted by activation volume) is discarded, so the new\
    \ layer may sit far from the centre of mass of the previous allocation.\n- **Rigid\
    \ candidate ordering** \u2013 Sorting by (distance, free memory, metric) offers\
    \ no real trade\u2011off: a chiplet one hop farther but with twice the free capacity\
    \ is never chosen, leading to fragmentation.\n- **Topology\u2011blind** \u2013\
    \ Edge/corner chiplets have lower degree and limited fan\u2011out, yet they are\
    \ treated as equal candidates. Placing a heavily communicating layer there can\
    \ create congestion.\n- **No pipe\u2011lining or global path awareness** \u2013\
    \ Mapping is done layer\u2011by\u2011layer without considering the *sequence*\
    \ of layers. Consecutive layers can end up many hops apart even if a spatially\
    \ contiguous assignment is possible.\n- **Weight\u2011loading cost omitted** \u2013\
    \ The one\u2011time movement of weights from I/O to compute chiplets is not minimised,\
    \ despite `weight_loading_strategy: all_at_once`.\n\n## 2. Specific opportunities\
    \ for improvement given this config\n\n- **96 homogeneous CMOS chiplets** invite\
    \ a *spatial pipeline* approach: map consecutive layers to adjacent chiplets so\
    \ that activation transfer needs only a single hop.\n- The **regular 10\xD710\
    \ mesh** allows pre\u2011computation of a Hamiltonian path (snake order) covering\
    \ all compute chiplets. Layers can be mapped in sequence along this path, guaranteeing\
    \ minimal inter\u2011layer hop distance.\n- With **4 I/O chiplets exactly at the\
    \ corners**, we can start the snake path at a corner to bring the first layer\
    \ close to an I/O, and also place the last layer near another corner if necessary\
    \ for output extraction.\n- **Weight\u2011stationary \u201Call at once\u201D loading**\
    \ benefits from placing a layer close to the I/O that will feed it weights. Starting\
    \ the path at a corner inherently provides short weight\u2011loading distance\
    \ for early layers.\n- For layers that must be split (e.g., large FC layers),\
    \ the **contiguous segments along the path** keep all chunks of a layer physically\
    \ close, allowing low\u2011latency partial sum reduction before the next layer\
    \ consumes the output.\n- The **partitioning code already splits layers along\
    \ output channels**; forcing this splitting into a contiguous block is straightforward.\n\
    \n## 3. What data/signals the mapper currently ignores that it should use\n\n\
    | Signal | Available? | Used? |\n|--------|------------|-------|\n| I/O chiplet\
    \ coordinates and distances | Yes, in topology | No |\n| Full distribution of\
    \ previous layer allocations | Yes (`layer_mappings[-1]`) | Only max\u2011id used\
    \ |\n| Activation traffic volume (`input_activation` size) | Yes in layer info\
    \ | No |\n| Occupancy fraction (not just free/full) | Computed but not in scoring\
    \ | No |\n| Node degree / mesh position (edge vs. centre) | NetworkX graph | No\
    \ |\n| Forward/backward model graph (sequential order) | Implicit in layer list\
    \ | Not exploited for global path |\n| Weight size for loading cost | Yes (`num_weights`)\
    \ | Not used for placement |\n\n---\n\n## Proposed new optimisation strategy:\
    \ \u201CHamiltonian Snake Mapping with Contiguous Layer Segments\u201D\n\nThis\
    \ strategy replaces the greedy nearest\u2011neighbour heuristic with a **deterministic,\
    \ topology\u2011driven placement schedule** that exploits the regular mesh and\
    \ sequential workload structure.\n\n### Core idea\n\n1. **Precompute a Hamiltonian\
    \ path** that starts at one corner I/O chiplet, snakes through all 96 compute\
    \ chiplets, and ends near another I/O corner. This path guarantees that every\
    \ edge connects adjacent chiplets, and the total order is fixed.\n2. **Assign\
    \ layers sequentially along the path**. For each layer, we allocate a **contiguous\
    \ segment** of chiplets on the path (possibly a single chiplet) proportional to\
    \ the layer\u2019s weight or compute demand.\n3. **Forced splitting for parallelism**\
    \ \u2013 even if a layer fits on one chiplet, it can be spread over a predefined\
    \ number of adjacent chiplet nodes (e.g., a block of size `min_splits`) to utilise\
    \ more resources, as long as the segment stays contiguous. The partitioner then\
    \ divides the layer evenly along output channels.\n4. **Inter\u2011layer communication**\
    \ now always travels at most one hop forward along the path, because the output\
    \ of layer\u202Fi\u2019s last chiplet is directly adjacent to the first chiplet\
    \ of layer\u202Fi+1. The result is **drastically reduced average communication\
    \ distance**.\n5. **Weight loading** \u2013 early layers are placed near the starting\
    \ I/O chiplet, reducing their initial weight\u2011transfer distance. The path\
    \ geometry can be tuned so that the most weight\u2011heavy layers sit close to\
    \ a corner I/O.\n6. **Capacity reservation implicitly handled** \u2013 because\
    \ the path consumes chiplets in order, large upcoming layers simply occupy a longer\
    \ segment, pushing later layers further along the path. This avoids fragmentation\
    \ without explicit reservation.\n7. **Handling of I/O for final output** \u2013\
    \ the end of the path is deliberately routed near an I/O chiplet, shortening the\
    \ latency for writing results back.\n\n### Implementation sketch (modifies only\
    \ `generate_mapping` and mapper logic)\n\n- **Precomputation**: In `ModelMapper.__init__`,\
    \ compute the snake order. Choose the corner I/O that minimises distance to the\
    \ starting chiplet (or a fixed corner). Generate an ordered list `chiplet_order`\
    \ of compute chiplet IDs that forms a Hamiltonian path (e.g., spiral or zig\u2011\
    zag covering the 10\xD710 mesh).\n- **Global assignment loop**: Instead of iterating\
    \ layers independently, run through the path sequentially, assigning one layer\
    \ after another while maintaining a pointer `path_ptr` into the chiplet order.\n\
    - For each layer:\n  - Determine number of chiplets needed (`n_chiplets`) based\
    \ on capacity and a configurable `min_splits`.\n  - Allocate `n_chiplets` consecutive\
    \ chiplets from `chiplet_order[path_ptr : path_ptr + n_chiplets]`.\n  - Distribute\
    \ the layer percentage proportionally across these chiplets (or equally); update\
    \ remaining capacities.\n  - Advance `path_ptr`.\n  - If a layer is too large\
    \ for a contiguous block, it can wrap around? Not possible on a path of all chiplets,\
    \ so we must ensure the path is long enough; but 96 chiplets provide huge total\
    \ capacity. For extreme cases, fall back to original greedy mapper.\n- The partitioner\
    \ then uses these percentages to split the layer as usual.\n- Communicate the\
    \ path ordering and adjacency to the simulator via the mapping; this simply changes\
    \ the chiplet assignment, no simulator changes needed.\n\n### Why this is different\n\
    \n- **Global ordering** rather than greedy local decisions \u2192 avoids compute\
    \ hotspots and fragmentation.\n- **Contiguous segments** make inter\u2011layer\
    \ transfers **1\u2011hop** (or minimal) whereas the previous strategies still\
    \ allowed arbitrary distance scaling.\n- **No need for complex scoring** or reservation\
    \ tables; the fixed path inherently organises spatial locality.\n- **Exploits\
    \ the dense mesh** \u2013 the snake path uses *all* chiplets in a prescribed order,\
    \ making full use of the 96\u2011chiplet array.\n\n### Expected impact on latency\n\
    \n- Drastically lower inter\u2011layer communication volume by collapsing multi\u2011\
    hop routes to single\u2011hop moves.\n- Better load distribution because every\
    \ layer is spread over a dedicated block, avoiding single\u2011chiplet bottlenecks.\n\
    - Improved weight\u2011loading time for early layers by starting the path at a\
    \ corner I/O.\n- Overall latency should drop significantly below the 42\u202F\
    k cycles achieved by the previous iteration, likely to less than 10\u202Fk cycles\
    \ for AlexNet, given that data movement is the primary bottleneck.\n\n### Configurability\n\
    \n- The path start corner can be selected based on I/O layout.\n- `min_splits`\
    \ controls the degree of parallelism \u2013 a performance/energy knob analogous\
    \ to the existing `preference` dictionary.\n- If the workload contains non\u2011\
    sequential connections (e.g., skip connections), a small extension can map those\
    \ layers onto the path so that the forward and backward hooks stay close, preserving\
    \ gains.\n\nThis Hamiltonian Snake Mapping is a fundamentally different approach\
    \ that replaces the nearest\u2011neighbour heuristic with a static, hardware\u2011\
    aware pipeline scheduling, directly addressing the core weaknesses while fully\
    \ leveraging the specific 96\u2011CMOS + 4\u2011corner\u2011IO configuration."
