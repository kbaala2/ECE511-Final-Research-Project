- change_summary: "**1. Key weaknesses of the current nearest\u2011neighbor approach**\n\
    \n- **All\u2011or\u2011nothing placement bias**  \n  The greedy allocator puts\
    \ an entire layer on a single chiplet as long as that chiplet has enough weight\
    \ capacity. This creates compute bottlenecks: one chiplet ends up performing all\
    \ the MACs for a layer while other compute resources sit idle. The mapper only\
    \ splits a layer when forced by capacity limits, ignoring the throughput gains\
    \ that come from parallel execution across multiple chiplets.\n\n- **Myopic starting\u2011\
    chiplet selection**  \n  For the first layer, the mapper picks the chiplet with\
    \ the most available memory (and then the highest performance/energy metric) but\
    \ completely ignores the location of I/O chiplets. This wastes an opportunity\
    \ to reduce the latency of loading both input data and (initially) weights from\
    \ the corners of the mesh. For subsequent layers, only the single dominant chiplet\
    \ of the previous layer is used as the anchor; the full distribution of the previous\
    \ layer\u2019s allocations is discarded, so the new layer may be placed far from\
    \ the majority of the data sources.\n\n- **Distance\u2011only ordering with weak\
    \ tie\u2011breakers**  \n  Chiplet candidates are sorted first by hop distance\
    \ from the starting chiplet, then by available memory, and only then by the performance/energy\
    \ metric. This rigid ordering ignores the fact that a chiplet slightly farther\
    \ away but with significantly more free capacity might prevent later fragmentation,\
    \ or that a high\u2011metric chiplet at the same distance is always better than\
    \ a lower\u2011metric one. The metric never truly balances the trade\u2011offs.\n\
    \n- **No awareness of network topology beyond hop count**  \n  Edge and corner\
    \ chiplets have lower degree and may become congestion hot\u2011spots, yet the\
    \ mapper treats all chiplets equally. Placing heavily communicating layers on\
    \ the periphery can degrade overall network performance in a mesh.\n\n- **Lack\
    \ of lookahead**  \n  Mapping is strictly layer\u2011by\u2011layer without reserving\
    \ capacity for later, possibly large layers. A layer that fits easily in a central,\
    \ well\u2011connected chiplet might block that prime location, forcing subsequent\
    \ high\u2011traffic layers into remote corners, increasing the total communication\
    \ distance.\n\n- **Weight\u2011loading cost ignored**  \n  With weight\u2011stationary\
    \ execution and `all_at_once` weight loading, the one\u2011time movement of weights\
    \ from I/O chiplets to compute chiplets can be a significant overhead. The mapper\
    \ does not account for the weight size of a layer or the distance from I/O, losing\
    \ a chance to minimise initialisation latency.\n\n**2. Specific opportunities\
    \ for improvement given this config**\n\n- **Integrate I/O proximity from the\
    \ start**  \n  Choose the first layer\u2019s placement by balancing available\
    \ memory with proximity to the four corner I/O chiplets (e.g., minimise weighted\
    \ sum of distances). This reduces both input\u2011stream latency and the initial\
    \ weight\u2011loading distance for that layer.\n\n- **Use weighted multi\u2011\
    source distances for subsequent layers**  \n  Replace the single \u201Clast dominant\
    \ chiplet\u201D heuristic with a cost that considers *all* chiplet allocations\
    \ of the previous layer, weighted by their percentages or, even better, by the\
    \ expected activation volume they will send. This naturally pulls the new layer\
    \ toward the centre of mass of the previous allocation.\n\n- **Introduce a composite\
    \ score for chiplet ranking**  \n  Instead of strict sorting, compute a score\
    \ that combines:\n  - distance to the source (previous layer or I/O),\n  - fraction\
    \ of free weight capacity (to spread load),\n  - current occupancy or a \u201C\
    hotness\u201D penalty,\n  - chiplet degree or position (centre vs. edge).  \n\
    \  Even a simple linear combination with configurable weights would let the user\
    \ express a preference for balancing vs. locality.\n\n- **Deliberate layer splitting\
    \ for parallelism**  \n  Allow a \u201Cminimum split\u201D parameter: even if\
    \ a layer would fit on one chiplet, force it to be divided among the *n* nearest\
    \ candidates in proportion to their capacity. This improves compute utilisation\
    \ and avoids single\u2011chiplet bottlenecks, especially for compute\u2011intensive\
    \ CONV layers in AlexNet\u2019s early stages.\n\n- **Plan capacity reservation\
    \ for large FC layers**  \n  AlexNet ends with large fully\u2011connected layers.\
    \ The mapper could estimate the total weight budget needed for upcoming layers\
    \ and reserve capacity in well\u2011connected regions, preventing early small\
    \ layers from consuming the best spots.\n\n- **Use activation sizes for communication\u2011\
    cost weighting**  \n  The mapper already receives `input_activation` and `total_macs`\
    \ in the layer info. Large activation volumes (e.g., early CONV layers with large\
    \ feature maps) should be given a higher weight in the distance minimisation,\
    \ making the mapper more sensitive to the real communication burden.\n\n**3. What\
    \ data/signals the mapper currently ignores that it should use**\n\n- **I/O chiplet\
    \ locations and distances** \u2013 never referenced, despite their key role in\
    \ feeding inputs and hosting weight storage.\n- **Full distribution of the previous\
    \ layer\u2019s allocations** \u2013 only the chiplet with the highest percentage\
    \ is used; the remaining chiplets and their traffic contributions are lost.\n\
    - **Expected communication volume between layers** \u2013 available through `input_activation`\
    \ size (and total MACs), which directly indicates the number of bytes that must\
    \ travel across the mesh.\n- **Current chiplet occupancy (as a fraction of total\
    \ capacity)** \u2013 computed but only used to exclude full chiplets; it could\
    \ be employed to balance load actively rather than just filling the closest candidate.\n\
    - **Topological node degree / chiplet position on the mesh** \u2013 edge/corner\
    \ chiplets have fewer outgoing links and are more prone to congestion; the mapper\
    \ could avoid placing high\u2011traffic layers in those positions.\n- **Layer\u2011\
    type knowledge for parallelism opportunities** \u2013 for example, CONV layers\
    \ split naturally along output channels; the mapper could favour a cluster of\
    \ adjacent chiplets that can later be merged with low\u2011cost reduction.\n-\
    \ **Total weight sizes of layers** \u2013 used only for capacity checks, not for\
    \ estimating the one\u2011time weight\u2011loading cost from I/O."
