- change_summary: "## 1. Key Weaknesses of the Current Nearest\u2011Neighbour Approach\n\
    \n- **Greedy layer\u2011by\u2011layer placement without inter\u2011layer communication\
    \ awareness**  \n  The mapper treats layers in isolation, selecting a new seed\
    \ solely from the previous layer\u2019s largest partition. It ignores the volume\
    \ of data that must flow between consecutive layers (activations) and any skip/residual\
    \ connections. In a weight\u2011stationary setup, this leads to arbitrarily long\
    \ paths for inter\u2011layer data transfers, increasing latency and energy.\n\n\
    - **Fragile seeding strategy based on the max\u2011chiplet**  \n  The seed for\
    \ layer *L+1* is the chiplet that received the largest percentage of layer *L*.\
    \ If that chiplet is nearly full, the next layer spills onto distant neighbours,\
    \ fragmenting the logical pipeline. This greedy choice does not represent a \u201C\
    geometric centre\u201D of the previous layer\u2019s placement, so successive layers\
    \ become spatially scattered.\n\n- **No I/O location awareness**  \n  The four\
    \ I/O chiplets at the mesh corners are completely ignored. The first layer\u2019\
    s input activations must be loaded from an I/O, and the final layer\u2019s output\
    \ must be sent back; the mapper may place these layers far from any I/O, adding\
    \ unnecessary hops to the critical ingress/egress paths.\n\n- **Excessive fragmentation\
    \ within a single layer**  \n  The algorithm expands in concentric distance rings,\
    \ greedily filling whatever capacity it finds. When the nearest neighbours have\
    \ only small available weight units, the layer can end up distributed across many\
    \ non\u2011contiguous chiplets. This increases the complexity of multicast/broadcast\
    \ of input activations and partial\u2011sum collection.\n\n- **Ineffective homogeneous\
    \ metric**  \n  With all 96 CMOS_Compute chiplets having identical specifications,\
    \ the `active_metric` (likely \u201Cperformance\u201D) is equal for all nodes.\
    \ Sorting by memory first then metric therefore degenerates to pure \u201Clargest\
    \ free capacity first\u201D within the distance ring, missing an opportunity to\
    \ balance compute load or maintain compactness.\n\n- **No spatial clustering or\
    \ packing for future layers**  \n  Because each layer consumes capacity greedily,\
    \ the free space becomes fragmented. Later layers may find themselves forced into\
    \ inefficient long\u2011distance expansions, even though a more compact placement\
    \ in a different region could have preserved a large contiguous block.\n\n## 2.\
    \ Specific Opportunities for Improvement Given This Config\n\n1. **I/O\u2011proximity\
    \ seeding for first and last layers**  \n   Modify the seed selection for the\
    \ initial layer to favour chiplets physically close to any I/O chiplet (preferably\
    \ the one feeding the input). Similarly, bias the final layer toward an I/O. This\
    \ can be done by adding a penalty term to the distance\u2011based sorting criterion\
    \ (e.g., `distance + \u03BB\xB7min_distance_to_io`).\n\n2. **Centroid\u2011based\
    \ inter\u2011layer locality**  \n   Instead of the max\u2011chiplet seed, compute\
    \ the **weight\u2011proportioned centroid** of the previous layer (average chiplet\
    \ coordinates, weighted by the fraction of weights placed). The next layer should\
    \ start from the available chiplet nearest to that centroid. This keeps successive\
    \ layers spatially clustered and reduces the average hop count for activation\
    \ transfers.\n\n3. **Force contiguity with region growing**  \n   When mapping\
    \ a single layer, adopt a region\u2011growing strategy: start from the seed and\
    \ expand only to immediate neighbours, filling a connected component. Reserve\
    \ expanding to the next distance ring only when the contiguous region cannot accommodate\
    \ the total required weight units. This minimises the layer\u2019s spatial extent\
    \ and yields compact, multicast\u2011friendly placements.\n\n4. **Explicitly account\
    \ for inter\u2011layer data volume and skip connections**  \n   Use the workload\
    \ metadata (activation sizes, `total_macs`) to compute data transfer costs between\
    \ layers. Weight the placement such that layers with large inter\u2011layer traffic\
    \ are kept closer together. For residual blocks, ensure the layer that produces\
    \ the skip output is co\u2011located with the addition layer, e.g., by constraining\
    \ their centroids to be within a small distance threshold.\n\n5. **Load\u2011\
    balanced partitioning using per\u2011chiplet compute throughput**  \n   Even if\
    \ the current config uses homogeneous chiplets, the mapper should be future\u2011\
    proof. When assigning a percentage of a layer to a chiplet, scale the allocation\
    \ by the chiplet\u2019s **compute throughput** (e.g., MACs/second) rather than\
    \ relying solely on memory capacity. This prevents pipeline stalls caused by one\
    \ slow chiplet.\n\n6. **Simple global optimisation post\u2011pass**  \n   Given\
    \ that weights are loaded *all\u2011at\u2011once* and the mapping is static, a\
    \ lightweight iterative improvement (e.g., simulated annealing of the mapping\
    \ graph) could be applied after the greedy placement. Move small partitions between\
    \ chiplets to reduce total inter\u2011layer communication distance, constrained\
    \ by capacity.\n\n## 3. Data / Signals the Mapper Currently Ignores That It Should\
    \ Use\n\n| Ignored Signal               | Why It Is Important                \
    \                                                                 |\n|------------------------------|-----------------------------------------------------------------------------------------------------|\n\
    | **I/O chiplet locations**    | Inputs enter from and outputs leave through specific\
    \ corners; ignoring them creates long ingress/egress paths. |\n| **Inter\u2011\
    layer activation sizes** | The volume of data flowing from layer *i* to *i+1*\
    \ directly determines the communication penalty of distance. Larger transfers\
    \ demand closer placement. |\n| **Residual (skip) connections** | In ResNet\u2011\
    50, the output of a block must be added to its input; the feed\u2011forward and\
    \ skip paths need to be co\u2011located to avoid large data movements. |\n| **Chiplet\
    \ compute performance / MAC rate** | With heterogeneous tiles, equal memory\u2011\
    based partitioning leads to load imbalance, causing pipeline bubbles. |\n| **Spatial\
    \ occupancy map / fragmentation** | The mapper only sees per\u2011chiplet remaining\
    \ capacity, not how free chiplets are clustered. Using a 2D occupancy grid would\
    \ enable deliberate packing into connected blocks. |\n| **Multicast/broadcast\
    \ capabilities** | The mesh network supports efficient distance\u2011bound multicast;\
    \ the mapper does not use this to group layer partitions for reduced input\u2011\
    activation replication. |\n| **Layer\u2019s MAC intensity (ops/byte)** | Can differentiate\
    \ communication\u2011 vs. computation\u2011bound layers, guiding trade\u2011offs\
    \ between memory\u2011centric and compute\u2011centric placement. |\n| **Weight\u2011\
    loading cost**      | Under the \u201Call\u2011at\u2011once\u201D strategy, the\
    \ initial mapping determines loading paths; a placement far from the I/O will\
    \ incur a one\u2011time but large weight\u2011transfer cost. |\n\n**Suggested\
    \ Different Strategy** (given the previous optimisation attempt yielded no improvement):\
    \  \nCombine **centroid\u2011based inter\u2011layer seeding** with a **compact\
    \ region\u2011growing assignment** that explicitly minimises the number of chiplets\
    \ used per layer, and augment the seed selection for the first/last layers with\
    \ **I/O proximity**. After greedy placement, perform a simple **swap\u2011based\
    \ hill climbing** that moves small partitions to reduce the sum of weighted hop\u2011\
    counts between dependent layers, constrained by the weight\u2011stationary requirement.\
    \ This approach directly targets latency by shortening critical communication\
    \ paths rather than merely reordering the greedy choice."
