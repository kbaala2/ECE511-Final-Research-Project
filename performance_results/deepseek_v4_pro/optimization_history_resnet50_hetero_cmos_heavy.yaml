- change_summary: "## Analysis of `_nearest_neighbor_mapper_v3`\n\n### 1. Key Weaknesses\
    \ of the Current Nearest\u2011Neighbor Approach\n\n**Greedy, layer\u2011wise placement\
    \ ignores inter\u2011layer communication cost**  \n- The mapper treats each layer\
    \ independently. It places one layer, then uses the chiplet that received the\
    \ largest fraction of that layer as the seed for the next layer.  \n- There is\
    \ **no consideration of the data volume** that flows between consecutive layers,\
    \ nor the presence of **skip connections** (e.g., ResNet\u201150 residuals). Placing\
    \ a layer\u2019s partitions far from the previous layer\u2019s output or far from\
    \ the skip\u2011addition target dramatically increases latency and energy for\
    \ inter\u2011layer communication.  \n- In a weight\u2011stationary setting, activations\
    \ must be broadcast/multicast between layers; the current algorithm does not minimise\
    \ the hop count for these transfers.\n\n**Fragile seeding strategy \u2013 \u201C\
    max\u2011chiplet\u201D can be a poor starting point**  \n- The seed for layer\
    \ *i*+1 is the chiplet that received the largest percentage of layer *i*. If that\
    \ chiplet is nearly full, the next layer is forced to spill out to distant neighbours,\
    \ scattering the computation and destroying locality.  \n- The seed does **not\
    \ represent a geographical centroid** of the previous layer\u2019s placement.\
    \ A centroid\u2011based starting point would keep successive layers spatially\
    \ overlapped and reduce communication distance.\n\n**No I/O awareness**  \n- The\
    \ 10\xD710 mesh has four I/O chiplets at corners. The mapper completely ignores\
    \ their locations. The first layer\u2019s input activations must be loaded from\
    \ an I/O chiplet, yet the seed is chosen only by available memory and a generic\
    \ \u201Cperformance\u201D metric \u2013 it may be placed far from any I/O, increasing\
    \ the initial broadcast cost.  \n- Similarly, the final layer\u2019s output must\
    \ be sent to an I/O chiplet; the mapper makes no effort to map the last layer\
    \ near an I/O.\n\n**Potential fragmentation and excessive layer spreading**  \n\
    - Within one layer, the algorithm fills chiplet capacity in strict distance\u2011\
    then\u2011memory\u2011then\u2011metric order. If the nearest neighbours are fragmented\
    \ (e.g., many chiplets with small available weight units), the layer will be scattered\
    \ over many chiplets, possibly far apart.  \n- It does **not try to minimise the\
    \ number of chiplets** used per layer. A single contiguous block of chiplets would\
    \ reduce multicast complexity and improve on\u2011chiplet aggregation, but the\
    \ current method produces arbitrary scattering.\n\n**Homogeneous metric is ineffective;\
    \ compute\u2011load imbalance is not addressed**  \n- In the given config all\
    \ 96 compute chiplets are identical CMOS_Compute units. The `active_metric` (performance)\
    \ is likely equal for all, rendering the sorting step useless.  \n- Even if chiplets\
    \ were heterogeneous, the mapper sorts by **available memory first, then metric**,\
    \ so a chiplet with slightly less memory but much higher performance could be\
    \ skipped, leading to compute\u2011load imbalances that stall the pipeline.\n\n\
    **Fixed expansion pattern ignores spatial structure of the free capacity**  \n\
    - The mapper always expands in concentric rings from the seed, regardless of whether\
    \ the mesh has a large empty region elsewhere that could host the layer more compactly.\
    \  \n- Later layers inherit whatever fragmented capacity remains, without any\
    \ attempt to \u201Cpack\u201D layers in a way that preserves large contiguous\
    \ regions for future large layers.\n\n### 2. Specific Opportunities for Improvement\
    \ Given This Config\n\n**a) Incorporate I/O proximity for first and last layers**\
    \  \nWhen choosing the seed for the very first layer, bias towards chiplets that\
    \ are near an I/O chiplet (preferably the one that will feed the input). For the\
    \ last layer, similarly favour chiplets close to the I/O where the output will\
    \ be collected. This can be done by augmenting the distance metric with a penalty\
    \ for I/O distance.\n\n**b) Use centroid\u2011based placement for inter\u2011\
    layer locality**  \nInstead of the single max\u2011chiplet seed, compute the **weight\u2011\
    proportioned centroid** of the previous layer (average chiplet position, weighted\
    \ by the fraction of weights assigned). Then start the next layer from the available\
    \ chiplet nearest to that centroid. This keeps successive layers spatially clustered,\
    \ reducing average hop count for activation transfers.\n\n**c) Force contiguity\
    \ or compactness for a single layer**  \nWhen mapping a layer, try to fill a **connected\
    \ component** of chiplets first. Use a region\u2011growing algorithm that starts\
    \ from the seed and expands to neighbouring chiplets with sufficient capacity,\
    \ only moving further if the component cannot hold the entire layer. This minimises\
    \ the layer\u2019s footprint and the cost of intra\u2011layer communication (e.g.,\
    \ collecting partial sums).\n\n**d) Account for inter\u2011layer data volume**\
    \  \nUse the workload information (activation sizes, `total_macs`) to compute\
    \ the **amount of data transferred** between successive layers. Weight the placement\
    \ so that layers with large inter\u2011layer traffic are kept closer. For residual\
    \ connections, explicitly ensure that the layer producing the skip\u2011connects\
    \ output is placed near the layer that performs the addition.\n\n**e) Balance\
    \ compute load in heterogeneous scenarios**  \nEven though the current config\
    \ may be homogeneous, the mapper should be ready for heterogeneous CMOS chiplets.\
    \ When assigning a percentage of a layer to a chiplet, scale the assignment by\
    \ the chiplet\u2019s compute throughput (not just its memory capacity). This keeps\
    \ the pipeline balanced and avoids stragglers.\n\n**f) Global optimisation pass\
    \ over all layers**  \nGiven that weight loading is *all\u2011at\u2011once* and\
    \ the mapping is static, a more sophisticated algorithm (e.g., graph partitioning\
    \ on the chiplet mesh, force\u2011directed placement, or iterative improvement)\
    \ could be applied to the whole model. For instance, treat the chiplet mesh as\
    \ a 2D grid and place layers as \u201Crectangles\u201D of chiplets, attempting\
    \ to minimise total communication energy while respecting capacity.\n\n### 3.\
    \ Data / Signals the Mapper Currently Ignores That It Should Use\n\n| Ignored\
    \ Signal                   | Why It Is Important                             \
    \                                                  |\n|----------------------------------|----------------------------------------------------------------------------------------------------|\n\
    | **I/O chiplet locations**        | Inputs enter from and outputs leave through\
    \ specific corners; ignoring them creates long paths.    |\n| **Inter\u2011layer\
    \ activation sizes** | The volume of data flowing between layers directly impacts\
    \ communication cost. Larger transfers should be placed closer. |\n| **Residual\
    \ (skip) connections**  | In ResNet\u201150, the output of a block must be added\
    \ to its input. The feed\u2011forward path and the skip path should be co\u2011\
    located. |\n| **Chiplet compute performance**  | If chiplets have different throughput,\
    \ equal memory\u2011based partitioning leads to load imbalance.     |\n| **Spatial\
    \ fragmentation of free capacity** | The mapper sees only per\u2011chiplet availability,\
    \ not how the free chiplets are clustered. Using a 2D occupancy map would allow\
    \ compact placement. |\n| **Multicast/broadcast topology support** | The mesh\
    \ network supports efficient multicast to nearby nodes; the mapper does not exploit\
    \ this by clustering grouped layers. |\n| **Layer\u2019s MAC intensity / operational\
    \ intensity** | Determines whether communication or computation dominates; could\
    \ influence trade\u2011off between memory\u2011centric and compute\u2011centric\
    \ placement. |\n\nCapturing and using these signals would transform the mapper\
    \ from a simple greedy nearest\u2011neighbour to a communication\u2011aware, load\u2011\
    balanced placement engine suited for a weight\u2011stationary CNN workload on\
    \ a tiled many\u2011chiplet architecture."
