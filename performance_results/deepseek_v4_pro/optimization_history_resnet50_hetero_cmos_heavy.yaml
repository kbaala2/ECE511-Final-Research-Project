- change_summary: "## 1. Key Weaknesses (Still Present After Previous Attempts)\n\n\
    The previous improvement (centroid\u2011based seeding + region growing) shortened\
    \ inter\u2011layer hop counts but still suffers from:\n\n- **Greedy, layer\u2011\
    by\u2011layer nature** \u2013 the decision made for layer *i* constrains all subsequent\
    \ layers; there is no look\u2011ahead, so early layers may consume capacity in\
    \ a way that forces later layers to scatter, even if an alternative placement\
    \ could keep the whole pipeline more compact.\n- **No global cost minimisation**\
    \ \u2013 inter\u2011layer communication distances are only reduced inside one\
    \ layer\u2019s expansion ring; the mapper does not consider the total sum of weighted\
    \ hop counts across the whole model.\n- **Skip connections are still ignored**\
    \ \u2013 a residual block\u2019s adder needs both the feed\u2011forward and skip\
    \ path activations, but the mapper does not ensure those two layer partitions\
    \ stay close.\n- **I/O awareness only for first/last layer seeding** (if added)\
    \ doesn\u2019t optimise the overall path from input to output; internal layers\
    \ that depend on far\u2011off I/O (e.g., weight loading from corners) remain unoptimised.\n\
    \n## 2. Different Optimization Strategy: Global Force\u2011Directed Placement\
    \ with Adaptive Partitioning\n\nInstead of incremental layer\u2011by\u2011layer\
    \ decisions, we propose a **force\u2011directed global placement** algorithm that\
    \ treats all layers simultaneously. This approach directly tackles the inter\u2011\
    layer communication bottleneck, the major source of latency in weight\u2011stationary\
    \ settings.\n\n### High\u2011level idea\n\n- Model the chiplet mesh as a 2D grid,\
    \ and each **layer\u2019s weight partition** as a movable block (size proportional\
    \ to weight units).  \n- Define **attractive forces** between blocks that correspond\
    \ to the amount of activation data flowing between them (derived from layer graph,\
    \ including residual connections).  \n- Define **repulsive forces** to avoid over\u2011\
    packing chiplets beyond capacity.  \n- Apply an iterative solver (e.g., Verlet\
    \ integration or a quadratic placement with discrete snapping) to find block positions\
    \ that minimise total potential energy \u2192 the energy correlates with total\
    \ communication distance.  \n- After convergence, **snap the blocks to the nearest\
    \ available chiplets** while respecting capacity, then split layers that don\u2019\
    t fit entirely onto one chiplet using a **contiguous region\u2011growing** algorithm\
    \ that respects the forced\u2011directed \u201Ctarget\u201D positions.\n\n###\
    \ How it uses previously ignored signals\n\n| Ignored Signal                 \
    \   | Used in Force\u2011Directed Mapper                                     \
    \ |\n|-----------------------------------|--------------------------------------------------------------------|\n\
    | Inter\u2011layer activation sizes      | Spring stiffness = data volume, so\
    \ large transfers attract strongly. |\n| Residual (skip) connections       | Added\
    \ as extra springs from the skip\u2011output layer to the adder layer. |\n| I/O\
    \ chiplet locations             | Fixed anchor points with springs to the first\
    \ layer (input) and last layer (output). |\n| Spatial occupancy / fragmentation\
    \ | Repulsive forces between overlapping blocks prevent congestion; final snapping\
    \ uses a 2D occupancy map to ensure compactness. |\n| Weight\u2011loading cost\
    \               | A one\u2011time spring from I/O to each layer\u2019s weight\
    \ location; if all\u2011at\u2011once loading matters, add a penalty for I/O distance.\
    \ |\n\n### Algorithm sketch (new mapper function `_global_force_directed_mapper`)\n\
    \n1. **Extract layer graph** from model_metrics: nodes = layers, directed edges\
    \ with weight = total activation bytes (from `total_macs` or explicit activation\
    \ size). Add edges for residual connections (e.g., for ResNet\u201150 blocks,\
    \ connect the layer that produces the skip output to the addition layer). Add\
    \ artificial edges from a virtual \u201Cinput\u201D node to the first layer and\
    \ from the last layer to a virtual \u201Coutput\u201D node, with spring constants\
    \ reflecting I/O bandwidth needs. The virtual nodes are placed at the centroid\
    \ of the I/O chiplets (or individually at each I/O chiplet with high stiffness).\n\
    \n2. **Initialize block positions** in a continuous coordinate space (e.g., the\
    \ same 10\xD710 grid scaled to some units). Each block\u2019s size (area) is proportional\
    \ to the weight units needed for the entire layer, but we treat each block as\
    \ a point mass at this stage.\n\n3. **Run iterative force\u2011directed placement**:\
    \ For each node, compute the net force from all springs (F = k * distance) and\
    \ from a simple repulsion term (to avoid overlap: e.g., F_repel = constant / distance\xB2\
    \ between all pairs of nodes). Update positions using a damping coefficient to\
    \ converge.\n\n4. **Discretise positions onto chiplets**: Build a **cost matrix**\
    \ where each layer can be assigned to chiplet(s) based on distance from the continuous\
    \ position, remaining capacity, and desired compactness. Use a greedy assignment\
    \ that tries to place the entire layer onto one chiplet if possible; otherwise,\
    \ split layer as a contiguous region around the nearest available chiplet (using\
    \ the region growing with centroid bias). The force\u2011directed positions serve\
    \ as attractors: we start from the chiplet closest to the layer\u2019s desired\
    \ position and expand.\n\n5. **Post\u2011optimisation swaps**: After initial assignment,\
    \ perform local hill climbing (swap small partitions between chiplets) to further\
    \ reduce total weighted hop count, constrained by capacity.\n\n### Why this is\
    \ different and likely better\n\n- **Global view** avoids greedy fragmentation.\
    \ The algorithm can choose to place a large early layer slightly off the optimal\
    \ local spot to leave contiguous space for a later huge layer, because the spring\
    \ forces naturally find a compromise.\n- **Communication\u2011centric** \u2013\
    \ the core objective directly minimises total inter\u2011layer hop count weighted\
    \ by traffic volume, which is the key driver of latency in non\u2011pipelined,\
    \ weight\u2011stationary execution.\n- **Residual\u2011aware** \u2013 by explicitly\
    \ adding skip\u2011connection springs, the adder layer is pulled toward both its\
    \ feed\u2011forward predecessor and the earlier output, preventing costly long\u2011\
    distance data movement.\n- **I/O integrated** \u2013 the entire data flow, from\
    \ input ingress to output egress, is part of the same cost function, so the whole\
    \ pipeline is optimised end\u2011to\u2011end.\n\n## 3. Additional Data / Signals\
    \ to Collect for the Force\u2011Directed Mapper\n\n| Signal                  \
    \                   | How to obtain / estimate                               \
    \                         |\n|--------------------------------------------|---------------------------------------------------------------------------------|\n\
    | Activation tensor sizes (bytes) per layer  | From layer definitions: output\
    \ channels \xD7 spatial dimensions \xD7 bits_per_activation / 8 |\n| Residual\
    \ connection topology               | Parse model definitions (ResNet\u201150\
    \ building blocks have known skip patterns)    |\n| Weight\u2011loading paths\
    \ and bandwidth         | If all\u2011at\u2011once, the one\u2011time weight placement\
    \ cost can be derived from I/O proximity |\n| Chiplet compute throughput (MACs/s)\
    \        | From chiplet yaml; used for load balancing in case of heterogeneous\
    \ hardware    |\n\nBy implementing this force\u2011directed global placer, we\
    \ expect further latency reductions compared to the centroid\u2011based greedy\
    \ method, because the placement will be globally optimised for the complete data\u2011\
    flow graph rather than reacting layer by layer."
