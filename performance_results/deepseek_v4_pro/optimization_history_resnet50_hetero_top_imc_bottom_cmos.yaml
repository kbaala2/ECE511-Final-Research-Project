- change_summary: "## 1. Key Weaknesses of the Current Nearest\u2011Neighbor Approach\n\
    \n1. **Single\u2011anchor myopia** \u2013 Only the highest\u2011allocation chiplet\
    \ of the previous layer is used as the anchor for the next layer. When the previous\
    \ layer is split, the data from the other source partitions must travel long distances\
    \ to reach the new layer\u2019s scattered destinations, inflating traffic and\
    \ latency.\n\n2. **Sequential greedy commitment** \u2013 Capacity is consumed\
    \ layer\u2011by\u2011layer without any look\u2011ahead. Early small layers often\
    \ exhaust nearby chiplet space, leaving insufficient contiguous capacity for later\
    \ large layers and causing unnecessary mapping failures or highly fragmented assignments.\n\
    \n3. **Ignorance of the full dependency graph** \u2013 The mapper treats the network\
    \ as a linear list; skip connections (e.g., residual adds in ResNet\u201150) are\
    \ completely ignored. A layer with multiple predecessors gets placed far from\
    \ some of them, introducing extra hops for the skipped paths.\n\n4. **No communication\u2011\
    volume weighting** \u2013 Every hop is considered equally important. Large activation\
    \ volumes between layers are not given priority; a low\u2011traffic edge may be\
    \ placed closely while a high\u2011volume edge is forced to span many hops.\n\n\
    5. **Absence of compute\u2011load balancing** \u2013 Only weight\u2011memory capacity\
    \ is tracked. The `total_macs` field is ignored, so some chiplets can become compute\u2011\
    heavy hotspots while others are under\u2011utilized, leading to load imbalance\
    \ and pipeline stalls.\n\n6. **Ignorance of I/O proximity** \u2013 The 10\xD7\
    10 mesh has four I/O chiplets at its corners; the mapper never considers distance\
    \ to them. The first and last layers can end up arbitrarily far from any I/O,\
    \ increasing off\u2011chip latency and inner network pressure.\n\n---\n\n## 2.\
    \ Specific Opportunities for Improvement Given This Config\n\n- **96 homogeneous\
    \ CMOS chiplets** \u2192 Perfect candidates for simultaneous memory and compute\
    \ load balancing; any imbalance directly degrades overall latency.\n- **Weight\u2011\
    stationary, \u201Call\u2011at\u2011once\u201D loading** \u2192 Inter\u2011layer\
    \ communication pattern is static once mapped; a global, one\u2011shot placement\
    \ optimisation is feasible and yields persistent gains.\n- **10\xD710 mesh with\
    \ four corner I/O chiplets** \u2192 The corners provide natural entry/exit points;\
    \ explicitly anchoring I/O\u2011intensive layers near them reduces boundary traffic.\n\
    - **ResNet\u201150\u2019s residual blocks** \u2192 The graph contains many multi\u2011\
    fan\u2011in nodes; a placement that respects these edges can dramatically cut\
    \ skip\u2011path distances.\n- **Non\u2011pipelined communication** \u2192 Every\
    \ hop counts doubly (request + response), so even a small reduction in average\
    \ weighted hop distance translates into measurable latency improvement.\n\n---\n\
    \n## 3. Data/Signals the Mapper Currently Ignores That It Should Use\n\n| Missing\
    \ signal | Why it matters | How to use |\n|---------------|----------------|-------------|\n\
    | **Full predecessor mapping** (all source partitions with percentages) | Determines\
    \ true communication cost from *all* inputs | Compute weighted distance from candidate\
    \ chiplet to each source partition using volume \xD7 allocation |\n| **Model graph\
    \ with skip connections** | Residual adds and concatenations need proximity to\
    \ multiple ancestors | Build the DAG; for each node, consider all incoming edges\
    \ |\n| **Activation/output dimensions** (input_activation, out_channels, etc.)\
    \ | Communication volume, not just weight memory, drives latency | Estimate edge\
    \ data size and use as weight in objective function |\n| **Compute load (total_macs)**\
    \ | Homogeneous chiplets need balanced execution time | Penalize assignments that\
    \ push any chiplet\u2019s MAC sum beyond a balance threshold |\n| **I/O chiplet\
    \ locations** | First/last layers must talk off\u2011chip | Boost ranking of chiplets\
    \ near corners for I/O\u2011bound layers |\n| **Global capacity distribution**\
    \ (after full mapping) | Fragmentation starves later large layers | Enable re\u2011\
    allocation after an initial greedy pass to avoid early exhaustion of critical\
    \ regions |\n| **Partition granularity of previous layers** | Many tiny source\
    \ partitions increase communication endpoint count | Prefer destination chiplet\
    \ assignments that align with large source partitions |\n\n---\n\n## 4. Proposed\
    \ Different Optimization Strategy: **Simulated\u2011Annealing Global Placement\
    \ with Volume\u2011Weighted Communication Cost**\n\nThis approach departs fundamentally\
    \ from the previous attempts (source\u2011weighted nearest\u2011neighbor and hierarchical\
    \ block partitioning) by **optimising all layer\u2011to\u2011chiplet assignments\
    \ simultaneously** using a stochastic search, with a direct cost function that\
    \ captures weighted communication volume, capacity constraints, and load balance.\
    \ It avoids sequential commitment and can undo early bad decisions.\n\n### Algorithm\
    \ Overview\n\n1. **Model Graph Construction**\n   - Build a directed graph `G`\
    \ where nodes are the layers, edges weighted by `volume = input_activation_bytes\
    \ * number_of_connections` (approximated from layer parameters). Include every\
    \ skip connection.\n\n2. **Initial Feasible Solution**\n   - Run the current `_nearest_neighbor_mapper_v3`\
    \ to generate a valid mapping `M0` that respects capacities, and extract for each\
    \ layer its set of (chiplet, percentage) pairs. This seed is guaranteed feasible.\n\
    \n3. **Cost Function `C(M)`**\n   - For each edge `(u, v)` in `G`:\n     - Compute\
    \ `comm_cost = volume(u,v) * \u03A3_i \u03A3_j (p_u_i * q_v_j * dist(i, j))` where\
    \ `p_u_i` is the percentage of layer `u` on chiplet `i`, and `q_v_j` for `v`.\n\
    \   - Add a **compute\u2011imbalance penalty**: `\u03BB * \u03A3_c (max(0, MACs_c\
    \ / MACs_avg - 1))\xB2`.\n   - Add an **I/O\u2011distance penalty** for the first\
    \ and last layers: `\u03BC * \u03A3_{layer\u2208{first,last}} \u03A3_i (pct_i\
    \ * dist_to_nearest_IO(i))`.\n   - Total cost = `\u03A3 edge comm_cost + imbalance_penalty\
    \ + IO_penalty`.\n\n4. **Simulated Annealing Loop**\n   - Start with `M = M0`,\
    \ `T = T_high`.\n   - For a fixed number of iterations at each temperature:\n\
    \     - **Perturbation**: Randomly select a layer, pick one of its current chiplet\
    \ assignments (with probability proportional to its percentage), and move a small\
    \ fraction (e.g., 5%) of its workload to another randomly chosen chiplet that\
    \ has enough remaining capacity. If the move would violate capacity, reject immediately.\
    \ Update the mapping percentages accordingly, keeping sum 100%.\n     - Evaluate\
    \ \u0394C. Accept if `\u0394C < 0`, or with probability `exp(-\u0394C/T)` otherwise.\n\
    \   - Gradually reduce `T`.\n\n5. **Post\u2011Processing**\n   - After SA converges,\
    \ apply a **minimum partition merge** step: split allocations below a threshold\
    \ (e.g., 3%) are reassigned to the nearest larger partition of the same layer\
    \ to reduce endpoint count.\n\n6. **Integration with Existing Code**\n   - Modify\
    \ `generate_mapping` to retain all layer info in a list, then call the SA routine\
    \ instead of layer\u2011by\u2011layer mapping. The rest of the system (capacity\
    \ tracking, partitioning) remains unchanged because the SA output is a set of\
    \ (layer_idx, list of (chiplet, pct)) identical in format to the current output.\n\
    \n### Why This Strategy Is Different and Promising\n\n| Aspect | Previous Attempts\
    \ | Proposed SA Placement |\n|--------|-------------------|------------------------|\n\
    | **Planning horizon** | Layer\u2011by\u2011layer greedy (attempt 1) or coarse\u2011\
    then\u2011fine (attempt 2) | Global, all layers simultaneously, no premature commitment\
    \ |\n| **Communication model** | Single anchor or block\u2011level aggregation\
    \ | Exact volume\u2011weighted many\u2011to\u2011many distance sum, including\
    \ skip edges |\n| **Capacity fragility** | Early fragmentation is irreversible\
    \ | Stochastic search can move allocations away from crowded chiplets, undoing\
    \ early mistakes |\n| **Load balance** | None or only block\u2011level | Direct\
    \ compute\u2011load penalty inside cost function, balancing MACs across all 96\
    \ chiplets |\n| **I/O awareness** | Missing or indirect via region assignment\
    \ | Explicit penalty for first/last layer distance to I/O, ensuring they land\
    \ near corners |\n| **Optimisation technique** | Deterministic, constructive |\
    \ Metaheuristic (SA) that exploits the static mapping nature to explore the solution\
    \ space thoroughly |\n| **Risk of local minima** | High (greedy) | Mitigated by\
    \ temperature\u2011based acceptance of uphill moves |\n\nBecause the 96\u2011\
    chiplet system and model are static, the SA can be run offline once, and its computational\
    \ overhead is negligible compared to the simulation runtime. This approach directly\
    \ attacks the root cause of poor latency: suboptimal spatial distribution of layer\
    \ partitions that ignores communication volume, multi\u2011source dependencies,\
    \ and load balance \u2013 all of which the previous strategies only partially\
    \ addressed."
