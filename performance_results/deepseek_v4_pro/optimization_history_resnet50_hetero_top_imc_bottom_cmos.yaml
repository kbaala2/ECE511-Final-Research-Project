- change_summary: "## 1. Key Weaknesses of the Current Nearest\u2011Neighbor Approach\n\
    \n1. **Single\u2011anchor myopia**  \n   Each layer is placed using only the *max\u2011\
    allocation* chiplet of the previous layer as the distance anchor. When a layer\
    \ is split (e.g., 60% on chiplet A, 40% on B), the next layer tries to stay close\
    \ to A, ignoring the large traffic from B. This inflates communication latency\
    \ for the forgotten source.\n\n2. **Greedy capacity filling \u2192 early fragmentation**\
    \  \n   Chiplets are filled solely in order of increasing distance from the anchor.\
    \ Small early layers often consume close\u2011by capacity, leaving no nearby room\
    \ for later large layers. This causes unnecessary mapping failures or forces large\
    \ layers to span distant chiplets.\n\n3. **Residual / skip connections completely\
    \ ignored**  \n   The mapper treats the network as a flat linear list. In ResNet\u2011\
    50, addition nodes have *two* incoming branches. Placing the addition node away\
    \ from either source creates extra hops for the skipped path, directly hurting\
    \ performance.\n\n4. **No compute\u2011load awareness**  \n   Only weight\u2011\
    memory (capacity units) is tracked. `total_macs` is ignored, so one chiplet can\
    \ end up with many heavy\u2011compute layers while another does almost nothing,\
    \ creating execution hotspots and imbalanced pipeline stalls.\n\n5. **Ignorance\
    \ of I/O location**  \n   The 10\xD710 mesh has four I/O chiplets at the corners.\
    \ First and last layers can land arbitrarily far from any corner, increasing off\u2011\
    chip latency and internal network pressure.\n\n6. **No communication\u2011volume\
    \ weighting**  \n   All hops are treated equally, disregarding that a small layer\
    \ with huge activations causes more traffic than a large layer with tiny outputs.\
    \ The mapper wastes proximity on low\u2011traffic pairs and leaves high\u2011\
    volume pairs far apart.\n\n7. **Unbounded partition fragmentation**  \n   When\
    \ capacity is partial, tiny partitions (e.g., 2% of a layer) are created. Many\
    \ minuscule slices increase the number of communication endpoints and packet header\
    \ overhead without real benefit.\n\n---\n\n## 2. Specific Opportunities for Improvement\
    \ Given This Config\n\n- **96 homogeneous CMOS chiplets** \u2192 Load balancing\
    \ of both memory and compute is essential; any chiplet becoming a bottleneck slows\
    \ the whole model.\n- **Weight\u2011stationary, all\u2011at\u2011once loading**\
    \ \u2192 Weights never move after initial mapping, so the inter\u2011layer communication\
    \ pattern is static and can be optimized offline. A global graph\u2011aware placement\
    \ pays off.\n- **10\xD710 mesh with corner I/O chiplets** \u2192 The four corners\
    \ provide natural \u201Centry/exit\u201D points. Pinning the input and output\
    \ layers near corners reduces off\u2011chip latency and evenly distributes boundary\
    \ traffic.\n- **ResNet\u201150\u2019s block structure** \u2192 The network naturally\
    \ decomposes into residual blocks. Placing each block on a contiguous group of\
    \ chiplets minimizes skip\u2011path delays and localises heavy inter\u2011connections.\n\
    - **Non\u2011pipelined communication** \u2192 Every hop counts doubly (request\
    \ and response); therefore, even a small reduction in average hop distance yields\
    \ measurable latency improvement.\n\n---\n\n## 3. Data/Signals the Mapper Currently\
    \ Ignores That It Should Use\n\n| Missing signal                  | Why it matters\
    \                                                                 | How to use\
    \                                                                            \
    \            |\n|---------------------------------|--------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------|\n\
    | **Full predecessor mapping**   | Determines true communication cost from *all*\
    \ sources                          | Weight candidate chiplet score by sum_{pred}\
    \ (alloc_pct_pred \xD7 activation_volume \xD7 distance)     |\n| **Model graph\
    \ with skip edges**| Residual adds need proximity to both branches           \
    \                       | Build full DAG; for each node, consider all incoming\
    \ edges when scoring chiplets                 |\n| **Activation / output sizes**\
    \  | Communication volume, not just weight memory, drives latency            \
    \       | Estimate data size per edge (e.g., `out_channels \xD7 spatial_dim`)\
    \ and use as edge weight          |\n| **Compute load (total_macs)**  | Homogeneous\
    \ compute requires balanced execution time                           | Penalize\
    \ chiplets whose accumulated MACs exceed a balance threshold                 \
    \            |\n| **I/O chiplet locations**      | First/last layers must talk\
    \ to off\u2011chip                                        | Boost score of chiplets\
    \ near corners for I/O\u2011heavy layers                                     \
    \  |\n| **Global free capacity curve** | Look\u2011ahead helps avoid starving\
    \ large later layers                             | Use a future\u2011aware heuristic\
    \ that preserves capacity in central high\u2011connectivity regions         |\n\
    | **Partition granularity of prev.**| Many tiny sources increase overhead    \
    \                                      | Prefer chiplet assignments that align\
    \ with *large* source partitions and avoid creating fragments|\n\n---\n\n## 4.\
    \ Proposed New Optimization Strategy: **Graph\u2011Aware Hierarchical Mapping**\n\
    \nThis strategy is fundamentally different from both the current single\u2011\
    anchor greedy mapper **and** from any simple source\u2011weighted extension (likely\
    \ the attempt in Iteration\_1). It replaces the layer\u2011by\u2011layer sequential\
    \ process with a multi\u2011level placement that respects the model\u2019s high\u2011\
    level block structure, global communication patterns, and resource balance.\n\n\
    ### Outline\n\n1. **Build Weighted Inter\u2011Layer Graph**\n   - Nodes = layers;\
    \ directed edges = data flow, weighted by estimated communication volume (activation\
    \ bytes \xD7 packets).\n   - Include all skip connections from ResNet\u201150\
    \ (residual adds).\n\n2. **Coarse\u2011Grained Block Partitioning**\n   - Use\
    \ a multi\u2011level graph partitioner (e.g., METIS) to cut the DAG into *K* clusters\
    \ (super\u2011layers) while minimising the total cut weight.\n   - Choose K such\
    \ that each cluster\u2019s total memory/MACs fits within a modest number of chiplets\
    \ (e.g., 8\u201316). Natural candidates are the residual blocks themselves plus\
    \ stem and head.\n\n3. **Global Cluster\u2011to\u2011Region Assignment**\n   -\
    \ Represent the 10\xD710 mesh as a grid; pre\u2011reserve corner regions for clusters\
    \ that contain I/O layers.\n   - Assign each cluster to a contiguous sub\u2011\
    mesh (e.g., 2\xD74, 3\xD73) using a graph\u2011mapping algorithm (e.g., simulated\
    \ annealing) that minimises inter\u2011cluster communication weighted by cut edges.\n\
    \   - The objective also penalises imbalance in total MACs across the chiplet\
    \ regions.\n\n4. **Intra\u2011Cluster Fine\u2011Grained Placement**\n   - Within\
    \ each sub\u2011mesh region, run a refined version of the nearest\u2011neighbour\
    \ mapper but with the following modifications:\n     - Starting anchor(s) are\
    \ the *barycentre* of the source chiplet allocations inside the region.\n    \
    \ - The scoring function includes: weighted distance to *all* predecessors, a\
    \ compute\u2011load penalty, and a minimum partition size (e.g., 5%) to avoid\
    \ fragmentation.\n     - Capacity is shared only among chiplets in that region,\
    \ preserving contiguity.\n\n5. **Iterative Refinement**\n   - After initial placement,\
    \ swap small allocations between border chiplets of adjacent regions to reduce\
    \ cut\u2011edge distances further, using a hill\u2011climbing pass.\n\n### Why\
    \ This Is Different and Expected to Improve Performance\n\n- **Leverages model\
    \ structure**: Residual blocks are kept together, so the skip\u2011path hop count\
    \ shrinks dramatically.\n- **Global view**: Graph partitioning accounts for all\
    \ inter\u2011layer edges, not just immediate predecessors, avoiding myopic decisions.\n\
    - **I/O awareness**: Corner assignments are explicit, not accidental.\n- **Balanced\
    \ compute**: MAC\u2011based penalties prevent hotspots, enabling the 96 chiplets\
    \ to operate in a more synchronized fashion, reducing tail latency.\n- **Contiguous\
    \ regions**: Internal communication becomes highly localised, reducing hop distances\
    \ and network contention.\n\nThis approach addresses every major weakness listed\
    \ above without relying on the simple \u201Cweight all predecessors\u201D heuristic,\
    \ which was likely insufficient when tried in Iteration\_1 and yielded no improvement."
