- change_summary: "## 1. Key Weaknesses of the Current Nearest-Neighbor Approach\n\
    \n**Greedy sequential anchoring ignores partition distribution**  \nFor each layer,\
    \ the algorithm only uses the chiplet with the *maximum allocation* of the previous\
    \ layer as a single anchor. If the previous layer is split across multiple chiplets\
    \ (e.g., 70% on A, 30% on B), the next layer\u2019s entire placement is biased\
    \ toward the vicinity of A. The 30% data from B must then travel long distances\
    \ to reach places near A, creating large communication overhead. The mapper does\
    \ not consider the full set of source partitions, so it cannot minimise the weighted\
    \ sum of distances from all input sources.\n\n**Myopic, layer-by-layer capacity\
    \ allocation**  \nChiplet capacity is filled greedily in order of increasing distance\
    \ from the anchor. This leads to early fragmentation: a nearby chiplet may be\
    \ fully consumed by a small layer, leaving insufficient nearby capacity for later,\
    \ larger layers. Because there is no look-ahead, the algorithm easily fails earlier\
    \ than necessary, especially for deep models with varying layer sizes.\n\n**ResNet\u2011\
    style skip connections are completely ignored**  \nThe mapper treats the network\
    \ as a linear list of layers. It does not inspect the model graph, so layers that\
    \ have multiple predecessors (e.g., addition nodes in residual blocks) will not\
    \ try to be close to *all* of them. This results in extra communication hops for\
    \ the skipped connections, degrading performance on networks like ResNet\u2011\
    50.\n\n**No consideration of I/O proximity**  \nThe 10\xD710 mesh has four I/O\
    \ chiplets at the corners, but the mapper never evaluates a layer\u2019s distance\
    \ to these I/O nodes. First and last layers, which must read input data from and\
    \ write results to I/O, may be placed arbitrarily far from the corners, increasing\
    \ off\u2011chip latency and bandwidth pressure on the internal network.\n\n**Lack\
    \ of compute\u2011load balancing**  \nThe mapper only tracks weight\u2011memory\
    \ occupancy (capacity units). It disregards `total_macs` and the resulting computational\
    \ load. Consequently, some chiplets may end up with many lightweight layers while\
    \ others are overloaded with compute\u2011heavy layers, creating execution hotspots\
    \ even though memory is balanced.\n\n**No communication\u2011volume weighting**\
    \  \nAllocates chiplets based solely on hop distance, ignoring how much data travels\
    \ between layers. A small layer with large activations placed far from its successor\
    \ is punished less than it should be; a large but low\u2011communication layer\
    \ may be pulled closer unnecessarily. The algorithm does not use activation sizes\
    \ or the number of synapses to weight the importance of distance.\n\n**Unbounded\
    \ partitioning granularity**  \nWhen a chiplet offers less than the full requirement,\
    \ the algorithm creates a partition proportional to the fraction of remaining\
    \ capacity. This can result in many tiny partitions (e.g., 1\u20112% of a layer)\
    \ scattered across distant chiplets, increasing communication book\u2011keeping\
    \ and packet overhead. No minimum partition size is enforced.\n\n---\n\n## 2.\
    \ Specific Opportunities for Improvement Given This Config\n\n**Replace single\
    \ anchor with source\u2011weighted placement**  \nCompute a cost for each candidate\
    \ chiplet that is the weighted average communication distance from all source\
    \ partitions of the incoming layer. Use the mapping of all input layers (and skip\
    \ connections) with their percentage allocations as the weight. This directly\
    \ reduces the total expected traffic.\n\n**Introduce a global graph\u2011aware\
    \ placement pass**  \nSince the 96 CMOS\u2011Compute chiplets are homogeneous\
    \ and weight\u2011stationary, the mapping is run once and reused. This justifies\
    \ a stochastic global search (e.g., simulated annealing or a greedy graph\u2011\
    partitioning step) that optimises the entire layer\u2011to\u2011chiplet assignment,\
    \ minimising an objective that sums weighted distances over all inter\u2011layer\
    \ edges (including skip connections) and penalises load imbalance.\n\n**Reserve\
    \ capacity near I/O chiplets for first and last layers**  \nAdd a heuristic that\
    \ biases initial layers toward a corner I/O chiplet and final layers toward another\
    \ (or the same) corner. Even a simple \u201Cdistance\u2011to\u2011IO\u201D bonus\
    \ in the chiplet ranking would improve off\u2011chip latency.\n\n**Balance both\
    \ memory and compute load**  \nModify the chiplet scoring to include a penalty\
    \ for high compute occupancy: e.g., `score = \u03B1\xB7distance + \u03B2\xB7(allocated_MACs\
    \ / max_MACs) + \u2026`. This avoids compute hotspots and improves overall throughput.\n\
    \n**Integrate minimum partition size**  \nSet a threshold (e.g., 5% of the layer)\
    \ and merge allocations that would fall below it into adjacent partitions. This\
    \ reduces communication overhead from many small slices.\n\n**Use the activation\
    \ size (or total_macs) as a communication\u2011volume weight**  \nReplace pure\
    \ hop\u2011count with estimated data volume for each inter\u2011layer edge. The\
    \ volume can be approximated by the unpartitioned `input_activation` size or the\
    \ product of input and output dimensions. This sharpens the trade\u2011off between\
    \ placing large\u2011communication pairs close together and small\u2011communication\
    \ pairs farther apart.\n\n**Consider a \u201Cbalancing\u201D pass that re\u2011\
    distributes capacity after initial greedy placement**  \nAfter all layers are\
    \ tentatively mapped, run a refinement step that moves portions of layers between\
    \ chiplets to equalise occupancy and shorten critical communication paths, using\
    \ the complete layer\u2011dependency graph.\n\n---\n\n## 3. Data/Signals the Mapper\
    \ Currently Ignores That It Should Use\n\n| Data / Signal | Why it is important\
    \ | How to use |\n|---------------|----------------------|-------------|\n| **Full\
    \ mapping of all predecessor layers** (not just the one with max allocation) |\
    \ Determines the true communication cost for placing the current layer\u2019s\
    \ partitions | Weight destination chiplet scores by the product of source allocation\
    \ \xD7 edge volume |\n| **Model graph with skip connections** | ResNet\u201150\
    \ contain adds, concatenations, etc., that require proximity to multiple ancestors\
    \ | Build a directed graph of layer dependencies; propagate source chiplet lists\
    \ through all incoming edges |\n| **Activation / output dimensions** (`input_activation`,\
    \ `out_channels`, `filter_size`, etc.) | Communication volume between layers is\
    \ proportional to activation size, not only weight memory | Estimate data size\
    \ per edge and use as weight in the distance\u2011based cost function |\n| **Computational\
    \ load** (`total_macs`) | Homogeneous 96\u2011chiplet system requires balancing\
    \ execution time, not just memory footprint | Accumulate MACs per chiplet and\
    \ add a load\u2011imbalance penalty to the placement objective |\n| **I/O chiplet\
    \ locations** | First layer receives data from off\u2011chip; last layer sends\
    \ results off\u2011chip; their distance matters | Pre\u2011rank chiplets near\
    \ corners higher for input/output layers, or include an I/O\u2011distance term\
    \ in the ranking |\n| **Available chiplet memory after mapping each layer** (globally,\
    \ not just current state) | Fragmented mapping can starve later large layers;\
    \ global view enables look\u2011ahead | Use a simulated future\u2011aware heuristic,\
    \ or evaluate global objective that includes total remaining capacity after all\
    \ assignments |\n| **Network bandwidth / contention (beyond hop distance)** |\
    \ Hop count alone may underestimate congestion when many flows share the same\
    \ link | If a cost model exists, integrate expected link utilisation or use a\
    \ simple squared\u2011distance penalty to discourage concentrated hot\u2011spots\
    \ |\n| **Partition granularity of previous layers** | The previous layer\u2019\
    s partition distribution determines how many sources send data; many small sources\
    \ increase communication overhead | Prefer chiplet assignments that align with\
    \ large source partitions and avoid creating fragmented destination partitions\
    \ |\n\nBy incorporating these missing signals and shifting from a single\u2011\
    anchor greedy approach to a graph\u2011aware, load\u2011balanced placement, the\
    \ mapper could significantly improve both performance and mappability for ResNet\u2011\
    50 on the 10\xD710 mesh."
