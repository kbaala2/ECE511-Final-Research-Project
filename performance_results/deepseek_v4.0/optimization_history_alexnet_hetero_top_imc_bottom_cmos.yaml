- change_summary: "Based on the previous analysis highlighting the mapper\u2019s myopic\
    \ anchoring, greediness, and ignorance of activation volumes and I/O placement,\
    \ I propose a **Weighted\u2011Centroid Communication\u2011Aware Mapper (WCCAM)**.\
    \ It replaces the single\u2011chiplet anchor with a traffic\u2011conscious centroid,\
    \ balances compute load, and treats I/O chiplets as key nodes.\n\n## 1. Core Strategy\n\
    \nFor each layer `i`:\n\n- If `i == 0`: anchor placement near the **input I/O\
    \ chiplet** (e.g., corner with lowest ID) to minimise off\u2011chip data ingress\
    \ distance.\n- If `i == last`: anchor near the **output I/O chiplet** (opposite\
    \ corner or predefined) to minimise egress distance.\n- Else: compute a **weighted\
    \ centroid** of all chiplets that received a portion of the *previous* layer\u2019\
    s output channels, with weights proportional to the fraction of the layer\u2019\
    s total output channels (or MACs) they process.\n- For every candidate chiplet\
    \ `c`, compute a **composite cost**:\n\n  `cost(c) = w_dist \xD7 H(centroid, c)\
    \ + w_load \xD7 load_penalty(c) + w_io \xD7 io_penalty(c, first/last)`\n\n  where:\n\
    \  - `H` = shortest\u2011path hop distance from the centroid.\n  - `load_penalty`\
    \ = normalised ratio of MACs already assigned to `c` vs. its theoretical max (prevents\
    \ compute hotspots).\n  - `io_penalty` = distance to the nearest I/O chiplet,\
    \ applied only for input/output boundary layers.\n  - `w_dist`, `w_load`, `w_io`\
    \ are tunable weights (can be set by performance/energy preference, e.g., `w_dist`\
    \ gets higher weight for latency bias).\n\n- After sorting chiplets by cost, allocate\
    \ capacity **not greedily**, but using a **proportional partition** of the layer\u2019\
    s weights among the top\u2011N best candidates, respecting each chiplet\u2019\
    s remaining weight capacity, so that fragmentation is reduced and the layer is\
    \ spread evenly.\n\n## 2. How It Uses the Previously Ignored Signals\n\n- **Activation\
    \ tensor size**: The centroid is weighted by the previous layer\u2019s output\
    \ channel fractions, effectively capturing the communication volume; chiplets\
    \ that handle more outputs pull the centroid closer, reducing the total bit\u2011\
    miles.\n- **I/O chiplet positions**: First/last layers explicitly minimise distance\
    \ to the I/O chiplets that handle ingress/egress. The `io_penalty` term enforces\
    \ proximity.\n- **Compute load (MACs)**: The `load_penalty` tracks cumulative\
    \ MACs assigned to each chiplet and penalises overloaded ones, resulting in a\
    \ more balanced pipeline.\n- **Layer type constraints**: The proportional partition\
    \ can be aligned with the partitioner\u2019s existing output\u2011channel splitting;\
    \ for self\u2011attention, it avoids breaking head coherence (the partitioner\
    \ already handles this, but we feed it a smoother distribution).\n- **Weight loading**:\
    \ By anchoring the first layers near I/O, the heavy initial weight loading from\
    \ DRAM is concentrated in the same region, cutting the loading distance.\n\n##\
    \ 3. Detailed Algorithm (Modification to `_nearest_neighbor_mapper_v3`)\n\nBelow\
    \ is pseudocode that replaces the existing mapping logic while preserving the\
    \ interface. Key changes are highlighted in comments.\n\n```python\ndef _nearest_neighbor_mapper_v3(self,\
    \ model_layer_info, system, preference, current_available_crossbars, layer_mappings=None,\
    \ shortest_paths=None):\n    # ... existing imports and initialisation ...\n \
    \   # 1. Determine if this layer is first or last\n    is_first_layer = (len(layer_mappings)\
    \ == 0)\n    # We need to know if this is the last layer \u2013 this can be inferred\
    \ from the model context\n    is_last_layer = model_layer_info.get('is_last')\
    \  # must be provided by caller\n\n    # 2. Locate I/O chiplets (use the four\
    \ corner IDs from chiplet_mapping.yaml)\n    io_ids = [1, 10, 91, 100]  # 10x10\
    \ mesh corners; adjust as needed\n    # input I/O: e.g., lowest corner (1); output\
    \ I/O: e.g., opposite (100)\n    input_io, output_io = io_ids[0], io_ids[-1]\n\
    \n    # 3. Build weighted centroid of previous layer's chiplets\n    if not is_first_layer:\n\
    \        prev_mapping = layer_mappings[-1][1]          # list of (chiplet_id,\
    \ pct)\n        centroid_x, centroid_y, total_signal = 0, 0, 0\n        for cid,\
    \ pct in prev_mapping:\n            if pct <= 0: continue\n            x, y =\
    \ self.get_chiplet_coords(cid)       # assume we have a coord lookup\n       \
    \     w = pct                                    # weight by assignment percentage\n\
    \            centroid_x += x * w\n            centroid_y += y * w\n          \
    \  total_signal += w\n        if total_signal > 0:\n            centroid_x /=\
    \ total_signal\n            centroid_y /= total_signal\n        else:\n      \
    \      # fallback: use single dominant chiplet\n            prev_leader = max(prev_mapping,\
    \ key=lambda x: x[1])[0]\n            centroid_x, centroid_y = self.get_chiplet_coords(prev_leader)\n\
    \    else:\n        # for the first layer, set centroid at the input I/O chiplet\n\
    \        centroid_x, centroid_y = self.get_chiplet_coords(input_io)\n\n    # 4.\
    \ Pre\u2011compute per\u2011chiplet compute load (MACs) normalised penalty\n \
    \   max_macs_per_chiplet = 2.46e6 * 1e9 / ... # define a heuristic ceiling\n \
    \   load_penalty = {}\n    for idx in self.compute_chiplet_indices:\n        chiplet_id\
    \ = idx + 1\n        assigned_macs = self.macs_assigned.get(chiplet_id, 0)  #\
    \ need to maintain this dict\n        load_penalty[chiplet_id] = min(assigned_macs\
    \ / max_macs_per_chiplet, 1.0)\n\n    # 5. Tuneable weights (could be read from\
    \ preference)\n    w_dist = 1.0\n    w_load = 0.3\n    w_io = 0.5 if (is_first_layer\
    \ or is_last_layer) else 0.0\n\n    # 6. Compute cost for each eligible chiplet\n\
    \    candidates = []\n    for idx in self.compute_chiplet_indices:\n        chiplet_id\
    \ = idx + 1\n        if remaining_capacity[idx] <= 0:\n            continue\n\
    \        # check allowed_chiplet_ids\n        if allowed and chiplet_id not in\
    \ allowed_set:\n            continue\n\n        x, y = self.get_chiplet_coords(chiplet_id)\n\
    \        dist_centroid = abs(x - centroid_x) + abs(y - centroid_y)  # Manhattan\
    \ / hop\n        io_dist = min(abs(x - io_x) + abs(y - io_y) for io_x, io_y in\
    \ [get_coords(io_id) for io_id in io_ids])  # nearest I/O\n        cost = (w_dist\
    \ * dist_centroid\n                + w_load * load_penalty[chiplet_id]\n     \
    \           + w_io * io_dist)\n        # Also store remaining capacity for proportional\
    \ split\n        candidates.append((cost, chiplet_id, remaining_capacity[idx],\
    \ load_penalty[chiplet_id]))\n\n    candidates.sort(key=lambda x: x[0])\n\n  \
    \  # 7. Proportional allocation among the best candidates (up to N=4 or until\
    \ capacity exhausted)\n    max_copies = 4\n    total_weights_needed = self._calculate_layer_requirements(model_layer_info,\
    \ chiplets[0])  # same for all chiplets\n    weight_remaining = crossbars_required\n\
    \    percentage_remaining = 100\n    action = [0] * num_chiplets\n\n    # Determine\
    \ how many output channels are available (to split proportionally)\n    layer_out_channels\
    \ = model_layer_info.get('out_channels')  # we need this info\n    chunk_out_channels\
    \ = 0\n\n    for cost, cid, avail, _ in candidates[:max_copies]:\n        if weight_remaining\
    \ <= 0:\n            break\n        idx = cid - 1\n        # Determine how many\
    \ of the layer\u2019s weights this chiplet can host\n        max_weights_it_can_host\
    \ = avail  # in weight units\n        # Proportionally allocate weights, but not\
    \ more than this chiplet can hold\n        alloc_weight = min(weight_remaining,\
    \ max_weights_it_can_host)\n        if alloc_weight <= 0:\n            continue\n\
    \        # Convert weight units to percentage of layer\n        alloc_pct = (alloc_weight\
    \ / crossbars_required) * 100.0 if crossbars_required > 0 else 0\n        # Round\
    \ the channel count appropriately\n        ch = round(layer_out_channels * alloc_pct\
    \ / 100.0)\n        if ch < 1: ch = 1  # ensure at least one channel\n       \
    \ # Update capacities and action\n        remaining_capacity[idx] -= alloc_weight\n\
    \        action[idx] = alloc_pct\n        weight_remaining -= alloc_weight\n \
    \       percentage_remaining -= alloc_pct\n        chunk_out_channels += ch\n\n\
    \    # 8. Adjust for any leftover due to rounding (similar to existing insufficient\
    \ memory handling)\n    if weight_remaining > 10:\n        return remaining_capacity,\
    \ None, True, \"INSUFFICIENT_MEMORY\"\n    # ... post\u2011processing: propagate\
    \ out_channels count for partitioner ...\n    model_layer_info['chunk_out_channels']\
    \ = chunk_out_channels  # feed to partitioner\n\n    # Update MACs load tracker\n\
    \    self.macs_assigned = self._update_macs_tracker(action, model_layer_info)\n\
    \n    return remaining_capacity, action, False, None\n```\n\n## 4. Expected Impact\
    \ on This Config\n\n- **Reduced Average Communication Distance**: The centroid\
    \ ensures the next layer hugs the \u201Cmass\u201D of the previous one, avoiding\
    \ isolated chiplets. Activation bits travel shorter distances, cutting NoC latency.\n\
    - **I/O Efficiency**: First layer sits beside input I/O; last layer beside output\
    \ I/O. The initial and final data transfers avoid traversing the entire 10\xD7\
    10 mesh.\n- **Balanced Compute**: `load_penalty` prevents a single chiplet from\
    \ processing a disproportionate share of MACs, minimising pipeline stalls and\
    \ improving overall throughput.\n- **Fragmentation Avoidance**: Proportional splitting\
    \ over multiple chiplets distributes the weight requirement more evenly, reducing\
    \ the chance that a large later layer cannot be placed because no single chiplet\
    \ has enough contiguous space.\n- **Config Exploitation**: With 96 CMOS chiplets,\
    \ an even spread (e.g., 3-4 chiplets per layer) is feasible; the tunable weights\
    \ allow the user\u2019s performance/energy preference to actually steer the mapping.\n\
    \nThis combined strategy directly attacks the mapper\u2019s current blind spots\
    \ and has a high probability of improving mapping success and inference latency."
