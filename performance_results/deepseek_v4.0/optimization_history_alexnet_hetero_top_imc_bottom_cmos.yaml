- change_summary: "### Analysis of the Nearest-Neighbor Mapper\u2019s Weaknesses in\
    \ the Current Config\n\nThe `_nearest_neighbor_mapper_v3` method suffers from\
    \ several critical limitations when applied to a 10\xD710 mesh with 96 CMOS chiplets\
    \ and 4 corner I/O chiplets:\n\n1. **Myopic single\u2011chiplet anchor**  \n \
    \  Each new layer is anchored to the chiplet that received the largest fraction\
    \ of the previous layer, ignoring that the previous layer may be distributed over\
    \ many chiplets. This forces all candidates to cluster around one node, increasing\
    \ average communication hops and fragmenting capacity.\n\n2. **Greedy, first\u2011\
    fit allocation without fragmentation foresight**  \n   The algorithm fills the\
    \ nearest chiplet to capacity before considering others. Over several layers,\
    \ this creates many partially filled chiplets (\u201CSwiss\u2011cheese\u201D pattern),\
    \ making it impossible to place a large layer later even though total capacity\
    \ suffices.\n\n3. **No global layer\u2011order awareness**  \n   Mapping is strictly\
    \ sequential and deterministic, with no lookahead to reserve capacity for known\
    \ large layers (e.g., >80% of a chiplet\u2019s weight capacity). A single poor\
    \ early decision can cascade into a mapping failure for the whole network.\n\n\
    4. **Ignores activation volume and inter\u2011layer traffic**  \n   Only static\
    \ hop distance is used as cost; the actual size of activation tensors flowing\
    \ between layers is never considered. In an AlexNet workload, early convolutional\
    \ layers produce huge activation maps whose transport cost dominates energy and\
    \ latency, yet this is completely omitted.\n\n5. **No I/O locality for ingress/egress**\
    \  \n   The four corner I/O chiplets are invisible to the algorithm. The first\
    \ layer (that reads input) and the last layer (that writes output) can end up\
    \ arbitrarily far from the I/O, adding unnecessary long\u2011distance data transfers\
    \ at the network boundaries.\n\n6. **Compute load imbalance**  \n   Capacity (weight\
    \ units) is the sole resource metric; the actual MACs assigned to each chiplet\
    \ are never tracked. Consequently some chiplets become compute\u2011heavy while\
    \ others sit almost idle, creating pipeline bubbles.\n\n7. **Performance/energy\
    \ preference is decorative**  \n   The `active_metric` is read but only used as\
    \ a tertiary sort key, so the user\u2011specified trade\u2011off has no practical\
    \ effect on placement quality.\n\n### New Optimization Strategy: Global Communication\u2011\
    Constrained Bin Packing Mapper (GCC\u2011BPM)\n\n**Rationale**  \nThe previous\
    \ improvement (WCCAM) addressed many of these issues but still maps layers one\
    \ by one using a weighted centroid. That approach remains fundamentally greedy\
    \ and does not consider the entire communication graph simultaneously. A fundamentally\
    \ different strategy is to treat the whole neural network as a graph of **layer\
    \ operations with weighted communication edges** and to solve a **constrained\
    \ bin\u2011packing problem** that simultaneously assigns layer fractions to chiplets\
    \ while minimizing inter\u2011chiplet communication.\n\nIn this new approach,\
    \ we:\n- Pre\u2011partition layers into \u201Cchunks\u201D (e.g., groups of output\
    \ channels) that fit within a configurable fraction of a chiplet\u2019s weight\
    \ capacity.\n- Construct a graph where nodes are these layer\u2013chunk fragments,\
    \ edges represent activation flow (volume \xD7 frequency), and node weights are\
    \ the weight\u2011capacity demand.\n- Use a multilevel graph partitioning algorithm\
    \ (e.g., recursive spectral bisection or Kernighan\u2013Lin refinement) to assign\
    \ fragments to chiplets, minimising the weighted cut across the mesh, while respecting\
    \ each chiplet\u2019s weight capacity.\n- After initial assignment, apply a local\
    \ search (e.g., simulated annealing) that swaps fragments between nearby chiplets\
    \ to further reduce communication cost and balance MAC loads.\n\nThis strategy\
    \ is **global**: it considers all layers at once, naturally handles fragmentation\
    \ by packing fragments of varying sizes, and directly incorporates activation\
    \ volumes into the cut metric. It is also easily tuned to the mesh topology by\
    \ using the actual Manhattan distance as the link weight during partitioning.\n\
    \n### Detailed Algorithm Outline for `_gcc_mapper`\n\nBelow is the core logic\
    \ that replaces the existing `_nearest_neighbor_mapper_v3`. It uses the same interface\
    \ and capacity\u2011tracking scheme, but performs a global optimisation before\
    \ allocating layer percentages.\n\n```python\ndef _gcc_mapper(self, model_layers,\
    \ system, preference, current_available_crossbars, shortest_paths=None):\n   \
    \ \"\"\"\n    Global mapping for all layers at once using graph partitioning.\n\
    \    model_layers : list of layer_info dicts (the whole model)\n    \"\"\"\n \
    \   # 1. Pre\u2011partition each layer into \"fragments\" of output channels.\n\
    \    #    A fragment size is chosen so that its weight requirement is \u2264 80%\
    \ of a chiplet's capacity.\n    #    The partitioner already knows how to split\
    \ output channels; we reuse that logic.\n    fragments = []\n    for layer in\
    \ model_layers:\n        frags = self._generate_fragments(layer, system)\n   \
    \     fragments.extend(frags)\n\n    # 2. Build a communication graph G = (V,\
    \ E).\n    #    Each fragment is a node, weighted by required weight units.\n\
    \    #    Edges represent activation flow between consecutive layers (or residual\
    \ connections).\n    #    Edge weight = size of activation tensor (in bits) flowing\
    \ between the two fragments.\n    #    Also include edges to/from I/O chiplets\
    \ for the first and last layers.\n    G = self._build_communication_graph(fragments,\
    \ system)\n\n    # 3. Number of chiplets = 96 (compute chiplets only). Each chiplet\
    \ has a capacity in weight units.\n    chiplet_capacities = [current_available_crossbars[i]\
    \ for i in self.compute_chiplet_indices]\n    num_chiplets = len(self.compute_chiplet_indices)\n\
    \n    # 4. Call a multilevel graph partitioner that assigns each fragment to a\
    \ chiplet index,\n    #    minimising the weighted cut (communication) while respecting\
    \ capacities.\n    #    Because the mesh is a grid, we can embed the target topology:\n\
    \    #      - Use a recursive bipartitioning that maps the mesh\u2019s Manhattan\
    \ distance to a linear ordering\n    #        (e.g., space\u2011filling curve,\
    \ then assign contiguous chunks of fragments along the curve).\n    #    For simplicity,\
    \ we can use a balanced k\u2011way partitioner like METIS with node weights\n\
    \    #    and edge weights, then map partitions to chips using a greedy assignment\
    \ that minimises\n    #    distance between heavily connected partition pairs.\n\
    \    partition_map = self._partition_fragments(G, num_chiplets, chiplet_capacities,\
    \ system)\n\n    # 5. Convert the fragment\u2011to\u2011chiplet assignment back\
    \ to the per\u2011layer action percentages.\n    #    For each layer, aggregate\
    \ the weight units assigned to each chiplet, compute percentages.\n    remaining_capacity\
    \ = current_available_crossbars.copy()\n    layer_mappings = []\n    for layer\
    \ in model_layers:\n        action = [0] * len(system.chiplets)\n        for frag\
    \ in fragments_by_layer[layer]:\n            cid = partition_map[frag.id]\n  \
    \          action[cid] += frag.weight_units  # accumulate weight units\n     \
    \   # Normalize to percentage\n        total_units = sum(action)\n        if total_units\
    \ > 0:\n            action = [100.0 * u / total_units for u in action]\n     \
    \   # Update remaining capacity (subtract used weight units)\n        for i, a\
    \ in enumerate(action):\n            used = round(total_units * a / 100.0)\n \
    \           remaining_capacity[i] -= used\n        layer_mappings.append((layer['name'],\
    \ [(i+1, pct) for i, pct in enumerate(action) if pct > 0]))\n\n    # After all\
    \ layers are placed, verify no chiplet exceeded capacity.\n    if any(remaining_capacity[i]\
    \ < 0 for i in self.compute_chiplet_indices):\n        return None, np.array([]),\
    \ \"INSUFFICIENT_MEMORY\"\n\n    # Update system state with final capacity\n \
    \   self.system.update_capacity_availability(remaining_capacity)\n\n    return\
    \ layer_mappings, (initial_capacity - remaining_capacity), None\n```\n\n### How\
    \ GCC\u2011BPM Differs from WCCAM and Exploits the Config\n\n- **Global vs. greedy**:\
    \ GCC\u2011BPM solves an optimisation problem over the entire network, rather\
    \ than making irrevocable layer\u2011by\u2011layer decisions. This avoids the\
    \ fragmentation trap and can make trade\u2011offs that sacrifice local optimality\
    \ for global benefit.\n- **Activation volume is the primary edge weight**: The\
    \ graph partitioning cut directly minimises the product of activation bits and\
    \ hop count, automatically yielding a placement that reduces NoC energy and latency.\n\
    - **Better fragmentation control**: By partitioning layers into appropriately\
    \ sized fragments *before* placement, we ensure that no single fragment exceeds\
    \ a safe fraction of a chiplet\u2019s capacity. Large layers that wouldn\u2019\
    t fit on a single chiplet are automatically spread across multiple chiplets in\
    \ a balanced way, never blocked by \u201CSwiss cheese\u201D leftovers.\n- **I/O\
    \ awareness**: The communication graph can include artificial I/O nodes, so the\
    \ partitioner will naturally pull first\u2011layer fragments close to the input\
    \ I/O corner and last\u2011layer fragments near the output I/O corner.\n- **Load\
    \ balancing**: Node weights in the partitioner are weight units; edge weights\
    \ are MAC\u2011related activation volumes. The partitioner\u2019s capacity constraints\
    \ ensure weight\u2011space balance, but we can also use a post\u2011processing\
    \ MAC\u2011balancing swap heuristic.\n- **Topology\u2011aware embedding**: Because\
    \ the mesh is a grid, we can map the partition IDs to physical chiplet locations\
    \ using a locality\u2011preserving scheme (e.g., Hilbert curve ordering) so that\
    \ nearby partitions in the logical graph land on nearby chips on the mesh, further\
    \ reducing hop count.\n\nThis approach treats mapping as a genuine optimization\
    \ problem rather than a heuristic, directly addressing all the weaknesses identified,\
    \ and it is clearly distinct from the weighted\u2011centroid method attempted\
    \ previously. It is feasible for a 10\xD710 system with 96 chiplets and an AlexNet\u2011\
    sized model to run in a few seconds if a fast multi\u2011level partitioner like\
    \ METIS (or an in\u2011house spectral bisection) is used."
