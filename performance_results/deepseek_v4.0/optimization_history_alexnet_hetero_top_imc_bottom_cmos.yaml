- change_summary: "### 1. Key Weaknesses of the Current Nearest-Neighbor Approach\n\
    \n- **Myopic anchoring to the single dominant chiplet of the previous layer**\
    \  \n  For each new layer, the mapper selects as \u201Cstarting chiplet\u201D\
    \ the one that received the largest percentage of the previous layer\u2019s allocation.\
    \ All candidate chiplets are then sorted by distance from that single anchor.\
    \ This ignores the fact that the previous layer may be spread across many chiplets.\
    \ A more balanced set of sources would often yield lower total communication cost\
    \ than forcing the next layer to cluster around a single, possibly peripheral,\
    \ chiplet.\n\n- **Greedy, first-fit capacity allocation without fragmentation\
    \ control**  \n  The algorithm tries to fill the nearest chiplet\u2019s remaining\
    \ capacity as much as possible before moving to the next nearest. Over time this\
    \ can create a \u201CSwiss cheese\u201D pattern of small leftover capacities scattered\
    \ across the mesh. Later layers that need large contiguous space (e.g., a full\
    \ chiplet\u2019s worth of weights) may fail even though enough total capacity\
    \ exists.\n\n- **No global objective or lookahead**  \n  Placement is strictly\
    \ sequential and deterministic. There is no weighting of future layers, no backtracking,\
    \ and no attempt to reserve capacity or strategic start positions for upcoming\
    \ large layers. A single poor early decision (e.g., starting far from I/O chiplets)\
    \ can cascade into mapping failure for the whole network.\n\n- **Ignores activation\
    \ communication volume and congestion**  \n  The cost metric uses only static\
    \ shortest-path hop count. It does not consider the size of the activation tensors\
    \ flowing between layers, the bandwidth of links, or the potential for network\
    \ hotspot creation. In a 10\xD710 mesh with uniform links, communication energy\
    \ and latency are dominated by the product of activation volume and hop count;\
    \ ignoring this leads to suboptimal placement.\n\n- **Starvation of I/O locality**\
    \  \n  The mapper pays no attention to the four corner I/O chiplets. The first\
    \ layer (which consumes off\u2011chip input) and the last layer (which produces\
    \ output) can end up arbitrarily far from the I/O nodes, adding unnecessary latency\
    \ and energy for the data entering and leaving the chip.\n\n- **Load balancing\
    \ based only on memory, not compute**  \n  Available capacity (weight units) is\
    \ used as the sole resource for sorting chiplets. The actual computational load\
    \ (total MACs) distributed to each chiplet is not considered. Consequently, one\
    \ chiplet might be assigned a huge number of MACs while another sits almost idle,\
    \ creating pipeline bubbles and under\u2011utilising the total compute throughput.\n\
    \n- **The \u201Cactive_metric\u201D (performance/energy) is decorative**  \n \
    \ Chiplet attributes like `performance` or `energy_efficiency` are read but only\
    \ used as tertiary sort keys. The mapping algorithm does not translate the user\u2019\
    s preference into a weighted cost function that truly trades off placement choices\u2014\
    it remains heavily distance\u2011driven.\n\n### 2. Specific Opportunities for\
    \ Improvement Given This Config\n\n- **Replace single\u2011chiplet anchor with\
    \ a weighted centroid**  \n  For each subsequent layer, compute a \u201Ccentre\
    \ of mass\u201D of all chiplets that host part of the previous layer, weighted\
    \ by their fraction of the previous layer\u2019s output channels/MACs. Use this\
    \ centroid as the reference point when sorting candidate chiplets by distance.\
    \ This would spread the next layer more evenly and reduce average communication\
    \ hops.\n\n- **Integrate I/O chiplet proximity for the first and last layers**\
    \  \n  Identify which I/O chiplet(s) will inject the model\u2019s input and collect\
    \ its output (e.g., the corner closest to the off\u2011chip memory controller).\
    \ Seed the first layer near that I/O chiplet and, symmetrically, anchor the final\
    \ layer near the output I/O chiplet. This can dramatically cut the long\u2011\
    distance data movement at the boundaries of the inference pipeline.\n\n- **Incorporate\
    \ activation size into the cost function**  \n  The layer definitions include\
    \ `input_activation` and/or output dimensions. Multiply the hop distance between\
    \ a candidate chiplet and the previous layer\u2019s chiplet(s) by the number of\
    \ activation bits that will travel that path. Use this weighted distance as the\
    \ primary sort key. For large activation\u2011heavy layers (e.g., early conv layers),\
    \ this becomes much more important than weight\u2011capacity proximity.\n\n- **Reserve\
    \ capacity for known large layers**  \n  Before starting the mapping, scan the\
    \ model to identify layers that require more than, say, 80% of a chiplet\u2019\
    s weight capacity. When placing earlier layers, preferentially consume capacity\
    \ on chiplets that are *not* needed later to host those large layers. This simple\
    \ lookahead avoids fragmentation\u2011induced failures.\n\n- **Balance computational\
    \ load (MACs) explicitly**  \n  Maintain a running tally of expected MACs assigned\
    \ to each chiplet. Use a combined score that penalizes chiplets that are already\
    \ heavily loaded, creating a more uniform execution time across the mesh and reducing\
    \ pipeline stalls.\n\n- **Use a more sophisticated partitioning of output channels**\
    \  \n  Instead of allocating whole chiplet\u2011capacity chunks in one shot, decide\
    \ how many output channels each chiplet should process based on a global optimisation\
    \ of communication cost. For example, partition the output channels among the\
    \ top\u2011k nearest chiplets proportionally to their remaining weight capacity,\
    \ while also respecting the channel\u2011wise communication pattern (e.g., grouped\
    \ convolution constraints).\n\n- **Introduce a simple iterative improvement step**\
    \  \n  After a successful greedy mapping, apply a local search (e.g., swap layers\
    \ between nearby chiplets, or shift the whole chain\u2019s start position) to\
    \ reduce the sum of (activation\u2011size \xD7 hop\u2011count). The configuration\u2019\
    s 10\xD710 mesh and 96 chiplets make this computationally feasible online.\n\n\
    ### 3. Data / Signals the Mapper Currently Ignores That It Should Use\n\n| Data\
    \ / Signal                                   | Why It Matters                \
    \                                                 | How It Could Be Used     \
    \                                                                            \
    \     |\n|-------------------------------------------------|--------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|\n\
    | **Activation tensor size (bytes) per layer**     | Dominates inter\u2011layer\
    \ communication energy and time on the NoC.                | Weight candidate\
    \ distances by `activation_size \xD7 hop_distance` to minimise transmitted bit\u2011\
    miles.        |\n| **I/O chiplet positions and traffic direction**  | First/last\
    \ layers must move data to/from I/O chiplets; ignoring I/O adds latency and energy.\
    \ | Anchor first layer near input I/O, last layer near output I/O; include I/O\u2011\
    to\u2011chiplet distance in cost.  |\n| **Per\u2011chiplet compute load (MACs\
    \ assigned)**     | Unbalanced MAC load causes some chiplets to finish early while\
    \ others lag.      | Track running MACs per chiplet and use it as a penalty term\
    \ in sorting candidates.                       |\n| **Layer type and structural\
    \ constraints**        | Some layers (e.g., depthwise conv, attention) have reuse\
    \ patterns that affect optimal channel\u2011partitioning. | When partitioning\
    \ output channels, ensure that attention heads or feature groups stay co\u2011\
    located to avoid extra communication. |\n| **Network link bandwidth and injection\
    \ rates**   | Hotspots and congestion can ruin a placement that looks good on\
    \ pure hop count. | Incorporate a simple NoC congestion model (e.g., sum of expected\
    \ offered load on each link) as a tie\u2011breaker. |\n| **Weight\u2011loading\
    \ source and cost**               | With `weight_loading_strategy: all_at_once`,\
    \ loading 2.46M weights per chiplet from a central DRAM through the I/O chiplets\
    \ consumes time and energy. | Prefer to place weight\u2011heavy layers near the\
    \ I/O interface to reduce initial loading distance.            |\n| **Performance\
    \ / energy preference**              | The user explicitly sets `performance`\
    \ vs `energy_efficiency` but it has no real effect. | Create a weighted composite\
    \ cost: `\u03B1\xB7hops + (1\u2011\u03B1)\xB7energy_per_hop`, where \u03B1 is\
    \ the performance preference; vary `\u03B1` to trade off latency vs. energy. |\n\
    \nIncorporating these signals would transform the mapper from a greedy space\u2011\
    filling heuristic into a communication\u2011aware, load\u2011balanced placement\
    \ algorithm, significantly improving both mapping success rate and runtime inference\
    \ performance on the 10\xD710 CMOS mesh."
