    \ the mapper currently ignores that it should use\n\n| Ignored Information | Why\
    \ it matters for this configuration |\n|---------------------|----------------------------------------|\n\
    | **Positions of I/O chiplets (corners)** | Weight loading fans out from corners;\
    \ starting near an I/O chiplet shortens the all\u2011at\u2011once weight distribution.\
    \ |\n| **Activation dimensions per layer (`input_activation`)** | Directly determines\
    \ inter\u2011layer communication volume; must be used to prioritise placement\
    \ proximity. |\n| **Sizes of future layers** | A one\u2011layer lookahead could\
    \ avoid filling a critical chiplet with a small layer that could be placed elsewhere.\
    \ |\n| **Total model capacity footprint vs. available chiplets** | Knowing that\
    \ AlexNet uses only ~25% of chiplets should trigger a \u201Ccompact\u2011region\u201D\
    \ mapping policy rather than spreading layers thinly. |\n| **Network link utilisation\
    \ / congestion** | Without awareness, the mapper can create hotspots (e.g., routing\
    \ many layer transitions through one chiplet), causing contention and delay. |\n\
    | **Weight\u2011loading strategy (`all_at_once`)** | This strategy should bias\
    \ initial placement toward corners, which the mapper wholly ignores. |\n| **Chiplet\
    \ performance metric (`active_metric`)** | If the system were ever heterogeneous,\
    \ faster chiplets should host latency\u2011critical layers; currently the metric\
    \ is fetched but used only as a tie\u2011breaker. |\n| **Predecessor partitions\
    \ beyond the largest** | All source partitions of a split layer generate traffic;\
    \ ignoring the smaller partitions grossly underestimates the true communication\
    \ distance for the successor. |\n| **Data dependencies beyond immediate predecessor\
    \ (for skip connections)** | While AlexNet is feed\u2011forward, the same mapper\
    \ would catastrophically fail on ResNet\u2011like networks; incorporating multi\u2011\
    predecessor anchoring is essential for generality. |\n\n---\n\n### Proposed different\
    \ optimization strategy: **Sequential linear packing with split\u2011avoidance\
    \ and weighted centroids**\n\nGiven that the previous attempts resulted in no\
    \ latency improvement, a fundamentally different algorithm is needed \u2013 one\
    \ that exploits the feed\u2011forward nature of AlexNet and the abundance of free\
    \ chiplets.\n\n**Core idea**: Lay out the entire model along a minimised\u2011\
    length Hamiltonian path that starts at a corner I/O chiplet and traverses the\
    \ mesh in a compact, predictable order. Layers are placed contiguously on that\
    \ path, **without splitting unless absolutely necessary**, and the path direction\
    \ is chosen to maximise weight\u2011loading efficiency.\n\n**Algorithm steps**:\n\
    \n1. **Precompute a set of candidate linear paths**  \n   For each of the four\
    \ corners, generate a space\u2011filling path (e.g., along rows or columns) that\
    \ visits chiplets in a dense, locally connected manner (snake\u2011like scan).\
    \ Only paths that stay within a compact bounding box (e.g., the nearest 5\xD7\
    5 block) are retained.\n\n2. **Determine required number of chiplets**  \n   Compute\
    \ the minimum number of weight units needed by the whole AlexNet. Divide by 2.46M\
    \ to get `N_req` \u2248 25. The goal is to confine the mapping to a region containing\
    \ `N_req` contiguous chiplets.\n\n3. **Select the best starting corner and path**\
    \  \n   Evaluate each candidate path by:\n   - **Weight\u2011loading cost** =\
    \ sum over all layers of `hops_from_corner \xD7 layer_weight_size`.\n   - **Inference\
    \ communication cost** = sum over consecutive layers of `hops_between_centroids\
    \ \xD7 activation_volume`.\n   Choose the path with the lowest combined score.\n\
    \n4. **Place layers sequentially on the path**  \n   - Move along the path chiplet\
    \ by chiplet. For each layer, check whether the current chiplet can hold the **entire**\
    \ layer without splitting.  \n   - If yes, assign the layer to that chiplet and\
    \ advance only if the chiplet is completely full or the next layer cannot co\u2011\
    reside.  \n   - If no (layer too large), attempt to place the layer on two or\
    \ three **consecutive** chiplets along the path, minimising the number of splits.\
    \ This keeps all split fragments adjacent, reducing hop count to at most 2\u2013\
    3.  \n   - Ensure that the path\u2019s order respects the centroid principle:\
    \ fragments of a split layer are placed ahead of their successor, and the centroid\
    \ of these fragments becomes the anchor for the next layer.\n\n5. **Co\u2011locate\
    \ small layers**  \n   Fully\u2011connected layers often have modest weight footprints.\
    \ If a chiplet still has free memory after hosting a conv layer, place one or\
    \ more FC layers on the same chiplet to eliminate inter\u2011layer hops entirely.\n\
    \n6. **Refine with a local swap**  \n   After the initial packing, perform a simulated\u2011\
    annealing pass that swaps entire layers between two chiplets (or groups of chiplets)\
    \ if the total weighted hop count decreases. This can tighten the cluster further.\n\
    \n**Why this differs from the current mapper**:\n\n- **No nearest\u2011neighbor\
    \ greediness** \u2013 the mapping is determined by a pre\u2011planned path, not\
    \ by searching iteratively with a flawed anchor.\n- **Split avoidance** \u2013\
    \ splitting is treated as a last resort and, when forced, fragments are kept contiguous.\n\
    - **Considers I/O corners** \u2013 the path origin is chosen to minimise weight\u2011\
    loading overhead.\n- **Uses activation volumes** \u2013 the path selection explicitly\
    \ minimises volume\u2011weighted inference hops.\n- **Exploits excess capacity**\
    \ \u2013 packs the model into a tiny fraction of the mesh, eliminating unnecessary\
    \ long\u2011range communication.\n\nThis strategy directly addresses every weakness\
    \ identified above and can be expected to yield a significant latency reduction\
    \ for AlexNet on the given configuration."
