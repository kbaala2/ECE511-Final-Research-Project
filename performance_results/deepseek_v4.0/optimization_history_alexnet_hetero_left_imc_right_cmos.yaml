- change_summary: "### 1. Key weaknesses of the current nearest\u2011neighbor approach\
    \ (`_nearest_neighbor_mapper_v3`)\n\n* **Greedy, layer\u2011by\u2011layer allocation\
    \ without global foresight.**  \n  Each layer is placed independently based only\
    \ on the current free capacities and the immediately preceding layer\u2019s placement.\
    \ The mapper has no mechanism to anticipate future layers\u2019 requirements or\
    \ to minimise end\u2011to\u2011end communication cost. This leads to myopic decisions\
    \ (e.g. filling a \u201Cnearby\u201D chiplet with a large layer that later forces\
    \ the next large layer to be placed far away).\n\n* **Locality heuristic uses\
    \ only the single largest partition of the previous layer.**  \n  When splitting\
    \ a layer across several chiplets, the algorithm picks the one with the largest\
    \ percentage as the starting point for the next layer. All other partitions (which\
    \ also send activations to the next layer) are ignored. In AlexNet, a convolutional\
    \ layer split over 3\u20134 chiplets still generates traffic from all those chiplets;\
    \ anchoring the next layer only to the largest one can vastly increase total hop\u2011\
    count and latency.\n\n* **No communication\u2011volume awareness.**  \n  The mapper\
    \ sorts chiplets by distance and remaining memory, but completely disregards the\
    \ volume of data that will flow between consecutive layers (activation sizes).\
    \ A large\u2011capacity chiplet that is slightly farther away may be chosen over\
    \ a smaller nearby one, causing significant extra communication energy and latency\
    \ for high\u2011traffic layers.\n\n* **No penalty for splitting a layer.**  \n\
    \  If the closest chiplet cannot hold the whole layer, the mapper spreads it across\
    \ as many chiplets as needed. Splitting increases the number of inter\u2011chiplet\
    \ edges for both the current and the next layer, yet the algorithm treats a split\
    \ layer the same as an un\u2011split one. This often leads to unnecessary fragmentation\
    \ and higher communication overhead.\n\n* **First\u2011layer starting point ignores\
    \ I/O positions and weight\u2011loading cost.**  \n  The initial chiplet is selected\
    \ solely by maximum available weight memory. With `weight_stationary: true` and\
    \ `weight_loading_strategy: all_at_once`, all weights must be distributed from\
    \ the four corner I/O chiplets before inference. Starting far from any corner\
    \ penalises the weight\u2011loading phase, but the mapper has no notion of the\
    \ I/O chiplet locations.\n\n* **Deterministic, greedy behaviour \u2013 no exploration.**\
    \  \n  The algorithm always follows the fixed distance\u2011memory\u2011metric\
    \ sorting order; it never explores alternative assignments that might lead to\
    \ a better global layout. In a homogeneous 10\xD710 mesh, many equally valid placements\
    \ exist, and a small amount of backtracking or randomisation could uncover much\
    \ lower communication\u2011cost mappings.\n\n* **Potential capacity fragmentation.**\
    \  \n  When a chiplet has exactly (or more than) the units needed for the remainder\
    \ of a layer, the mapper allocates the entire remainder there, even if that chiplet\
    \ could have been saved for a larger future layer that must sit close to the current\
    \ cluster. This \u201Cuse it if it fits\u201D strategy can scatter layer footprints\
    \ and increase average hop distance over the whole model.\n\n### 2. Specific opportunities\
    \ for improvement given this configuration\n\n* **Spatially pipeline the layers\
    \ along the mesh.**  \n  AlexNet is a purely feed\u2011forward network. Placing\
    \ layers sequentially in a compact, linear path across the mesh (e.g., from a\
    \ corner I/O chiplet inward) would drastically reduce average inter\u2011layer\
    \ hop distance. The first layer should be placed on a chiplet adjacent to a corner\
    \ I/O chiplet, and each subsequent layer should extend the path, respecting capacity\
    \ constraints.\n\n* **Use a weighted centroid for next\u2011layer placement.**\
    \  \n  Instead of anchoring on the single largest partition, compute a \u201C\
    centre of mass\u201D of all chiplets that hold the previous layer, weighted by\
    \ their share of output channels. Place the next layer as close as possible to\
    \ this centroid. This reduces the aggregated communication distance from *all*\
    \ partitions, not just the largest.\n\n* **Introduce a communication\u2011cost\
    \ metric into the sorting order.**  \n  Augment the distance calculation with\
    \ an estimate of activation volume (e.g., the number of activations per inference).\
    \ Sort candidate chiplets by `distance \xD7 volume`, effectively trading off memory\
    \ availability against expected traffic. For AlexNet, large feature\u2011map layers\
    \ (early conv) should be placed with minimal hop distance, while small fully\u2011\
    connected layers can tolerate a few extra hops.\n\n* **Preferentially avoid layer\
    \ splitting.**  \n  When a chiplet has enough capacity to hold the entire layer,\
    \ do *not* split it unless splitting demonstrably reduces overall communication\
    \ (e.g., when placing the whole layer on one chiplet would push a later, larger\
    \ layer far away). The algorithm could evaluate whether a small split now leads\
    \ to better packing of later layers.\n\n* **Pack the model into a compact cluster.**\
    \  \n  With 96 chiplets, AlexNet (\u224862M weights) requires only about 25\u2013\
    30 chiplets (2.46M weights each). The mapper could deliberately concentrate all\
    \ mapped layers in a contiguous, small block of the mesh, leaving unused chiplets\
    \ idle. This minimises inter\u2011chiplet hop counts, network contention, and\
    \ static power.\n\n* **Account for weight\u2011loading time.**  \n  Honour the\
    \ `all_at_once` strategy by starting the first layer as close as possible to a\
    \ corner I/O chiplet. The mapper can bias `starting_chiplet` selection toward\
    \ chiplets with smallest Manhattan distance to any I/O port, weighted by the size\
    \ of the first layer\u2019s weights. This shortens the initial weight\u2011distribution\
    \ phase without affecting inference latency.\n\n* **Use a metric like total weighted\
    \ hop\u2011count as a global objective.**  \n  Even a simple post\u2011pass that\
    \ re\u2011evaluates the complete mapping and swaps entire layers between two chiplets\
    \ if it reduces total `hop \xD7 activation_volume` could yield measurable improvements\
    \ without a full optimisation framework.\n\n### 3. Data / signals the mapper currently\
    \ ignores that it should use\n\n| Ignored information | Why it matters for this\
    \ config |\n|----------------------|--------------------------------|\n| **Position\
    \ of I/O chiplets (corners)** | Weight loading must fan\u2011out from corners;\
    \ starting layers near an I/O chiplet cuts load time. |\n| **Activation dimensions\
    \ per layer (`input_activation`)** | Determines communication volume between layers\
    \ \u2013 a large conv layer\u2019s output should stay close to the next layer,\
    \ while a small FC layer can be farther away. |\n| **Layer connectivity beyond\
    \ immediate predecessor** | AlexNet is sequential, but if future models have skip\
    \ connections, the mapper would ignore them and break critical low\u2011latency\
    \ paths. |\n| **Network congestion / link utilisation** | Without knowing which\
    \ links become overloaded, the mapper can accidentally create hotspots (e.g.,\
    \ many layer transitions funnelling through one chiplet). |\n| **Weight\u2011\
    loading strategy (`all_at_once`)** | Influences initial placement; the mapper\
    \ should cluster early layers near I/O chiplets to amortise loading cost. |\n\
    | **Chiplet performance metrics (`metric` attribute in network nodes)** | If the\
    \ system were heterogeneous (e.g., mixed\u2011technology chiplets), the mapper\
    \ should route latency\u2011critical layers to faster chiplets. Currently fetched\
    \ but never used meaningfully. |\n| **Future layer sizes and demands** | A one\u2011\
    layer lookahead could prevent filling a chiplet with a small layer when a large\
    \ layer would benefit from that location. |\n| **Total model footprint vs. available\
    \ chiplets** | Knowing that only ~25% of chiplets are needed could trigger a \u201C\
    compact packing\u201D mode, drastically reducing average hop distance. |"
