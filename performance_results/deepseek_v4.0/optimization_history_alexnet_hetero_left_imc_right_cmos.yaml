    \ cuts hop counts, power, and contention, while the remaining idle chiplets can\
    \ be clock\u2011gated.\n\n- **Start the mapping from a corner I/O chiplet**  \n\
    \  Choose the first layer\u2019s position to minimise `distance_to_nearest_IO_chiplet\
    \ \xD7 layer_weight_size`. This directly accelerates the one\u2011time weight\u2011\
    loading phase without harming inference latency.\n\n- **Apply a post\u2011mapping\
    \ layer\u2011swap refinement**  \n  After generating a greedy mapping, perform\
    \ a simple local search that swaps layer assignments between chiplets if it reduces\
    \ the total `weighted_hop_count \xD7 activation_volume` across the model. Even\
