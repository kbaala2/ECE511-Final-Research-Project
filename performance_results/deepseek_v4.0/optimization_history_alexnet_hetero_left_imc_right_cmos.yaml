- change_summary: "### 1. Key weaknesses of the current nearest\u2011neighbor approach\
    \ (`_nearest_neighbor_mapper_v3`)\n\n1. **Greedy, myopic layer\u2011by\u2011layer\
    \ placement**  \n   Each layer is mapped sequentially, using only the current\
    \ remaining capacity and the immediate predecessor\u2019s \u201Clargest\u2011\
    percentage\u201D chiplet as an anchor. The mapper never looks ahead to the requirements\
    \ of later layers, so it often fills a nearby chiplet with a small layer that\
    \ would have been far better reserved for a later, larger layer. This leads to\
    \ fragmentation and increased communication distances over the whole model.\n\n\
    2. **Over\u2011simplified locality anchor: only the largest partition of the previous\
    \ layer**  \n   When a layer is split across several chiplets, only the chiplet\
    \ holding the *largest* split contributes to the starting point of the next layer.\
    \ All other source chiplets \u2013 which also send activations to the next layer\
    \ \u2013 are ignored. For AlexNet, large convolutional layers routinely get split\
    \ across 3\u20114 chiplets; anchoring solely on the largest can easily increase\
    \ the average communication distance by 2\u20114 hops compared with a weighted\
    \ centroid approach.\n\n3. **No communication\u2011volume awareness**  \n   The\
    \ sorting of candidate chiplets uses simple distance and available memory, completely\
    \ disregarding the **volume of data** (activation tensor sizes) that will flow\
    \ between consecutive layers. A chiplet with a lot of free weight capacity but\
    \ 2 extra hops away is chosen over a smaller nearby chiplet, even when the layer\u2019\
    s output is a massive feature map that would incur substantial energy and latency\
    \ penalty for the extra hops.\n\n4. **No penalty for layer splitting**  \n   The\
    \ mapper splits a layer as soon as the closest chiplet cannot hold the entire\
    \ requirement, spreading the layer across as many chiplets as needed. There is\
    \ no cost attached to splitting (e.g., extra inter\u2011chiplet edges, more complex\
    \ routing). This often results in many tiny fragments, increasing the number of\
    \ logical connections and the overall communication overhead without any compensating\
    \ benefit.\n\n5. **First\u2011layer placement ignores I/O chiplet positions**\
    \  \n   The initial starting chiplet is chosen solely by maximum available weight\
    \ capacity. With `weight_stationary: true` and `weight_loading_strategy: all_at_once`,\
    \ all weights must be loaded from the four corner I/O chiplets before inference.\
    \ Placing the first layer far from all corners lengthens the one\u2011time weight\u2011\
    loading phase, which can be a significant portion of total execution time for\
    \ short inference runs.\n\n6. **Deterministic, greedy behaviour with no exploration**\
    \  \n   The sorting order (distance, then memory) is always followed, so the mapper\
    \ always takes the same path. In a large, homogeneous 10\xD710 mesh with 96 chiplets,\
    \ many alternative placements would yield significantly lower total end\u2011\
    to\u2011end communication cost. The lack of any backtracking, randomisation, or\
    \ global optimisation limits the mapping to a narrow, often suboptimal corridor.\n\
    \n7. **\u201CUse it if it fits\u201D fragmentation**  \n   When a chiplet has\
    \ enough capacity for the remaining portion of a layer, the mapper allocates it\
    \ entirely to that chiplet, even if that chiplet might have been better reserved\
    \ for a future layer that needs to be close to the current cluster. This short\u2011\
    sighted packing can scatter the footprint of the model, increasing average hop\
    \ distance and link utilisation.\n\n### 2. Specific opportunities for improvement\
    \ given this configuration\n\n*Given: 96 CMOS chiplets (2.46M weights each), 4\
    \ IO chiplets at corners, AlexNet workload (~62M weights \u2192 ~25 chiplets needed),\
    \ weight stationary, all\u2011at\u2011once weight loading, non\u2011pipelined\
    \ communication.*\n\n1. **Spatially pipeline layers along a compact path starting\
    \ from an I/O corner**  \n   Place the first convolutional layer on a chiplet\
    \ adjacent to a corner I/O chiplet. For each subsequent layer, extend the placement\
    \ along a continguous path (or small cluster) that minimises the aggregate hop\
    \ distance from all source chiplets of the previous layer. This can dramatically\
    \ reduce inter\u2011layer communication latency.\n\n2. **Replace the single\u2011\
    partition anchor with a weighted centroid**  \n   Compute the centre of mass of\
    \ all chiplets that contain the previous layer, weighted by their share of output\
    \ channels (or activation volume). Place the next layer as close as possible to\
    \ this centroid. This accounts for traffic from *all* partitions simultaneously,\
    \ potentially halving the average hop count for split layers.\n\n3. **Incorporate\
    \ activation volume into the distance metric**  \n   Augment the chiplet sorting\
    \ order with an estimate of data volume:  \n   `cost = distance_hops \xD7 activation_size\
    \ (in packets)`  \n   Large feature\u2011map layers (e.g., early AlexNet conv\
    \ layers) would then strongly prefer nearby chiplets, while smaller fully\u2011\
    connected layers could tolerate larger distances. This simple change can significantly\
    \ reduce total communication energy and latency.\n\n4. **Add a reluctance to split\
    \ layers**  \n   Before spreading a layer across multiple chiplets, evaluate whether\
    \ forcing it onto a single chiplet (even if that means moving to a slightly farther\
    \ chiplet) would reduce overall communication. If the chiplet network is a mesh,\
    \ consolidating a layer on one chiplet eliminates all intra\u2011layer communication\
    \ and reduces the number of source anchors for the next layer.\n\n5. **Pack the\
    \ entire model into a compact block**  \n   Since AlexNet uses only about 25 of\
    \ the 96 available chiplets, the mapper can deliberately confine the mapping to\
    \ a small, contiguous region (e.g., a 5\xD75 block near one corner). This maximises\
    \ locality, reduces hop counts, and avoids scattering traffic across the entire\
    \ mesh. The unused chiplets can be powered down or left idle.\n\n6. **Bias the\
    \ initial placement toward a corner I/O chiplet**  \n   For the first layer, select\
    \ the starting chiplet that minimises `distance_to_nearest_IO_chiplet \xD7 number_of_weights`.\
    \ This directly accelerates the one\u2011time weight\u2011loading phase and is\
    \ free in terms of inference performance.\n\n7. **Apply a simple post\u2011mapping\
    \ layer\u2011swap optimisation**  \n   After a mapping is generated, iterate over\
    \ pairs of layers and evaluate a swap (exchanging their chiplet assignments) that\
    \ reduces the sum of weighted hop distances to predecessor/successor layers. Even\
    \ a single greedy improvement pass can smooth out fragmentation leftover by the\
    \ greedy mapper.\n\n### 3. Data / signals the mapper currently ignores that it\
    \ should use\n\n| Ignored Information | Why It Matters for This Config |\n|----------------------|--------------------------------|\n\
    | **Positions of I/O chiplets (corners)** | Weight loading fan\u2011out from corners;\
    \ starting near an I/O chiplet reduces the initial weight\u2011distribution time.\
    \ |\n| **Activation dimensions per layer (`input_activation`)** | Determines the\
    \ volume of inter\u2011layer communication \u2013 large feature maps must stay\
    \ close to the next layer to avoid high latency/energy. |\n| **Existence of future\
    \ layers\u2019 sizes and connectivity** | A one\u2011layer lookahead could prevent\
    \ reserving a high\u2011value location for a tiny layer that could be placed elsewhere.\
    \ |\n| **Dynamic link utilisation / congestion** | Without awareness, the mapper\
    \ can create hotspots (e.g., many layer transitions routed through a single chiplet),\
    \ causing network contention and delay. |\n| **Weight\u2011loading strategy (`all_at_once`)**\
    \ | The entire weight set is loaded once; placing the model near an I/O corner\
    \ amortises this overhead. |\n| **Chiplet performance metrics (e.g., `active_metric`)**\
    \ | If the system were ever heterogeneous (e.g., faster chiplets), the mapper\
    \ should place latency\u2011critical layers there; currently the metric is retrieved\
    \ but not used meaningfully. |\n| **Total model footprint vs. available chiplets**\
    \ | Knowing that only ~25% of chiplets are needed should trigger a \u201Ccompact\
    \ region\u201D packing policy instead of spreading the model thinly. |\n| **Predecessors\
    \ other than the largest partition** | When a layer is split, all source partitions\
    \ generate traffic; ignoring the smaller partitions underestimates the true communication\
    \ distance for the next layer. |\n| **Data dependency beyond immediate predecessor\
    \ (for future skip connections)** | AlexNet is feed\u2011forward, but the same\
    \ mapper will break badly on ResNet\u2011like models if it neglects multi\u2011\
    predecessor placements. |"
