    \  \n   Each layer is mapped independently, with no lookahead to future layers\u2019\
    \ sizes or connectivity. This often leads to fragmentation and suboptimal chiplet\
    \ reservations, forcing later layers to be placed farther away than necessary.\n\
    \n2. **Na\xEFve locality anchor \u2013 only the largest partition of the previous\
    \ layer**  \n   When a layer is split across multiple chiplets, the mapper uses\
    \ only the chiplet with the largest fraction as the anchor for the next layer.\
    \ All other source chiplets \u2013 which also send activations \u2013 are ignored.\
    \ In a split AlexNet conv layer spanning 3\u20134 chiplets, this can increase\
    \ average hop\u2011count by 2\xD7\u20134\xD7 compared with a properly weighted\
    \ centroid.\n\n3. **No communication\u2011volume awareness**  \n   Candidate chiplets\
    \ are sorted solely by distance and remaining memory. The size of the activation\
    \ tensor that will flow between consecutive layers is never considered. Large\
    \ feature\u2011map layers (e.g., early conv layers in AlexNet) suffer disproportionate\
    \ latency/energy penalties when placed even one extra hop away.\n\n4. **No penalty\
    \ for splitting a layer**  \n   The algorithm freely fragments a layer across\
    \ as many chiplets as needed, ignoring the extra inter\u2011chiplet communication\
    \ and complexity that splitting introduces. This often leads to unnecessary splits\
    \ that inflate total hop count and link utilisation.\n\n5. **First\u2011layer\
    \ starting point ignores I/O chiplet positions**  \n   The initial layer is placed\
    \ on the chiplet with the most available weight memory, regardless of its distance\
    \ to the four corner I/O chiplets. With `weight_stationary: true` and `weight_loading_strategy:\
    \ all_at_once`, loading weights from a far corner lengthens the weight\u2011distribution\
    \ phase, which can become a non\u2011negligible fraction of total execution time.\n\
    \n6. **Deterministic greedy behaviour with no global view**  \n   The sorting\
    \ order (distance \u2192 memory \u2192 metric) is always followed, and there is\
    \ no backtracking or exploration. In a large 10\xD710 mesh, many alternative assignments\
    \ could yield dramatically lower end\u2011to\u2011end communication.\n\n7. **\u201C\
    Use\u2011it\u2011if\u2011it\u2011fits\u201D fragmentation of chiplet capacity**\
    \  \n   When a chiplet has enough capacity for the remaining portion of a layer,\
    \ it is immediately filled, regardless of whether that location should be saved\
    \ for a larger, more critical layer later. This scatters the model\u2019s footprint\
    \ across the mesh.\n\n### 2. Specific opportunities for improvement given this\
    \ configuration\n\n- **Exploit feed\u2011forward structure to pipeline layers\
    \ linearly**  \n  AlexNet has a strictly sequential topology. Placing layers along\
    \ a compact, contiguous path (e.g., a west\u2011to\u2011east sweep starting from\
    \ a corner I/O chiplet) minimises the cumulative hop distance between consecutive\
    \ layers.\n\n- **Use a weighted centroid for next\u2011layer placement**  \n \
    \ Instead of anchoring on the single largest partition, compute the 2D centre\
    \ of mass of all chiplets holding the previous layer, weighted by their share\
    \ of output channels. Place the next layer as close as possible to this centroid\
    \ \u2013 this captures communication from *all* source chiplets.\n\n- **Incorporate\
    \ activation volume into the distance metric**  \n  Augment the chiplet sorting\
    \ cost with `distance \xD7 activation_tensor_size`. This automatically keeps high\u2011\
    traffic conv layers tightly clustered while allowing low\u2011volume fully\u2011\
    connected layers to spread modestly.\n\n- **Introduce a deliberate penalty for\
