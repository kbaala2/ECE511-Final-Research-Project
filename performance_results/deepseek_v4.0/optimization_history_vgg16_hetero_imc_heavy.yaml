- change_summary: "## 1. Key weaknesses of the current nearest\u2011neighbour approach\n\
    \nThe `_nearest_neighbor_mapper_v3` is fundamentally a **single\u2011anchor, greedy,\
    \ hop\u2011count\u2011only** placement algorithm. For the described 100\u2011\
    chiplet system (96 CMOS compute + 4 corner I/O, 10\xD710 mesh, non\u2011pipelined\
    \ Garnet, all\u2011at\u2011once weight loading) it exhibits the following critical\
    \ flaws:\n\n- **Blind inter\u2011layer chaining** \u2013 Only the chiplet that\
    \ received the *largest* percentage of the previous layer is used as the starting\
    \ point for the next layer. The other partitions of the previous layer (often\
    \ carrying 60\u201370% of the activations) are ignored. This forces the consumer\
    \ of those activations to be placed far from their sources, increasing hop\u2011\
    count and serialisation in the non\u2011pipelined network.\n- **No I/O proximity\
    \ awareness** \u2013 Weight loading is `all_at_once` from the four corner I/O\
    \ chiplets. The mapper never considers distance to an I/O corner; the first layer\
    \ greedily picks the chiplet with the most free memory, which may be in the centre\
    \ of the mesh, incurring tens of unnecessary extra hops for weight loading.\n\
    - **No load balancing** \u2013 The greedy first\u2011layer placement and the nearest\u2011\
    neighbour expansion cause early over\u2011utilisation of a hot\u2011spot cluster\
    \ while other chiplets remain nearly empty. This concentrates traffic and reduces\
    \ the number of chiplets that can operate in parallel, increasing serialisation\
    \ delay.\n- **No look\u2011ahead or fragmentation control** \u2013 VGG16 has large\
    \ fully\u2011connected layers later in the network; the mapper fills the most\
    \ attractive (close, high\u2011capacity) chiplets early, leaving only fragmented,\
    \ distant capacity for the final large layers. This causes mapping failures or\
    \ long\u2011range spreading even when total capacity is sufficient.\n- **Topology\u2011\
    only scoring** \u2013 Only Manhattan distance from the anchor chiplet is used.\
    \ There is no awareness of link congestion, actual path load, or the fact that\
    \ communication is `non\u2011pipelined` (where a single hot link serialises all\
    \ flows through it).\n- **Wasteful allocation arithmetic** \u2013 The per\u2011\
    chiplet `ceil` of required units creates un\u2011reclaimable slivers of capacity\
    \ that can add up to >10% of a chiplet\u2019s budget. This directly triggers the\
    \ spurious `\"INSUFFICIENT_MEMORY\"` failure.\n- **Heterogeneity ignored** \u2013\
    \ The configuration is `hetero_imc_heavy`, yet the mapper treats all compute chiplets\
    \ identically. There is no preferential mapping of convolutional layers to IMC\
    \ (crossbar\u2011efficient) or FC layers to CMOS.\n\n## 2. Specific opportunities\
    \ for improvement given this configuration\n\nThe 10\xD710 mesh with 96 CMOS chiplets\
    \ and corner I/O, non\u2011pipelined comm, and static weight loading creates several\
    \ clear optimisation levers:\n\n- **I/O\u2011aware first placement** \u2013 Force\
    \ the initial layer (and every new layer that loads weights) to start from chiplets\
    \ within a few hops of a corner I/O. This dramatically shortens the all\u2011\
    at\u2011once weight\u2011loading phase, which is a pure start\u2011up latency\
    \ penalty.\n- **Activation\u2011volume\u2011weighted placement** \u2013 Instead\
    \ of a single anchor, compute the *centroid of previous layer activations*, weighted\
    \ by their sizes (output feature map volume). Place the next layer\u2019s partitions\
    \ to minimise the volume\u2011hop product, directly attacking the largest communication\
    \ cost.\n- **Occupancy\u2011aware spread** \u2013 Use the already\u2011computed\
    \ `occupancy_percentages` to steer new partitions towards lightly loaded chiplets,\
    \ improving parallel utilisation and reducing hot\u2011spot link congestion.\n\
    - **Pre\u2011emptive capacity reservation** \u2013 Scan the model before mapping;\
    \ for the 3\u20115 largest layers, reserve a contiguous block (e.g., 2\xD72 or\
    \ 3\xD73 cluster) of chiplets. This prevents late\u2011stage fragmentation and\
    \ long\u2011range spreading.\n- **Heterogeneous layer\u2011type affinity** \u2013\
    \ Add a soft preference: conv \u2192 IMC, FC \u2192 CMOS, using the chiplet `type`\
    \ attribute. This leverages the hardware\u2019s specialisation.\n- **Largest\u2011\
    remainder allocation** \u2013 Replace the sequential `ceil` logic with a largest\u2011\
    remainder method across the chosen candidate chiplets, eliminating capacity waste\
    \ and the arbitrary `resources_remaining > 10` tolerance.\n- **Link\u2011congestion\
    \ proxy** \u2013 Even a simple running count of how many layer\u2011to\u2011layer\
    \ flows traverse each edge (derived from previous mappings) can be added as a\
    \ penalty when scoring candidates, steering the mapper away from creating bottleneck\
    \ links.\n\n## 3. What data/signals the mapper currently ignores that it should\
    \ use\n\n| Ignored Data / Signal | Where Available | Why It Matters |\n|------------------------|-----------------|----------------|\n\
    | **Activation sizes (`input_activation`)** | `model_layer_info['input_activation']`\
    \ | Determines the true communication cost between layers \u2013 must be co\u2011\
    located with producers/consumers. |\n| **Distance to nearest I/O chiplet** | Topology\
    \ (corners) | Critical for reducing the all\u2011at\u2011once weight\u2011loading\
    \ time. |\n| **Chiplet type (IMC/CMOS)** | `system.chiplets[].type` | Enables\
    \ matching conv/matmul to IMC, FC to CMOS for better performance. |\n| **Chiplet\
    \ occupancy percentage** | Already computed as `occupancy_percentages` | Essential\
    \ for load balancing and avoiding hot\u2011spot concurrency degradation. |\n|\
    \ **Layer size distribution of the whole model** | Entire `model_metrics` available\
    \ | Enables capacity reservation and avoids late\u2011stage failures. |\n| **Edge/\
    \ link utilisation from previous mappings** | Derivable from layer partitions\
    \ and topology | Prevents creating serialising bottleneck links in non\u2011pipelined\
    \ mode. |\n| **Communication mode (`non-pipelined`)** | Config parameter | Informs\
    \ the mapper that any serialised link access is punishing \u2013 avoiding congestion\
    \ is paramount. |\n| **Weight loading strategy (`all_at_once`)** | Config parameter\
    \ | Directly signals that I/O proximity is a first\u2011order optimisation. |\n\
    \n---\n\n## Proposed different optimisation strategy\n\nPrevious attempts that\
    \ merely re\u2011ranked candidates within the nearest\u2011neighbour framework\
    \ either failed or showed no improvement because they did not address the *root\
    \ causes*: missing I/O proximity, activation\u2011volume blindness, and capacity\
    \ fragmentation. A fundamentally different approach is required.\n\nThe new strategy,\
    \ **Activation\u2011 and I/O\u2011Aware Global Greedy Mapping with Reservation**,\
    \ replaces the single\u2011anchor, hop\u2011count\u2011only scoring with a composite,\
    \ multi\u2011objective candidate evaluation and adds a lightweight pre\u2011planning\
    \ phase. It consists of the following steps:\n\n### Phase 0: Pre\u2011processing\
    \ and reservation\n1. Read the entire `model_metrics` list.  \n2. Identify the\
    \ top 5 layers by weight capacity requirement. For each, compute the number of\
    \ chiplets needed (assuming ideal full\u2011chip occupancy).  \n3. Reserve a physically\
    \ contiguous block of chiplets (e.g., a rectangle) for each such layer. Blocks\
    \ are placed near I/O corners for weight loading and intersect minimally with\
    \ each other. These chiplets are temporarily marked as \u201Creserved\u201D and\
    \ are not used by smaller layers.\n\n### Phase 1: First\u2011layer placement\n\
    - Score every compute chiplet using a **composite cost**:\n  ```\n  cost = \u2013\
    available_capacity + \u03BB1 * dist_to_nearest_IO + \u03BB2 * occupancy_percent\n\
    \  ```\n- Choose the chiplet with the lowest cost. Allocate the full layer (or\
    \ maximum that fits) there; if the layer must split, use largest\u2011remainder\
    \ across the k nearest chiplets (k limited by how many chiplets can be filled\
    \ without waste).  \n- The bias toward short I/O distance reduces weight\u2011\
    loading latency.\n\n### Phase 2: Subsequent layers \u2013 volume\u2011weighted\
    \ centroid\n- For layer *L*, compute the **activation\u2011weighted centroid**\
    \ *C* of layer *L\u20111*\u2019s placements:\n  - For each chiplet *i* that contains\
    \ a partition of *L\u20111*, weight its coordinates by `pct_i * activation_size(L\u2011\
    1)` (or the actual output size). This gives a weighted average (x\u0304, \u0233\
    ).\n- This centroid represents the spatial centre of mass of the input activations.\
    \  \n- Candidate chiplets for *L* are sorted by their Euclidean/Manhattan distance\
    \ to *C*, but additionally evaluated against a composite penalty:\n  ```\n  score\
    \ = distance_to_centroid + \u03B1 * dist_to_nearest_IO + \u03B2 * occupancy_percent\
    \ \u2013 \u03B3 * type_affinity\n  ```\n  (where `type_affinity = 1` if chiplet\
    \ type matches layer\u2019s preferred type, else 0).\n- Allocate partitions using\
    \ largest\u2011remainder across the top\u2011scoring chiplets, respecting reserved\
    \ blocks and available capacity.\n\n### Phase 3: Post\u2011allocation balancing\n\
    - After each layer is placed, recompute the \u201Clink\u2011load increment\u201D\
    \ on all edges used by paths from the previous layer partitions to the new one.\
    \ Increment a global link\u2011congestion counter.  \n- The congestion counter\
    \ is then fed back as an additional penalty in the scoring of the *next* layer\
    \ (`+\u03B4 * link_load`), discouraging the mapper from repeatedly routing through\
    \ the same saturated edges.\n\n### Phase 4: Releasing reserved blocks\n- When\
    \ a large layer that was reserved has been placed, its block is released; any\
    \ unused chiplets become available for later layers with a fresh occupancy value.\n\
    \nThis multi\u2011objective, volume\u2011 and I/O\u2011aware approach directly\
    \ tackles:\n- **Weight loading** (Phase 1, I/O distance in all scoring)\n- **Inter\u2011\
    layer communication** (Phase 2 activation centroid)\n- **Load balancing** (occupancy\
    \ in scoring)\n- **Fragmentation** (Phase 0 reservation, largest\u2011remainder)\n\
    - **Chiplet specialisation** (type affinity)\n- **Link congestion** (Phase 3 dynamic\
    \ penalty)\n\nIt requires no complex iterative optimisation (like simulated annealing)\
    \ that might fail to converge within the simulation\u2019s time budget, yet it\
    \ is far more informed than the current single\u2011anchor heuristic. The expected\
    \ outcome is a measurable latency reduction for VGG16 on the 100\u2011chiplet\
    \ mesh."
