- change_summary: "## 1. Key weaknesses of the current nearest\u2011neighbor approach\n\
    \nThe `_nearest_neighbor_mapper_v3` determines layer placement exclusively by\
    \ following the \u201Cdominant\u201D chiplet of the previous layer and then greedily\
    \ packing the current layer into the nearest available neighbours. This approach\
    \ suffers from several critical flaws:\n\n* **Extremely myopic inter\u2011layer\
    \ linking**  \n  Only the chiplet that received the *largest* percentage of the\
    \ *immediately preceding* layer is used as the staring point for the next layer.\
    \ The spatial distribution of the other partitions of the previous layer is completely\
    \ ignored. If a layer was spread 40%\u201130%\u201130% across three distant chiplets,\
    \ the next layer will start near the 40% chiplet, neglecting the 60% of activations\
    \ that must travel from elsewhere. This creates unnecessary long\u2011distance\
    \ communication and network bottlenecks.\n\n* **No load balancing or fragmentation\
    \ awareness**  \n  The first layer greedily consumes the chiplet with the most\
    \ free memory, very often far from the I/O corners. Later layers continue this\
    \ greedy filling, leading to early over\u2011utilisation of a few chiplets while\
    \ others remain almost empty. This not only causes poor resource utilisation but\
    \ also forces later large layers to spill over to distant chiplets, increasing\
    \ hop counts and reducing parallelism.\n\n* **Ignores weight\u2011loading cost**\
    \  \n  The configuration uses `weight_loading_strategy: all_at_once` and `weight_stationary:\
    \ true`. The four I/O chiplets sit at the corners of the 10\xD710 mesh. Initial\
    \ weight loading latency is directly proportional to the distance from the nearest\
    \ I/O chiplet. The mapper never considers this; a layer may be placed at the centre\
    \ of the mesh, far from any I/O, incurring unnecessary loading time.\n\n* **Deterministic\
    \ greedy strategy without look\u2011ahead**  \n  Each layer is mapped sequentially\
    \ with no knowledge of upcoming layer sizes or communication patterns. Large layers\
    \ that appear late in the network can be starved of contiguous, close\u2011by\
    \ capacity because the early layers grabbed the best spots. This leads to fragmentation\
    \ and mapping failures on models with a few very large layers, even though total\
    \ capacity is sufficient.\n\n* **Rigid nearest\u2011neighbour rule ignores topology\
    \ beyond hop count**  \n  The chiplet network is a 10\xD710 mesh with a non\u2011\
    pipelined communication model (Garnet). Only Manhattan distance is used to sort\
    \ candidates. Actual path congestion, link utilisation, or the presence of hotspot\
    \ routers along the path are completely invisible to the mapper. In a non\u2011\
    pipelined system, congestion on a single link can serialise entire communication\
    \ phases.\n\n* **Allocation arithmetic causes capacity waste**  \n  The mapping\
    \ uses `ceil(resources_remaining * units_needed_full / crossbars_required)` to\
    \ convert percentages into discrete capacity units (crossbars or weight entries).\
    \ Repeated rounding when a layer is split across many chiplets can leave unused\
    \ slivers of capacity that sum up to 10\u201320% of a chiplet, never reclaimed.\
    \ This artificially raises the \u201CINSUFFICIENT_MEMORY\u201D failure rate.\n\
    \n* **Heterogeneity is under\u2011utilised**  \n  The configuration is `mapping_100_hetero_imc_heavy.yaml`,\
    \ implying both IMC and CMOS chiplets. The mapper estimates chiplet\u2011specific\
    \ layer requirements (`_calculate_layer_requirements`) but treats all compute\
    \ chiplets equivalently during selection\u2014only free capacity and an optional\
    \ performance metric are considered. There is no preference to map convolution\
    \ layers to IMC (where crossbar multiplication excels) or fully\u2011connected\
    \ layers to CMOS if that would reduce latency or energy.\n\n## 2. Specific opportunities\
    \ for improvement given this configuration\n\nThe **96 CMOS_Compute chiplets +\
    \ 4 corner I/O chiplets** on a **10\xD710 mesh** with **non\u2011pipelined communication**\
    \ and **all\u2011at\u2011once weight loading** create several concrete optimisation\
    \ opportunities:\n\n* **I/O\u2011conscious seeding and placement**  \n  Place\
    \ the first layer (and later layers requiring large weight loads) on chiplets\
    \ immediately adjacent to or within 1\u20132 hops of an I/O corner. The mapper\
    \ could bias the starting chiplet selection towards the four corners, perhaps\
    \ by adding a distance\u2011to\u2011IO term in the candidate scoring. This would\
    \ reduce the initial weight\u2011loading latency from microseconds to hundreds\
    \ of cycles.\n\n* **Layer\u2011communication\u2011aware spreading**  \n  Instead\
    \ of a single dominant chiplet, compute a **centre of mass** of the previous layer\u2019\
    s distributed partitions (weighted by percentage). Use that as the starting point,\
    \ and explicitly reserve bandwidth by placing the next layer\u2019s partitions\
    \ so that they minimise the volume\u2011weighted hop distance to the activations\
    \ they must receive. The mapper already has access to `input_activation` sizes;\
    \ these could be used as communication weights.\n\n* **Pre\u2011emptive capacity\
    \ reservation**  \n  Before mapping any layer, perform a lightweight scan of the\
    \ model\u2019s upcoming layer sizes. Reserve a fraction of capacity on chiplets\
    \ that are physically clustered, so that large layers later in the network do\
    \ not have to sprawl across the entire mesh. A simple bin\u2011packing heuristic\
    \ (e.g., large layers get a contiguous cluster) would dramatically reduce hop\
    \ counts.\n\n* **Occupancy\u2011aware balancing**  \n  The code already computes\
    \ `occupancy_percentages` but never uses them. Incorporating occupancy into the\
    \ sorting key (e.g., preferring less\u2011occupied chiplets after distance) would\
    \ spread the workload more uniformly, lowering the likelihood of hotspots and\
    \ improving throughput by keeping more chiplets active in parallel.\n\n* **Heterogeneous\
    \ type\u2011layer affinity**  \n  If the chiplet definitions include a `type`\
    \ attribute (IMC/CMOS), add a soft preference: map matrix\u2011multiplication\u2011\
    heavy layers (Conv, FC, SelfAttention) to IMC chiplets first, and use CMOS for\
    \ auxiliary layers or when IMC capacity is exhausted. This would leverage the\
    \ DNN\u2011to\u2011chiplet mapping\u2019s potential to match computation style\
    \ to hardware capability.\n\n* **Better integer allocation with least\u2011remainder\
    \ adjustment**  \n  Replace the current sequential `ceil` allocation with a **largest\u2011\
    remainder** method across the selected candidate chiplets. This gives a near\u2011\
    optimal discrete distribution of the layer\u2019s output channels/weights among\
    \ the chosen chiplets, minimising wasted capacity and eliminating the arbitrary\
    \ `resources_remaining > 10` tolerance.\n\n* **Link\u2011congestion\u2011aware\
    \ candidate scoring**  \n  Because the simulation uses Garnet with non\u2011pipelined\
    \ comm, even a simple proxy for link utilisation (e.g., counting how many previous\
    \ layers send traffic through a particular edge) would let the mapper avoid creating\
    \ several layers that all route through the same bottleneck link. This could be\
    \ incorporated as a dynamic penalty added to the hop count.\n\n## 3. Data/signals\
    \ the mapper currently ignores that it should use\n\nThe mapper computes or has\
    \ access to a wealth of data that is left unused. The most impactful missing signals\
    \ are:\n\n| Data / Signal | Where available | Why it matters |\n|---------------|----------------|----------------|\n\
    | **Activation sizes** (`input_activation`) | `model_layer_info['input_activation']`\
    \ (the feature map volume) | Determines the true communication cost between layers.\
    \ Large activations need wide, low\u2011distance routes. |\n| **Output feature\
    \ map size** (for the next layer) | Potentially derivable from layer parameters\
    \ | Same \u2013 the next layer\u2019s input size equals current layer\u2019s output\
    \ size; mapping should minimise the distance over which this data must be shipped.\
    \ |\n| **Distance to nearest I/O chiplet** | Known from the 10\xD710 mesh topology\
    \ (corners) | Critical for minimising the time to load weights `all_at_once`.\
    \ Current placement can be many hops from any I/O. |\n| **Chiplet type** (`IMC`\
    \ vs `CMOS`) | Already present in system.chiplets | Allows layer\u2011type affinity\
    \ (e.g., Conv \u2192 IMC). |\n| **Chiplet occupancy percentage** | Computed as\
    \ `occupancy_percentages` but not used | Enables better load balancing and hot\u2011\
    spot avoidance. |\n| **Inter\u2011layer traffic volume estimates** | Could be\
    \ derived from layer sizes and partition percentages | Helps to avoid congesting\
    \ the same links repeatedly. |\n| **Upcoming layer size distribution** | Whole\
    \ `model_metrics` available before mapping | Enables capacity reservation and\
    \ look\u2011ahead to prevent late\u2011game failures. |\n| **Communication mode**\
    \ (`non-pipelined`) | Config parameter | The mapper could know that stacked communication\
    \ at a congested link is particularly costly and avoid creating such situations.\
    \ |\n| **Weight loading strategy** (`all_at_once`) | Config parameter | Tells\
    \ the mapper to bias placement close to I/O to shorten the critical loading phase.\
    \ |\n\nBy integrating these signals, the mapper could evolve from a local greedy\
    \ algorithm into a globally aware, congestion\u2011 and heterogeneity\u2011conscious\
    \ placement tool, directly improving both mapping success rate and runtime performance."
