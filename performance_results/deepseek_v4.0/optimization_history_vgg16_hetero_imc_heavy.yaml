- change_summary: "## 1. Key weaknesses of the current nearest\u2011neighbor approach\n\
    \nThe `_nearest_neighbor_mapper_v3` suffers from several critical limitations\
    \ that prevent it from fully exploiting the 96\u2011chip CMOS compute fabric with\
    \ 4 corner I/O chiplets on a 10\u202F\xD7\u202F10 mesh, non\u2011pipelined communication,\
    \ and all\u2011at\u2011once weight loading:\n\n* **Myopic inter\u2011layer linking**\
    \ \u2013 Only the single chiplet that received the *largest* percentage of the\
    \ previous layer is used as the anchor for the next layer. All other partitions\
    \ of the previous layer are ignored, causing the next layer\u2019s placements\
    \ to be far from the majority of incoming activations, increasing overall communication\
    \ latency and serialisation.\n* **No load balancing** \u2013 The first layer greedily\
    \ consumes the chiplet with the most free memory, often located far from the I/O\
    \ corners. Later layers continue this greedy fill, leading to early over\u2011\
    utilisation of a few chiplets while others remain lightly loaded. This creates\
    \ hotspots and forces large late layers to sprawl across distant chiplets, raising\
    \ hop counts.\n* **Insensitivity to weight\u2011loading cost** \u2013 The configuration\
    \ loads all weights at once (`weight_loading_strategy: all_at_once`, `weight_stationary:\
    \ true`) from the four corner I/O chiplets. The mapper never considers distance\
    \ to an I/O chiplet; a layer placed in the centre of the mesh may require tens\
    \ of extra hops for weight loading, unnecessarily prolonging the initial phase.\n\
    * **No look\u2011ahead or fragmentation control** \u2013 Each layer is mapped\
    \ sequentially without knowledge of upcoming layer sizes. Large layers that appear\
    \ later in VGG16 (e.g., the final fully\u2011connected layers) may find contiguous,\
    \ close\u2011by capacity already consumed, causing unnecessary long\u2011range\
    \ placement.\n* **Rigid Manhattan\u2011distance sorting** \u2013 The only topological\
    \ information used is hop count from the starting chiplet. Actual path congestion,\
    \ link utilisation, and the non\u2011pipelined communication model (Garnet) are\
    \ completely ignored. In a non\u2011pipelined network, a single congested link\
    \ can serialise all communication through it, yet the mapper is blind to this\
    \ risk.\n* **Rounding\u2011induced capacity waste** \u2013 The allocation loop\
    \ uses `ceil` on each chiplet independently, leaving un\u2011reclaimable slivers\
    \ of capacity that can sum to 10\u201320% of a chiplet\u2019s units. This directly\
    \ increases the \u201CINSUFFICIENT_MEMORY\u201D failure rate.\n* **Heterogeneity\
    \ not utilised** \u2013 The configuration is `hetero_imc_heavy`, implying both\
    \ IMC and CMOS chiplets, but the mapper treats all compute chiplets identically.\
    \ There is no preference for placing convolution\u2011heavy layers on IMC (where\
    \ crossbar multiplication excels) or fully\u2011connected layers on CMOS if that\
    \ would reduce latency.\n\n## 2. Specific opportunities for improvement given\
    \ this configuration\n\nThe described setup offers several concrete avenues for\
    \ optimisation:\n\n* **I/O\u2011conscious seeding** \u2013 For the first layer\
    \ (and any layer that requires a large weight load), bias the starting chiplet\
    \ selection towards the four corners (adjacent to an I/O chiplet). This directly\
    \ reduces the all\u2011at\u2011once weight\u2011loading latency.\n* **Volume\u2011\
    weighted inter\u2011layer placement** \u2013 Instead of a single \u201Cdominant\u201D\
    \ chiplet, compute the *activation\u2011weighted centroid* of the previous layer\u2019\
    s distributed partitions. Use that centroid as the anchor to minimise the total\
    \ communication volume (activation size \xD7 hop distance) between layers. The\
    \ mapper already has access to `input_activation` sizes from `model_layer_info`.\n\
    * **Occupancy\u2011aware balancing** \u2013 The code already computes `occupancy_percentages`\
    \ but never uses them. Incorporating occupancy into the chiplet scoring (preferring\
    \ less\u2011occupied chiplets at similar distance) spreads the load, reduces hotspots,\
    \ and keeps more chiplets active in parallel.\n* **Pre\u2011emptive capacity reservation**\
    \ \u2013 Before mapping any layer, scan the entire model to identify the largest\
    \ layers (by weight memory). Reserve a contiguous cluster of chiplets for each\
    \ such layer, preventing fragmentation and guaranteeing that they can be placed\
    \ nearby.\n* **Chiplet type\u2011layer affinity** \u2013 If the chiplet definitions\
    \ contain a `type` attribute, add a soft preference: map convolutional and matrix\u2011\
    multiplication layers to IMC chiplets first, and use CMOS only when IMC capacity\
    \ is exhausted or for less demanding layers.\n* **Largest\u2011remainder allocation**\
    \ \u2013 Replace the sequential `ceil` packing with a largest\u2011remainder method\
    \ across the chosen candidate chiplets. This yields a near\u2011optimal discrete\
    \ distribution that avoids capacity waste and eliminates the arbitrary `resources_remaining\
    \ > 10` tolerance.\n* **Link\u2011congestion awareness** \u2013 Even a simple\
    \ dynamic count of how many previous layer partitions traverse a given link (based\
    \ on their chiplet assignments) can be used as a penalty when sorting candidates,\
    \ steering the mapper away from creating congested paths in the non\u2011pipelined\
    \ network.\n\n## 3. What data/signals the mapper currently ignores that it should\
    \ use\n\nThe mapper computes or has access to the following critical information\
    \ that is completely unused:\n\n| Data / Signal | Where available | Why it matters\
    \ |\n|---------------|----------------|----------------|\n| **Activation sizes**\
    \ (`input_activation`) | `model_layer_info['input_activation']` | Determines the\
    \ true communication cost between layers. Larger activations must travel shorter\
    \ distances to avoid dominating latency. |\n| **Distance to nearest I/O chiplet**\
    \ | Topology (corners) | Cuts weight\u2011loading time dramatically when placement\
    \ is biased towards I/O corners. |\n| **Chiplet type** (IMC vs CMOS) | `system.chiplets[].type`\
    \ | Allows matching layer types (Convolution \u2192 IMC, FC \u2192 CMOS) for better\
    \ performance/energy. |\n| **Chiplet occupancy percentage** | Already computed\
    \ as `occupancy_percentages` | Enables load balancing, preventing hotspot formation.\
    \ |\n| **Upcoming layer size distribution** | Entire `model_metrics` list available\
    \ | Enables capacity reservation and fragmentation avoidance, preventing mapping\
    \ failures for large late layers. |\n| **Link utilisation / communication load**\
    \ | Can be estimated from previous layer partitions and topology | Helps avoid\
    \ creating bottleneck links in non\u2011pipelined mode. |\n| **Communication mode**\
    \ (`non-pipelined`) | Config parameter | Informs the mapper that any serialised\
    \ link access is costly, making congestion avoidance paramount. |\n| **Weight\
    \ loading strategy** (`all_at_once`) | Config parameter | Tells the mapper to\
    \ prioritise I/O proximity to shorten the critical weight\u2011loading phase.\
    \ |\n\n---\n\n## Different optimisation strategy (proposed replacement for `_nearest_neighbor_mapper_v3`)\n\
    \nThe previous optimisation attempt either crashed or produced no latency improvement,\
    \ suggesting that simple tweaks (e.g., re\u2011ranking chiplets, adding a single\
    \ heuristic) are insufficient. A fundamentally different approach is needed that\
    \ directly addresses the largest latency contributors in this system: **weight\
    \ loading** and **inter\u2011layer activation communication**.\n\nThe new strategy,\
    \ **I/O\u2011Aware, Volume\u2011Weighted Placement with Capacity Reservation**,\
    \ consists of five coordinated changes:\n\n1. **Initial placement near I/O corners**\
    \  \n   For the first layer, score each chiplet by a weighted combination of available\
    \ capacity and distance to the nearest I/O corner (lower is better). Choose the\
    \ chiplet that maximises free capacity while staying within 3 hops of an I/O.\
    \ This drastically reduces the all\u2011at\u2011once weight loading time.\n\n\
    2. **Activation\u2011weighted centroid for layer chaining**  \n   For each subsequent\
    \ layer, compute the weighted centroid of the *previous layer\u2019s* chiplet\
    \ distribution, using activation volume (or layer output size) as the weight.\
    \ The next layer\u2019s partitions are then placed by minimising the volume\u2011\
    weighted distance to that centroid, effectively co\u2011locating the producer\
    \ and consumer of large feature maps.\n\n3. **Composite candidate scoring**  \n\
    \   Sort candidate chiplets not just by pure hop distance, but by a score:  \n\
    \   `score = hop_distance + \u03B1 * (distance_to_nearest_IO) + \u03B2 * occupancy_percent\
    \ \u2013 \u03B3 * chiplet_type_affinity`  \n   where `\u03B1`, `\u03B2`, `\u03B3\
    ` are configurable weights. This encourages placement that respects weight loading,\
    \ load balancing, and chiplet specialisation simultaneously.\n\n4. **Pre\u2011\
    scan and capacity reservation**  \n   Before mapping any layer, scan the model\
    \ and identify the top 3\u20135 largest layers by weight memory requirement. Reserve\
    \ a physically contiguous block of chiplets (e.g., a rectangle of 2\xD72 or 3\xD7\
    3) for each such layer. During mapping, these blocks are excluded from use by\
    \ other layers, guaranteeing that large layers can be placed close together.\n\
    \n5. **Largest\u2011remainder discrete allocation**  \n   Once the ordered candidate\
    \ list is determined (via the composite score), apply a largest\u2011remainder\
    \ algorithm to split the layer\u2019s total capacity requirement across the selected\
    \ chiplets. This eliminates rounding waste and ensures exact consumption, avoiding\
    \ the artificial `resources_remaining > 10` failure condition.\n\nFinally, the\
    \ mapper will incorporate the chiplet type so that, for instance, convolutional\
    \ layers are preferentially mapped to IMC chiplets (if present) while fully\u2011\
    connected layers go to CMOS, mirroring the *hetero_imc_heavy* configuration.\n\
    \nThis multi\u2011pronged strategy directly attacks the weight loading bottleneck,\
    \ the activation communication cost, the lack of load balancing, and the fragmentation\
    \ problem\u2014areas that a simple nearest\u2011neighbour re\u2011ranking cannot\
    \ address. It is expected to yield a measurable latency reduction for VGG16 on\
    \ the 100\u2011chiplet mesh."
  function_name: io_aware_volume_balanced_mapper
