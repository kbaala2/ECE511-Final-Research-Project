- change_summary: "### 1. Key weaknesses of the current nearest\u2011neighbor approach\n\
    \n#### 1.1 Greedy, myopic layer\u2011by\u2011layer placement\nThe mapper processes\
    \ layers sequentially without any global optimization or lookahead. Once a layer\
    \ is placed, the decision cannot be revisited. This leads to **fragmentation**:\
    \ early small layers consume capacity in prime locations, forcing later, larger\
    \ layers to be split across many chiplets or pushed far from earlier stages. The\
    \ algorithm has no mechanism to reserve space for critical layers.\n\n#### 1.2\
    \ Weak seed selection for successive layers\nAfter the first layer, the seed chiplet\
    \ is chosen as \u201Cthe chiplet that received the highest allocation percentage\
    \ of the previous layer.\u201D This heuristic ignores the **dataflow dependencies**:\
    \ the activations produced by the previous layer\u2019s partitions need to feed\
    \ the current layer\u2019s partitions. Simply picking the most\u2011loaded chiplet\
    \ may yield a seed far from where the current layer\u2019s inputs actually reside,\
    \ increasing inter\u2011layer communication distance. Further, nothing guarantees\
    \ that the other chiplets used by the previous layer are nearby, so the current\
    \ layer may end up scattered across a non\u2011contiguous set, elevating average\
    \ hop count.\n\n#### 1.3 Distance\u2011only ordering with blind fill\nChiplets\
    \ are sorted first by distance from the seed, then by available memory. The allocation\
    \ then fills each chiplet to its capacity (in percentage terms) before moving\
    \ to the next. This is a classic **bin\u2011packing problem** but without any\
    \ attempt to minimise the number of bins used. As a result, a layer that could\
    \ fit on one or two chiplets may be split across three or four, simply because\
    \ the nearest chiplet with any free space gets a chunk. That unnecessary splitting\
    \ increases future communication cost and complicates aggregation of partial sums.\n\
    \n#### 1.4 Ignorance of inter\u2011layer communication volume\nThe mapper sees\
    \ only the weight count of each layer (`crossbars_required`) and the UV\u2011\
    like capacity (weight units for CMOS). It has **no information about the size\
    \ of activation tensors** that must be moved between layers. For example, in AlexNet,\
    \ early layers have huge activation maps; splitting them across distant chiplets\
    \ incurs far greater communication penalty than splitting a small later layer.\
    \ The current cost model (hop count distance) does not weight these distances\
    \ by data volume.\n\n#### 1.5 Unused occupancy and load\u2011balancing signals\n\
    The code computes `occupancy_percentages` and `avail_memory_list` for all chiplets,\
    \ but occupancy is never used in the sorting or decision logic. Consequently,\
    \ the mapper may repeatedly prefer a few central chiplets (because they have most\
    \ free memory at start) while leaving peripheral ones nearly empty, creating computation\
    \ hotspots and network congestion in the centre of the mesh.\n\n#### 1.6 Dubious\
    \ metric handling for CMOS platforms\nThe algorithm extracts an `active_metric`\
    \ from the topology graph nodes (presumably something like \u201Cperformance\u201D\
    ). In a homogeneous 96\u2011CMOS\u2011chiplet floorplan, all compute chiplets\
    \ are identical, so this metric likely carries zero information but still influences\
    \ the sort order (as a tie\u2011breaker). More critically, **no chiplet\u2011\
    level performance metrics are defined** for CMOS chiplets, so the tie\u2011breaker\
    \ is essentially a no\u2011op that clutters the code without benefit.\n\n####\
    \ 1.7 Fragile resource unit translation\nFor CMOS, `_calculate_layer_requirements`\
    \ returns total weights of the full layer on a chiplet. The allocation logic then\
    \ computes `units_needed_for_resources` by scaling by `resources_remaining / crossbars_required`.\
    \ This assumes that `crossbars_required` (passed in the layer info) is exactly\
    \ the total weight count of the layer, which is not enforced by any type system\
    \ or validation. If the caller provides a value from a different domain (e.g.,\
    \ crossbar count from an IMC estimator), the scaling becomes erroneous, leading\
    \ to under\u2011 or over\u2011allocation.\n\n---\n\n### 2. Specific opportunities\
    \ for improvement given this configuration\n\n#### 2.1 Use the 10\xD710 mesh with\
    \ corner IOs for strategic initial / final placement\nThe four I/O chiplets sit\
    \ at the corners of the mesh. The first model layer (conv1 of AlexNet) and the\
    \ last layer (fc8) produce/consume data that must enter/exit through these corners.\
    \ The mapper should **deliberately seed the first layer near one or more I/O chiplets**,\
    \ and similarly steer the final layers toward an output\u2011adjacent region.\
    \ Currently the first\u2011layer seed is chosen purely by free capacity; if an\
    \ IO\u2011chiplet\u2011adjacent chiplet has enough free space, it might not be\
    \ chosen because the sorter puts available memory first. An explicit bias toward\
    \ corners for ingress/egress layers would cut both input\u2011loading and output\u2011\
    readout latencies.\n\n#### 2.2 Aggregate partitions to minimise chiplets per layer\n\
    Instead of greedy one\u2011chiplet\u2011at\u2011a\u2011time filling, the mapper\
    \ could implement a **buddy\u2011buddy or best\u2011fit decreasing** algorithm\
    \ that tries to satisfy the whole layer\u2019s requirement from the fewest chiplets\
    \ within a given distance radius. Because CMOS chiplets have large capacity (2.46M\
    \ weights), many AlexNet layers (e.g., fc6: 37.7M weights, fc7: 16.8M, conv2\u2011\
    5) could fit on a handful of chiplets if allocated as contiguous blocks. Reducing\
    \ the number of chiplets per layer directly shrinks the **all\u2011to\u2011all\
    \ aggregation traffic** that the partitioner\u2019s output\u2011channel splitting\
    \ creates, and simplifies later routing.\n\n#### 2.3 Align partitions across consecutive\
    \ layers (pipeline locality)\nLayers that are connected in the computation graph\
    \ could be **mapped onto the same set of chiplets** (or spatially adjacent ones)\
    \ so that activations remain local. A simple scheme is to pre\u2011compute an\
    \ \u201Caffinity\u201D score: if layer\u202F*i* used chiplets\u202FC, then layer\u202F\
    *i+1* should try to fit entirely within C\u222Aneighbors. When that is impossible,\
    \ the shards of layer\u202F*i+1* can be placed in a way that mirrors the shard\
    \ locations of layer\u202F*i*. This would transform the chain of nearest\u2011\
    neighbour placements into a **pipeline parallelism\u2011aware placement**.\n\n\
    #### 2.4 Exploit occupancy for load balancing\nWith 96 identical chiplets, an\
    \ ideal mapping spreads the total weight load equally as well as the communication\
    \ load. Instead of ignoring occupancy, use it as a **primary sort key** (after\
    \ distance) to steer layers toward under\u2011utilised chiplets. This would counteract\
    \ the tendency to over\u2011crowd the centre, improving throughput and reducing\
    \ network congestion in the core of the mesh.\n\n#### 2.5 Pre\u2011compute a global\
    \ \u201Cweight map\u201D using a clustering algorithm\nGiven the static nature\
    \ of the workload (AlexNet) and the weight\u2011stationary regime, a **one\u2011\
    shot partitioning** (e.g., recursive bisection of the chiplet graph with weighted\
    \ vertices equal to layer sizes, edges reflecting layer adjacency) would avoid\
    \ the fragmentation inherent in the sequential greedy approach. The mapping file\
    \ already defines the full model, so such an offline optimisation is feasible\
    \ and would likely produce a higher\u2011quality placement.\n\n---\n\n### 3. What\
    \ data/signals the mapper currently ignores that it should use\n\n| Missing data\
    \ / signal | Why it matters |\n|-----------------------|----------------|\n| **Activation\
    \ tensor sizes per layer** | Dictates the actual data volume communicated between\
    \ layers; hop\u2011count alone misestimates communication cost, especially for\
    \ early layers with large feature maps. |\n| **IO chiplet positions and K\u2011\
    ary mesh structure** | First and last layers must interface with I/O; ignoring\
    \ these locations wastes opportunities to minimise system\u2011level latency.\
    \ |\n| **Weight\u2011stationary residency state** | The mapper never checks *which*\
    \ weights are already loaded on a chiplet from prior layers. Even though all weights\
    \ are loaded upfront, it could **co\u2011locate weights of layers that share common\
    \ sub\u2011tensors** (e.g., convolutional filters that can be reused) to save\
    \ capacity or reduce cross\u2011chiplet referencing. |\n| **Topology\u2011aware\
    \ communication cost beyond hop count** | In a 10\xD710 mesh, congestion can arise\
    \ when many flows traverse the same routers. The mapper does not consider **link\
    \ load** or the fact that splitting a layer into many shards creates an all\u2011\
    to\u2011all traffic pattern that may saturate internal routers. |\n| **Per\u2011\
    chiplet compute performance metrics** | If chiplets had differing speeds (e.g.,\
    \ due to voltage/frequency islands or different memory bandwidths), the `active_metric`\
    \ would be meaningful; currently it is fetched but likely always zero, yet the\
    \ code treats it as if it were a real tie\u2011breaker. For the homogeneous CMOS\
    \ setup, either remove it or replace it with a true chiplet profile (e.g., memory\
    \ bandwidth, cache size). |\n| **Weight\u2011loading order and cost** | Loading\
    \ weights all at once incurs a one\u2011time cost. If weights are not stored at\
    \ the chiplet but loaded from an external memory, the **distance from the weight\
    \ source** (perhaps a central DRAM hub or the IO chiplets) could be considered\
    \ to minimise initialisation time. Current code ignores this cold\u2011start penalty.\
    \ |\n| **Network routing table or non\u2011shortest\u2011path diversity** | The\
    \ chiplet network is a mesh; multiple equal\u2011cost paths exist between nodes.\
    \ The mapper could distribute traffic across diverse routes to mitigate congestion,\
    \ but it sets all flows onto shortest paths through the network (later simulated\
    \ by Garnet). At placement time, some awareness of **path diversity** could favour\
    \ placements that allow traffic to fan out better. |\n\n**Summary:** The nearest\u2011\
    neighbour mapper v3 makes placement decisions based solely on static weight count\
    \ and hop distance, ignoring activation sizes, I/O locality, load balance, and\
    \ the global structure of the computation graph. For this large, homogeneous CMOS\
    \ mesh, a more holistic strategy would yield lower communication overhead, better\
    \ utilisation, and improved overall performance."
