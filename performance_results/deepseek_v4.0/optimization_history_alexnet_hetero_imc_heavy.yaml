- change_summary: "## 1. Key weaknesses of the current nearest\u2011neighbour approach\n\
    \n**1.1 Greedy, myopic layer\u2011by\u2011layer placement**\nEach layer is placed\
    \ sequentially without any global view. Once a layer\u2019s allocation is fixed,\
    \ it cannot be revisited, leading to **capacity fragmentation**: early small layers\
    \ may consume capacity in topologically valuable locations, forcing later large\
    \ layers to be split across many chiplets far from their input sources.\n\n**1.2\
    \ Weak inter\u2011layer seed selection**\nAfter the first layer, the starting\
    \ chiplet for a new layer is chosen as the chiplet that received the largest percentage\
    \ of the *previous* layer. This ignores dataflow dependencies\u2014the activations\
    \ from all previous\u2011layer partitions must feed the current layer. A single\
    \ seed may be distant from where the majority of those activations reside, causing\
    \ excessive multi\u2011hop communication.\n\n**1.3 Blind fill\u2011until\u2011\
    capacity leading to over\u2011splitting**\nChiplets are sorted only by distance\
    \ from the seed and then by available capacity, and the mapper greedily fills\
    \ each chiplet to its remaining capacity before moving to the next. No attempt\
    \ is made to **minimise the number of chiplets** that host a layer. A layer that\
    \ could fit on two chiplets may be needlessly split across four, inflating the\
    \ all\u2011to\u2011all reduction traffic and making later inter\u2011layer routing\
    \ more complex.\n\n**1.4 Complete disregard of I/O locations**\nThe 10\xD710 mesh\
    \ has four I/O chiplets at its corners (nodes 1, 10, 91, 100). Input activations\
    \ enter and output data leaves through those corners, yet the mapper entirely\
    \ ignores I/O positions. The first layer (conv1) could be placed far from any\
    \ I/O, forcing input data to traverse many hops before even starting computation.\n\
    \n**1.5 No notion of pipeline locality**\nConsecutive layers are not forced to\
    \ share the same or adjacent chiplets. As a result, activation tensors may travel\
    \ large distances between successive operators, dramatically increasing network\
    \ latency and congestion.\n\n**1.6 Unused occupancy and load\u2011balancing signals**\n\
    Occupancy percentages are computed but never used in sorting or decisions. The\
    \ algorithm therefore tends to over\u2011crowd a few central chiplets while leaving\
    \ periphery under\u2011utilised, creating hotspots and further worsening network\
    \ contention.\n\n**1.7 Metric tie\u2011breaker is a no\u2011op**\nThe `active_metric`\
    \ from the topology graph is extracted and used to break ties. In a homogeneous\
    \ 96\u2011CMOS\u2011chiplet configuration, this metric is always zero, so it serves\
    \ no purpose yet adds complexity.\n\n---\n\n## 2. Specific opportunities for improvement\
    \ given this configuration\n\n**2.1 I/O\u2011anchored placement for first and\
    \ last layers**\nSince the workload is weight\u2011stationary and all weights\
    \ are loaded once, inference\u2011time latency is dominated by input loading,\
    \ inter\u2011layer communication, and output delivery.  \n**Opportunity**: Seed\
    \ the first layer (conv1) on a chiplet that is a **direct neighbour of an I/O\
    \ chiplet**, minimising the hop count for the initial large activation tensor\
    \ (224\xD7224\xD73 \u2261 ~150K input activations). Similarly, steer the final\
    \ layer (fc8) toward an I/O\u2011adjacent region to reduce output movement.\n\n\
    **2.2 Minimise chiplets per layer via bin\u2011packing**\nAlexNet\u2019s weight\
    \ tallies show many layers (conv2\u20135, fc7, fc8) can be accommodated by a small\
    \ number of chiplets if allocated compactly.  \n**Opportunity**: Replace the linear\
    \ sweep with a **best\u2011fit decreasing (or buddy) approach** that, given a\
    \ seed, evaluates candidate chiplet sets within a fixed radius and aims to satisfy\
    \ the layer\u2019s full requirement using the **fewest chiplets**. This directly\
    \ reduces the number of broadcast/collect communication patterns and preserves\
    \ contiguous capacity for later layers.\n\n**2.3 Enforce pipeline locality across\
    \ layers**\nBecause activations flow from layer to layer, the chiplet sets of\
    \ consecutive layers should be as similar as possible.  \n**Opportunity**: When\
    \ mapping layer *i+1*, prefer chiplets that were **already used by layer *i***,\
    \ then their direct neighbours, and only afterwards expand the search radius.\
    \ If the new layer fits entirely on the previous layer\u2019s chiplets (with free\
    \ capacity), place it there to achieve zero\u2011hop activation transfer. This\
    \ chaining dramatically reduces the average hop count for inter\u2011layer communication.\n\
    \n**2.4 Exploit the abundance of CMOS capacity for load balancing**\nWith 96 chiplets\
    \ each holding 2.46M weights, the total capacity (236M) far exceeds AlexNet\u2019\
    s weight count (62.6M).  \n**Opportunity**: Use **occupancy** as a primary sorting\
    \ criterion (after distance) to spread the weight load evenly, preventing network\
    \ congestion in the centre of the mesh.\n\n**2.5 Stratified pre\u2011planning\
    \ for large layers**\nfc6 (37.7M weights) inevitably requires \u224816 chiplets.\
    \ The current mapper may spill this layer haphazardly across the mesh.  \n**Opportunity**:\
    \ Detect large layers during an initial pass and **reserve a contiguous block\
    \ of chiplets** (e.g., a 4\xD74 sub\u2011mesh) for them. This avoids scattering\
    \ and enables the layer to be partitioned in a way that mirrors the activation\
    \ tensor layout, simplifying subsequent reduction.\n\n---\n\n## 3. What data/signals\
    \ the mapper currently ignores that it should use\n\n| Missing signal | Why it\
    \ matters |\n|----------------|----------------|\n| **Activation tensor sizes\
    \ per layer** | Determines the actual communication volume between layers; moving\
    \ a 27\xD727 activation map costs far less than a 55\xD755 one. The mapper treats\
    \ all hops equally, misestimating real latency impact. |\n| **I/O chiplet positions\
    \ and mesh corner topology** | Input/output data must travel to/from these corners.\
    \ Ignoring this forces unnecessary long\u2011haul traversals at both ends of the\
    \ pipeline. |\n| **Previous layer\u2019s chiplet allocation map (exact percentages)**\
    \ | To achieve pipeline locality, the mapper must know *which* partitions of the\
    \ previous layer map to which chiplets, so that the next layer can align its output\u2011\
    channel splits, minimising cross\u2011chiplet activation movement. |\n| **Network\
    \ congestion potential (hot\u2011spot risk)** | A mesh\u2011aware cost model would\
    \ penalize placements that create funnels (e.g., too many layers mapped to the\
    \ central rows). Currently only static hop count is used. |\n| **Weight\u2011\
    loading origin (external memory location)** | Even though weights are loaded \u201C\
    all at once,\u201D the initialisation cost depends on distance from the weight\
    \ source (likely an I/O chiplet or external interface). Placing a layer far from\
    \ that source increases cold\u2011start latency. |\n| **Chiplet\u2011level compute\
    \ performance profile** | In a heterogeneous system the `active_metric` would\
    \ matter; in this homogeneous CMOS array it is zero. The mapper should drop the\
    \ meaningless tie\u2011breaker and replace it with a true load\u2011balance metric\
    \ like **current throughput capacity** if chiplets differ in frequency or memory\
    \ bandwidth. |\n| **Non\u2011shortest\u2011path routing diversity** | Garnet may\
    \ later use adaptive routing, but the mapper currently assumes all flows follow\
    \ a single shortest path. Awareness of **multiple equal\u2011cost paths** could\
    \ favour placements that naturally distribute traffic across distinct routes.\
    \ |\n\n---\n\n## Proposed different optimisation strategy\n\nThe prior attempt\
    \ likely tweaked sorting keys within the same nearest\u2011neighbour framework,\
    \ yielding no latency improvement. A **different strategy** is to implement a\
    \ **pipeline\u2011aware, I/O\u2011anchored mapper** with **split minimisation**:\n\
    \n1. **Pre\u2011compute the required number of chiplets for each layer** based\
    \ on weight size (unit size: 2.46M weights).  \n2. **Anchor the first layer**\
    \ on the compute chiplet with the smallest maximum distance to any I/O chiplet\
    \ (e.g., chiplet 2 or 11, adjacent to IO node 1).  \n3. **For each subsequent\
    \ layer**, select a set of chiplets that:  \n   - have sufficient free capacity,\
    \  \n   - are \u201Cclose\u201D to the chiplet set used by the previous layer\
    \ (priority: same chiplet, then direct neighbours, then 2\u2011hop neighbours),\
    \ and  \n   - together can host the layer using the **fewest chiplets possible**\
    \ (a bin\u2011packing step within the confined neighbourhood).  \n4. If a layer\
    \ cannot be satisfied within the immediate neighbourhood (e.g., fc6 needs 16 chiplets),\
    \ expand the search radius *while still preferring chiplets that maintain a compact\
    \ shape* (e.g., a rectangular block to simplify the partition layout).  \n5. For\
    \ **output\u2011bound layers** (fc8), apply an additional bias toward chiplet\
    \ positions near one of the I/O corners, even if that means a temporary deviation\
    \ from pure pipeline locality.\n\nThis strategy directly addresses the root causes\
    \ of the current mapper\u2019s poor performance\u2014lack of I/O awareness, over\u2011\
    splitting, and absent pipeline locality\u2014and should yield a substantial reduction\
    \ in end\u2011to\u2011end inference latency for the 10\xD710 CMOS mesh running\
    \ AlexNet."
