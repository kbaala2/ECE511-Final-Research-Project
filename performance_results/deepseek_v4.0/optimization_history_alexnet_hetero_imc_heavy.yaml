- change_summary: "## 1. Key weaknesses of the current nearest\u2011neighbour approach\n\
    \n1. **Greedy sequential placement** \u2013 no global view or backtracking; early\
    \ decisions fragment capacity and force later workarounds.\n2. **Ignored inter\u2011\
    layer data locality** \u2013 the seed for layer\u202F*i* is merely the previous\
    \ layer\u2019s most\u2011loaded chiplet, not the set that actually holds the previous\
    \ layer\u2019s partitions.\n3. **Blind bin\u2011packing** \u2013 fill\u2011until\u2011\
    full logic over\u2011splits layers across more chiplets than necessary, inflating\
    \ all\u2011to\u2011all reduction traffic.\n4. **No I/O awareness** \u2013 four\
    \ corner I/O chiplets exist but are never used as attractors for first/last layers.\n\
    5. **Unused occupancy data** \u2013 computed but never employed for load\u2011\
    balancing; central chiplets become hotspots.\n6. **Homogeneous metics** \u2013\
    \ the `active_metric` tie\u2011breaker is meaningless in a uniform CMOS array.\n\
    \n## 2. Specific optimisation opportunities given this configuration\n\n- **I/O\u2011\
    anchored placement**: place conv1 near an I/O corner, place fc8 near the same\
    \ or opposite corner.\n- **Minimise chiplets per layer**: use best\u2011fit on\
    \ a candidate set of nearby chiplets to hold the whole layer if possible.\n- **Pipeline\
    \ locality**: enforce that consecutive layers share the same or neighbouring chiplets\
    \ to keep activations local.\n- **Exploit abundant capacity**: 96\xD72.46M = 236M\
    \ >> 62.6M weights; spread layers out to avoid congestion.\n- **Reserve contiguous\
    \ blocks for huge layers** (e.g., 4\xD74 sub\u2011mesh for fc6) to avoid scattering.\n\
    \n## 3. Data/signals the mapper currently ignores that it should use\n\n| Missing\
    \ signal | Impact |\n|----------------|--------|\n| Activation tensor sizes |\
    \ Determines true communication cost per hop |\n| I/O chiplet positions | Ignored\
    \ \u2192 long input/output traversals |\n| Previous layer\u2019s *partition map*\
    \ (which % on which chiplet) | Needed to align output\u2011channel splits across\
    \ layers |\n| Network congestion potential | Hotspots in mesh centre cause contention\
    \ |\n| Weight\u2011loading origin cost | Initial latency penalty if weights placed\
    \ far from source |\n| Adaptive routing path diversity | Could inform placement\
    \ to spread traffic |\n\n---\n\n## Proposed different optimisation strategy: \
    \ \n### Pipeline\u2011Aware, I/O\u2011Anchored Greedy Mapper with Split Minimisation\n\
    \nThis strategy directly addresses the root causes while remaining lightweight\
    \ and suitable for integration into the existing framework. It replaces the old\
    \ `_nearest_neighbor_mapper_v3` with a new function that:\n\n1. **Pre\u2011computes\
    \ the ideal number of chiplets** for each layer (weight size \xF7 per\u2011chiplet\
    \ capacity).  \n2. **Anchors the first layer** on the compute chiplet that is\
    \ adjacent to an I/O corner and has the most free capacity.  \n3. **For each subsequent\
    \ layer**, constructs a **preferred set** of chiplets:  \n   - the set previously\
    \ used by the preceding layer (weighted by allocation),  \n   - its direct mesh\
    \ neighbours, and  \n   - optionally 2\u2011hop neighbours if the layer cannot\
    \ fit.  \n4. Within this preferred set, it uses a **best\u2011fit decreasing bin\u2011\
    packing** to satisfy the layer\u2019s capacity requirement **using the fewest\
    \ possible chiplets**. If the set cannot accommodate the layer, it expands the\
    \ search radius gradually while still favouring compact rectangular shapes.  \n\
    5. **For the final layer(s)**, an extra bias is added towards chiplet positions\
    \ that are adjacent to any I/O corner, so that output activations encounter minimal\
    \ hop penalty.  \n6. **Occupancy balancing**: when multiple chiplet sets can serve\
    \ a layer equally well in terms of distance and count, the one with the lowest\
    \ average occupancy is preferred to naturally spread load.\n\n### Pseudocode for\
    \ the new mapper\n\n```python\ndef _pipeline_aware_mapper(self, layer_info, system,\
    \ preference, ...):\n    # 1. Pre\u2011compute layer\u2019s full weight requirements\
    \ on a single CMOS chiplet\n    full_units = self._calculate_layer_requirements(layer_info,\
    \ typical_cmos_chiplet)\n    \n    # 2. Determine chiplet\u2011count goal = ceil(full_units\
    \ / per_chiplet_capacity)\n    chiplet_cap = typical_cmos_chiplet.get_total_memory()\
