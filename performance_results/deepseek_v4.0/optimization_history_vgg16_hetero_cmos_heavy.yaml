- change_summary: "## Analysis of the Nearest\u2011Neighbor Mapper and Suggested Alternative\
    \ Strategy\n\nThe previous two optimization cycles failed to improve latency (707\u202F\
    \xB5s \u2192 297\u202F\xB5s, then unchanged). Those attempts focused on producer\u2011\
    aware placement, I/O bias, removal of the 10\u2011unit tolerance, and layer packing.\
    \ The lack of improvement suggests that the real bottleneck lies elsewhere. A\
    \ careful reading of the code and the CMOS\u2011only configuration points to **unnecessary\
    \ fragmentation across chiplets** as the dominant weakness.\n\n### 1. Key weaknesses\
    \ of the current nearest\u2011neighbor approach\n\n- **Indiscriminate layer splitting**\
    \  \n  The mapper fills the *nearest* available capacity chunk, even when the\
    \ entire layer could fit on a single, slightly more distant chiplet (capacity\
    \ 2.46\u202FM weights). Many VGG16 layers (all convs prior to FC\u20117, and even\
    \ some early FCs) are well within this limit. Splitting a layer across 3, 5, or\
    \ more chiplets turns an otherwise zero\u2011communication operation into an expensive\
    \ all\u2011to\u2011all activation transfer. With `comm_method: non-pipelined`,\
    \ this dramatically inflates latency.\n\n- **Fragmentation\u2011driven placement\
    \ dominates over communication cost**  \n  Because the algorithm always starts\
    \ from the chiplet with the largest share of the *previous* layer and then greedily\
    \ fills the nearest available capacity, later layers that could be placed compactly\
    \ are forced to spread widely. The primary decision criterion is *capacity*, not\
    \ *communication*. A far\u2011away chiplet with enough free weight memory to hold\
    \ the entire layer is never considered if nearer fragments exist\u2014even though\
    \ using that far chiplet would eliminate all inter\u2011chiplet communication\
    \ for that layer.\n\n- **All\u2011to\u2011all activation pattern inherent in the\
    \ partition model**  \n  The `LayerPartitioner` splits output channels proportionally,\
    \ creating a dense communication graph between the producer(s) of the previous\
    \ layer and the producer(s) of the current layer. Each producer must send part\
    \ of its output to every consumer. When a layer is split across *K* chiplets,\
    \ the number of logical flows becomes *(number of producers)\u202F\xD7\u202FK*.\
    \ This quickly saturates the Garnet mesh, especially with non\u2011pipelined messaging\
    \ and 8\u2011b activation / 128\u2011b packet encapsulation.\n\n- **Under\u2011\
    utilisation of per\u2011chiplet weight memory**  \n  With 2.46\u202FM weights\
    \ per chiplet, many chiplets end up holding only a tiny fraction of a layer\u2019\
    s weights, wasting the rest of the chiplet\u2019s capacity. This wastes the benefit\
    \ of weight\u2011stationary \u201Call\u2011at\u2011once\u201D loading: weights\
    \ are pre\u2011loaded anyway, so consolidating several small layers onto one chiplet\
    \ would add no extra runtime cost and would eliminate all inter\u2011layer activation\
    \ movement for those transitions.\n\n### 2. Specific opportunities for improvement\
    \ given this config\n\nThe configuration (96 homogeneous CMOS chiplets, 10\xD7\
    10 mesh, weight\u2011stationary, activation\u2011only inter\u2011chiplet traffic)\
    \ makes **communication avoidance** the paramount optimisation target. The most\
    \ impactful improvement is to **minimise the number of chiplets involved in each\
    \ layer transition**.\n\n- **Whole\u2011layer fitting with priority**  \n  Before\
    \ attempting any split, search globally for a chiplet that can host the *entire*\
    \ layer without fragmentation. Starting from the set of chiplets that already\
    \ hosted the previous layer (if small layers can be co\u2011located), select the\
    \ closest candidate with sufficient free weight memory. If none exists, fall back\
    \ to splitting, but still aim to use the **fewest possible chiplets** while keeping\
    \ them near the producer(s) of the previous layer.\n\n- **Consolidation of small\
    \ consecutive layers**  \n  Many VGG16 layers (Conv\u20111 through Conv\u2011\
    10, FC\u20116, FC\u20117) have \u2264 2\u202FM weights. Several consecutive small\
    \ layers can be stacked on the same chiplet, completely eliminating inter\u2011\
    layer communication for those transitions. Because weights are loaded `all_at_once`\
    \ before simulation, the additional weights add no runtime overhead.\n\n- **Replace\
    \ the \u201Cnearest fill\u201D allocation with a bucketed Poisson\u2011like placement**\
    \  \n  For layers that must be split, prefer a small, contiguous cluster of chiplets\
    \ near the producing chiplet(s), even if it means leaving some capacity unused\
    \ on closer (but too\u2011small) nodes. This can be implemented by sorting candidate\
    \ chiplets first by *distance to the nearest producer*, then by *capacity*, but\
    \ imposing a hard limit on the number of chiplets allowed (e.g., \u2264 4 for\
    \ a layer that would otherwise require 10).\n\n- **Avoid the 10\u2011unit under\u2011\
    allocation tolerance entirely** (already attempted, but must be retained in any\
    \ new strategy).\n\n### 3. What data/signals the mapper currently ignores that\
    \ it should use\n\n- **Total weight footprint of each layer** \u2013 The mapper\
    \ uses this only to check per\u2011chiplet capacity, never to decide whether a\
    \ single chiplet could hold the layer.\n- **Capacity needed for a whole layer\
    \ vs. partial** \u2013 The distinction between \u201Cthis layer *can* be whole\
    \ on one chiplet\u201D and \u201Cit must be split\u201D is completely absent from\
    \ the logic.\n- **Number of chiplets consumed per layer** \u2013 No penalty is\
    \ applied for high split count. A simple counter could serve as a secondary cost\
    \ to drive consolidation.\n- **Inter\u2011layer communication volume (activation\
    \ size)** \u2013 Multiplying hop distance by data volume would naturally favour\
    \ placing a layer on a single chiplet (0 communication cost) over many distant\
    \ chiplets.\n- **Presence of multiple small layers in succession** \u2013 A lightweight\
    \ look\u2011ahead could detect clusters of layers that together fit within one\
    \ chiplet, triggering a packing pass before committing the placement of the first\
    \ layer in the cluster.\n\n### Recommended Different Optimization Strategy\n\n\
    Instead of refining the producer\u2011aware distance heuristic (which did not\
    \ improve latency), implement a **\u201Cwhole\u2011layer\u2011first, minimal\u2011\
    split\u2011only\u201D** mapper:\n\n1. **Pre\u2011scan the workload** to identify\
    \ all layers whose total weight requirement \u2264 2.46\u202FM (the chiplet capacity).\
    \  \n2. **For each layer**, attempt to assign the entire layer to a single chiplet\
    \ that minimises a composite cost:\n   - Hop distance to the nearest *producer*\
    \ chiplet of the previous layer (weighted by producer\u2019s share).\n   - For\
    \ the first layer, use hop distance to the nearest I/O chiplet.\n   - Skip any\
    \ chiplet that does not have enough free capacity.\n3. If no single chiplet candidate\
    \ exists, **split the layer across the absolute minimum number of chiplets** (starting\
    \ with 2, then 3, etc.) that together can hold the full weight, selecting the\
    \ cluster with the lowest average hop distance to the producers.\n4. After placement,\
    \ **pack small consecutive layers** on already\u2011used chiplets if space permits,\
    \ to avoid future splits.\n5. Remove the 10\u2011unit tolerance and ensure 100%\
    \ allocation.\n\nThis strategy directly attacks the fragmentation that creates\
    \ excessive inter\u2011chiplet communication. Because each whole\u2011layer assignment\
    \ completely eliminates activation traffic for that layer, the total network utilisation\
    \ and latency should drop significantly\u2014something the previous producer\u2011\
    aware refinements could not achieve because they still ended up splitting many\
    \ moderate\u2011sized layers. Given the VGG16 workload, several large reductions\
    \ in communication volume are attainable, making this a genuinely different and\
    \ promising direction."
