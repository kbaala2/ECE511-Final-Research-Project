- change_summary: "### 1. Key weaknesses of the current nearest\u2011neighbor approach\n\
    \n- **Greedy, local decision ignores distributed outputs from the prior layer**\
    \  \n  The mapper picks the chiplet with the largest percentage of the **previous**\
    \ layer\u2019s computation as the starting point, then allocates the new layer\
    \ in order of increasing hop distance from that single chiplet. It completely\
    \ ignores the fact that the previous layer\u2019s output channels are themselves\
    \ scattered across multiple chiplets. Consequently, the communication cost between\
    \ the producers and the consumers of activation data is not minimized\u2014the\
    \ actual data movement will be high if the new layer\u2019s chiplets are far from\
    \ the bulk of the prior layer\u2019s outputs.\n\n- **Arbitrary tolerance of 10\
    \ resource units causes silent under\u2011allocation**  \n  After the allocation\
    \ loop, the mapper checks `if (resources_remaining - 10) > 0`. Any unplaced fraction\
    \ of the layer smaller than 10 units is ignored and the mapping is deemed successful.\
    \ This leaves the layer **incompletely partitioned** (the action percentages sum\
    \ to <100%) while the rest of the pipeline treats it as a valid mapping. The partitioned\
    \ sub\u2011layers will then under\u2011represent the actual computation, leading\
    \ to incorrect simulation results.\n\n- **First\u2011layer placement is deterministic\
    \ and ignores I/O proximity**  \n  For the very first layer, all CMOS compute\
    \ chiplets initially have identical free weight memory. The mapper sorts by free\
    \ memory (always equal) and then by the `performance`/`energy_efficiency` node\
    \ metric (identical in a homogeneous mesh). Ties break in favour of the lowest\
    \ chiplet ID, which happens to be a fixed compute chiplet. No bias is given to\
    \ the corner I/O chiplets where input data arrives, causing unnecessary long\u2011\
    distance data movement for the initial activations.\n\n- **No packing of multiple\
    \ layers on the same chiplet**  \n  Each layer is allocated freshly from the available\
    \ capacity, but the mapper makes no attempt to co\u2011locate small, consecutive\
    \ layers on the same chiplet. For example, many VGG16 layers have modest weight\
    \ footprints (\u226A2.46\u202FM). Placing subsequent layers on chiplets that already\
    \ host weights from earlier layers could both conserve weight memory and dramatically\
    \ reduce inter\u2011layer communication distance (since the weights are stationary\
    \ and activations only move between chiplets when layers are on different chiplets).\n\
    \n- **Greedy nearest\u2011first allocation creates resource fragmentation**  \n\
    \  By always filling the nearest available chiplet first, the mapper rapidly saturates\
    \ one region of the mesh. Large later layers that cannot be fully accommodated\
    \ in that region are pushed farther away, increasing communication distances for\
    \ all subsequent data exchanges. No look\u2011ahead considers the size of future\
    \ layers or attempts to balance capacity across the mesh.\n\n- **The \u201Cactive\
    \ metric\u201D is powerless in a homogeneous system**  \n  The `performance` and\
    \ `energy_efficiency` node attributes are used only as a tertiary sort key in\
    \ the first\u2011layer tie\u2011breaking. Since all compute chiplets are identical\
    \ CMOS devices, these values carry no useful information and serve no purpose\
    \ in mapping.\n\n### 2. Specific opportunities for improvement given this config\n\
    \nGiven the 10\xD710 mesh with 96 identical CMOS chiplets (weight\u2011stationary,\
    \ 2.46\u202FM weights each) and 4 corner I/O chiplets, the configuration strongly\
    \ favours **minimising activation communication during inference**. The following\
    \ improvements directly address the weaknesses above:\n\n- **Replace the single\u2011\
    chiplet starting\u2011point heuristic with a producer\u2011aware placement** \
    \ \n  Instead of starting from the chiplet with the largest percentage of the\
    \ previous layer, compute for each candidate chiplet the **weighted sum of distances**\
    \ to **all** chiplets that own a portion of the previous layer\u2019s output.\
    \ The weight can be the percentage of output channels held by that producer. Choose\
    \ the chiplet (or chiplet set) that minimises this aggregated cost, then allocate\
    \ the new layer around that region while still respecting capacity.\n\n- **Bias\
    \ the first layer toward an I/O chiplet**  \n  For the first layer, seed the mapping\
    \ near one of the corner I/O chiplets \u2013 e.g., by artificially adding a \u201C\
    virtual producer\u201D with a large weight near an I/O node, or by directly selecting\
    \ the compute chiplet(s) immediately adjacent to it. Similarly, bias the final\
    \ layer toward an I/O chiplet for output data.\n\n- **Introduce a capacity\u2011\
    aware packing step**  \n  After mapping a layer, check if the **next** layer\u2019\
    s weight footprint could fit on the same chiplet(s) being used. If so, reserve\
    \ the needed capacity immediately, thereby keeping consecutive layers on the same\
    \ physical die and eliminating inter\u2011layer communication for those activations.\
    \ This can be done as a local post\u2011processing step or integrated into the\
    \ allocation loop.\n\n- **Eliminate the 10\u2011unit tolerance and ensure 100%\
    \ partitioning**  \n  If at the end of the allocation loop `resources_remaining\
    \ > 0`, re\u2011distribute the remainder across the already\u2011allocated chiplets\
    \ (proportionally to their current shares) or attempt to place it on a new chiplet.\
    \ This guarantees the layer\u2019s action percentages sum to exactly 100, and\
    \ the partitioner will produce the correct total number of output channels.\n\n\
    - **Use a global optimisation pass**  \n  The mesh is large enough to warrant\
    \ a lightweight global search, e.g., a greedy algorithm that simultaneously considers\
    \ all layers and their inter\u2011dependencies, or a simulated\u2011annealing\
    \ approach that perturbs layer placements to jointly minimise total weighted hop\u2011\
    count while respecting capacity. This would avoid the fragmentation and distant\
    \ placement that the current per\u2011layer greedy method suffers from.\n\n- **Leverage\
    \ shortest\u2011path data already available**  \n  The mapper precomputes all\u2011\
    pairs shortest path lengths. These can be used directly to evaluate the true communication\
    \ cost of any proposed mapping, both for inter\u2011layer activation routing and\
    \ for weight loading (though weight loading is one\u2011time). A cost function\
    \ that multiplies hop distance by data volume per connection would give a far\
    \ more accurate picture than only comparing hop counts.\n\n### 3. What data /\
    \ signals the mapper currently ignores that it should use\n\n- **Distribution\
    \ of the previous layer\u2019s output across chiplets**  \n  The `layer_mappings`\
    \ list holds the exact per\u2011chiplet percentages for every previously mapped\
    \ layer. The current mapper only inspects the maximum percentage chiplet. The\
    \ **full vector of (chiplet_id, percentage)** for the last layer should be used\
    \ to calculate true communication distances, weighting each producer by the amount\
    \ of data it will send.\n\n- **Activation data volume**  \n  Each layer has an\
    \ input activation size (e.g., `input_activation` in the layer info) and an output\
    \ activation size. After partitioning, the amount of data that must flow from\
    \ each producer partition to each consumer partition depends on the percentage\
    \ splits and the total output dimensions. This volume should multiply the hop\
    \ distance in the cost function, because a long hop carrying 1000 activations\
    \ is much worse than a long hop carrying 10.\n\n- **I/O chiplet locations**  \n\
    \  The corner I/O chiplets are known but never used in placement decisions. The\
    \ mapper should treat them as fixed sources (for the first layer) and sinks (for\
    \ the last layer) and penalise large distances to those nodes for the boundary\
    \ layers.\n\n- **Future layer sizes (weight footprint)**  \n  The workload file\
    \ (`workload_vgg16.csv`) and model definitions provide the total weight count\
    \ of every layer. The mapper could scan ahead and note upcoming large layers,\
    \ then avoid filling capacity in the region where a large later layer would otherwise\
    \ be forced to spread far. This could be done by estimating the capacity needed\
    \ and reserving a contiguous zone.\n\n- **Residual connections / skip layers (if\
    \ any)**  \n  For networks with branches, the data dependencies go beyond the\
    \ immediate predecessor. While VGG16 is purely sequential, the mapper never consults\
    \ the model graph. A more general approach would build an inter\u2011layer dependency\
    \ graph and use it to place layers that feed into the same subsequent layer closer\
    \ together.\n\n- **Weight\u2011memory utilisation balance**  \n  While the mapper\
    \ tracks remaining capacity, it does not use the **percentage of memory filled**\
    \ per chiplet beyond a tie\u2011breaker. Actively balancing utilisation (e.g.,\
    \ preferring chips with a lower fill ratio) could prevent early saturation of\
    \ some regions and keep options open for later layers.\n\n- **Network congestion\
    \ or bandwidth (for future extension)**  \n  In the current config it is not simulated\
    \ in the mapper, but the CHIPSIM framework supports `enable_comm_cache` and `Garnet`\
    \ simulation. Even a simple approximation like link bandwidth could be incorporated\
    \ into the cost to avoid creating hotspots in the mesh that would later cause\
    \ contention."
