- change_summary: "## 1. Key Weaknesses of the Current Nearest-Neighbor Approach\n\
    \n**A. Myopic Producer Selection**\nThe mapper selects the single chiplet with\
    \ the highest percentage of the previous layer's computation as the starting point\
    \ (`last_chiplet`), then expands outward. This ignores that the previous layer's\
    \ output is scattered across multiple chiplets, causing data movements from distant\
    \ producers to nearby consumers.\n\n**B. Unchecked Resource Under-allocation**\n\
    The tolerance `if (resources_remaining - 10) > 0` silently allows up to 10 weight\
    \ units (or crossbars) to remain unplaced. This means layers can be mapped to\
    \ less than 100% of their required resources, producing corrupted partitioned\
    \ sub-layers and incorrect simulation.\n\n**C. Blind First-Layer Placement**\n\
    With 96 identical CMOS chiplets starting with equal free memory, tie-breaking\
    \ falls to chiplet ID order. This places the first layer at chiplet 1, far from\
    \ any corner I/O chiplet, adding unnecessary hop-distance for the initial activation\
    \ load.\n\n**D. No Inter-Layer Co-location**\nSuccessive layers are mapped independently,\
    \ failing to recognize that small consecutive layers (abundant in VGG16) could\
    \ share the same chiplets, eliminating inter-layer activation communication entirely.\n\
    \n**E. Fragmentation via Greedy Nearest-First Allocation**\nThe strategy saturates\
    \ the region nearest to the first layer, pushing later, larger layers to distant\
    \ chiplets and inflating communication distances across the entire pipeline.\n\
    \n**F. Irrelevant \"Active Metric\"**\nThe `performance`/`energy_efficiency` node\
    \ attributes are uniform across homogeneous CMOS chiplets, serving as a useless\
    \ tie-breaker with no impact on quality.\n\n## 2. Specific Opportunities for Improvement\
    \ Given This Configuration\n\n- **Producer-Centric Placement:** Replace the single-chiplet\
    \ starting-point with a cost function that sums distances to all producer chiplets\
    \ from the prior layer, weighted by their output percentages. Minimize this aggregated\
    \ communication cost when selecting seeds for the new layer.\n\n- **I/O-Aware\
    \ Boundary Layer Placement:** Bias the first layer to compute chiplets adjacent\
    \ to I/O corners (e.g., chiplets 2, 11, 92, 99) by adding a virtual \"I/O producer\"\
    \ with high weight. Mirror this for the final layer.\n\n- **Layer Packing Pass:**\
    \ After mapping a layer, inspect the next layer's weight footprint. If it fits\
    \ in the same chiplet(s), reserve capacity immediately, keeping consecutive layers\
    \ co-located and avoiding inter-layer activation routing.\n\n- **Remove 10-Unit\
    \ Tolerance:** Redistribute any remaining `resources_remaining` proportionally\
    \ among already-allocated chiplets, ensuring 100% layer partitioning and accurate\
    \ simulation results.\n\n- **Lightweight Global Optimization:** Use a two-phase\
    \ approach: (1) greedy initial placement with producer-awareness, then (2) a local\
    \ search (e.g., simulated annealing or pairwise swapping) to reduce total weighted\
    \ hop-counts across layer transitions while honoring capacity constraints.\n\n\
    - **Volume-Weighted Hop-Cost:** Multiply hop distances by the data volume (input\
    \ activation size) to penalize long routes for large tensors more than short routes\
    \ for small tensors.\n\n## 3. What Data/Signals the Mapper Currently Ignores That\
    \ It Should Use\n\n- **Full Producer Distribution (`layer_mappings`)**: Only the\
    \ maximum percentage chiplet is used; the complete vector of (chiplet_id, percentage)\
    \ for the prior layer is ignored, preventing true communication-aware placement.\n\
    \n- **Activation Data Volume**: No input/output activation sizes enter the placement\
    \ cost function, treating all data transfers as equally expensive regardless of\
    \ tensor size.\n\n- **I/O Chiplet Coordinates**: Fixed corner locations are never\
    \ considered as data sources/sinks for boundary layers.\n\n- **Future Layer Weights**:\
    \ The workload file contains all layer sizes upfront; scanning ahead to reserve\
    \ capacity for large layers would prevent fragmentation.\n\n- **Weight Memory\
    \ Fill Ratio**: While computed (`occupancy_percentages`), it is only used for\
    \ tie-breaking in the first layer, not for ongoing load-balancing.\n\n- **Inter-Layer\
    \ Dependency Graph**: For purely sequential VGG16 this is trivial, but the mapper\
    \ ignores even the immediate predecessor's full distribution, missing the simplest\
    \ dependency information.\n\n### Recommended Optimization Strategy\n\nFor the\
    \ next iteration, implement a **producer-weighted cost function** that seeds each\
    \ layer by evaluating all candidate chiplets against the full prior-layer distribution:\n\
    \n```python\ndef _producer_weighted_cost(candidate_chiplet, prev_layer_mapping,\
    \ shortest_paths):\n    cost = 0\n    for prev_chiplet_id, prev_pct in prev_layer_mapping:\n\
    \        distance = shortest_paths[prev_chiplet_id].get(candidate_chiplet, float('inf'))\n\
    \        cost += distance * prev_pct\n    return cost\n```\n\nSelect the chiplet\
    \ minimizing this cost, then allocate using nearest-neighbor from that seed. Additionally:\n\
    - Force first layer to chiplet adjacent to I/O chiplet 1 (e.g., chiplet 2 on a\
    \ 10x10 mesh).\n- Remove the 10-unit tolerance entirely.\n- Add a post-allocation\
    \ peephole optimization that merges small consecutive layers onto shared chiplets\
    \ when capacity permits."
