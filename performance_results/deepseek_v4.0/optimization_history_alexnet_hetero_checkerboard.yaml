- change_summary: "### A Different Optimization Strategy: **Congestion-Aware Global\
    \ Placement via Simulated Annealing**\n\nThe current `_nearest_neighbor_mapper_v3`\
    \ greedily places each layer one after another, using only the previous layer\u2019\
    s dominant chiplet as an anchor. The previous optimization attempt (Iteration\
    \ 1) likely tried to refine this greedy logic\u2014e.g., better anchor selection,\
    \ IO proximity, or traffic weighting\u2014as suggested by the analysis. While\
    \ those are helpful, they **remain local**, and the mapping of earlier layers\
    \ can paint later layers into a corner, causing avoidable global congestion.\n\
    \nA radically different approach is to **globally optimize the placement of all\
    \ layers simultaneously**, directly targeting the expected inter\u2011layer communication\
    \ latency. This can be done via **simulated annealing over a cost function that\
    \ captures hop\u2011distance, activation volume, and link load**, while respecting\
    \ chiplet weight capacities.\n\n---\n\n### Why This Matters for the Given Configuration\n\
    \n- **Weight\u2011stationary, non\u2011pipelined, all\u2011at\u2011once weight\
    \ loading** \u2013 Communication is dominated by activation transfers between\
    \ layers. A global view can minimize the total weighted communication distance\
    \ better than a greedy chain.\n- **96 CMOS chiplets on a 10\xD710 mesh, IO at\
    \ corners** \u2013 The network has enough dimensions to create alternative paths;\
    \ a global optimizer can spread layers to avoid hot spots, balancing load across\
    \ the mesh.\n- **Blocking age threshold = 10** \u2013 If too many activations\
    \ stall on a link, performance degrades sharply. Reducing peak link congestions\
    \ is critical.\n- **The mapper already uses precomputed shortest\u2011path lengths**\
    \ \u2013 This can be reused inside a fast cost evaluation loop.\n\n---\n\n###\
    \ Proposed Strategy: Layer\u2011Wise Simulated Annealing with Congestion Cost\n\
    \n1. **Represent the mapping as a set of assignments:** For each layer `l`, a\
    \ list of (chiplet, fraction_of_layer_weight) pairs that respect capacity. A state\
    \ is an allocation of weight units for all layers.\n\n2. **Cost function:**\n\
    \   ```\n   Cost = \u03A3_(l\u2192l+1) \u03A3_{s\u2208source(l)} \u03A3_{t\u2208\
    dest(l+1)} act_volume(l) \xB7 \u03C9(s) \xB7 \u03B4(s,t)\n          + \u03BB \xB7\
    \ \u03A3_{links} max(0, link_load \u2013 bandwidth)^2\n   ```\n   - `act_volume(l)`\
    \ = total activation size (output channels \xD7 spatial size) of layer `l`, scaled\
    \ proportional to the fraction of layer `l` on source chiplet `s`.  \n   - `\u03C9\
    (s)` = fraction of layer `l`\u2019s weights placed on chiplet `s`.  \n   - `\u03B4\
    (s,t)` = Manhattan distance between chiplets (or edge weights, if any).  \n  \
    \ - The first term approximates average unicast traffic (since weight-stationary\
    \ means each receiver chiplet needs all outputs from each source chiplet, which\
    \ can be multicast, but a unicast sum penalizes distance appropriately).  \n \
    \  - The link load term penalizes any link whose expected total traffic exceeds\
    \ a fraction of link bandwidth, reducing tail latency from blocking.  \n   - `\u03BB\
    ` balances the two terms (tuned empirically).\n\n3. **Initial solution:** Use\
    \ the greedy `_nearest_neighbor_mapper_v3` to create a valid mapping (ensuring\
    \ feasibility). Then run simulated annealing to improve.\n\n4. **Annealing moves:**\n\
    \   - **Re\u2011allocate weight capacity:** Shift a small fraction of a layer\u2019\
    s weights from one chiplet to another that has free space, while maintaining capacity\
    \ constraints.\n   - **Swap two layers\u2019 partial assignments** on two chiplets\
    \ (if both fit).\n   - **Re\u2011anchor an entire layer cluster:** Choose a new\
    \ \u201Cseed\u201D chiplet for a layer and re\u2011distribute its weights among\
    \ its nearest neighbours (capacity\u2011permitting) using a mini\u2011version\
    \ of the greedy procedure, but with a global cost check.\n\n5. **Temperature schedule:**\
    \ Fast-paced, e.g., geometric cooling over ~10,000 evaluations, since the problem\
    \ space is moderate (number of layers in AlexNet is ~10\u201120, each may split\
    \ across 2\u201110 chiplets).\n\n6. **Post-annealing refinement:** After placement,\
    \ use the existing `LayerPartitioner` to split output channels proportionally.\n\
    \n---\n\n### How This Differs from Previous Iteration\n\n| Previous Greedy Improvements\
    \ | Proposed Global SA Approach |\n|---|---|\n| Local, layer\u2011by\u2011layer\
    \ decisions | Simultaneous optimization of all layers |\n| Anchor selection based\
    \ on previous layer or IO | Cost function directly models full inter\u2011layer\
    \ traffic matrix |\n| No explicit congestion avoidance (just distance) | Includes\
    \ link overload penalty to prevent hot spots |\n| Capacity utilization is greedy\
    \ \u2013 no \u201Cswap\u201D of earlier assignments | SA can re\u2011balance earlier\
    \ layers if it helps later layers |\n| No global view of communication cost |\
    \ The cost function evaluates end\u2011to\u2011end weighted distance sums |\n\n\
    The previous iteration likely refined the greedy heuristic (e.g., modified anchor\
    \ choice or added a fallback). The SA approach is a paradigm shift \u2013 it uses\
    \ the greedy mapping only as a starting point and then systematically explores\
    \ the space, allowing the mapper to escape local minima that the greedy approach\
    \ inevitably falls into.\n\n---\n\n### Integration into the Existing Mapper\n\n\
    The `ModelMapper` class can be extended with a new method `_sim_annealing_mapper`.\
    \ It would:\n\n1. Call `_nearest_neighbor_mapper_v3` sequentially for all layers\
    \ to obtain an initial feasible assignment (storing chiplet\u2011percentage actions\
    \ for each layer).\n2. Compute the initial cost.\n3. Run a loop with the moves\
    \ described, evaluating the cost efficiently using the pre\u2011computed `shortest_paths`\
    \ and a quick link\u2011load accumulator.\n4. Return the final mapping and capacity\
    \ usage.\n\nBecause SA is offline (only run once per model), the runtime overhead\
    \ is acceptable. The algorithm is probabilistic and can be repeated with different\
    \ seeds; the best result across a few runs (e.g., 5) can be selected.\n\n---\n\
    \n### Expected Impact\n\n- **Latency reduction:** By minimizing the product of\
    \ activation size and distance across the whole network, the average and tail\
    \ communication latency drops significantly. The congestion penalty further reduces\
    \ blocking stalls.\n- **Better IO utilization:** The global cost can naturally\
    \ bias early and final layers toward corners if we add an extra term penalizing\
    \ distance to nearest IO for first/last layers.\n- **Robustness:** The SA approach\
    \ is less likely to fail with `INSUFFICIENT_MEMORY` because it can re\u2011distribute\
    \ earlier allocations to free space near a critical region, unlike the greedy\
    \ mapper that aborts.\n\nThis strategy directly targets the structural weaknesses\
    \ of the greedy approach while remaining compatible with the existing chiplet\
    \ capacity model and partitioner. It should yield a notably different\u2014and\
    \ likely superior\u2014placement than any purely local refinement."
