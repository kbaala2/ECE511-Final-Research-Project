- change_summary: "## 1. Key Weaknesses of the Current Nearest-Neighbor Approach\n\
    \n### 1.1 Greedy Layer\u2011by\u2011Layer Anchoring Ignores Global Traffic\nThe\
    \ mapper selects a **single anchor chiplet** for each layer \u2013 either the\
    \ one with the largest share of the previous layer, or the one with the most free\
    \ memory for the first layer. It sorts available chiplets by hop distance from\
    \ that anchor and fills them in order. This entirely overlooks:\n\n- **All source\
    \ chiplets that produced the previous layer\u2019s outputs.** Only the \u201C\
    dominant\u201D chiplet matters; the other partitions are invisible.\n- **Activation\
    \ data volume** \u2013 the product of output size and the fractions of the previous\
    \ layer on each source \u2013 is not used to compute communication cost.\n- **Fan\u2011\
    out / fan\u2011in structures.** If layer *L* is spread across 10 chiplets, the\
    \ true communication burden is the sum of distances from all those chiplets to\
    \ every candidate for layer *L+1*, weighted by data size. The current heuristic\
    \ ignores this.\n\n*Consequence:* Layers may be placed in a way that keeps hop\
    \ counts low from an arbitrary single point but creates a high total communication\
    \ load and network hot spots.\n\n### 1.2 Greedy Filling Creates Dense Clusters\
    \ and Self\u2011Reinforcing Hot Spots\nBecause each layer\u2019s allocation starts\
    \ at the previous layer\u2019s dominant chiplet and spreads outward, subsequent\
    \ layers tend to **stack weight capacity in the same neighbourhood**. This:\n\n\
    - Leads to **unbalanced memory utilisation** across the mesh.\n- Causes **communication\
    \ congestion** during inference, as many chiplets compete for the same inter\u2011\
    chiplet links.\n- Exacerbates blocking (recall `blocking_age_threshold = 10`),\
    \ because a concentrated placement forces most traffic through a small set of\
    \ links.\n\n### 1.3 IO Chiplets Are Completely Ignored\nThe system has four dedicated\
    \ IO chiplets at the corners of the 10\xD710 mesh. Input activations must enter\
    \ from an IO chiplet, and final outputs must exit through one. The mapper does\
    \ not:\n\n- Bias the **first layer** toward a corner to minimise input activation\
    \ travel.\n- Bias the **last layer** toward a corner to minimise output travel.\n\
    - Account for the extra latency of weight loading from off\u2011chip memory to\
    \ far\u2011away chiplets (all weights are loaded at once before inference).\n\n\
    The current algorithm simply picks the first layer\u2019s starting chiplet based\
    \ on free memory and a generic network metric, regardless of its distance to the\
    \ nearest IO.\n\n### 1.4 No Attempt to Co\u2011locate Consecutive Layers on the\
    \ Same Chiplet\nIn weight\u2011stationary mode, multiple layers\u2019 weights\
    \ can reside on the same chiplet. If two consecutive layers fit on a single chiplet\
    \ (or a small, tightly connected cluster), the intermediate activation traffic\
    \ stays **on\u2011chip**, eliminating external communication. The mapper never\
    \ **reserves** capacity on the previous layer\u2019s chiplet(s) for the next layer,\
    \ nor does it actively try to keep a layer chain local. It merely uses the previous\
    \ dominant chiplet as the sorting anchor, and if that chiplet has no room, it\
    \ immediately spills to neighbours.\n\n### 1.5 Brittle Failure Handling \u2013\
    \ No Fallback or Re\u2011balancing\nIf a layer cannot place all its weights in\
    \ the available capacity, the entire mapping **fails immediately** (`INSUFFICIENT_MEMORY`).\
    \ There is no attempt to:\n\n- Relax the distance ordering (e.g., use chiplets\
    \ further away but with enough capacity).\n- Re\u2011visit earlier assignments\
    \ to free space near the needed region.\n- Split layers more aggressively or in\
    \ a different pattern.\n\nThis brittleness is particularly harmful when chiplet\
    \ capacity is tight \u2013 which is exactly the case with 96 CMOS chiplets each\
    \ holding only 2.46 M weights.\n\n### 1.6 Oversimplified Resource Model for CMOS\n\
    `_calculate_layer_requirements` returns the **total number of weights** of the\
    \ layer, which is correct for CMOS weight\u2011storage capacity. However, it does\
    \ **not** consider that when a layer is split across many chiplets, each chiplet\
    \ only stores the weights of the **output channels assigned to it**, so the per\u2011\
    chiplet requirement is truly fractional. The mapper currently computes `units_needed_full`\
    \ as the full layer\u2019s weight count for each chiplet, then prorates. This\
    \ over\u2011estimates the per\u2011chiplet consumption when a single chiplet only\
    \ takes a small percentage of the layer. While it works in practice because the\
    \ algorithm always aims to put the full remaining resources on a single chiplet\
    \ if possible (due to sorting by distance and then free memory), it **obscures\
    \ the fact that a layer could be split more finely** to balance memory usage.\
    \ A more accurate model would directly compute the weight count for the given\
    \ percentage of output channels, potentially enabling smarter packing.\n\n---\n\
    \n## 2. Specific Opportunities for Improvement Given This Config\n\n### 2.1 IO\u2011\
    Aware Placement for Boundary Layers\n- For the **first layer**, force the anchor\
    \ to be the chiplet **closest to any IO chiplet** with the largest free capacity.\n\
    - For the **last layer**, do the same.\n- Even better: add a small distance\u2011\
    to\u2011IO penalty term in the chiplet ranking for all layers, gradually decreasing\
    \ the weight for intermediate layers, to gently coax the mapping towards the corners\
    \ without harming later\u2011layer locality.\n\n### 2.2 Traffic\u2011Weighted\
    \ Anchor Selection\nReplace the single\u2011anchor heuristic with a **complete\
    \ source\u2011weighted distance cost**:\n\n- For each candidate chiplet *c* for\
    \ layer *L+1*, compute:\n  \\[\n  \\text{cost}(c) = \\sum_{s \\in \\text{sources}(L)}\
    \ \\omega_s(L) \\times d(s,c)\n  \\]\n  where \\(\\omega_s(L)\\) is the fraction\
    \ of layer *L*\u2019s output channels produced by chiplet *s*, and \\(d(s,c)\\\
    ) is the shortest path hop count.\n- Sort candidates by this cost, then by free\
    \ memory.\n\nThis directly minimises the expected per\u2011activation routing\
    \ cost and accounts for **all** producing chiplets, not just the largest one.\n\
    \n### 2.3 Capacity Reservation for Intra\u2011Chiplet Pipelines\nBefore placing\
    \ layer *L+1*:\n\n- Compute the total weight requirement for *L+1*.\n- Check if\
    \ the chiplet(s) that hold *L* have enough **remaining** capacity to host the\
    \ entire *L+1*.\n- If yes, **pre\u2011allocate** that capacity (temporarily block\
    \ it) so that the greedy procedure naturally fills those same chiplets for *L+1*,\
    \ keeping the communication entirely on\u2011chip.\n- If only partial fit, pre\u2011\
    allocate as much as possible and then let the remaining weight ratio flow to adjacent\
    \ chiplets \u2013 still better than no reservation.\n\n### 2.4 Load Balancing\
    \ by Occupancy Penalty\nThe mapper already computes `occupancy_percentages` but\
    \ only uses them indirectly (preferring more free memory). Incorporate a **soft\
    \ penalty** into the sorting key:\n\n- Sort order: `(distance, -free_memory_after_penalty,\
    \ -metric_value)`, where `free_memory_after_penalty = free_memory \xD7 (1 \u2013\
    \ \u03B1 \xD7 occupancy/100)`.\n- This discourages piling more weight onto already\
    \ heavily\u2011loaded chiplets, spreading the memory and compute load more evenly\
    \ across the mesh and reducing hot spots.\n\n### 2.5 Graceful Degradation on Capacity\
    \ Shortage\nInstead of instantly declaring failure:\n\n- If the first pass (distance\u2011\
    ordered) fails, retry with **only available capacity** ordering (largest free\
    \ space first), sacrificing some locality to achieve successful placement.\n-\
    \ If even that fails, try to **re\u2011pack earlier layers** in a restricted region\
    \ to free up the needed capacity near the anchor, using a bounded backtracking\
    \ search.\n\n### 2.6 Accurate Per\u2011Chiplet Weight Requirement for Partial\
    \ Splits\nModify `_calculate_layer_requirements` to accept the **percentage of\
    \ the layer** to be placed on a chiplet, and return the actual number of weights\
    \ corresponding to that fraction of output channels. This would prevent the over\u2011\
    reservation when a layer is split across many chiplets and enable more precise\
    \ capacity packing.\n\n---\n\n## 3. Data/Signals Currently Ignored but Should\
    \ Be Used\n\n| Signal / Data                         | Importance            \
    \                                                                            \
    \              | How to Use                                                  \
    \                                                                            \
    \               |\n|---------------------------------------|-----------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------|\n\
    | **Activation tensor sizes** per layer | Dominant factor in inter\u2011layer\
    \ communication volume.                                                      \
    \      | Multiply each source\u2019s distance by its fraction of output channels\
    \ \xD7 total activation volume when computing cost (Section 2.2).            \
    \             |\n| **Full source chiplet distribution** of previous layer | Tells\
    \ **all** chiplets that send data to the next layer, not just the \u201Cdominant\u201D\
    \ one.                      | Implement the weighted\u2011cost anchor selection\
    \ described above.                                                           \
    \                                |\n| **IO chiplet coordinates & usage**    |\
    \ Inputs and outputs must traverse the network via these chiplets; initial weight\
    \ load also originates from them. | Bias first and last layer placement toward\
    \ corners; add a distance\u2011to\u2011nearest\u2011IO term in the ranking of\
    \ all chiplets.                                    |\n| **Current per\u2011chiplet\
    \ occupancy** (already computed) | Shows which chiplets are most heavily utilised;\
    \ heavy usage can lead to memory/thermal hot spots.               | Apply occupancy\
    \ penalty in sorting key to spread load (Section 2.4).                       \
    \                                                             |\n| **Link bandwidth\
    \ & potential contention** | Hop count does not capture the effect of many flows\
    \ sharing a link; blocking is a major latency source.    | Model expected link\
    \ load (sum of activation volumes crossing each link) and penalise mappings that\
    \ exceed a fraction of bandwidth (as in SA approach below). |\n| **Layer dependency\
    \ graph beyond immediate neighbour** | Foresight can prevent \u201Cpainting into\
    \ a corner\u201D where a future layer cannot be placed near its predecessor. \
    \   | Use a one\u2011pass forward\u2011looking heuristic to pre\u2011allocate\
    \ capacity for the next layer or maintain a \u201Cslack\u201D of reserved space\
    \ around active regions.      |\n| **Weight loading cost from IO**      | In `all_at_once`\
    \ mode, initial weight loading latency can be non\u2011trivial if many weights\
    \ are placed far from IO. | Place layers that are loaded early in the sequence\
    \ (especially the first layer) closer to IO chiplets; extend to other layers if\
    \ loading order is known. |\n| **Chiplet compute capability heterogeneity** |\
    \ In CMOS, all are identical here, but future designs may differ.            \
    \                                  | Use compute power as a tie\u2011breaker or\
    \ capacity multiplier for heterogeneous systems.                             \
    \                                        |\n\n*Note: The mapper already computes\
    \ `avail_memory_list` and `occupancy_percentages` but only uses them to rank by\
    \ free memory; it does not penalise high occupancy explicitly.*\n\n---\n\n## Additional:\
    \ A Fundamentally Different Approach \u2013 Congestion\u2011Aware Global Placement\
    \ via Simulated Annealing\n\nGiven the previous attempts focused on refining the\
    \ greedy heuristic, a **paradigm shift** to a global optimisation method can yield\
    \ much larger gains. The proposal is to use **simulated annealing (SA)** that\
    \ directly minimises a cost function capturing:\n\n- Total weighted communication\
    \ distance (activation volume \xD7 hop count) between all consecutive layers.\n\
    - A penalty for link over\u2011subscription, to prevent network blocking.\n- Optional\
    \ IO\u2011proximity bias.\n\nThe SA framework:\n\n- **Initial solution:** The\
    \ current greedy `_nearest_neighbor_mapper_v3` result.\n- **State representation:**\
    \ For each layer, a list of (chiplet, percentage\u2011of\u2011layer\u2011weights)\
    \ pairs respecting weight capacity.\n- **Moves:**\n  - Shift a small weight fraction\
    \ from one chiplet to another (if space exists).\n  - Swap the chiplet assignments\
    \ of two layers\u2019 weight fragments.\n  - Re\u2011anchor an entire layer by\
    \ selecting a new seed chiplet and re\u2011distributing weights among its nearest\
    \ neighbours (capacity\u2011permitting).\n- **Cost function:**  \n  \\[\n  C =\
    \ \\sum_{l \\to l+1} \\sum_{s \\in S_l} \\sum_{t \\in T_{l+1}} A_l \\cdot \\omega_s\
    \ \\cdot \\phi_t \\cdot d(s,t) \\;+\\; \\lambda \\sum_{\\text{links}} \\max(0,\
    \ u_{\\text{link}} \u2013 B)^2\n  \\]\n  where \\(A_l\\) is activation volume,\
    \ \\(\\omega_s\\) and \\(\\phi_t\\) are weight fractions, \\(d(s,t)\\) is hop\
    \ distance, \\(u_{\\text{link}}\\) is estimated link traffic, \\(B\\) is a bandwidth\
    \ threshold, and \\(\\lambda\\) balances the two terms.\n- **Cooling schedule:**\
    \ Geometric cooling over several thousand iterations, which is feasible because\
    \ the problem size (AlexNet ~ 8\u201110 layers) is modest.\n\nThis SA approach\
    \ breaks the local minimum trap of greedy placement, directly addresses link congestion\
    \ (the cause of blocking), and naturally balances memory and communication across\
    \ the entire mesh. It can be implemented as a new mapper function (`_sim_annealing_mapper`)\
    \ within the existing `ModelMapper` class, reusing the precomputed shortest paths\
    \ and capacity bookkeeping. Multiple random\u2011seed runs can be performed, and\
    \ the best result selected.\n\nSuch a global optimisation is expected to significantly\
    \ reduce both average and tail communication latency, improve utilisation of the\
    \ 96\u2011chiplet array, and robustly handle capacity\u2011tight mappings that\
    \ would fail under the greedy approach."
