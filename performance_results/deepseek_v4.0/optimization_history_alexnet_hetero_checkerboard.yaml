- change_summary: "## 1. Key Weaknesses of the Current Nearest-Neighbor Approach\n\
    \n### 1.1 Blindness to Inter-Layer Communication Patterns\nThe mapper uses only\
    \ the *single chiplet* that held the largest fraction of the previous layer as\
    \ the anchor for the next layer. It ignores:\n- The full set of source chiplets\
    \ that produced the previous layer\u2019s outputs.\n- The **volume of activation\
    \ data** that must be transferred between the source partitions and the new layer\u2019\
    s partitions.\n- The **fan\u2011in/fan\u2011out** structure: if the previous layer\
    \ is split over many chiplets, the communication cost is dominated by the sum\
    \ of distances from all those chiplets to the new ones, not just from the \u201C\
    dominant\u201D chiplet.\n\n**Consequence:** Layers may be placed in a way that\
    \ minimises hops from an arbitrary anchor, but creates large total communication\
    \ load or causes network hotspots because many activations must travel from scattered\
    \ sources to a concentrated destination.\n\n### 1.2 Greedy Filling Creates Local\
    \ Hotspots\nThe algorithm sorts available chiplets by distance from the anchor,\
    \ then by free capacity, and fills them sequentially. This tends to cluster the\
    \ weight allocations of a layer around the anchor.\n- Later layers will again\
    \ start from the previous largest chiplet, perpetuating a dense cluster in one\
    \ region of the mesh.\n- The weight\u2011stationary compute model means that,\
    \ during inference, all chiplets holding parts of a layer compute in parallel\
    \ and exchange partial sums. A dense cluster forces all that communication through\
    \ a small set of inter\u2011chiplet links, increasing congestion and latency.\n\
    - There is **no cost term for link contention** or for balancing load across the\
    \ mesh.\n\n### 1.3 IO Chiplet Locations Are Ignored\nThe system has four IO chiplets\
    \ at the corners of the 10\xD710 mesh. The mapper:\n- Chooses the first layer\u2019\
    s starting chiplet solely by available memory and a generic \u201Cmetric\u201D\
    , **without considering distance to the nearest IO chiplet**.\n- Does not bias\
    \ the final layer\u2019s placement toward IO.\n\n**Result:** Input activations\
    \ may have to traverse many hops from a corner IO to an interior chiplet, and\
    \ output data may travel equally far, hurting both latency and energy.\n\n###\
    \ 1.4 No Attempt to Co-locate Consecutive Layers on the Same Chiplet\nIn weight\u2011\
    stationary mode, a chiplet can hold weights for multiple layers. If two consecutive\
    \ layers fit in the same chiplet (or a small cluster), **all intermediate activations\
    \ stay on\u2011chip**, eliminating external communication.\n- The current mapper\
    \ may use the previous layer\u2019s max chiplet as an anchor, but it does **not**\
    \ reserve space there for the next layer; if capacity is insufficient it immediately\
    \ spills to neighbours.\n- No explicit preference for keeping lightweight layer\
    \ chains within a single chiplet is present.\n\n### 1.5 Failure\u2011Only Backtracking\
    \ \u2013 No Fallback Heuristic\nIf a layer cannot be placed with the current capacity,\
    \ the entire mapping fails (`INSUFFICIENT_MEMORY`). There is no attempt to:\n\
    - Relax the distance ordering (e.g., use next\u2011nearest chiplets that may have\
    \ more room).\n- Re\u2011balance earlier placements to free capacity closer to\
    \ the anchor.\n\nThis brittleness is problematic for large models that push the\
    \ chiplet memory limits.\n\n### 1.6 Over\u2011Simplified Resource Modelling for\
    \ CMOS\n`_calculate_layer_requirements` returns the **total number of weights**\
    \ for the layer, which is correct for CMOS weight storage. However, it does not\
    \ account for:\n- The fact that weights are 8\u2011bit, and the chiplet capacity\
    \ is in units of weights; that is captured.\n- But it does **not** consider **weight\
    \ duplication** when a layer is split across many chiplets: each chiplet needs\
    \ the full set of input weights or a portion of the weights? In CMOS weight\u2011\
    stationary mode, a filter\u2019s weights are only stored where that filter\u2019\
    s output channel is computed; no duplication is needed, so the model is correct.\
    \ Still, there is no optimisation for minimising the number of chiplets used per\
    \ layer (which would reduce communication), beyond the nearest\u2011neighbour\
    \ sorting that naturally fills a few nearby chiplets first.\n\n---\n\n## 2. Specific\
    \ Opportunities for Improvement Given This Config\n\n### 2.1 IO\u2011Aware First\u2011\
    Layer and Last\u2011Layer Placement\n- For the **first layer**, force the starting\
    \ chiplet to be among those **closest to any IO chiplet** (e.g., within 2 hops\
    \ of the corners). Choose the one with the highest available weight capacity.\n\
    - For the **last layer**, similarly bias placement toward IO\u2011proximal chiplets.\n\
    - This can be implemented via the existing `preference` dictionary by marking\
    \ \u201Cio_proximal\u201D as a condition, or by modifying the starting selection\
    \ logic when `layer_idx == 0` or the final layer is detected.\n\n### 2.2 Traffic\u2011\
    Aware Anchoring Using All Source Chiplets\nReplace the single\u2011anchor strategy\
    \ with a **source\u2011weighted distance cost**:\n- For layer *L+1*, obtain the\
    \ set of chiplets that hold portions of layer *L* and their output data sizes\
    \ (proportional to the partitioned output channels).\n- Score each candidate chiplet\
    \ for *L+1* by `\u2211 (data_size_from_source * distance(source, candidate))`.\n\
    - Sort available chiplets by this score, then by free capacity.\n\nThis directly\
    \ minimises the expected total communication volume between the two layers.\n\n\
    ### 2.3 Capacity Reservation for Layer Pipelines\nWhen two consecutive layers\
    \ are small enough to fit on a single chiplet (or a small cluster that is fully\
    \ connected), the mapper should **reserve** space on that chiplet/cluster for\
    \ the next layer *before* allocating the current one.\n- After placing layer *L*,\
    \ check if the remaining capacity on the already\u2011used chiplets can accommodate\
    \ layer *L+1*\u2019s weights. If so, \u201Cpre\u2011allocate\u201D them (temporarily\
    \ mark capacity as used) so that the anchor for *L+1* is automatically those same\
    \ chiplets, keeping communication intra\u2011chiplet.\n\n### 2.4 Balanced Clustering\
    \ for Large Layers\nFor a layer that requires many chiplets, instead of filling\
    \ strictly by distance from one anchor, use a **k\u2011medoids\u2011like expansion**:\n\
    - Choose multiple seed chiplets (e.g., the top\u2011N previous\u2011layer chiplets\
    \ by output size) and expand in concentric rings around each simultaneously, ensuring\
    \ a more even spatial distribution.\n- Apply a **soft penalty** in the sorting\
    \ key that de\u2011prioritises chiplets that are already very heavily loaded (to\
    \ spread compute and memory utilisation).\n\n### 2.5 Fallback Retry with Relaxed\
    \ Distance\nIf the first allocation attempt fails due to insufficient memory,\
    \ retry with:\n- The same anchor but removing the distance\u2011based sorting\
    \ (i.e., purely by available capacity), or\n- Shifting the anchor to the chiplet\
    \ with the most remaining capacity among the top\u20113 nearest.\n\nThis trades\
    \ some locality for successful mapping, critical for full\u2011capacity utilisation.\n\
    \n### 2.6 Exploit the Mesh Regularity for Symmetric Placement\nThe 10\xD710 mesh\
    \ is recurrent; the mapper could place layers that are spatially separable (like\
    \ depth\u2011wise convolutions) in a tiled, interleaved pattern to reduce mutual\
    \ interference. Even without such layer types, enforcing that weight usage grows\
    \ equally in all four quadrants reduces the diameter of communication for the\
    \ whole network.\n\n---\n\n## 3. Data/Signals Currently Ignored but Should Be\
    \ Used\n\n| Signal / Data                    | Why it matters                \
    \                                                                           |\
    \ How to use it                                                              \
    \                                        |\n|----------------------------------|----------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------|\n\
    | **Activation tensor sizes** per layer | Dominant factor in inter\u2011layer\
    \ communication volume.                                                    | Weight\
    \ chiplet selection by the expected amount of activation data to be exchanged,\
    \ not just hop distance.        |\n| **Source chiplet distribution** of previous\
    \ layer | Tells which chiplets send data to the next layer.                  \
    \                                     | Compute aggregated cost as `\u2211(activation_size\
    \ \xD7 distance)`.                                                        |\n\
    | **IO chiplet coordinates**       | Input/output data must pass through these\
    \ chiplets.                                                     | Prioritise placements\
    \ near IO for boundary layers; incorporate IO distance into cost functions.  \
    \                  |\n| **Network link bandwidth & contention** | Hop count alone\
    \ does not capture congestion when many flows share a link.                  \
    \      | Model expected link utilisation under a given placement and use a congestion\u2011\
    aware cost (e.g., max link load or E2E latency estimate). |\n| **Chiplet compute\
    \ capability heterogeneity** | If some CMOS chiplets differed in speed, assignment\
    \ should reflect that. This config is homogeneous, but future heterogeneous designs\
    \ could benefit. | Use compute capability as a tie\u2011breaker or capacity weighting.\
    \                                                    |\n| **Layer dependency graph\
    \ beyond immediate neighbour** | Foresight of the whole chain can avoid painting\
    \ into a corner.                                           | Use a lightweight\
    \ rolling window or a one\u2011pass forward\u2011looking heuristic to reserve\
    \ critical resources.            |\n| **Weight loading cost from IO**  | In \u201C\
    all_at_once\u201D mode, initial weight loading from off\u2011chip memory may dominate\
    \ if many weights are placed far from IO. | Prefer placing layers that are loaded\
    \ early in the sequence closer to IO to shorten loading latency.             \
    \  |\n| **Current occupancy percentages** (already computed) | Shows which chiplets\
    \ are heavily utilised.                                                      \
    \        | Use occupancy directly in the sorting key (not just free memory) to\
    \ balance thermal/utilisation hot spots.         |\n\n*Note: The mapper already\
    \ computes `avail_memory_list` and `occupancy_percentages` but only uses them\
    \ to prefer more free memory; it does **not** penalise high occupancy or use occupancy\
    \ to influence decisions beyond that simple rank.*"
