- change_summary: "**Analysis of Nearest-Neighbor Mapper Weaknesses for Given CHIPSIM\
    \ Configuration**\n\n---\n\n### **1. Key Weaknesses of Current Nearest-Neighbor\
    \ Approach**\nThe algorithm prioritizes proximity and local memory availability,\
    \ but overlooks critical factors for efficient mapping on a 96-chiplet mesh with\
    \ 4 I/O corner chiplets:\n\n**A. Network Congestion & Communication Overhead**\n\
    - **Shortest-path-only evaluation**: The mapper uses Manhattan distance (`shortest_paths`)\
    \ but ignores **link contention**, **bandwidth bottlenecks**, and **network topology\
    \ asymmetry**. On a 10\xD710 mesh with I/O chiplets only at corners, data movement\
    \ to/from edge chiplets will experience higher latency and congestion\u2014this\
    \ isn\u2019t captured.\n- **No traffic modeling**: The mapper doesn\u2019t simulate\
    \ or estimate inter-layer communication (e.g., activations from one layer to the\
    \ next). Placing consecutive layers on nearby chiplets reduces hop count but may\
    \ overload specific routers if many layers map to the same region.\n\n**B. Load\
    \ Balancing & Resource Fragmentation**\n- **Memory occupancy bias**: The algorithm\
    \ sorts chiplets by `(distance, -avail_memory, -metric_value)`. This means a chiplet\
    \ with slightly more free memory will be chosen even if it\u2019s far from the\
    \ previous layer\u2019s placement. For large layers, this can cause **spatial\
    \ fragmentation**\u2014spreading a layer across distant chiplets increases communication\
    \ costs.\n- **No look-ahead**: The mapper processes layers sequentially without\
    \ considering future layers\u2019 sizes or dependencies. This can lead to **suboptimal\
    \ cluster formation**, where early layers consume central chiplets, forcing later\
    \ layers to map to edges, increasing average distance.\n\n**C. Heterogeneity Ignorance**\n\
    | Chiplet Type       | Count | Placement       | Weight Capacity |\n|--------------------|-------|----------------|----------------|\n\
    | CMOS Compute       | 96    | Mesh interior  | 2.46M weights each |\n| I/O (corners)\
    \      | 4     | Corners        | (excluded from mapping) |\n\n- **Uniform treatment**:\
    \ All 96 CMOS chiplets are considered identical in `_calculate_layer_requirements`.\
    \ However, in a real heterogeneous system, chiplets may have varying **memory\
    \ bandwidth**, **computational throughput**, or **thermal limits**. The mapper\u2019\
    s \u201Cdistance + memory\u201D heuristic doesn\u2019t account for performance\
    \ variance.\n- **I/O proximity penalty**: The 4 I/O chiplets are excluded, but\
    \ data must flow to them for off-chip communication. Mapping compute layers far\
    \ from I/O chiplets (e.g., center of mesh) increases latency for loading weights\
    \ or sending final outputs off-chip.\n\n**D. Algorithmic Inefficiencies**\n- **Linear\
    \ greedy allocation**: For each layer, the mapper iterates over chiplets sorted\
    \ by distance and allocates percentage based on local capacity. This can create\
    \ **unbalanced splits**: a layer might be split across 10+ chiplets because the\
    \ nearest chiplet only had partial capacity, increasing synchronization overhead.\n\
    - **Rounding errors**: The partitioner (`layer_partitioner.py`) adjusts partitions\
    \ post-mapping, but the mapper\u2019s percentage allocation (`alloc_percentage\
    \ = available_units * 100 / units_needed_full`) can produce uneven splits that\
    \ complicate load balancing.\n\n---\n\n### **2. Specific Opportunities for Improvement**\n\
    Given the 10\xD710 mesh topology and workload (`workload_vgg16.csv`), the following\
    \ enhancements are high-priority:\n\n**A. Topology-Aware Clustering**\n| Strategy\
    \                     | Benefit                                              \
    \                   |\n|------------------------------|-------------------------------------------------------------------------|\n\
    | **Quadrant-based mapping**   | Assign layers to one of 4 quadrants (each anchored\
    \ by a corner I/O chiplet). Reduces average distance to I/O. |\n| **Contiguous\
    \ block selection**| Instead of nearest-neighbor, pick a contiguous rectangular\
    \ block of chiplets with sufficient aggregate capacity. Minimizes intra-layer\
    \ communication hops. |\n| **I/O-aware seeding**        | Start first layer near\
    \ an I/O chiplet (not necessarily center). Use `preferred_start_chiplet_id` to\
    \ bias initial placement toward corners. |\n\n**B. Communication-Aware Cost Function**\n\
    Replace `(distance, -avail_memory, -metric_value)` with a cost that estimates:\n\
    - **Inter-layer traffic**: If previous layer\u2019s output activations are large,\
    \ favor chiplets with high bandwidth links or low congestion paths.\n- **Data\
    \ reuse**: If a layer reuses weights from a prior layer, map to the same chiplets\
    \ to avoid weight reloading.\n- **Network hotspot avoidance**: Prefer paths that\
    \ avoid already heavily used links (requires tracking link utilization during\
    \ mapping).\n\n**C. Batch Optimization**\n- **Layer grouping**: Process multiple\
    \ layers together (e.g., all layers of a VGG16 block) to find a placement minimizing\
    \ total communication.\n- **Backtracking**: If a layer cannot fit near its predecessor,\
    \ consider remapping the predecessor to a more flexible location (requires temporary\
    \ undo).\n\n**D. Heterogeneity Utilization**\n- **Performance/energy trade-off**:\
    \ The `preference` dict (`{\"performance\": 1, \"energy_efficiency\": 0}`) is\
    \ used only as a tertiary sorting metric. Instead, integrate it into the cost\
    \ function: e.g., weigh distance vs. chiplet-specific power efficiency.\n- **Thermal\
    \ awareness**: Avoid concentrating layers in a dense region (creates hotspot).\
    \ Spread compute across mesh to balance thermal load.\n\n---\n\n### **3. Missing\
    \ Data/Signals the Mapper Should Use**\nThe mapper currently ignores:\n\n| Missing\
    \ Signal                     | How to Incorporate                            \
    \                                     |\n|------------------------------------|------------------------------------------------------------------------------------|\n\
    | **Inter-layer data volume**        | From `model_metrics`, obtain activation\
    \ sizes between layers. Use to weight distance cost. |\n| **Network link capacity**\
    \          | Mesh links have finite bandwidth (implied by `bits_per_packet: 128`\
    \ and `network_operation_frequency_hz: 1e9`). Model per-link utilization and penalize\
    \ overloaded paths. |\n| **Chiplet compute throughput**    | CMOS chiplets may\
    \ have different MAC/cycle rates. Use to adjust allocation percentages (faster\
    \ chiplets get larger shares). |\n| **Spatial locality**               | The mapper\
    \ splits layers across arbitrary chiplets. Enforce **maximum split radius**\u2014\
    limit allocation to chiplets within N hops of the primary chiplet. |\n| **Workload\
    \ concurrency**           | If multiple models run simultaneously, track residual\
    \ capacity across runs to avoid fragmenting capacity. |\n\n**Immediate Improvements\
    \ for `_nearest_neighbor_mapper_v3`:**\n1. **Add a \u201Ccluster radius\u201D\
    \ parameter**: Restrict allocation to chiplets within `max_hops` of the starting\
    \ chiplet.\n2. **Weight inter-layer communication**: Multiply distance by activation\
    \ size (if available) to prioritize low-traffic placements.\n3. **Batch allocation**:\
    \ For large layers, allocate to the nearest **set** of chiplets with sufficient\
    \ contiguous capacity, rather than iterating one-by-one.\n4. **I/O anchor bias**:\
    \ Modify `starting_chiplet` selection to prefer chiplets adjacent to I/O corners\
    \ when `preference[\"energy_efficiency\"] > 0`.\n\n**Conclusion**: The current\
    \ nearest-neighbor mapper is reasonable for small-scale homogeneous meshes but\
    \ lacks the sophistication needed for large-scale heterogeneous systems with deep\
    \ neural networks (VGG16). Incorporating **communication volume**, **topology\
    \ constraints**, and **batch optimization** would significantly improve mapping\
    \ efficiency."
