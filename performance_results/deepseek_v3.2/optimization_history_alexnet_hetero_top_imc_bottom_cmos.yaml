- change_summary: "## Analysis of Nearest-Nighbor Mapping Algorithm Weaknesses\n\n\
    ### 1. Key Weaknesses of Current Nearest-Nighbor Approach\n\n**A. Static Distance-Based\
    \ Prioritization**\nThe algorithm prioritizes physical proximity (`distances.get(chiplet_id,\
    \ math.inf)`) without considering:\n- **Network congestion**: Allocates to nearest\
    \ chiplets first, potentially creating hotspots\n- **Heterogeneity blindness**:\
    \ Treats all 96 CMOS_Compute chiplets identically despite potential performance\
    \ variations\n- **Load balancing**: No mechanism to spread layers evenly across\
    \ the 10x10 mesh\n\n**B. Single-Start-Point Bottleneck**\n```python\nstarting_chiplet\
    \ = sorted_chiplets_ids[0]  # Always starts from the \"best\" chiplet\n```\n-\
    \ Creates a single expansion point radiating outward\n- Limits parallel layer\
    \ execution opportunities\n- Suboptimal for large models like AlexNet with many\
    \ layers\n\n**C. Memory Fragmentation**\n```python\nunits_needed_for_resources\
    \ = math.ceil(resources_remaining * units_needed_full / crossbars_required)\n\
    ```\n- Allocates partial percentages that may not align with chiplet capacity\
    \ boundaries\n- Creates leftover capacity fragments too small for subsequent layers\n\
    - Particularly problematic with 2.46M weight units per CMOS chiplet\n\n**D. Ignored\
    \ System-Level Metrics**\n- No consideration of:\n  - Inter-chiplet communication\
    \ bandwidth\n  - Activation data movement patterns\n  - Layer dependency graph\
    \ (AlexNet has sequential dependencies)\n  - Weight stationary implications (`weight_stationary:\
    \ true` in config)\n\n**E. Algorithmic Inefficiencies**\n- O(n\xB2) shortest path\
    \ precomputation (scales poorly beyond 10x10)\n- No lookahead for future layer\
    \ requirements\n- Greedy allocation without backtracking\n- Fragmented chiplet\
    \ selection logic with duplicate filtering\n\n### 2. Specific Opportunities for\
    \ Improvement Given This Config\n\n**A. Mesh Topology Exploitation**\n```yaml\n\
    adj_matrix: adj_matrix_10x10_mesh.csv\nchiplet_mapping: mapping_100_hetero_top_imc_bottom_cmos.yaml\n\
    ```\n- **Opportunity**: Create \"zones\" within 10x10 mesh for different layer\
    \ types\n- **Benefit**: Reduce average hop distance for common activation flows\n\
    \n**B. CMOS Chiplet Homogeneity**\n```python\n# 96 identical CMOS_Compute chiplets\n\
    ```\n- **Opportunity**: Round-robin or striping allocation patterns\n- **Benefit**:\
    \ Better load balancing and heat distribution\n\n**C. IO Chiplet Placement**\n\
    ```python\n# 4 IO chiplets at corners on a 10x10 mesh topology\n```\n- **Opportunity**:\
    \ Map input/output-intensive layers to perimeter chiplets\n- **Benefit**: Reduce\
    \ data movement from/to external interfaces\n\n**D. Weight Stationary Mode**\n\
    ```yaml\nweight_stationary: true\n```\n- **Opportunity**: Prioritize keeping weights\
    \ local to avoid re-loading\n- **Benefit**: Reduced weight movement overhead during\
    \ inference\n\n### 3. Critical Data/Signals Currently Ignored\n\n**A. Layer Dependency\
    \ Graph**\nAlexNet layers execute sequentially, but the mapper treats each layer\
    \ independently:\n- No consideration of output\u2192input activation flows\n-\
    \ Missing opportunity to co-locate dependent layers\n\n**B. Activation Data Volume**\n\
    From workload_alexnet.csv:\n- Input/output activation sizes vary dramatically\
    \ between layers\n- Current mapper ignores activation movement cost entirely\n\
    \n**C. Chiplet Communication Patterns**\n- No awareness of which chiplets communicate\
    \ frequently\n- Missing ability to create \"communities\" of frequently communicating\
    \ chiplets\n\n**D. Performance/Energy Tradeoffs**\n```python\nactive_metric =\
    \ next((metric for metric, active in preference.items() if active), \"performance\"\
    )\n```\n- Binary preference system (performance OR energy_efficiency)\n- No way\
    \ to optimize for balanced metrics\n\n**E. Temporal Locality**\n- No reuse of\
    \ previously allocated weights\n- Each layer allocation starts fresh, ignoring\
    \ that weights might already be loaded\n\n---\n\n## Recommended Improvements\n\
    \n### Immediate Fixes:\n1. **Add Load Balancing**: Sort chiplets by available\
    \ capacity first, then distance\n2. **Fix Duplicate Filtering**: Remove redundant\
    \ `available_chiplet_ids` filtering code\n3. **Add Fragmentation Metric**: Prefer\
    \ allocations that leave evenly divisible remainders\n\n### Medium-Term Enhancements:\n\
    1. **Layer-Aware Placement**: Use AlexNet's layer dependency graph to guide placement\n\
    2. **Activation-Aware Mapping**: Consider input/output activation sizes in distance\
    \ calculations\n3. **Zone-Based Allocation**: Divide 10x10 mesh into quadrants\
    \ around IO chiplets\n\n### Long-Term Architecture:\n1. **Lookahead Mapper**:\
    \ Evaluate multiple future layers when placing current layer\n2. **Communication\
    \ Cost Model**: Integrate Garnet simulator feedback into placement decisions\n\
    3. **Heterogeneity Awareness**: Add chiplet performance profiles even within same\
    \ type\n\nThe current mapper's simplicity makes it fast but suboptimal for this\
    \ 100-chiplet configuration. Adding just load balancing and fragmentation awareness\
    \ would significantly improve performance without major algorithmic complexity\
    \ increases."
