- change_summary: "Looking at the failed optimization attempts, I can see that previous\
    \ attempts focused on stage-aware mapping and contiguity, but actually worsened\
    \ latency (106,893 vs 82,040). This suggests the approach either increased fragmentation\
    \ or created communication bottlenecks. Let me analyze why and propose a fundamentally\
    \ different strategy.\n\n## **Analysis of Previous Failures**\n\n**Why stage-aware\
    \ mapping failed:**\n1. **Forced spatial separation** - Placing stages in different\
    \ regions likely increased activation movement between stages\n2. **Ignored activation\
    \ sizes** - AlexNet conv layers produce massive activations (e.g., first conv:\
    \ 224\xD7224\xD764 \u2248 3.2M values) while FC layers have smaller activations\n\
    3. **Network hotspots** - Concentrating layers in specific regions (corners/center)\
    \ created contention points\n\n**The real problem**: The mapper focuses on **layer\
    \ proximity** but ignores **activation data movement costs**.\n\n## **NEW Optimization\
    \ Strategy: Activation-Aware Co-placement**\n\nInstead of separating stages by\
    \ network location, we should **co-locate layers with high activation transfer**\
    \ and use a **cost model based on actual data movement**.\n\n### **1. Core Insight**\n\
    For AlexNet (from your workload file):\n- **Conv1\u2192Conv2**: 55.4M activations\
    \ (55MB with 8-bit)\n- **Conv5\u2192FC6**: 432K activations (0.4MB)\n- **Early\
    \ conv layers** have 100-1000\xD7 more activation data than late FC layers\n\n\
    **Current mapper's flaw**: It minimizes distance between consecutive layers regardless\
    \ of activation size. This wastes optimization effort on tiny data movements while\
    \ neglecting massive ones.\n\n### **2. Specific Implementation Changes**\n\n####\
    \ **A. Add Activation-Aware Cost Function**\n```python\ndef _activation_aware_nearest_neighbor(self,\
    \ model_layer_info, system, preference, \n                                   \
    \   current_available_capacity, layer_mappings=None, \n                      \
    \                shortest_paths=None, activation_sizes=None):\n    \"\"\"\n  \
    \  Modified nearest neighbor that weights distance by activation size\n    \"\"\
    \"\n    # Get activation size to next layer (if available)\n    next_activation_size\
    \ = 0\n    if activation_sizes and len(layer_mappings) < len(activation_sizes):\n\
    \        next_activation_size = activation_sizes[len(layer_mappings)]  # Size\
    \ from current to next layer\n    \n    # Normal nearest neighbor logic until\
    \ starting chiplet selection...\n    \n    # MODIFIED: Weight distances by activation\
    \ size importance\n    chiplet_info = []\n    for chiplet_id in available_chiplet_ids:\n\
    \        idx = chiplet_id - 1\n        raw_distance = distances.get(chiplet_id,\
    \ math.inf)\n        \n        # Weight distance by activation importance\n  \
    \      # If moving huge activations, distance matters more\n        activation_weight\
    \ = min(1.0, next_activation_size / (10 * 1024 * 1024))  # Scale: 10MB = max weight\n\
    \        weighted_distance = raw_distance * (1 + activation_weight)\n        \n\
    \        metric_value = chiplet_network.nodes[chiplet_id].get(active_metric, 0)\n\
    \        chiplet_info.append((chiplet_id, weighted_distance, avail_memory_list[idx],\
    \ metric_value))\n    \n    # Sort by weighted distance first\n    chiplet_info.sort(key=lambda\
    \ x: (x[1], -x[2], -x[3]))\n```\n\n#### **B. Implement Lookahead for Critical\
    \ Pairs**\n```python\ndef _find_critical_layer_pairs(self, model_metrics, activation_sizes):\n\
    \    \"\"\"\n    Identify layer pairs with largest activation transfers\n    Returns:\
    \ List of (prev_layer_idx, curr_layer_idx, activation_size) sorted by size\n \
    \   \"\"\"\n    critical_pairs = []\n    for i in range(len(model_metrics) - 1):\n\
    \        if i < len(activation_sizes):\n            size = activation_sizes[i]\n\
    \            critical_pairs.append((i, i+1, size))\n    \n    # Sort by activation\
    \ size descending\n    critical_pairs.sort(key=lambda x: x[2], reverse=True)\n\
    \    return critical_pairs\n\ndef _pre_place_critical_pairs(self, critical_pairs,\
    \ model_metrics, remaining_capacity):\n    \"\"\"\n    Pre-place the most critical\
    \ layer pairs to minimize large data movements\n    \"\"\"\n    placed_layers\
    \ = set()\n    placement_map = {}  # layer_idx -> chiplet_id\n    \n    for prev_idx,\
    \ curr_idx, act_size in critical_pairs[:3]:  # Top 3 most critical\n        if\
    \ prev_idx in placed_layers and curr_idx not in placed_layers:\n            #\
    \ Place current layer near already-placed previous layer\n            prev_chiplet\
    \ = placement_map[prev_idx]\n            self._place_layer_near_chiplet(curr_idx,\
    \ prev_chiplet, remaining_capacity)\n            placed_layers.add(curr_idx)\n\
    \            placement_map[curr_idx] = prev_chiplet\n        elif prev_idx not\
    \ in placed_layers:\n            # Place both layers together\n            best_pair\
    \ = self._find_best_pair_location(prev_idx, curr_idx, remaining_capacity)\n  \
    \          placed_layers.update([prev_idx, curr_idx])\n            placement_map.update({prev_idx:\
    \ best_pair, curr_idx: best_pair})\n    \n    return placement_map\n```\n\n####\
    \ **C. Dynamic Chiplet Capacity Reservation**\n```python\ndef _reserve_for_large_activations(self,\
    \ layer_idx, activation_sizes, remaining_capacity):\n    \"\"\"\n    Reserve capacity\
    \ on neighboring chiplets for layers that will need to \n    send large activations\
    \ to subsequent layers\n    \"\"\"\n    if layer_idx >= len(activation_sizes):\n\
    \        return remaining_capacity\n    \n    act_size = activation_sizes[layer_idx]\n\
    \    \n    # Only reserve for very large activations (>5MB)\n    if act_size >\
    \ 5 * 1024 * 1024:  # 5MB\n        print(f\"\u26A0\uFE0F Large activation detected:\
    \ {act_size/1024/1024:.1f}MB after layer {layer_idx}\")\n        \n        # For\
    \ current layer placement, reserve capacity on neighboring chiplets\n        #\
    \ for potential next-layer placement\n        for chiplet_idx, capacity in enumerate(remaining_capacity):\n\
    \            if capacity > 0:\n                # Reserve 20% of capacity on this\
    \ chiplet for future layers\n                reserve_amount = int(capacity * 0.2)\n\
    \                remaining_capacity[chiplet_idx] -= reserve_amount\n         \
    \       \n    return remaining_capacity\n```\n\n#### **D. Reverse-Order Mapping\
    \ for FC Layers**\n```python\ndef _reverse_map_fc_layers(self, model_metrics,\
    \ remaining_capacity):\n    \"\"\"\n    Map FC layers in reverse order (output\
    \ to input) to minimize \n    activation movement through the network\n    \"\"\
    \"\n    # Identify FC layers\n    fc_indices = [i for i, layer in enumerate(model_metrics)\
    \ \n                  if layer['layer_type'] == 'fc']\n    \n    if not fc_indices:\n\
    \        return remaining_capacity\n    \n    # Map from last FC to first\n  \
    \  for fc_idx in reversed(fc_indices):\n        # Find chiplets near the network\
    \ output (corner IOs for final output)\n        output_corners = [91, 100]  #\
    \ Bottom-right corners\n        nearest_to_output = self._find_nearest_available(output_corners,\
    \ remaining_capacity)\n        \n        # Place this FC layer near output\n \
    \       if nearest_to_output:\n            # Calculate requirements and allocate\n\
    \            layer_info = model_metrics[fc_idx]\n            units_needed = self._calculate_layer_requirements(layer_info,\
    \ \n                                                             self.system.chiplets[nearest_to_output-1])\n\
    \            \n            if remaining_capacity[nearest_to_output-1] >= units_needed:\n\
    \                remaining_capacity[nearest_to_output-1] -= units_needed\n   \
    \ \n    return remaining_capacity\n```\n\n### **3. Why This Strategy Will Work\
    \ Better**\n\n**Key differences from previous attempts:**\n\n1. **Data-Driven\
    \ Optimization**: Uses actual activation sizes (from workload file) rather than\
    \ assumptions about layer types\n2. **Selective Optimization**: Focuses effort\
    \ where it matters most (large activations), ignoring tiny data movements\n3.\
    \ **Preserves Locality**: Still uses nearest-neighbor but weights it by actual\
    \ communication cost\n4. **Adaptive to Workload**: Works for any DNN, not just\
    \ AlexNet-specific patterns\n\n### **4. Implementation Priority**\n\n1. **First**:\
    \ Parse activation sizes from workload file and pass to mapper\n2. **Second**:\
    \ Implement weighted distance calculation (minimal change to existing algorithm)\n\
    3. **Third**: Add reverse-order FC mapping\n4. **Fourth**: (Optional) Add critical\
    \ pair pre-placement\n\n### **5. Expected Benefits**\n\n1. **Reduced Massive Data\
    \ Movement**: 55MB activations won't travel across the entire mesh\n2. **Better\
    \ Network Utilization**: Small activations can travel farther without penalty\n\
    3. **Maintains Simplicity**: Keeps the nearest-neighbor foundation but makes it\
    \ data-aware\n4. **No Stage Separation**: Layers stay naturally clustered by data\
    \ dependency, not artificial boundaries\n\n### **6. Required Data from Workload**\n\
    \nThe workload file (`workload_alexnet.csv`) should contain or be augmented with:\n\
    - Activation sizes between layers\n- Or calculated from: output dimensions \xD7\
    \ bit-width\n\n**Quick estimation for AlexNet:**\n- Conv1\u2192Conv2: 55.4M values\
    \ \xD7 8-bit = 443Mb = 55MB\n- Conv2\u2192Conv3: 14.7M \xD7 8-bit = 14.7MB  \n\
    - Conv5\u2192FC6: 432K \xD7 8-bit = 0.43MB\n\nThis optimization strategy directly\
    \ targets the **real performance bottleneck** (large activation movement) that\
    \ the current mapper completely ignores, explaining why previous topology-focused\
