- change_summary: "Based on your previous optimization attempts and analysis, here's\
    \ a focused improvement strategy targeting the most critical weaknesses in the\
    \ `_nearest_neighbor_mapper_v3` for this specific 10x10 mesh configuration with\
    \ 96 compute chiplets and 4 corner IOs:\n\n## **Optimization Strategy: Stage-Aware\
    \ Contiguous Mapping with IO Proximity**\n\n### **Core Problem to Solve**\nThe\
    \ current mapper treats each layer independently and creates fragmented mappings\
    \ that ignore:\n1. **Network topology structure** (corner IOs vs. interior chiplets)\n\
    2. **Layer grouping opportunities** (AlexNet has clear conv/fc stages)\n3. **Contiguity\
    \ benefits** (scattered partitions increase communication overhead)\n\n### **Specific\
    \ Implementation Changes**\n\n#### **1. Add Stage Detection & Grouping**\n```python\n\
    def _detect_alexnet_stages(self, model_metrics):\n    \"\"\"Identify natural stage\
    \ boundaries in AlexNet workload\"\"\"\n    stages = []\n    current_stage = []\n\
    \    \n    for layer_info in model_metrics:\n        layer_type = layer_info['layer_type']\n\
    \        \n        # AlexNet pattern: conv layers -> fc layers transition\n  \
    \      if layer_type == 'fc' and all(l['layer_type'] != 'fc' for l in current_stage):\n\
    \            if current_stage:\n                stages.append(current_stage)\n\
    \                current_stage = []\n        \n        current_stage.append(layer_info)\n\
    \    \n    if current_stage:\n        stages.append(current_stage)\n    \n   \
    \ return stages\n```\n\n#### **2. Modify Nearest-Neighbor for Contiguous Allocation**\n\
    Replace the percentage-based scattering with **contiguous block allocation**:\n\
    \n```python\ndef _allocate_contiguous_block(self, chiplet_id, remaining_capacity,\
    \ \n                               units_needed_full, resources_remaining, \n\
    \                               crossbars_required, num_chiplets):\n    \"\"\"\
    \n    Try to allocate complete layers or large contiguous blocks to single chiplets\n\
    \    before falling back to nearest-neighbor scattering\n    \"\"\"\n    # First\
    \ pass: Try to fit entire remaining resources on this chiplet\n    chiplet_idx\
    \ = chiplet_id - 1\n    available_units = remaining_capacity[chiplet_idx]\n  \
    \  \n    if crossbars_required > 0:\n        units_needed_for_all = math.ceil(resources_remaining\
    \ * units_needed_full / crossbars_required)\n    else:\n        units_needed_for_all\
    \ = 0\n    \n    # If this chiplet can take ALL remaining resources, allocate\
    \ 100% here\n    if available_units >= units_needed_for_all and units_needed_for_all\
    \ > 0:\n        remaining_capacity[chiplet_idx] -= units_needed_for_all\n    \
    \    return 100, 0, 0, remaining_capacity\n    \n    # Otherwise, try to allocate\
    \ at least 50% to maintain contiguity\n    min_contiguous_percentage = 50\n  \
    \  units_needed_min = math.ceil(units_needed_for_all * min_contiguous_percentage\
    \ / 100)\n    \n    if available_units >= units_needed_min and units_needed_min\
    \ > 0:\n        alloc_percentage = min_contiguous_percentage\n        remaining_capacity[chiplet_idx]\
    \ -= units_needed_min\n        remaining_resources = resources_remaining - math.ceil(alloc_percentage\
    \ * crossbars_required / 100)\n        remaining_percentage = 100 - alloc_percentage\n\
    \        return alloc_percentage, remaining_resources, remaining_percentage, remaining_capacity\n\
    \    \n    # Fall back to whatever is available\n    if units_needed_full > 0:\n\
    \        alloc_percentage = min(available_units * 100 / units_needed_full, 100)\n\
    \    else:\n        alloc_percentage = 0\n    \n    if alloc_percentage > 0:\n\
    \        units_used = math.ceil(units_needed_full * alloc_percentage / 100)\n\
    \        remaining_capacity[chiplet_idx] -= units_used\n        remaining_resources\
    \ = resources_remaining - math.ceil(alloc_percentage * crossbars_required / 100)\n\
    \        remaining_percentage = 100 - alloc_percentage\n        return alloc_percentage,\
    \ remaining_resources, remaining_percentage, remaining_capacity\n    \n    return\
    \ 0, resources_remaining, 100, remaining_capacity\n```\n\n#### **3. Intelligent\
    \ Starting Point Selection Based on Stage**\nModify the starting chiplet selection\
    \ to consider **stage position in network**:\n\n```python\ndef _get_stage_aware_starting_chiplet(self,\
    \ stage_index, total_stages, \n                                      available_chiplet_ids,\
    \ chiplet_network):\n    \"\"\"\n    Select starting chiplet based on stage position:\n\
    \    - Early stages: Near input IOs (corners)\n    - Middle stages: Central region\n\
    \    - Late stages: Near output IOs\n    \"\"\"\n    # Calculate stage position\
    \ (0.0 = beginning, 1.0 = end)\n    stage_position = stage_index / max(total_stages\
    \ - 1, 1)\n    \n    # Get corner IO positions (from 10x10 mesh)\n    corner_chiplets\
    \ = [1, 10, 91, 100]  # Assuming 1-based indexing\n    \n    if stage_position\
    \ < 0.33:\n        # Early stage: prefer near input IOs\n        return self._find_nearest_to_corners(available_chiplet_ids,\
    \ corner_chiplets[:2], chiplet_network)\n    elif stage_position > 0.66:\n   \
    \     # Late stage: prefer near output IOs  \n        return self._find_nearest_to_corners(available_chiplet_ids,\
    \ corner_chiplets[2:], chiplet_network)\n    else:\n        # Middle stage: prefer\
    \ central chiplets\n        return self._find_central_chiplet(available_chiplet_ids,\
    \ chiplet_network)\n\ndef _find_nearest_to_corners(self, available_chiplet_ids,\
    \ corner_chiplets, chiplet_network):\n    \"\"\"Find available chiplet closest\
    \ to specified corners\"\"\"\n    min_avg_distance = float('inf')\n    best_chiplet\
    \ = available_chiplet_ids[0]\n    \n    for chiplet_id in available_chiplet_ids:\n\
    \        total_distance = 0\n        for corner in corner_chiplets:\n        \
    \    total_distance += nx.shortest_path_length(chiplet_network, chiplet_id, corner)\n\
    \        \n        avg_distance = total_distance / len(corner_chiplets)\n    \
    \    if avg_distance < min_avg_distance:\n            min_avg_distance = avg_distance\n\
    \            best_chiplet = chiplet_id\n    \n    return best_chiplet\n\ndef _find_central_chiplet(self,\
    \ available_chiplet_ids, chiplet_network):\n    \"\"\"Find most central available\
    \ chiplet (min distance to all others)\"\"\"\n    min_total_distance = float('inf')\n\
    \    best_chiplet = available_chiplet_ids[0]\n    \n    for chiplet_id in available_chiplet_ids:\n\
    \        total_distance = sum(\n            nx.shortest_path_length(chiplet_network,\
    \ chiplet_id, other)\n            for other in available_chiplet_ids\n       \
    \ )\n        \n        if total_distance < min_total_distance:\n            min_total_distance\
    \ = total_distance\n            best_chiplet = chiplet_id\n    \n    return best_chiplet\n\
    ```\n\n#### **4. Post-Mapping Consolidation Pass**\nAdd a pass to consolidate\
    \ fragmented mappings:\n\n```python\ndef _consolidate_mappings(self, layer_mappings,\
    \ remaining_capacity):\n    \"\"\"\n    Try to consolidate highly fragmented mappings\
    \ by migrating\n    small percentages to adjacent chiplets with more capacity\n\
    \    \"\"\"\n    for layer_idx, mapping in enumerate(layer_mappings):\n      \
    \  # Find chips with small percentages (<20%)\n        small_chips = [(chip_id,\
    \ pct) for chip_id, pct in mapping[1] if 0 < pct < 20]\n        large_chips =\
    \ [(chip_id, pct) for chip_id, pct in mapping[1] if pct >= 20]\n        \n   \
    \     if not small_chips or not large_chips:\n            continue\n         \
    \   \n        # Try to migrate each small allocation to nearest large chip\n \
    \       for small_chip_id, small_pct in small_chips:\n            # Find nearest\
    \ large chip with enough capacity\n            for large_chip_id, large_pct in\
    \ large_chips:\n                if self._can_migrate_percentage(small_chip_id,\
    \ large_chip_id, \n                                               small_pct, remaining_capacity):\n\
    \                    # Perform migration\n                    self._migrate_percentage(layer_mappings,\
    \ layer_idx, \n                                           small_chip_id, large_chip_id,\
    \ \n                                           small_pct, remaining_capacity)\n\
    \                    break\n```\n\n### **Why This Approach is Different from Previous\
    \ Attempts**\n\n1. **Stage Awareness**: Previous optimizations treated all layers\
    \ equally. This approach recognizes AlexNet's natural conv\u2192fc transition.\n\
    \n2. **Contiguity Over Scattering**: Instead of accepting fragmented mappings,\
    \ this actively tries to allocate larger contiguous blocks.\n\n3. **Topology Exploitation**:\
    \ Explicitly uses the 10x10 mesh structure with corner IOs by placing stages strategically.\n\
    \n4. **Two-Phase Process**: Initial mapping + consolidation pass, rather than\
    \ one-pass greedy allocation.\n\n### **Expected Benefits for This Configuration**\n\
    \n1. **Reduced Cross-Chiplet Communication**: Contiguous allocation minimizes\
    \ data movement between layer partitions.\n\n2. **Better IO Utilization**: Early/late\
    \ layers placed near appropriate IOs reduce data movement to/from memory.\n\n\
    3. **Improved Load Balance**: Centralized middle stages avoid edge congestion.\n\
    \n4. **Lower Network Contention**: Reduced scattering means fewer small packets\
    \ clogging the mesh.\n\n### **Implementation Priority**\n1. First implement **contiguous\
    \ block allocation** (most impactful)\n2. Add **stage detection** for AlexNet\n\
    3. Implement **IO-aware starting points**\n4. Add **consolidation pass** as final\
    \ optimization\n\nThis strategy directly addresses the key weaknesses identified:\
    \ topology agnosticism, fragmentation, and ignoring workload structure. The changes\
    \ are surgical modifications to the existing mapper rather than a complete rewrite,\
    \ making them practical to implement."
