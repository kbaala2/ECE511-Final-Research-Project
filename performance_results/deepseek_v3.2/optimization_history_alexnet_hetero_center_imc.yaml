- change_summary: "Based on the analysis of the `_nearest_neighbor_mapper_v3` algorithm\
    \ and the specific 10\xD710 mesh configuration with 96 compute + 4 I/O chiplets,\
    \ I recommend a **Cluster-Based Mapping with Communication-Aware Initialization**\
    \ strategy. The previous optimization attempt likely failed because it didn't\
    \ fundamentally change the nearest-neighbor approach's core weaknesses.\n\n##\
    \ NEW OPTIMIZATION STRATEGY: Cluster-Based with Communication-Aware Initialization\n\
    \n### Implementation Plan:\n\n**1. Add Cluster Detection for First Layer:**\n\
    Instead of randomly selecting the starting chiplet based on available memory,\
    \ detect natural clusters in the mesh topology and place the first layer near\
    \ I/O chiplets.\n\n```python\ndef _nearest_neighbor_mapper_v3_cluster_aware(self,\
    \ model_layer_info, system, preference, current_available_crossbars, layer_mappings=None,\
    \ shortest_paths=None):\n    \"\"\"\n    Enhanced nearest-neighbor with cluster-aware\
    \ initialization and load distribution.\n    \"\"\"\n    # ... [keep existing\
    \ initialization code until layer_mappings check] ...\n    \n    if not layer_mappings:\n\
    \        available_chiplet_ids = [idx + 1 for idx, cu in enumerate(remaining_capacity)\
    \ \n                                if cu > 0 and not self.system.is_io_chiplet(idx\
    \ + 1)]\n        \n        # NEW: Identify 4 clusters centered around I/O chiplets\
    \ (corners)\n        io_chiplets = [1, 10, 91, 100]  # Corner positions in 10x10\
    \ mesh\n        io_clusters = {}\n        \n        for io_id in io_chiplets:\n\
    \            # Find compute chiplets within 2 hops of this I/O chiplet\n     \
    \       cluster_members = []\n            for comp_id in available_chiplet_ids:\n\
    \                distance = shortest_paths.get(io_id, {}).get(comp_id, math.inf)\n\
    \                if distance <= 2:  # Within 2 hops\n                    cluster_members.append(comp_id)\n\
    \            io_clusters[io_id] = cluster_members\n        \n        # NEW: For\
    \ input layers, prefer clusters near I/O\n        layer_name = model_layer_info['name'].lower()\n\
    \        is_input_layer = 'input' in layer_name or layer_idx == 0\n        \n\
    \        if is_input_layer and io_clusters:\n            # Choose the cluster\
    \ with most available capacity\n            best_cluster = None\n            best_avg_capacity\
    \ = -1\n            \n            for io_id, cluster_members in io_clusters.items():\n\
    \                if cluster_members:\n                    avg_capacity = np.mean([remaining_capacity[cid-1]\
    \ for cid in cluster_members])\n                    if avg_capacity > best_avg_capacity:\n\
    \                        best_avg_capacity = avg_capacity\n                  \
    \      best_cluster = cluster_members\n            \n            if best_cluster:\n\
    \                # Sort cluster members by capacity (not just distance)\n    \
    \            cluster_info = []\n                for chiplet_id in best_cluster:\n\
    \                    idx = chiplet_id - 1\n                    metric_value =\
    \ chiplet_network.nodes[chiplet_id].get(active_metric, 0)\n                  \
    \  cluster_info.append((chiplet_id, avail_memory_list[idx], metric_value))\n \
    \               \n                cluster_info.sort(key=lambda x: (-x[1], -x[2]))\n\
    \                starting_chiplet = cluster_info[0][0] if cluster_info else available_chiplet_ids[0]\n\
    \            else:\n                # Fallback to original logic\n           \
    \     chiplet_info = []\n                for chiplet_id in available_chiplet_ids:\n\
    \                    idx = chiplet_id - 1\n                    metric_value =\
    \ chiplet_network.nodes[chiplet_id].get(active_metric, 0)\n                  \
    \  chiplet_info.append((chiplet_id, avail_memory_list[idx], metric_value))\n \
    \               chiplet_info.sort(key=lambda x: (-x[1], -x[2]))\n            \
    \    starting_chiplet = chiplet_info[0][0] if chiplet_info else available_chiplet_ids[0]\n\
    \        else:\n            # Original logic for non-input layers\n          \
    \  chiplet_info = []\n            for chiplet_id in available_chiplet_ids:\n \
    \               idx = chiplet_id - 1\n                metric_value = chiplet_network.nodes[chiplet_id].get(active_metric,\
    \ 0)\n                chiplet_info.append((chiplet_id, avail_memory_list[idx],\
    \ metric_value))\n            chiplet_info.sort(key=lambda x: (-x[1], -x[2]))\n\
    \            starting_chiplet = chiplet_info[0][0] if chiplet_info else available_chiplet_ids[0]\n\
    \    \n    else:\n        # MODIFIED: Don't just pick max percentage chiplet\n\
    \        last_layer_mapping = layer_mappings[-1][1]\n        \n        # Calculate\
    \ weighted center of previous layer's allocation\n        total_percentage = sum(pct\
    \ for _, pct in last_layer_mapping)\n        if total_percentage > 0:\n      \
    \      weighted_chiplets = []\n            for chiplet_id, percentage in last_layer_mapping:\n\
    \                if percentage > 0:\n                    # Convert chiplet_id\
    \ to mesh coordinates\n                    row = (chiplet_id - 1) // 10\n    \
    \                col = (chiplet_id - 1) % 10\n                    weight = percentage\
    \ / total_percentage\n                    weighted_chiplets.append((row, col,\
    \ weight))\n            \n            # Calculate center of mass\n           \
    \ if weighted_chiplets:\n                center_row = sum(r * w for r, _, w in\
    \ weighted_chiplets)\n                center_col = sum(c * w for _, c, w in weighted_chiplets)\n\
    \                \n                # Find chiplet closest to center of mass\n\
    \                min_dist = math.inf\n                starting_chiplet = None\n\
    \                \n                for chiplet_id in available_chiplet_ids:\n\
    \                    row = (chiplet_id - 1) // 10\n                    col = (chiplet_id\
    \ - 1) % 10\n                    dist = abs(row - center_row) + abs(col - center_col)\n\
    \                    if dist < min_dist:\n                        min_dist = dist\n\
    \                        starting_chiplet = chiplet_id\n            else:\n  \
    \              starting_chiplet = available_chiplet_ids[0]\n        else:\n  \
    \          starting_chiplet = available_chiplet_ids[0]\n    \n    # NEW: Add load-aware\
    \ filtering before allocation\n    filtered_chiplet_ids = []\n    for chiplet_id\
    \ in available_chiplet_ids:\n        idx = chiplet_id - 1\n        occupancy =\
    \ occupancy_percentages[idx]\n        # Skip chiplets with >85% occupancy unless\
    \ absolutely necessary\n        if occupancy < 85 or resources_remaining > crossbars_required\
    \ * 0.5:\n            filtered_chiplet_ids.append(chiplet_id)\n    \n    if not\
    \ filtered_chiplet_ids:\n        filtered_chiplet_ids = available_chiplet_ids\
    \  # Fallback\n    \n    # Continue with filtered list instead of all available\
    \ chiplets\n    # ... [rest of the allocation logic using filtered_chiplet_ids]\
    \ ...\n```\n\n**2. Modify the Layer Partitioner for Better Load Distribution:**\n\
    ```python\ndef partition_layer_cluster_aware(self, layer_def, chiplet_mappings):\n\
    \    \"\"\"\n    Enhanced partitioning that considers chiplet proximity for better\
    \ load distribution.\n    \"\"\"\n    # Group chiplets by proximity before partitioning\n\
    \    chiplet_groups = []\n    current_group = []\n    \n    # Sort by chiplet_id\
    \ to get spatial ordering (in mesh topology)\n    sorted_mappings = sorted(chiplet_mappings,\
    \ key=lambda x: x[0])\n    \n    for chiplet_id, percentage in sorted_mappings:\n\
    \        if not current_group:\n            current_group.append((chiplet_id,\
    \ percentage))\n        else:\n            last_id = current_group[-1][0]\n  \
    \          # Check if chiplets are adjacent (difference of 1 in same row or 10\
    \ in same column)\n            if (abs(chiplet_id - last_id) == 1 and (chiplet_id\
    \ - 1) // 10 == (last_id - 1) // 10) or \\\n               (abs(chiplet_id - last_id)\
    \ == 10):\n                current_group.append((chiplet_id, percentage))\n  \
    \          else:\n                chiplet_groups.append(current_group)\n     \
    \           current_group = [(chiplet_id, percentage)]\n    \n    if current_group:\n\
    \        chiplet_groups.append(current_group)\n    \n    # Distribute rounding\
    \ errors within groups first\n    network_chunks = []\n    for group in chiplet_groups:\n\
    \        group_chunks = super().partition_layer(layer_def, group)\n        \n\
    \        # Adjust within group to minimize inter-group communication\n       \
    \ if len(group) > 1:\n            total_percentage = sum(pct for _, pct in group)\n\
    \            # Ensure group gets exactly its share of resources\n            self._balance_within_group(layer_def,\
    \ group_chunks, total_percentage)\n        \n        network_chunks.extend(group_chunks)\n\
    \    \n    return network_chunks\n```\n\n**3. Key Configuration Changes for CHIPSIM:**\n\
    \nUpdate the mapping configuration to use the new strategy:\n```yaml\nmapping:\n\
    \  algorithm: \"nearest_neighbor_v3_cluster_aware\"\n  parameters:\n    cluster_radius:\
    \ 2  # hops from I/O chiplets\n    max_occupancy_threshold: 85  # percentage\n\
    \    enable_load_balancing: true\n```\n\n**4. Why This Strategy Addresses Previous\
    \ Weaknesses:**\n\n1. **I/O Awareness:** Creates explicit clusters around corner\
    \ I/O chiplets, reducing hop distance for input/output layers.\n\n2. **Load Distribution:**\
    \ The 85% occupancy threshold prevents hotspot formation while still allowing\
    \ efficient packing.\n\n3. **Center-of-Mass Calculation:** For subsequent layers,\
    \ calculates weighted center rather than picking the max chiplet, distributing\
    \ load more evenly.\n\n4. **Spatial Grouping:** The enhanced partitioner groups\
    \ adjacent chiplets together, reducing inter-chiplet communication overhead.\n\
    \n5. **Mesh Topology Exploitation:** By considering row/column adjacency in grouping,\
    \ it respects the mesh structure's natural communication patterns.\n\n**Expected\
    \ Impact:**\n- Reduced communication latency by placing input layers near I/O\
    \ chiplets\n- Better load balancing across the 96 compute chiplets\n- Lower network\
    \ congestion by avoiding over-commitment to single chiplets\n- Improved spatial\
    \ locality for partitioned layers\n\nThis approach fundamentally changes the initialization\
    \ and progression logic while maintaining compatibility with the existing nearest-neighbor\
    \ allocation mechanism."
