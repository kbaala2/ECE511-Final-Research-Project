    ```\n\n**2. Add complementary partitioning strategy:**\n\n```python\ndef partition_layer_column_aware(self,\
    \ layer_def, chiplet_mappings):\n    \"\"\"\n    Partition layers with awareness\
    \ of column-based allocation.\n    Groups chiplets by column for better communication\
    \ patterns.\n    \"\"\"\n    # Group by column\n    MESH_SIZE = 10\n    column_groups\
    \ = {}\n    \n    for chiplet_id, percentage in chiplet_mappings:\n        col\
    \ = (chiplet_id - 1) % MESH_SIZE\n        if col not in column_groups:\n     \
    \       column_groups[col] = []\n        column_groups[col].append((chiplet_id,\
    \ percentage))\n    \n    # Process each column group\n    network_chunks = []\n\
    \    \n    for col in sorted(column_groups.keys()):\n        column_mappings =\
    \ column_groups[col]\n        \n        # Sort within column by chiplet_id (which\
    \ gives row order)\n        column_mappings.sort(key=lambda x: x[0])\n       \
    \ \n        # Calculate total percentage for this column\n        col_total_pct\
    \ = sum(pct for _, pct in column_mappings)\n        \n        # Adjust percentages\
    \ to maintain column-wise coherence\n        if col_total_pct > 0:\n         \
    \   # Get base partitioned chunks for this column\n            col_chunks = super().partition_layer(layer_def,\
    \ column_mappings)\n            \n            # Adjust to ensure each column gets\
    \ integer number of channels\n            self._balance_column_partition(layer_def,\
    \ col_chunks, col_total_pct)\n            \n            network_chunks.extend(col_chunks)\n\
    \    \n    return network_chunks\n\ndef _balance_column_partition(self, original_layer,\
    \ column_chunks, column_percentage):\n    \"\"\"\n    Ensure each column gets\
    \ an integer number of output channels.\n    \"\"\"\n    params = original_layer.get('parameters',\
    \ {})\n    original_channels = params.get('output_channels', 1)\n    \n    # Calculate\
    \ how many channels this column should get\n    col_channels = max(1, round(original_channels\
    \ * column_percentage / 100))\n    \n    # Distribute these channels among chiplets\
    \ in the column\n    total_assigned = sum(chunk[1]['parameters']['output_channels']\
    \ for chunk in column_chunks)\n    \n    if total_assigned != col_channels:\n\
    \        difference = col_channels - total_assigned\n        \n        if difference\
    \ > 0:\n            # Add to smallest partitions first\n            column_chunks.sort(key=lambda\
    \ x: x[1]['parameters']['output_channels'])\n            for i in range(min(difference,\
    \ len(column_chunks))):\n                column_chunks[i][1]['parameters']['output_channels']\
    \ += 1\n        else:\n            # Remove from largest partitions first\n  \
    \          column_chunks.sort(key=lambda x: x[1]['parameters']['output_channels'],\
    \ reverse=True)\n            for i in range(min(abs(difference), len(column_chunks))):\n\
    \                if column_chunks[i][1]['parameters']['output_channels'] > 1:\n\
    \                    column_chunks[i][1]['parameters']['output_channels'] -= 1\n\
    ```\n\n**3. Why this will work better:**\n\n1. **Exploits mesh regularity**: Column-major\
    \ allocation creates predictable communication patterns that mesh routers can\
    \ optimize.\n\n2. **Minimizes row contention**: By keeping allocations within\
    \ columns, we reduce traffic across rows, which are the bottleneck in mesh networks.\n\
    \n3. **Balanced load distribution**: The 50% per-chiplet cap prevents hotspots\
    \ while allowing efficient packing.\n\n4. **Topology-aware placement**: First\
    \ layer placement considers layer size and places near center for minimal average\
    \ distance.\n\n5. **Graceful expansion**: When a column fills, expands to adjacent\
    \ columns maintaining locality.\n\n**4. Configuration changes:**\n\n```yaml\n\
