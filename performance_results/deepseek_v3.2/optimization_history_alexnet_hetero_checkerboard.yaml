    \        ))\n    \n    # Return up to max_expansion additional chiplets\n    return\
    \ expanded[:max_expansion]\n```\n\n### Why This Strategy is Different and Complementary:\n\
    \n1. **Dynamic Cluster Sizing**: Adapts to each layer's needs rather than using\
    \ fixed zones\n2. **Center-of-Mass Calculation**: Considers the entire previous\
