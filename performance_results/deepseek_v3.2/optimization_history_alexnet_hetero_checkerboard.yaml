    \ = (remaining_capacity[chiplet_idx] * 100) / units_needed_full\n            \
    \        remaining_capacity[chiplet_idx] = 0\n                    action[chiplet_idx]\
    \ = actual_alloc\n                    percentage_remaining -= actual_alloc\n \
