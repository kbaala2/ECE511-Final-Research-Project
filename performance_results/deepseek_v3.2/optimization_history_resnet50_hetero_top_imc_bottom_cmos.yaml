- change_summary: "Based on the analysis and the latency improvement from Iteration\
    \ 2 (273,893.9 vs 318,726.3, ~14% reduction), we see that **some improvement is\
    \ possible but the nearest-neighbor approach still has fundamental limitations**.\
    \ Let me propose a different, more balanced strategy that addresses the core weaknesses\
    \ while being practical to implement.\n\n## New Optimization Strategy: **Cost-Aware\
    \ Greedy with Rebalancing**\n\n### Core Idea\nInstead of pure nearest-neighbor,\
    \ use a **cost function** that balances three factors for each candidate chiplet:\
    \ **distance penalty**, **capacity utilization**, and **communication load**.\
    \ After initial placement, apply a **rebalancing phase** to spread load more evenly.\n\
    \n### Key Changes to `_nearest_neighbor_mapper_v3`:\n\n#### 1. **Enhanced Cost\
    \ Function**\n```python\ndef _calculate_chiplet_cost(self, chiplet_id, candidate_info,\
    \ layer_info, \n                           previous_mappings, available_capacity,\
    \ network_load_map):\n    \"\"\"\n    Calculate comprehensive cost for placing\
    \ part of a layer on this chiplet.\n    Lower cost is better.\n    \"\"\"\n  \
    \  chiplet_idx = chiplet_id - 1\n    \n    # 1. Distance cost (Manhattan distance\
    \ from previous layer's primary chiplet)\n    distance_cost = 0\n    if previous_mappings\
    \ and len(previous_mappings) > 0:\n        last_layer_map = previous_mappings[-1][1]\n\
    \        if last_layer_map:\n            # Find chiplet with largest allocation\
    \ in previous layer\n            primary_prev = max(last_layer_map, key=lambda\
    \ x: x[1])[0]\n            if chiplet_id in self.shortest_paths.get(primary_prev,\
    \ {}):\n                distance = self.shortest_paths[primary_prev][chiplet_id]\n\
    \                # Scale by activation size if available\n                activation_size\
    \ = layer_info.get('input_activation_size', 1)\n                distance_cost\
    \ = distance * activation_size * 0.01\n    \n    # 2. Capacity utilization cost\
    \ (penalize nearly full chiplets)\n    chiplet = self.system.chiplets[chiplet_idx]\n\
    \    total_capacity = chiplet.get_total_memory()\n    used_capacity = total_capacity\
    \ - (available_capacity[chiplet_idx] * chiplet.get_capacity_unit_size())\n   \
    \ utilization = used_capacity / total_capacity if total_capacity > 0 else 0\n\
    \    \n    # Quadratic penalty for high utilization (encourages load balancing)\n\
    \    utilization_cost = (utilization ** 2) * 100\n    \n    # 3. Network congestion\
    \ cost\n    congestion_cost = 0\n    if network_load_map and chiplet_id in network_load_map:\n\
    \        # Penalize chiplets that are already communication hotspots\n       \
    \ congestion_cost = network_load_map[chiplet_id] * 10\n    \n    # 4. I/O proximity\
    \ bonus/penalty\n    io_cost = 0\n    if self.system.is_io_chiplet(chiplet_id):\n\
    \        # Avoid placing compute on I/O chiplets\n        io_cost = 1000\n   \
    \ else:\n        # Check distance to nearest I/O chiplet\n        io_distances\
    \ = []\n        for io_id in [1, 10, 91, 100]:  # Corner I/O chiplets in 10x10\
    \ mesh\n            if io_id in self.shortest_paths.get(chiplet_id, {}):\n   \
    \             io_distances.append(self.shortest_paths[chiplet_id][io_id])\n  \
    \      \n        if io_distances:\n            min_io_distance = min(io_distances)\n\
    \            # Layers with large activations benefit from being near I/O\n   \
    \         activation_size = layer_info.get('input_activation_size', 1)\n     \
    \       if activation_size > 1000000:  # Large activation\n                io_cost\
    \ = min_io_distance * 5\n            else:  # Small activation\n             \
    \   io_cost = min_io_distance * 0.5\n    \n    # Weighted sum of costs (tune these\
    \ weights based on preference)\n    weights = {\n        'distance': self.preference.get('performance',\
    \ 1),\n        'utilization': 0.5,  # Moderate load balancing\n        'congestion':\
    \ 0.3,\n        'io': 0.2\n    }\n    \n    total_cost = (\n        distance_cost\
    \ * weights['distance'] +\n        utilization_cost * weights['utilization'] +\n\
    \        congestion_cost * weights['congestion'] +\n        io_cost * weights['io']\n\
    \    )\n    \n    return total_cost\n```\n\n#### 2. **Network Load Tracking**\n\
    ```python\nclass ModelMapper:\n    def __init__(self, system, mapping_function=\"\
    nearest_neighbor_v3\", preference=None):\n        # ... existing init code ...\n\
    \        \n        # Track network load per chiplet (simplified model)\n     \
    \   self.network_load = {chiplet_id: 0 for chiplet_id in range(1, len(system.chiplets)\
    \ + 1)}\n        \n        # Track layer dependencies for ResNet skip connections\n\
    \        self.skip_connections = {}  # layer_name -> list of dependent layer names\n\
    \        \n    def _update_network_load(self, chiplet_id, layer_info):\n     \
    \   \"\"\"Update network load estimate for a chiplet\"\"\"\n        # Estimate\
    \ communication based on layer type and size\n        if layer_info['layer_type']\
    \ == 'conv':\n            # Conv layers: activations + partial sums\n        \
    \    comm_estimate = layer_info.get('input_activation_size', 1000) * 2\n     \
    \   elif layer_info['layer_type'] == 'fc':\n            # FC layers: mainly weight\
    \ loading\n            comm_estimate = layer_info.get('num_weights', 1000)\n \
    \       else:\n            comm_estimate = 1000\n            \n        # Update\
    \ this chiplet and its neighbors (simplified mesh model)\n        self.network_load[chiplet_id]\
    \ += comm_estimate\n        \n        # Also update neighbors (1 hop away)\n \
    \       row = (chiplet_id - 1) // 10\n        col = (chiplet_id - 1) % 10\n  \
    \      \n        neighbors = []\n        if row > 0: neighbors.append(chiplet_id\
    \ - 10)\n        if row < 9: neighbors.append(chiplet_id + 10)\n        if col\
    \ > 0: neighbors.append(chiplet_id - 1)\n        if col < 9: neighbors.append(chiplet_id\
    \ + 1)\n        \n        for neighbor in neighbors:\n            if 1 <= neighbor\
    \ <= 100:\n                self.network_load[neighbor] += comm_estimate * 0.3\
    \  # Reduced impact\n```\n\n#### 3. **Main Mapper with Cost-Based Selection**\n\
    ```python\ndef _nearest_neighbor_mapper_v3_enhanced(self, model_layer_info, system,\
    \ preference, \n                                        current_available_crossbars,\
    \ layer_mappings=None, \n                                        shortest_paths=None):\n\
    \    # ... existing setup code until sorted_chiplets_ids calculation ...\n   \
    \ \n    # Instead of simple distance sorting, use cost-based selection\n    chiplet_costs\
    \ = []\n    for chiplet_id in available_chiplet_ids:\n        cost = self._calculate_chiplet_cost(\n\
    \            chiplet_id=chiplet_id,\n            candidate_info={\n          \
    \      'distance': distances.get(chiplet_id, math.inf),\n                'available_memory':\
    \ avail_memory_list[chiplet_id-1],\n                'metric_value': chiplet_network.nodes[chiplet_id].get(active_metric,\
    \ 0)\n            },\n            layer_info=model_layer_info,\n            previous_mappings=layer_mappings,\n\
    \            available_capacity=current_available_crossbars,\n            network_load_map=self.network_load\n\
    \        )\n        chiplet_costs.append((chiplet_id, cost))\n    \n    # Sort\
    \ by cost (lowest first)\n    chiplet_costs.sort(key=lambda x: x[1])\n    sorted_chiplets_ids\
    \ = [chiplet_id for chiplet_id, cost in chiplet_costs]\n    \n    # Allocate using\
    \ sorted list\n    for chiplet_id in sorted_chiplets_ids:\n        # ... existing\
    \ allocation logic ...\n        \n        if alloc_percentage > 0:\n         \
    \   # Update network load for successful allocation\n            self._update_network_load(chiplet_id,\
    \ model_layer_info)\n            \n            # Update chiplet utilization tracking\n\
    \            self.chiplet_utilization[chiplet_id] = \\\n                (self.chiplet_utilization.get(chiplet_id,\
    \ 0) + \n                 (alloc_percentage / 100) * model_layer_info.get('total_macs',\
    \ 1000))\n    \n    # After allocation, check if rebalancing is needed\n    if\
    \ not mapping_failed:\n        action = self._try_rebalance_allocation(\n    \
    \        action=action,\n            layer_info=model_layer_info,\n          \
    \  current_available_crossbars=remaining_capacity,\n            original_allocation=action.copy()\n\
    \        )\n    \n    return remaining_capacity, action, mapping_failed, failure_reason\n\
    ```\n\n#### 4. **Rebalancing Phase**\n```python\ndef _try_rebalance_allocation(self,\
    \ action, layer_info, current_available_crossbars, \n                        \
    \     original_allocation):\n    \"\"\"\n    Try to rebalance allocation to improve\
    \ load distribution.\n    Moves small percentages from highly utilized to less\
    \ utilized chiplets.\n    \"\"\"\n    # Only rebalance if layer is spread across\
    \ multiple chiplets\n    allocated_chiplets = [i for i, pct in enumerate(action)\
    \ if pct > 0]\n    if len(allocated_chiplets) < 2:\n        return action\n  \
    \  \n    # Calculate current utilization scores\n    utilizations = {}\n    for\
    \ chiplet_idx in allocated_chiplets:\n        chiplet_id = chiplet_idx + 1\n \
    \       chiplet = self.system.chiplets[chiplet_idx]\n        total_capacity =\
    \ chiplet.get_total_memory()\n        used = total_capacity - (current_available_crossbars[chiplet_idx]\
    \ * \n                                chiplet.get_capacity_unit_size())\n    \
    \    utilizations[chiplet_idx] = used / total_capacity if total_capacity > 0 else\
    \ 0\n    \n    # Sort by utilization (highest first)\n    high_util = sorted([(idx,\
    \ util) for idx, util in utilizations.items()], \n                      key=lambda\
    \ x: x[1], reverse=True)\n    low_util = sorted([(idx, util) for idx, util in\
    \ utilizations.items()], \n                     key=lambda x: x[1])\n    \n  \
    \  # Try to move up to 20% of allocation from high to low utilization\n    rebalance_amount\
    \ = 0.20  # Max percentage to move\n    \n    for high_idx, high_utilization in\
    \ high_util:\n        for low_idx, low_utilization in low_util:\n            if\
    \ high_idx == low_idx:\n                continue\n            \n            #\
    \ Calculate amount to move\n            current_pct = action[high_idx]\n     \
    \       if current_pct <= 5:  # Don't move very small allocations\n          \
    \      continue\n                \n            move_pct = min(current_pct * rebalance_amount,\
    \ 10)  # Max 10% per move\n            \n            # Check if low utilization\
    \ chiplet has capacity\n            units_needed_full = self._calculate_layer_requirements(\n\
    \                layer_info, self.system.chiplets[low_idx])\n            required_units\
    \ = math.ceil(move_pct * units_needed_full / 100)\n            \n            if\
    \ (current_available_crossbars[low_idx] >= required_units and\n              \
    \  action[low_idx] + move_pct <= 100):\n                \n                # Perform\
    \ the move\n                action[high_idx] -= move_pct\n                action[low_idx]\
    \ += move_pct\n                current_available_crossbars[high_idx] += required_units\n\
    \                current_available_crossbars[low_idx] -= required_units\n    \
    \            \n                # Update network loads\n                self._update_network_load(high_idx\
    \ + 1, layer_info)\n                self._update_network_load(low_idx + 1, layer_info)\n\
    \                \n                # Recalculate utilizations\n              \
    \  break\n    \n    return action\n```\n\n#### 5. **ResNet-Specific Optimization**\n\
    ```python\ndef _identify_resnet_skip_pairs(self, layer_name, model_metrics):\n\
    \    \"\"\"Identify layers that form skip connections in ResNet50\"\"\"\n    #\
    \ Simplified pattern matching for ResNet50\n    skip_patterns = [\n        # Conv2\
    \ before add (e.g., layer1.0.conv2 -> layer1.0.add)\n        (r'(layer\\d+\\.\\\
    d+\\.conv2)', r'\\1'.replace('conv2', 'add')),\n        # Conv3 before add (e.g.,\
    \ layer1.0.conv3 -> layer1.0.add)\n        (r'(layer\\d+\\.\\d+\\.conv3)', r'\\\
    1'.replace('conv3', 'add')),\n    ]\n    \n    skip_pairs = []\n    for pattern,\
    \ target_pattern in skip_patterns:\n        import re\n        match = re.match(pattern,\
    \ layer_name)\n        if match:\n            base = match.group(1)\n        \
    \    # Find the target layer in model metrics\n            for other_layer in\
    \ model_metrics:\n                if re.match(target_pattern, other_layer['name']):\n\
    \                    skip_pairs.append((layer_name, other_layer['name']))\n  \
    \                  break\n    \n    return skip_pairs\n\ndef _apply_skip_optimization(self,\
    \ current_layer_name, action, model_metrics):\n    \"\"\"Adjust allocation to\
    \ minimize skip connection distances\"\"\"\n    skip_pairs = self._identify_resnet_skip_pairs(current_layer_name,\
    \ model_metrics)\n    \n    if not skip_pairs:\n        return action\n    \n\
    \    # For each skip connection partner, try to co-locate allocations\n    for\
    \ source_layer, target_layer in skip_pairs:\n        # Find where target layer\
    \ was allocated (if already mapped)\n        target_allocation = None\n      \
    \  for layer_idx, mapping in enumerate(self.previous_mappings):\n            if\
    \ mapping[0] == target_layer:\n                target_allocation = mapping[1]\n\
    \                break\n        \n        if target_allocation:\n            #\
    \ Get primary chiplet for target\n            target_chiplets = [cid for cid,\
    \ pct in target_allocation if pct > 0]\n            if target_chiplets:\n    \
    \            primary_target = max(target_allocation, key=lambda x: x[1])[0]\n\
    \                \n                # Adjust current allocation to favor proximity\
    \ to target\n                for chiplet_idx, pct in enumerate(action):\n    \
    \                if pct > 0:\n                        chiplet_id = chiplet_idx\
    \ + 1\n                        distance = self.shortest_paths.get(primary_target,\
    \ {}).get(chiplet_id, 10)\n                        \n                        #\
    \ Penalize distant allocations\n                        if distance > 3:\n   \
    \                         # Try to move some allocation closer\n             \
    \               self._move_allocation_toward_target(\n                       \
    \         action, chiplet_idx, primary_target, \n                            \
    \    distance, pct, model_layer_info)\n    \n    return action\n```\n\n### Why\
    \ This Strategy is Different and Better:\n\n1. **Multi-Factor Optimization**:\
    \ Balances distance, utilization, and congestion instead of just distance\n2.\
    \ **Proactive Load Balancing**: The rebalancing phase actively spreads load after\
    \ initial placement\n3. **Network-Aware**: Considers current network load to avoid\
    \ hotspots\n4. **ResNet-Aware**: Special handling for skip connections without\
    \ requiring full block detection\n5. **Adaptive**: Weights can be tuned based\
    \ on preference (performance vs. energy)\n\n### Implementation Steps:\n\n1. **Add\
    \ cost calculation** to evaluate chiplets holistically\n2. **Track network load**\
    \ to avoid congestion\n3. **Implement rebalancing** phase after initial allocation\n\
    4. **Add skip connection optimization** for ResNet-specific patterns\n5. **Keep\
    \ nearest-neighbor as fallback** when cost calculation fails\n\n### Expected Benefits:\n\
    \n- **Better load distribution**: Avoids overloading nearest chiplets\n- **Reduced\
    \ congestion**: Considers network load during placement\n- **Improved skip connection\
    \ latency**: Actively tries to place connected layers close\n- **More balanced\
    \ utilization**: Rebalancing spreads work more evenly\n- **Maintains locality**:\
    \ Still prefers nearby chiplets but with better balancing\n\nThis approach addresses\
    \ the key weaknesses while being incrementally implementable and tunable based\
