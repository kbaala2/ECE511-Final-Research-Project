- change_summary: "## Analysis of Nearest-Neighbor Mapper Weaknesses\n\n### 1. Key\
    \ Weaknesses of Current Nearest-Neighbor Approach\n\n**A. Naive Distance-First\
    \ Sorting Problem**\nThe mapper prioritizes chiplets solely by shortest path distance\
    \ from the starting chiplet:\n```python\nchiplet_info.sort(key=lambda x: (x[1],\
    \ -x[2], -x[3]))  # Distance, then available memory, then metric\n```\nThis creates\
    \ several issues:\n- **Suboptimal load distribution**: Nearest chiplets get overloaded\
    \ while distant ones remain underutilized\n- **No consideration of heterogeneous\
    \ capabilities**: All 96 CMOS chiplets are treated identically despite potential\
    \ performance variations in the mesh topology\n- **Inefficient for large layers**:\
    \ Large ResNet50 layers cause \"clumping\" around starting points, ignoring potentially\
    \ better global placement\n\n**B. Single-Starting-Point Bottleneck**\nThe algorithm\
    \ uses only one starting chiplet per layer (either preferred or the chiplet with\
    \ most available memory from previous layer):\n- **First layer**: Picks chiplet\
    \ with maximum available memory\n- **Subsequent layers**: Uses chiplet with largest\
    \ allocation from previous layer\n- **No fallback strategy**: If nearest chiplets\
    \ lack capacity, mapping fails despite available capacity elsewhere\n\n**C. Reactive\
    \ Rather Than Proactive Capacity Management**\nThe mapper doesn't consider:\n\
    - **Future layer requirements**: No look-ahead capability\n- **Layer adjacency\
    \ patterns**: Critical for minimizing communication in ResNet50's skip connections\n\
    - **Cross-layer data dependencies**: Particularly important for residual connections\
    \ in ResNet\n\n**D. Inefficient Percentage Allocation**\nThe percentage-based\
    \ allocation has precision issues:\n```python\nalloc_percentage = (available_units\
    \ * 100 / units_needed_full) if units_needed_full > 0 else 0\npercentage_remaining\
    \ -= alloc_percentage\nresources_remaining -= math.ceil(alloc_percentage * crossbars_required\
    \ / 100)\n```\n- **Integer rounding errors**: `math.ceil()` can over-allocate\
    \ resources\n- **Capacity fragmentation**: Leaves unusable small capacity fragments\
    \ across chiplets\n\n**E. Ignoring Network Congestion**\nDespite having network\
    \ topology (10\xD710 mesh) and shortest paths precomputed, the mapper doesn't\
    \ consider:\n- **Communication hotspots**: Corner I/O chiplets create traffic\
    \ patterns\n- **Link contention**: Multiple layers communicating through same\
    \ intermediate chiplets\n- **Bandwidth constraints**: 128-bit packets on 1GHz\
    \ network have physical limits\n\n### 2. Specific Opportunities for Improvement\n\
    \n**A. Leverage Mesh Topology Structure**\nWith a 10\xD710 mesh and 4 corner I/O\
    \ chiplets:\n- **Implement quadrant-based mapping**: Split workload into 4 logical\
    \ quadrants (25 chiplets each)\n- **Use diagonal patterns**: Map layers along\
    \ mesh diagonals to maximize parallel communication paths\n- **Exploit I/O proximity**:\
    \ Place early/late layers near respective I/O chiplets\n\n**B. ResNet50-Specific\
    \ Optimizations**\nResNet50 has unique characteristics:\n- **Bottleneck blocks**:\
    \ 1\xD71, 3\xD73, 1\xD71 conv patterns\n- **Skip connections**: Require low-latency\
    \ between specific layer pairs\n- **Decreasing spatial dimensions**: Later layers\
    \ have smaller activation maps but more channels\n\n**Recommended mapping strategy:**\n\
    1. **Stage 1 (large spatial maps)**: Distribute across many chiplets near input\
    \ I/O\n2. **Stage 2-4**: Use compact clusters to minimize skip connection latency\n\
    3. **Stage 5 (classifier)**: Concentrate near output I/O chiplets\n\n**C. Heterogeneity-Aware\
    \ Mapping**\nThough all 96 are CMOS_Compute, mesh positions matter:\n- **Edge\
    \ vs. center chiplets**: Different communication characteristics\n- **I/O adjacency**:\
    \ Chiplets near I/O should handle more communication-intensive layers\n\n**D.\
    \ Batch Processing Optimization**\nGiven `weight_loading_strategy: all_at_once`:\n\
    - **Contiguous allocation**: Prefer allocating entire layers to fewer chiplets\n\
    - **Weight locality**: Keep layer weights together to minimize weight loading\
    \ overhead\n\n### 3. Missing Data/Signals the Mapper Should Use\n\n**A. Layer\
    \ Communication Requirements**\nThe mapper lacks:\n- **Activation volumes**: Input/output\
    \ activation sizes for each layer\n- **Data reuse patterns**: Which layers share\
    \ weights or activations\n- **Skip connection distances**: For ResNet50, distance\
    \ between residual connection endpoints\n\n**B. Network State Information**\n\
    - **Current link utilization**: To avoid congestion hotspots\n- **Pending communications**:\
    \ From previously mapped layers\n- **I/O chiplet loading**: Corner chiplets handling\
    \ multiple models\n\n**C. Performance Prediction Metrics**\n- **Computation-to-communication\
    \ ratio**: For each layer type\n- **Memory access patterns**: Help decide between\
    \ contiguous vs. distributed allocation\n- **Pipeline dependencies**: Critical\
    \ path information for throughput optimization\n\n**D. Workload-Aware Signals**\n\
    From `workload_resnet50.csv`:\n- **Layer execution frequency**: If known from\
    \ profiling\n- **Data dependencies**: Beyond simple layer ordering\n- **Batch\
    \ size implications**: Affects activation transfer volumes\n\n### Recommended\
    \ Improvements\n\n1. **Implement hierarchical mapping**:\n   - First pass: Assign\
    \ layers to mesh quadrants\n   - Second pass: Fine-grained chiplet assignment\
    \ within quadrants\n\n2. **Add cost function optimization**:\n   ```python\n \
    \  def calculate_mapping_cost(chiplet_ids, layer_info, previous_mappings):\n \
    \      # Consider: distance to previous layers, available capacity, \n       #\
    \ network congestion, I/O proximity, residual connection distances\n   ```\n\n\
    3. **Introduce fallback strategies**:\n   - When nearest neighbor fails, try k-means\
    \ clustering of available chiplets\n   - Implement gradual expansion from optimal\
    \ starting point\n\n4. **Add ResNet50-specific heuristics**:\n   - Identify and\
    \ co-locate layers connected by skip connections\n   - Map bottleneck blocks as\
    \ atomic units when possible\n\n5. **Utilize mesh topology properties**:\n   -\
    \ Prefer Manhattan distance-based spreading over simple nearest-neighbor\n   -\
    \ Use multiple starting points for large layers (>25% of total chiplets)\n\nThe\
    \ current mapper's simplicity makes it fast but suboptimal for the 10\xD710 mesh\
    \ with ResNet50. Adding modest complexity with topology-aware and workload-specific\
    \ heuristics could significantly improve performance without excessive computational\
    \ overhead."
