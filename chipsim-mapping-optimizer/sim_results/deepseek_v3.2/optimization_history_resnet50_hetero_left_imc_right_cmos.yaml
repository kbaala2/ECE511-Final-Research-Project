- change_summary: "Based on the analysis and previous optimization attempts, I'll\
    \ focus on a different strategy that addresses the core weaknesses while leveraging\
    \ the 10\xD710 mesh topology with 96 CMOS compute chiplets and 4 I/O chiplets.\n\
    \n## Recommended Optimization Strategy: **Multi-Seed Adaptive Capacity-Aware Mapping**\n\
    \n### Key Insight from Previous Failures:\nThe previous \"NO_IMPROVEMENT\" result\
    \ suggests that simple tweaks to the nearest-neighbor approach won't work. We\
    \ need a fundamentally different allocation strategy that:\n1. **Distributes layers\
    \ evenly** across the entire mesh (not just from one starting point)\n2. **Considers\
    \ real-time capacity** during allocation (not just initial state)\n3. **Leverages\
    \ the mesh structure** with 4 corner I/O chiplets as natural distribution points\n\
    \n### Implementation Plan:\n\n**Step 1: Quadrant-Based Partitioning**\n```python\n\
    def _get_quadrant_for_chiplet(self, chiplet_id):\n    \"\"\"\n    Assign chiplets\
    \ to quadrants based on mesh position.\n    For 10x10 mesh with I/O at corners:\n\
    \    - Quadrant 0: Top-left (near I/O chiplet at (0,0))\n    - Quadrant 1: Top-right\
    \ (near I/O chiplet at (0,9))\n    - Quadrant 2: Bottom-left (near I/O chiplet\
    \ at (9,0))\n    - Quadrant 3: Bottom-right (near I/O chiplet at (9,9))\n    \"\
    \"\"\n    row = (chiplet_id - 1) // 10  # Assuming 0-indexed mapping\n    col\
    \ = (chiplet_id - 1) % 10\n    if row < 5:\n        return 0 if col < 5 else 1\n\
    \    else:\n        return 2 if col < 5 else 3\n```\n\n**Step 2: Multi-Seed BFS\
    \ Expansion**\n```python\ndef _multi_seed_bfs_mapping(self, model_layer_info,\
    \ system, preference, \n                           current_available_crossbars,\
    \ layer_mappings, shortest_paths):\n    \"\"\"\n    Maps layers using BFS expansion\
    \ from all 4 corner I/O chiplets simultaneously.\n    \"\"\"\n    # Identify the\
    \ 4 corner I/O chiplets (should be IDs 1, 10, 91, 100 in 10x10 mesh)\n    corner_chiplets\
    \ = []\n    for idx in range(len(system.chiplets)):\n        chiplet_id = idx\
    \ + 1\n        if system.is_io_chiplet(chiplet_id):\n            corner_chiplets.append(chiplet_id)\n\
    \    \n    # Initialize BFS queues for each corner\n    bfs_frontiers = []\n \
    \   for corner in corner_chiplets:\n        visited = set([corner])\n        queue\
    \ = [corner]\n        bfs_frontiers.append((corner, queue, visited))\n    \n \
    \   # Track allocations per quadrant\n    quadrant_allocations = {0: 0, 1: 0,\
    \ 2: 0, 3: 0}\n    \n    # Main allocation loop - alternate between quadrants\n\
    \    remaining_capacity = current_available_crossbars.copy()\n    action = [0]\
    \ * len(system.chiplets)\n    resources_remaining = model_layer_info['crossbars_required']\n\
    \    \n    while resources_remaining > 0:\n        # Find quadrant with least\
    \ allocation\n        target_quadrant = min(quadrant_allocations.items(), key=lambda\
    \ x: x[1])[0]\n        \n        # Get next chiplet from that quadrant's BFS frontier\n\
    \        chiplet_id = None\n        for corner_id, queue, visited in bfs_frontiers:\n\
    \            if self._get_quadrant_for_chiplet(corner_id) == target_quadrant and\
    \ queue:\n                chiplet_id = queue.pop(0)\n                # Add neighbors\
    \ to queue\n                neighbors = list(system.chiplet_network.neighbors(chiplet_id))\n\
    \                for neighbor in neighbors:\n                    if neighbor not\
    \ in visited and not system.is_io_chiplet(neighbor):\n                       \
    \ visited.add(neighbor)\n                        queue.append(neighbor)\n    \
    \            break\n        \n        if not chiplet_id or remaining_capacity[chiplet_id-1]\
    \ <= 0:\n            # Move to next quadrant\n            continue\n         \
    \   \n        # Allocate to this chiplet (same logic as before but with quadrant\
    \ tracking)\n        chiplet_idx = chiplet_id - 1\n        available_units = remaining_capacity[chiplet_idx]\n\
    \        units_needed_full = self._calculate_layer_requirements(model_layer_info,\
    \ system.chiplets[chiplet_idx])\n        \n        if model_layer_info['crossbars_required']\
    \ > 0:\n            units_needed = math.ceil(resources_remaining * units_needed_full\
    \ / model_layer_info['crossbars_required'])\n        else:\n            units_needed\
    \ = 0\n            \n        if available_units >= units_needed:\n           \
    \ # Allocate remaining resources\n            remaining_capacity[chiplet_idx]\
    \ -= units_needed\n            action[chiplet_idx] = 100 - resources_remaining\n\
    \            resources_remaining = 0\n        else:\n            # Partial allocation\n\
    \            alloc_percentage = (available_units * 100 / units_needed_full) if\
    \ units_needed_full > 0 else 0\n            remaining_capacity[chiplet_idx] =\
    \ 0\n            action[chiplet_idx] = alloc_percentage\n            resources_remaining\
    \ -= math.ceil(alloc_percentage * model_layer_info['crossbars_required'] / 100)\n\
    \            quadrant_allocations[target_quadrant] += alloc_percentage\n    \n\
    \    return remaining_capacity, action, resources_remaining <= 10, None\n```\n\
    \n**Step 3: Layer-Type Aware Routing**\n```python\ndef _layer_type_aware_sorting(self,\
    \ chiplet_ids, layer_info, avail_memory_list, distances):\n    \"\"\"\n    Sort\
    \ chiplets based on layer type suitability.\n    CMOS chiplets better for weight-intensive\
    \ layers (Conv/FC with many weights)\n    \"\"\"\n    layer_type = layer_info.get('layer_type',\
    \ '')\n    \n    chiplet_scores = []\n    for chiplet_id in chiplet_ids:\n   \
    \     idx = chiplet_id - 1\n        chiplet = self.system.chiplets[idx]\n    \
    \    \n        # Base score: capacity/distance ratio\n        capacity = avail_memory_list[idx]\n\
    \        distance = distances.get(chiplet_id, math.inf)\n        base_score =\
    \ capacity / (distance + 1)\n        \n        # Layer-type adjustment\n     \
    \   if hasattr(chiplet, 'type'):\n            if chiplet.type == 'CMOS' and layer_type\
    \ in ['conv', 'fc']:\n                # CMOS excels at weight-intensive operations\n\
    \                base_score *= 1.5\n            elif chiplet.type == 'IMC' and\
    \ layer_type in ['self_attention']:\n                # IMC better for attention\
    \ patterns\n                base_score *= 1.2\n        \n        chiplet_scores.append((chiplet_id,\
    \ base_score))\n    \n    return sorted(chiplet_scores, key=lambda x: x[1], reverse=True)\n\
    ```\n\n### Why This Approach is Different:\n\n1. **Avoids Single-Point Congestion**:\
    \ By using 4 starting points and quadrant balancing\n2. **Adapts to Real-Time\
    \ Capacity**: Tracks allocations per quadrant and dynamically adjusts\n3. **Respects\
    \ Network Topology**: Uses BFS to naturally expand through the mesh\n4. **Layer-Type\
    \ Optimization**: Differentiates between CMOS (weight-intensive) and IMC (attention-intensive)\
    \ layers\n5. **Scalable**: Works for any mesh size with corner I/O chiplets\n\n\
    ### Implementation Integration:\n\nAdd this as a new mapper function in `ModelMapper`:\n\
    \n```python\ndef _multi_seed_adaptive_mapper(self, model_layer_info, system, preference,\
    \ \n                               current_available_crossbars, layer_mappings=None,\
    \ shortest_paths=None):\n    \"\"\"\n    Multi-seed adaptive mapper for large\
    \ mesh topologies.\n    \"\"\"\n    if not layer_mappings:\n        # First layer\
    \ - use quadrant-based allocation\n        return self._multi_seed_bfs_mapping(model_layer_info,\
    \ system, preference,\n                                           current_available_crossbars,\
    \ layer_mappings, shortest_paths)\n    else:\n        # Subsequent layers - use\
    \ dependency-aware mapping\n        # Try to map near previous layer allocations\n\
    \        return self._dependency_aware_mapping(model_layer_info, system, preference,\n\
    \                                             current_available_crossbars, layer_mappings,\
    \ shortest_paths)\n```\n\nThis strategy should distribute layers more evenly across\
    \ the 10\xD710 mesh, reduce network congestion, and better utilize the 96 CMOS\
    \ chiplets while respecting the corner I/O locations."
