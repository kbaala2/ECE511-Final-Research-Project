    \ wavefront mapper\n        return self._wavefront_load_balancing_mapper(\n  \
    \          model_layer_info, system, preference,\n            current_available_crossbars,\
    \ layer_mappings, shortest_paths\n        )\n    \n    # Analyze current layer\
    \ characteristics\n    layer_type = model_layer_info.get('layer_type', '')\n \
    \   macs = model_layer_info.get('total_macs', 0)\n    weights = model_layer_info.get('num_weights',\
    \ 0)\n    \n    # Find similar previous layers\n    similar_layer_indices = []\n\
    \    for i, (layer_idx, mappings) in enumerate(layer_mappings):\n        prev_layer_info\
    \ = self._get_layer_info(layer_idx)  # Need to store layer info\n        if prev_layer_info.get('layer_type')\
    \ == layer_type:\n            # Check if size is similar (\xB125%)\n         \
    \   prev_macs = prev_layer_info.get('total_macs', 0)\n            if prev_macs\
    \ > 0 and abs(macs - prev_macs) / prev_macs < 0.25:\n                similar_layer_indices.append(i)\n\
    \    \n    if similar_layer_indices:\n        # Try to map near similar layers\n\
    \        candidate_chiplets = set()\n        for layer_idx in similar_layer_indices:\n\
    \            _, mappings = layer_mappings[layer_idx]\n            for chiplet_id,\
    \ percentage in mappings:\n                if percentage > 20:  # Only consider\
    \ significant allocations\n                    candidate_chiplets.add(chiplet_id)\n\
    \        \n        # Expand to neighbors\n        expanded_candidates = set(candidate_chiplets)\n\
    \        for chiplet_id in candidate_chiplets:\n            neighbors = list(system.chiplet_network.neighbors(chiplet_id))\n\
    \            for neighbor in neighbors:\n                if not system.is_io_chiplet(neighbor):\n\
    \                    expanded_candidates.add(neighbor)\n        \n        # Filter\
    \ to available chiplets\n        available_candidates = []\n        for chiplet_id\
    \ in expanded_candidates:\n            idx = chiplet_id - 1\n            if (current_available_crossbars[idx]\
    \ > 0 and \n                not system.is_io_chiplet(chiplet_id)):\n         \
    \       available_candidates.append(chiplet_id)\n        \n        if available_candidates:\n\
    \            # Use nearest-neighbor but restricted to affinity region\n      \
    \      return self._restricted_nearest_neighbor(\n                model_layer_info,\
    \ system, preference,\n                current_available_crossbars, available_candidates,\n\
    \                layer_mappings, shortest_paths\n            )\n    \n    # No\
