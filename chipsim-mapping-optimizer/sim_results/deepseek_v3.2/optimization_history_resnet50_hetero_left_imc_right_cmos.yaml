- change_summary: "## Analysis of Nearest-Neighbor Mapper Weaknesses\n\n### 1. Key\
    \ Weaknesses of Current Approach\n\n**A. Rigid Linear Search Pattern**\n- The\
    \ mapper starts from a single chiplet (`starting_chiplet`) and expands outward\
    \ based on shortest paths\n- Creates **sequential bottlenecks** where all layers\
    \ map to the same starting region\n- **Problem**: With 96 compute chiplets on\
    \ a 10\xD710 mesh, this creates severe congestion around the starting chiplet\n\
    \n**B. Static Distance Metric Ignoring Resource Availability**\n- Sorting prioritizes\
    \ distance and chiplet metrics (`metric_value`) but **doesn't consider current\
    \ chiplet capacity**\n- The `avail_memory_list` is used only for initial sorting\
    \ but **not updated during allocation**\n- **Consequence**: May allocate to distant\
    \ chiplets while nearby ones have capacity\n\n**C. Poor Handling of Heterogeneous\
    \ Configurations**\n- The mapper doesn't differentiate between **IMC vs CMOS chiplets**\
    \ in allocation logic\n- `_calculate_layer_requirements()` returns different units\
    \ (crossbars vs weights) but allocation treats them uniformly\n- **Issue**: With\
    \ 96 CMOS compute chiplets (2.46M weights each), weight units \u2260 crossbar\
    \ units, causing allocation errors\n\n**D. No Load Balancing Across Mesh**\n-\
    \ Once a chiplet is partially allocated, remaining capacity isn't reconsidered\
    \ for subsequent layers\n- **Result**: Early layers saturate starting region while\
    \ distant chiplets remain underutilized\n\n**E. Single-Point Failure Risk**\n\
    - If starting chiplet fails or gets congested, entire mapping collapses (`\"NO_CHIPLET_CONNECTIONS\"\
    `)\n- No fallback strategy for alternative paths\n\n### 2. Specific Improvement\
    \ Opportunities for This Config\n\n**A. Dynamic Capacity-Aware Allocation**\n\
    ```python\n# Replace static distance sorting with capacity-weighted metric\ndef\
    \ _capacity_weighted_sort(self, chiplet_ids, avail_memory_list, distances):\n\
    \    capacity_score = []\n    for chiplet_id in chiplet_ids:\n        idx = chiplet_id\
    \ - 1\n        capacity = avail_memory_list[idx]\n        distance = distances.get(chiplet_id,\
    \ math.inf)\n        # Weight by capacity/distance ratio\n        score = capacity\
    \ / (distance + 1)  # Avoid division by zero\n        capacity_score.append((chiplet_id,\
    \ score))\n    return sorted(capacity_score, key=lambda x: x[1], reverse=True)\n\
    ```\n\n**B. Layer-Type Specific Mapping**\n- CMOS chiplets (96 units) should map\
    \ **weight-intensive layers** (Conv/FC)\n- IMC chiplets (4 units at corners) should\
    \ map **activation-intensive layers**\n- Add layer-type detection in `_calculate_layer_requirements()`\
    \ and route accordingly\n\n**C. Parallel Exploration from Multiple Seeds**\n-\
    \ For 10\xD710 mesh, start from **4 corner I/O chiplets** simultaneously\n- Use\
    \ **breadth-first expansion** from each corner to utilize entire mesh\n- Implement\
    \ region-based partitioning:\n```python\nregions = {\n    \"top_left\": chiplets\
    \ near I/O chiplet at (0,0),\n    \"top_right\": chiplets near I/O chiplet at\
    \ (0,9),\n    \"bottom_left\": chiplets near I/O chiplet at (9,0),\n    \"bottom_right\"\
    : chiplets near I/O chiplet at (9,9)\n}\n```\n\n**D. Real-Time Capacity Updates**\n\
    - After each partial allocation, **recompute `avail_memory_list`**\n- Re-sort\
    \ chiplets based on updated capacity rather than fixed initial state\n\n**E. Congestion-Aware\
    \ Routing**\n- Integrate **network load feedback** from `shortest_paths`\n- Penalize\
    \ paths through already-allocated chiplets\n- Use `preference[\"performance\"\
    ]` to balance proximity vs load\n\n### 3. Missing Data/Signals the Mapper Should\
    \ Use\n\n**A. Chiplet Type Differentiation**\n- Current logic treats all compute\
    \ chiplets uniformly\n- **Missing**: IMC vs CMOS distinction in allocation decisions\n\
    - **Should use**: `chiplet.type` property to route layer types appropriately\n\
    \n**B. Network Traffic Load**\n- `shortest_paths` only contains topological distances\n\
    - **Missing**: Current communication load on links\n- **Should use**: Real-time\
    \ bandwidth utilization from chiplet network\n\n**C. Layer Dependency Graph**\n\
    - Mapper processes layers independently\n- **Missing**: Inter-layer communication\
    \ patterns (skip connections, residuals)\n- **Should use**: Layer adjacency matrix\
    \ to co-locate dependent layers\n\n**D. Thermal/Power Constraints**\n- No consideration\
    \ of chiplet power budgets\n- **Missing**: Power consumption per chiplet from\
    \ workload\n- **Should use**: Power profiles to avoid hotspots in 10\xD710 mesh\n\
    \n**E. Historical Allocation Patterns**\n- Each mapping starts fresh\n- **Missing**:\
    \ Learning from previous mapping successes/failures\n- **Should use**: Allocation\
    \ history to predict optimal starting points\n\n**F. Cross-Chiplet Communication\
    \ Cost**\n- Assumes all inter-chiplet communication equal\n- **Missing**: Cost\
    \ of transferring partial results between CMOS vs IMC chiplets\n- **Should use**:\
    \ Communication cost matrix based on chiplet types\n\n### Recommended Immediate\
    \ Fixes:\n\n1. **Add chiplet-type awareness** in `_nearest_neighbor_mapper_v3`:\n\
    ```python\nif chiplet.type == \"CMOS\":\n    # Prioritize for weight-dense layers\n\
    \    capacity_score *= weight_density_factor\nelif chiplet.type == \"IMC\":\n\
    \    # Prioritize for activation-dense layers\n    capacity_score *= activation_density_factor\n\
    ```\n\n2. **Implement multi-start expansion**:\n```python\nstarting_chiplets =\
    \ [io_chiplet_ids]  # 4 corner I/O chiplets\nfor start_id in starting_chiplets:\n\
    \    distances = shortest_paths.get(start_id, {})\n    # Allocate proportionally\
    \ from each starting point\n```\n\n3. **Dynamic capacity re-sorting**:\n```python\n\
    # After each allocation iteration:\nremaining_capacity = current_available_crossbars.copy()\n\
    avail_memory_list = [remaining_capacity[i] * chiplet.get_capacity_unit_size()]\n\
    # Re-sort based on updated availability\n```\n\nThese changes would significantly\
    \ improve utilization of the 100-chiplet mesh and reduce congestion around single\
    \ starting points."
