    \        model_layer_info, system, preference,\n        current_available_crossbars,\
    \ layer_mappings, shortest_paths\n    )\n```\n\n## Why This Strategy is Different:\n\
    \n1. **Systematic Distribution**: The wavefront pattern ensures all chiplets get\
