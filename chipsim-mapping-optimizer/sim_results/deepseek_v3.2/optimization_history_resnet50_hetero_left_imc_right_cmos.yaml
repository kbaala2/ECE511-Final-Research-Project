- change_summary: "Looking at your configuration and the previous optimization attempts,\
    \ I'll analyze the fundamental weaknesses and propose a different strategy that\
    \ leverages the specific characteristics of your setup.\n\n## Analysis of Current\
    \ Weaknesses\n\n**Key Issue**: The nearest-neighbor mapper has a **single-point\
    \ expansion bias** that's particularly problematic for your 10\xD710 mesh with\
    \ 96 CMOS compute chiplets. The mapper always starts from either:\n1. The chiplet\
    \ with most available memory (for first layer)\n2. The chiplet with largest allocation\
    \ from previous layer (for subsequent layers)\n\nThis creates a **sequential hotspot\
    \ problem** - layers cluster around initial allocations, causing network congestion\
    \ and underutilization of distant chiplets.\n\n## Proposed Alternative: **Wavefront\
    \ Load-Balancing Mapper**\n\nThis approach treats the mesh as a wavefront that\
    \ propagates allocations systematically across all chiplets, ensuring even distribution.\n\
    \n```python\ndef _wavefront_load_balancing_mapper(self, model_layer_info, system,\
    \ preference, \n                                     current_available_crossbars,\
    \ layer_mappings=None, shortest_paths=None):\n    \"\"\"\n    Maps layers using\
    \ a wavefront pattern that systematically fills the mesh.\n    For 10x10 mesh\
    \ with 96 CMOS chiplets, this ensures even distribution.\n    \"\"\"\n    chiplets\
    \ = system.chiplets\n    num_chiplets = len(chiplets)\n    remaining_capacity\
    \ = current_available_crossbars.copy()\n    \n    layer_name = model_layer_info['name']\n\
    \    crossbars_required = model_layer_info['crossbars_required']\n    action =\
    \ [0] * num_chiplets\n    resources_remaining = crossbars_required\n    \n   \
    \ # Step 1: Identify available compute chiplets\n    available_chiplet_ids = []\n\
    \    for idx in range(num_chiplets):\n        chiplet_id = idx + 1\n        if\
    \ (remaining_capacity[idx] > 0 and \n            not system.is_io_chiplet(chiplet_id)):\n\
    \            available_chiplet_ids.append(chiplet_id)\n    \n    if not available_chiplet_ids:\n\
    \        return remaining_capacity, None, True, \"NO_AVAILABLE_CHIPLETS\"\n  \
    \  \n    # Step 2: Group chiplets by their \"wavefront priority\"\n    # For 10x10\
    \ mesh, create a priority based on distance from all 4 corners\n    # This creates\
    \ a center-outward filling pattern\n    wavefront_priorities = self._calculate_wavefront_priorities(available_chiplet_ids)\n\
    \    \n    # Step 3: Sort chiplets by priority (center first, then outward)\n\
    \    sorted_chiplets = sorted(wavefront_priorities.items(), key=lambda x: x[1])\n\
    \    \n    # Step 4: Allocate using round-robin within priority levels\n    #\
    \ This ensures even distribution across the mesh\n    priority_groups = {}\n \
    \   for chiplet_id, priority in sorted_chiplets:\n        if priority not in priority_groups:\n\
    \            priority_groups[priority] = []\n        priority_groups[priority].append(chiplet_id)\n\
    \    \n    # Process from highest to lowest priority (center to edges)\n    for\
    \ priority in sorted(priority_groups.keys()):\n        chiplets_in_priority =\
    \ priority_groups[priority]\n        \n        # Shuffle within priority for randomness,\
    \ but seeded for reproducibility\n        random.seed(hash(layer_name) % 1000)\n\
    \        random.shuffle(chiplets_in_priority)\n        \n        # Try to allocate\
    \ evenly within this priority level\n        for chiplet_id in chiplets_in_priority:\n\
    \            if resources_remaining <= 0:\n                break\n           \
    \     \n            chiplet_idx = chiplet_id - 1\n            available_units\
    \ = remaining_capacity[chiplet_idx]\n            \n            if available_units\
    \ <= 0:\n                continue\n            \n            # Calculate what\
    \ percentage of this layer fits here\n            units_needed_full = self._calculate_layer_requirements(\n\
    \                model_layer_info, chiplets[chiplet_idx]\n            )\n    \
    \        \n            if units_needed_full <= 0:\n                continue\n\
    \            \n            if crossbars_required > 0:\n                units_needed_for_resources\
    \ = math.ceil(\n                    resources_remaining * units_needed_full /\
    \ crossbars_required\n                )\n            else:\n                units_needed_for_resources\
    \ = 0\n            \n            # Determine allocation strategy based on preference\n\
    \            if preference.get(\"performance\", 1) > 0.7:\n                # Performance\
    \ mode: allocate fully to nearby chiplets first\n                if available_units\
    \ >= units_needed_for_resources:\n                    remaining_capacity[chiplet_idx]\
    \ -= units_needed_for_resources\n                    action[chiplet_idx] = 100\
    \  # Full allocation\n                    resources_remaining = 0\n          \
    \          break\n                else:\n                    # Partial allocation\n\
    \                    alloc_percentage = (available_units * 100 / units_needed_full)\n\
    \                    remaining_capacity[chiplet_idx] = 0\n                   \
    \ action[chiplet_idx] = alloc_percentage\n                    resources_remaining\
    \ -= math.ceil(\n                        alloc_percentage * crossbars_required\
    \ / 100\n                    )\n            else:\n                # Load-balancing\
    \ mode: distribute evenly\n                target_percentage = 100 / len(available_chiplet_ids)\n\
    \                units_for_target = math.ceil(\n                    target_percentage\
    \ * units_needed_full / 100\n                )\n                \n           \
    \     alloc_units = min(available_units, units_for_target)\n                alloc_percentage\
    \ = (alloc_units * 100 / units_needed_full)\n                \n              \
    \  remaining_capacity[chiplet_idx] -= alloc_units\n                action[chiplet_idx]\
    \ = alloc_percentage\n                resources_remaining -= math.ceil(\n    \
    \                alloc_percentage * crossbars_required / 100\n               \
    \ )\n    \n    # Check if allocation succeeded\n    if resources_remaining > 10:\
    \  # Allow small rounding errors\n        print(f\"\u26A0\uFE0F Layer '{layer_name}'\
    \ could not be fully mapped. Remaining: {resources_remaining}\")\n        return\
    \ remaining_capacity, None, True, \"INSUFFICIENT_MEMORY\"\n    \n    # Normalize\
    \ action percentages\n    total_action = sum(action)\n    if total_action > 0\
    \ and not math.isclose(total_action, 100, rel_tol=1):\n        # Scale to 100%\n\
    \        scale_factor = 100 / total_action\n        for i in range(len(action)):\n\
    \            action[i] *= scale_factor\n    \n    return remaining_capacity, action,\
    \ False, None\n\ndef _calculate_wavefront_priorities(self, chiplet_ids):\n   \
    \ \"\"\"\n    Calculate wavefront priorities for chiplets in a mesh.\n    Lower\
    \ priority = closer to center, gets allocated first.\n    \"\"\"\n    priorities\
    \ = {}\n    \n    for chiplet_id in chiplet_ids:\n        # Convert to mesh coordinates\
    \ (0-9, 0-9)\n        row = (chiplet_id - 1) // 10\n        col = (chiplet_id\
    \ - 1) % 10\n        \n        # Calculate distance from center (4.5, 4.5 for\
    \ 10x10)\n        center_row, center_col = 4.5, 4.5\n        distance_from_center\
    \ = math.sqrt(\n            (row - center_row)**2 + (col - center_col)**2\n  \
    \      )\n        \n        # Also consider distance from all 4 corners\n    \
    \    # This creates a balanced priority\n        distances_to_corners = [\n  \
    \          math.sqrt(row**2 + col**2),  # Top-left\n            math.sqrt(row**2\
    \ + (9-col)**2),  # Top-right\n            math.sqrt((9-row)**2 + col**2),  #\
    \ Bottom-left\n            math.sqrt((9-row)**2 + (9-col)**2)  # Bottom-right\n\
    \        ]\n        \n        avg_corner_distance = sum(distances_to_corners)\
    \ / 4\n        \n        # Combined priority: center-first, but balanced across\
    \ quadrants\n        priority = distance_from_center * 0.7 + avg_corner_distance\
    \ * 0.3\n        priorities[chiplet_id] = priority\n    \n    return priorities\n\
    ```\n\n## Complementary Strategy: **Layer-Affinity Grouping**\n\nAdd this to better\
    \ handle layer dependencies:\n\n```python\ndef _layer_affinity_mapper(self, model_layer_info,\
    \ system, preference,\n                          current_available_crossbars,\
