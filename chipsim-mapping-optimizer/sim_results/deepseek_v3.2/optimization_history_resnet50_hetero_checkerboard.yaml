- change_summary: "## Analysis of Nearest-Nighbor Mapper Weaknesses for CHIPSIM Configuration\n\
    \n### 1. Key Weaknesses of Current Nearest-Nighbor Approach\n\n**A. Localized\
    \ Mapping Without Global Optimization**\n- The mapper greedily places each layer\
    \ starting from either:\n  - First layer: highest-available-memory chiplet\n \
    \ - Subsequent layers: chiplet with largest share from previous layer\n- This\
    \ creates a **serial dependency chain** where each layer's placement depends solely\
    \ on the previous layer's largest allocation. This fails to consider:\n  - **Future\
    \ layer requirements** (size, communication patterns)\n  - **Inter-layer dependencies**\
    \ beyond immediate adjacency\n  - **Global balance** of chiplet utilization across\
    \ the entire model\n\n**B. Ignoring Communication Costs**\n- While distances are\
    \ computed via shortest paths, the algorithm **never actually uses distance metrics\
    \ for allocation decisions** beyond sorting.\n- Allocation percentages are determined\
    \ purely by **available capacity**, not by:\n  - Communication latency between\
    \ source/destination chiplets\n  - Network congestion potential (especially on\
    \ mesh topology)\n  - Bandwidth limitations between partitions\n\n**C. Coarse\
    \ Capacity Management**\n- The capacity unit calculation (`_calculate_layer_requirements`)\
    \ treats CMOS chiplets differently (weight units vs IMC crossbars), but:\n  -\
    \ **No consideration of activation memory** (only weight storage)\n  - **No memory\
    \ bandwidth constraints** in allocation decisions\n  - **No compute throughput\
    \ balancing** (all chiplets assumed equal compute power)\n\n**D. Topology-Agnostic\
    \ Placement**\n- The 10x10 mesh with corner IO chiplets creates specific patterns:\n\
    \  - **IO chiplets only at corners** \u2192 data must travel to compute chiplets\n\
    \  - **Checkerboard CMOS distribution** \u2192 compute resources are non-uniformly\
    \ distributed\n- The mapper ignores:\n  - **Proximity to IO chiplets** for input/output\
    \ layers\n  - **Spatial distribution** of CMOS chiplets across mesh\n  - **Network\
    \ bisection bandwidth** limitations\n\n**E. Layer-Type Blindness**\n- The mapper\
    \ treats all layers (conv, fc, attention) identically in placement logic:\n  -\
    \ **No differentiation** between compute-intensive vs memory-intensive layers\n\
    \  - **No consideration** of layer fan-in/fan-out patterns\n  - **No attention\
    \ to** attention layers' unique communication patterns (Q, K, V projections)\n\
    \n**F. Memory Fragmentation**\n- The greedy nearest-neighbor approach leads to:\n\
    \  - **Early exhaustion** of nearby chiplets\n  - **Fragmented memory** across\
    \ chiplet array\n  - **Increased communication distances** for later layers as\
    \ nearby chiplets are depleted\n\n### 2. Specific Opportunities for Improvement\
    \ Given This Config\n\n**A. Exploit Mesh Topology Structure**\n- **Corner IO chiplets**:\
    \ Place early/late layers (input/output) near corners to minimize IO communication\n\
    - **Checkerboard CMOS pattern**: Group layers onto CMOS clusters rather than spreading\
    \ across mixed regions\n- **10x10 mesh**: Use row/column-based placement strategies\
    \ to minimize hop counts\n\n**B. Layer-Type Aware Mapping**\n- **Convolution layers**:\
    \ Map to contiguous blocks of chiplets to minimize intermediate activation transfer\n\
    - **Attention layers**: Map Q/K/V projections to neighboring chiplets to reduce\
    \ cross-chiplet communication\n- **FC layers**: Map based on weight memory requirements\
    \ vs compute needs\n\n**C. Communication-Aware Allocation**\n- **Weight sharing\
    \ between layers**: Place layers with shared weights (e.g., residual connections)\
    \ on same/similar chiplets\n- **Activation flow optimization**: Map layers in\
    \ dataflow order along communication paths\n- **Network congestion avoidance**:\
    \ Avoid overloading specific network links between frequently communicating chiplets\n\
    \n**D. Capacity Balancing**\n- **Memory/Compute ratio**: CMOS chiplets have weight\
    \ storage constraints but high compute - balance layer requirements accordingly\n\
    - **Activation memory**: Consider temporary activation storage needs during mapping\n\
    - **Cross-chiplet communication overhead**: Account for communication capacity\
    \ in allocation decisions\n\n### 3. What Data/Signals the Mapper Currently Ignores\
    \ That It Should Use\n\n**A. Layer Communication Patterns**\n- **Fan-in/fan-out\
    \ degree**: How many preceding/succeeding layers communicate with this layer\n\
    - **Activation size**: Temporary data transfer requirements between layers\n-\
    \ **Weight reuse**: Which layers share weights or have similar weight patterns\n\
    \n**B. Network Performance Metrics**\n- **Link bandwidth**: Capacity of individual\
    \ network links\n- **Hop count penalties**: Actual latency per hop in the mesh\
    \ topology\n- **Congestion hotspots**: Potential bottlenecks in the 10x10 mesh\
    \ (center vs edges)\n\n**C. Chiplet Heterogeneity**\n- **CMOS vs IMC differences**:\
    \ Beyond just capacity units, they have different:\n  - Compute throughput per\
    \ weight unit\n  - Energy efficiency profiles\n  - Memory bandwidth limitations\n\
    - **Physical placement**: Corner IO chiplets have different network connectivity\
    \ than edge/center compute chiplets\n\n**D. Model-Level Information**\n- **Model\
    \ graph structure**: Dependencies between layers beyond sequential order\n- **Critical\
    \ paths**: Layers that dominate overall latency\n- **Memory access patterns**:\
    \ Which layers are memory-intensive vs compute-intensive\n\n**E. Runtime Signals**\n\
    - **Network utilization**: Real-time congestion information during mapping\n-\
    \ **Chiplet temperature/power**: Thermal constraints that affect placement\n-\
    \ **Historical performance**: Past mapping outcomes for similar layers\n\n###\
    \ Recommended Improvements:\n1. **Implement layer graph analysis** to identify\
    \ communication clusters\n2. **Add network-aware cost function** that penalizes\
    \ long-distance allocations\n3. **Use bin-packing algorithms** to minimize fragmentation\
    \ across chiplets\n4. **Differentiate layer types** in placement strategy (conv\
    \ vs attention vs fc)\n5. **Consider IO proximity** for input/output layers in\
    \ ResNet50\n6. **Balance chiplet utilization** across the entire model rather\
    \ than layer-by-layer\n\nThe current mapper is essentially a **capacity-first\
    \ greedy algorithm** with naive proximity sorting. For a 10x10 mesh with heterogeneous\
    \ chiplets running ResNet50, this leads to suboptimal communication patterns and\
    \ unbalanced resource utilization."
