    \ -= units_to_allocate\n        action[chiplet_idx] += actual_pct\n        percentage_remaining\
    \ -= actual_pct\n        resources_remaining -= math.ceil(actual_pct * crossbars_required\
    \ / 100)\n```\n\n### **Change 3: Mesh-Position-Aware Sorting**\n\nEnhance the\
    \ chiplet sorting to consider mesh position:\n\n```python\ndef get_mesh_position_score(chiplet_id,\
    \ mesh_size=10):\n    \"\"\"Score chiplets based on their position in the mesh\"\
    \"\"\n    row = (chiplet_id - 1) // mesh_size\n    col = (chiplet_id - 1) % mesh_size\n\
    \    \n    # Center chiplets have better connectivity (more neighbors)\n    #\
    \ Distance from center\n    center_row = mesh_size // 2\n    center_col = mesh_size\
    \ // 2\n    dist_from_center = abs(row - center_row) + abs(col - center_col)\n\
    \    \n    # Score: higher is better\n    # Max center distance is 9+9=18 for\
    \ corners\n    position_score = 18 - dist_from_center\n    \n    # Bonus for being\
    \ in middle columns/rows (better for east-west traffic)\n    if 3 <= col <= 6:\
    \  # Middle columns\n        position_score += 2\n    if 3 <= row <= 6:  # Middle\
