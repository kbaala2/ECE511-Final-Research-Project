- change_summary: "Looking at your CHIPSIM configuration (10\xD710 mesh, 96 CMOS compute\
    \ chiplets, 4 I/O corner chiplets, ResNet50 workload) and the two previous optimization\
    \ attempts (both showing minimal latency changes), I'll propose a **fundamentally\
    \ different strategy** that addresses core algorithmic limitations in the nearest-neighbor\
    \ mapper.\n\n## 1. Key Weaknesses Exploiting Your Specific Configuration\n\n###\
    \ **A. Mesh Topology Blindness**\nYour 10\xD710 mesh has **significant path diversity**,\
    \ but the mapper only uses shortest-path distance. This ignores:\n- **Edge vs.\
    \ Center:** Edge chiplets have 2-3 neighbors, center chiplets have 4 neighbors\
    \ (higher bandwidth)\n- **Diagonal paths:** Manhattan distance vs. actual network\
    \ routing\n- **I/O corner positioning:** All I/O at corners creates natural communication\
    \ bottlenecks\n\n### **B. \"All-or-Nothing\" Allocation Per Chiplet**\nThe current\
    \ algorithm tries to fully satisfy each layer's needs from the current chiplet\
    \ before moving to the next:\n```python\nif available_units >= units_needed_for_resources:\n\
    \    # Take everything from this chiplet\n    remaining_capacity[chiplet_idx]\
    \ -= units_needed_for_resources\n    alloc_percentage = percentage_remaining\n\
    ```\nThis creates **fragmentation** - a chiplet might have 80% of what's needed,\
    \ but the algorithm skips it entirely.\n\n### **C. No Consideration of Activation\
    \ Communication**\nFor ResNet50 on CMOS chiplets:\n- **Weight stationary:** Weights\
    \ stay on chiplets\n- **Activations move** between layers \u2192 This should drive\
    \ placement decisions\n- **Residual connections** create specific activation merge\
    \ points\n\n## 2. **NEW STRATEGY: Minimum-Cut Activation Flow Optimization**\n\
    \nInstead of optimizing for proximity alone, optimize for **minimizing activation\
    \ movement**. This aligns with CMOS compute characteristics in your config.\n\n\
    ### **Core Insight:** \nEach layer's output activations become the next layer's\
    \ inputs. By placing consecutive layers to minimize activation movement, we reduce\
    \ communication overhead.\n\n### **Implementation Approach:**\n1. **Model activation\
    \ flow** as edges in a graph\n2. **Weight edges** by activation size (from layer\
    \ dimensions)\n3. **Place layers** to minimize total weighted cut size\n\n## 3.\
    \ Specific Code Changes for `_nearest_neighbor_mapper_v3`\n\n### **Change 1: Activation-Aware\
    \ Starting Point Selection**\n\nReplace the simple \"last layer's main chiplet\"\
    \ logic:\n\n```python\ndef get_activation_weighted_starting_chiplets(layer_mappings,\
    \ model_metrics, current_layer_idx):\n    \"\"\"\n    Choose starting chiplets\
    \ based on activation flow from predecessors\n    \"\"\"\n    if not layer_mappings:\n\
    \        # First layer: prioritize chiplets near input I/O\n        io_chiplets\
    \ = [1, 10, 91, 100]  # Corner I/O chiplets in 10\xD710 mesh\n        # Find compute\
    \ chiplets adjacent to input I/O (chiplet 1 as primary input)\n        adjacent_to_io\
    \ = []\n        for chiplet_id in range(1, 101):\n            if not self.system.is_io_chiplet(chiplet_id):\n\
    \                # Check if adjacent to any I/O chiplet\n                for io_id\
    \ in io_chiplets:\n                    if shortest_paths[chiplet_id].get(io_id,\
    \ float('inf')) == 1:\n                        adjacent_to_io.append(chiplet_id)\n\
    \                        break\n        return adjacent_to_io[:4] if adjacent_to_io\
    \ else [6]  # Default to chiplet 6 (near center)\n    \n    # For subsequent layers,\
    \ weight predecessor contributions by activation size\n    activation_weighted_chiplets\
    \ = {}\n    \n    # Look at immediate predecessors (simplified - in practice would\
    \ parse model graph)\n    # For ResNet50, each layer typically has 1-2 predecessors\n\
    \    prev_layer_idx = current_layer_idx - 1\n    \n    if prev_layer_idx >= 0\
    \ and prev_layer_idx < len(layer_mappings):\n        prev_mapping = layer_mappings[prev_layer_idx][1]\n\
    \        \n        # Estimate activation size from previous layer\n        prev_layer_info\
    \ = model_metrics[prev_layer_idx]\n        if prev_layer_info['layer_type'] ==\
    \ 'conv':\n            # Simplified: activation size ~ output channels * spatial\
    \ size\n            # For ResNet50 early layers, this is large\n            activation_size\
    \ = prev_layer_info['out_channels'] * 56 * 56  # Assuming early layer\n      \
    \  else:\n            activation_size = prev_layer_info['out_channels']  # FC\
    \ layers\n        \n        # Weight each chiplet's contribution by its percentage\
    \ in previous layer\n        for chiplet_id, percentage in prev_mapping:\n   \
    \         if percentage > 0:\n                weighted_contrib = activation_size\
    \ * (percentage / 100.0)\n                activation_weighted_chiplets[chiplet_id]\
    \ = \\\n                    activation_weighted_chiplets.get(chiplet_id, 0) +\
    \ weighted_contrib\n    \n    # Also consider skip connections (ResNet50 specific)\n\
    \    # For simplicity, handle layer 16 (first residual add) specially\n    if\
    \ current_layer_idx == 16:  # First residual addition in ResNet50\n        # Layer\
    \ 16 needs inputs from layer 15 and layer 1\n        layer1_mapping = layer_mappings[1][1]\n\
    \        for chiplet_id, percentage in layer1_mapping:\n            if percentage\
    \ > 0:\n                activation_weighted_chiplets[chiplet_id] = \\\n      \
    \              activation_weighted_chiplets.get(chiplet_id, 0) + 100000  # Large\
    \ weight\n    \n    # Return top 2-3 chiplets by activation weight\n    sorted_chiplets\
    \ = sorted(activation_weighted_chiplets.items(), \n                          \
    \  key=lambda x: x[1], reverse=True)\n    return [chiplet_id for chiplet_id, weight\
    \ in sorted_chiplets[:3]]\n```\n\n### **Change 2: Fractional Allocation to Avoid\
    \ Fragmentation**\n\nModify the allocation logic to use partial allocation:\n\n\
    ```python\n# Replace the all-or-nothing logic (lines 368-380) with:\nfor chiplet_id\
    \ in sorted_chiplets_ids:\n    if resources_remaining <= 0 or percentage_remaining\
    \ <= 0:\n        break\n    \n    chiplet_idx = chiplet_id - 1\n    available_units\
    \ = remaining_capacity[chiplet_idx]\n    if available_units <= 0:\n        continue\n\
    \n    units_needed_full = self._calculate_layer_requirements(model_layer_info,\
    \ chiplets[chiplet_idx])\n    if units_needed_full <= 0: \n        continue\n\n\
    \    # NEW: Calculate what percentage of layer this chiplet can handle\n    #\
    \ based on both its capacity and activation flow optimization\n    \n    # Base\
    \ percentage from capacity\n    capacity_pct = min(100, (available_units * 100.0)\
    \ / units_needed_full)\n    \n    # Adjust based on activation flow (if has activation-weighted\
    \ priority)\n    flow_bonus = 1.0\n    if chiplet_id in activation_weighted_starting_chiplets:\n\
    \        # Higher priority for chiplets that minimize activation movement\n  \
    \      position_in_list = activation_weighted_starting_chiplets.index(chiplet_id)\n\
    \        flow_bonus = 1.5 - (position_in_list * 0.2)  # 1.5x, 1.3x, 1.1x\n   \
    \ \n    adjusted_pct = min(capacity_pct * flow_bonus, percentage_remaining)\n\
    \    \n    # Ensure we allocate at least 5% if this chiplet is in priority list\n\
    \    if adjusted_pct < 5 and chiplet_id in activation_weighted_starting_chiplets:\n\
    \        adjusted_pct = min(5, percentage_remaining, capacity_pct)\n    \n   \
    \ if adjusted_pct > 0:\n        # Calculate units needed for this percentage\n\
    \        units_for_pct = math.ceil(units_needed_full * adjusted_pct / 100.0)\n\
    \        \n        # Allocate what's available (capped)\n        units_to_allocate\
    \ = min(units_for_pct, available_units)\n        actual_pct = (units_to_allocate\
