- change_summary: "Based on the previous optimization attempts and the detailed analysis,\
    \ I'll propose a fundamentally different optimization strategy that addresses\
    \ the core weaknesses of the nearest-neighbor approach for this specific configuration.\n\
    \n## **Proposed Optimization: Communication-Cost-Aware Global Placement with Local\
    \ Refinement**\n\n### **Core Strategy: Two-Stage Optimization with Explicit Communication\
    \ Modeling**\n\nInstead of greedy nearest-neighbor placement, use a **global optimization**\
    \ approach that:\n1. First computes optimal placements considering **all layer\
    \ dependencies**\n2. Then refines locally to respect chiplet capacity constraints\n\
    \n### **Key Implementation Changes:**\n\n```python\nclass GlobalCommunicationAwareMapper(ModelMapper):\n\
    \    \"\"\"\n    Two-stage mapper:\n    1. Global placement using communication\
    \ cost minimization\n    2. Local refinement for capacity constraints\n    \"\"\
    \"\n    \n    def __init__(self, system, mapping_function=\"global_comm_aware\"\
    , **kwargs):\n        super().__init__(system, mapping_function, **kwargs)\n \
    \       self.communication_graph = None\n        self.activation_volumes = {}\n\
    \        \n    def _compute_layer_communication_requirements(self, model_metrics):\n\
    \        \"\"\"\n        Pre-compute activation communication volumes between\
    \ layers\n        Critical for weight-stationary mode where activations move\n\
    \        \"\"\"\n        for i, layer in enumerate(model_metrics):\n         \
    \   # For conv layers: activation volume = input_size * output_channels\n    \
    \        # For fc layers: activation volume = batch_size * features\n        \
    \    if layer['layer_type'] == 'conv':\n                # Estimate based on typical\
    \ ResNet50 parameters\n                # input_size = (H * W * in_channels)\n\
    \                # Simplified: use crossbars_required as proxy for activation\
    \ volume\n                self.activation_volumes[i] = layer.get('crossbars_required',\
    \ 1000)\n            else:\n                self.activation_volumes[i] = layer.get('crossbars_required',\
    \ 100)\n    \n    def _build_communication_graph(self, model_metrics):\n     \
    \   \"\"\"\n        Build graph of communication between layers based on ResNet50\
    \ structure\n        \"\"\"\n        self.communication_graph = nx.Graph()\n \
    \       \n        # Add nodes for each layer\n        for i, layer in enumerate(model_metrics):\n\
    \            self.communication_graph.add_node(i, \n                         \
    \                    weight=layer.get('crossbars_required', 0),\n            \
    \                                 layer_type=layer['layer_type'])\n        \n\
    \        # Add edges based on layer dependencies\n        # For ResNet50: sequential\
    \ except for skip connections\n        for i in range(len(model_metrics) - 1):\n\
    \            # Main sequential path\n            comm_volume = self.activation_volumes.get(i,\
    \ 100)\n            self.communication_graph.add_edge(i, i + 1, weight=comm_volume)\n\
    \            \n            # Detect and add skip connections (ResNet specific)\n\
    \            layer_name = model_metrics[i].get('name', '')\n            if 'downsample'\
    \ in layer_name or ('conv' in layer_name and \n                              \
    \              any(x in layer_name for x in ['shortcut', 'skip'])):\n        \
    \        # Find matching layers for skip connection\n                # Simplified:\
    \ connect to layer 2-3 steps ahead\n                if i + 3 < len(model_metrics):\n\
    \                    self.communication_graph.add_edge(i, i + 3, \n          \
    \                                           weight=comm_volume * 0.5)\n    \n\
    \    def _compute_placement_cost(self, placement, model_metrics):\n        \"\"\
    \"\n        Compute total communication cost for a given placement\n        \"\
    \"\"\n        total_cost = 0\n        \n        for u, v, data in self.communication_graph.edges(data=True):\n\
    \            chiplet_u = placement[u]\n            chiplet_v = placement[v]\n\
    \            \n            # Get distance between chiplets (hop count)\n     \
    \       distance = self.shortest_paths.get(chiplet_u, {}).get(chiplet_v, 10)\n\
    \            \n            # Communication volume between layers\n           \
    \ comm_volume = data.get('weight', 100)\n            \n            # Weight by\
    \ layer types (conv layers have higher bandwidth needs)\n            layer_type_u\
    \ = model_metrics[u]['layer_type']\n            layer_type_v = model_metrics[v]['layer_type']\n\
    \            type_multiplier = 2.0 if 'conv' in layer_type_u or 'conv' in layer_type_v\
    \ else 1.0\n            \n            # Cost = distance * volume * type_multiplier\n\
    \            total_cost += distance * comm_volume * type_multiplier\n        \n\
    \        return total_cost\n    \n    def _global_placement_phase(self, model_metrics):\n\
    \        \"\"\"\n        Stage 1: Find initial placement minimizing communication\
    \ cost\n        using simulated annealing\n        \"\"\"\n        n_layers =\
    \ len(model_metrics)\n        n_chiplets = len(self.compute_chiplet_indices)\n\
    \        \n        # Precompute communication requirements\n        self._compute_layer_communication_requirements(model_metrics)\n\
    \        self._build_communication_graph(model_metrics)\n        \n        # Initialize\
    \ random placement\n        current_placement = {}\n        for i in range(n_layers):\n\
    \            # Assign to random compute chiplet\n            chiplet_idx = random.choice(self.compute_chiplet_indices)\n\
    \            current_placement[i] = chiplet_idx + 1  # Convert to 1-based\n  \
    \      \n        current_cost = self._compute_placement_cost(current_placement,\
    \ model_metrics)\n        \n        # Simulated annealing for global optimization\n\
    \        temperature = 1000.0\n        cooling_rate = 0.95\n        iterations\
    \ = 1000\n        \n        for iteration in range(iterations):\n            #\
    \ Generate neighbor: move one random layer to different chiplet\n            layer_to_move\
    \ = random.randint(0, n_layers - 1)\n            old_chiplet = current_placement[layer_to_move]\n\
    \            new_chiplet = random.choice([\n                idx + 1 for idx in\
    \ self.compute_chiplet_indices \n                if idx + 1 != old_chiplet\n \
    \           ])\n            \n            new_placement = current_placement.copy()\n\
    \            new_placement[layer_to_move] = new_chiplet\n            new_cost\
    \ = self._compute_placement_cost(new_placement, model_metrics)\n            \n\
    \            # Acceptance criterion\n            if new_cost < current_cost or\
    \ random.random() < math.exp((current_cost - new_cost) / temperature):\n     \
    \           current_placement = new_placement\n                current_cost =\
    \ new_cost\n            \n            # Cool down\n            temperature *=\
    \ cooling_rate\n        \n        return current_placement, current_cost\n   \
    \ \n    def _capacity_constrained_refinement(self, model_metrics, global_placement):\n\
    \        \"\"\"\n        Stage 2: Adjust placement to respect chiplet capacity\
    \ constraints\n        while minimizing deviation from optimal global placement\n\
    \        \"\"\"\n        n_layers = len(model_metrics)\n        capacity_remaining\
    \ = self.system.get_available_capacity_per_chiplet().copy()\n        \n      \
    \  # Convert capacity to weight units for CMOS chiplets\n        for idx in self.compute_chiplet_indices:\n\
    \            chiplet = self.system.chiplets[idx]\n            # Already in correct\
    \ units from system\n        \n        # Group layers by their global placement\
    \ chiplet\n        layers_by_chiplet = {}\n        for layer_idx, chiplet_id in\
    \ global_placement.items():\n            chiplet_idx = chiplet_id - 1\n      \
    \      layers_by_chiplet.setdefault(chiplet_idx, []).append(layer_idx)\n     \
    \   \n        # Check capacity constraints and reassign if needed\n        final_placement\
    \ = global_placement.copy()\n        \n        for chiplet_idx, layer_indices\
    \ in layers_by_chiplet.items():\n            total_weight_needed = 0\n       \
    \     for layer_idx in layer_indices:\n                layer_info = model_metrics[layer_idx]\n\
    \                weight_needed = self._calculate_layer_requirements(\n       \
    \             layer_info, \n                    self.system.chiplets[chiplet_idx]\n\
    \                )\n                total_weight_needed += weight_needed\n   \
    \         \n            if total_weight_needed > capacity_remaining[chiplet_idx]:\n\
    \                # Need to reassign some layers\n                # Sort layers\
    \ by communication sensitivity (edges in graph)\n                layers_by_sensitivity\
    \ = []\n                for layer_idx in layer_indices:\n                    #\
    \ Calculate sensitivity = sum of edge weights to other layers\n              \
    \      sensitivity = 0\n                    for neighbor in self.communication_graph.neighbors(layer_idx):\n\
    \                        if neighbor in global_placement:\n                  \
    \          edge_data = self.communication_graph.get_edge_data(layer_idx, neighbor)\n\
