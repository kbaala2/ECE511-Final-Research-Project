- change_summary: "Given the previous failed optimization attempts that focused on\
    \ lookahead and contention-aware placement but worsened latency (268K \u2192 426K),\
    \ we need a fundamentally different strategy. The issue appears to be that more\
    \ sophisticated heuristics introduced overhead or made poor tradeoffs. Let's reconsider\
    \ the core problems and try a simpler, more targeted approach.\n\n## 1. Key Weaknesses\
    \ of Current Nearest-Neighbor Approach (Re-evaluated)\n\n### **A. Sequential Chaining\
    \ is Actually NOT the Main Problem**\nThe previous analysis assumed chaining was\
    \ bad, but **for ResNet50, sequential chaining might be optimal** since layers\
    \ execute sequentially (except skip connections). The real issue is:\n\n**Wrong\
    \ starting point selection**: The algorithm chooses starting chiplet based on\
    \ available memory (for first layer) or previous layer location. This creates:\n\
    - **First layer placement randomness**: No consideration of I/O locations or global\
    \ optimization\n- **Poor skip connection handling**: Residual blocks have parallel\
    \ paths that need proximity, but algorithm treats them as sequential\n\n### **B.\
    \ Memory-Centric Sorting Backfires**\n```python\nchiplet_info.sort(key=lambda\
    \ x: (-x[1], -x[2]))  # For first layer: available memory first\nchiplet_info.sort(key=lambda\
    \ x: (x[1], -x[2], -x[3]))  # For subsequent: distance, then available memory\n\
    ```\n**Flaw**: Filling the chiplet with most available memory first causes:\n\
    - **Heterogeneous fragmentation**: Some chiplets become packed, others nearly\
    \ empty\n- **Poor load balancing**: Uneven compute distribution across mesh\n\
    - **Inefficient network utilization**: Concentrated communication paths\n\n###\
    \ **C. Ignoring ResNet50's Residual Structure**\nThe mapper treats ResNet50 as\
    \ a linear chain, but it has:\n- **Skip connections** that need short-distance\
    \ communication\n- **Bottleneck blocks** (1\xD71 convs) with different communication\
    \ patterns\n- **Stage transitions** where feature map sizes change dramatically\n\
    \n### **D. Weight Allocation Proportionality Error**\n```python\nif crossbars_required\
    \ > 0:\n    units_needed_for_resources = math.ceil(resources_remaining * units_needed_full\
    \ / crossbars_required)\n```\nThis assumes **linear scaling** of weights with\
    \ \"crossbars_required\" (a proxy for compute), but:\n- Different layer types\
    \ have different weight-to-compute ratios\n- Small layers may get fragmented across\
    \ too many chiplets\n\n## 2. Specific Opportunities for THIS Configuration\n\n\
    ### **A. Exploit the 4 Corner IO Pattern**\nWith IO at corners (0,0), (0,9), (9,0),\
    \ (9,9) on a 10\xD710 mesh:\n- **Input layer should be near an IO corner** (not\
    \ center!)\n- **Output layer should be near an IO corner** (possibly different\
    \ one)\n- **Intermediate layers should minimize total IO distance sum**\n\n###\
    \ **B. CMOS Compute Heterogeneity Clarification**\nThe mapping file mentions `hetero_center_imc`\
    \ but config shows 96 CMOS chiplets. Need to check if:\n- All CMOS chiplets are\
    \ identical (likely)\n- Or there's hidden heterogeneity not exposed to mapper\n\
    \n### **C. Simple Symmetry Exploitation**\nFor a 10\xD710 mesh with corner IO:\n\
    - **Quadrant-based partitioning**: Split workload into 4 quadrants, each served\
    \ by nearest IO\n- **Mirror placement**: Place symmetric layers in symmetric positions\n\
    \n## 3. What the Mapper Should Actually Use\n\n### **A. Layer Characteristics\
    \ from Model Definition**\nThe mapper receives `model_layer_info` but doesn't\
    \ differentiate:\n- **Conv vs FC vs Attention** layers have different communication\
    \ patterns\n- **Kernel size** affects weight reuse locality\n- **Stride** affects\
    \ activation reduction\n\n### **B. Residual Block Awareness**\nEven without full\
    \ dependency graph, we can identify residual blocks by:\n- Layer naming patterns\
    \ in ResNet50\n- Input/output channel matching\n- Skip connection presence\n\n\
    ### **C. Corner IO Distance Matrix**\nPrecompute distances **to all 4 IO chiplets**,\
    \ not just to previous layer:\n```python\ndistance_to_nearest_io = min(distance_to_io1,\
    \ distance_to_io2, ...)\ndistance_to_all_io_sum = sum(distances_to_all_io)\n```\n\
    \n---\n\n## **NEW OPTIMIZATION STRATEGY: Corner-First Symmetric Placement**\n\n\
    Instead of complex lookahead or contention modeling (which failed), implement:\n\
    \n### **Strategy 1: IO-Proximity Weighted Placement**\n```python\ndef _corner_aware_mapper_v4(self,\
    \ model_layer_info, ...):\n    # For each chiplet, compute: distance_to_previous_layer\
    \ AND distance_to_nearest_IO\n    \n    # Early layers (first 10%): weight IO\
    \ distance heavily (input from sensors)\n    # Middle layers (80%): weight previous\
    \ layer distance normally  \n    # Final layers (last 10%): weight IO distance\
    \ heavily again (output to actuators)\n    \n    # Adjust weights based on layer\
    \ position in network\n```\n\n### **Strategy 2: Quadrant-Based Load Balancing**\n\
    ```python\n# Divide mesh into 4 quadrants around center\nquadrants = {\n    'NW':\
    \ chiplets with x<5, y<5,\n    'NE': chiplets with x>=5, y<5,\n    'SW': chiplets\
    \ with x<5, y>=5,\n    'SE': chiplets with x>=5, y>=5\n}\n\n# Assign each residual\
    \ block to a quadrant\n# Place layers within block in same quadrant\n# Balance\
    \ compute across quadrants\n```\n\n### **Strategy 3: Skip Connection Optimization**\n\
    ```python\n# Detect residual blocks (consecutive conv layers with same in/out\
    \ channels)\n# Ensure skip connection layers are placed:\n# 1. Same chiplet if\
    \ possible\n# 2. Adjacent chiplets if not\n# 3. Same quadrant as minimum\n```\n\
    \n### **Strategy 4: Reverse Order Placement**\nPrevious attempts started at input.\
    \ Try **starting at output and working backward**:\n- Place classifier near output\
    \ IO corner\n- Work backward through network\n- Residual blocks naturally cluster\
    \ when placed backward\n\n---\n\n## **Implementation Priorities**\n\n1. **Fix\
    \ first layer placement**: Start near an IO chiplet, not based on available memory\n\
    2. **Add residual block detection**: Group 2-3 layers that form a block\n3. **Balance\
    \ across mesh quadrants**: Simple round-robin across 4 quadrants\n4. **Output\
    \ layer placement**: Ensure near an IO chiplet\n\n**Minimal change with maximum\
    \ impact**:\n```python\n# In _nearest_neighbor_mapper_v3, modify starting_chiplet\
    \ selection:\nif not layer_mappings:  # First layer\n    # Instead of choosing\
    \ based on available memory\n    # Choose chiplet closest to an IO chiplet (e.g.,\
    \ near corner)\n    io_chiplets = [1, 10, 91, 100]  # For 10x10 mesh corners\n\
    \    # Find compute chiplet with min distance to any IO\n    starting_chiplet\
    \ = min(available_chiplet_ids, \n                          key=lambda cid: min(shortest_paths[cid][io]\
    \ for io in io_chiplets))\n```\n\nThis addresses the most glaring issue: first\
    \ layer placed arbitrarily far from IO, forcing long-distance activation movement\
    \ for the entire inference pipeline.\n\n**Second simple fix**: When placing layers,\
    \ prefer chiplets with **moderate available memory** (not maximum) to avoid fragmentation:\n\
    ```python\n# Instead of: chiplet_info.sort(key=lambda x: (x[1], -x[2], -x[3]))\n\
    # Use: chiplet_info.sort(key=lambda x: (x[1], -abs(x[2] - ideal_memory), -x[3]))\n\
    # where ideal_memory = total_capacity * 0.7 (aim for 70% utilization)\n```\n\n\
    These two minimal changes should significantly reduce latency without the complexity\
    \ that caused regression in previous attempts."
