- change_summary: "## 1. Key weaknesses of the current nearest\u2011neighbor approach\n\
    \nThe `_nearest_neighbor_mapper_v3` suffers from several fundamental flaws that\
    \ limit mapping quality for the given 10\xD710 mesh with 96 CMOS compute chiplets\
    \ and 4 corner I/O chiplets:\n\n- **Per\u2011layer greedy placement ignores the\
    \ global model graph.**  \n  Each layer is mapped independently using only the\
    \ previous layer\u2019s dominant chiplet as a seed. The full dependency graph\u2014\
    including skip connections, branches, and the precise data volumes flowing between\
    \ them\u2014is never consulted. This prevents the algorithm from making inter\u2011\
    layer trade\u2011offs to reduce total communication distance across the entire\
    \ network.\n\n- **Communication cost is limited to hop count, with no data\u2011\
    volume sensitivity.**  \n  The only cost metric is the shortest\u2011path length\
    \ in the mesh. The mapper does not weigh edges by the size of activation data\
    \ moving between layers (e.g., large feature maps after early conv stages). Consequently,\
    \ a high\u2011volume edge might be placed across many hops while a tiny edge is\
    \ placed close\u2011by, purely by accident.\n\n- **Greedy chiplet selection promotes\
    \ spreading and fragmentation.**  \n  After sorting neighbouring chiplets by distance,\
    \ the mapper prefers the one with the *most* available memory. This scatters a\
    \ layer across many partially\u2011filled chiplets, increasing the number of communication\
    \ endpoints (multicast/aggregation) and leaving the chiplet array fragmented.\
    \ Packing layers more densely would reduce NoC load.\n\n- **No awareness of I/O\
    \ chiplet positions.**  \n  The first and last layers must fetch inputs/weights\
    \ from and write results to off\u2011chip memory via the four corner I/O chiplets.\
    \ The mapper completely ignores this; the starting chiplet for the first layer\
    \ is simply the one with the most available memory, possibly far from any I/O\
    \ node, harming both latency and energy.\n\n- **Static, meaningless \u201Cperformance\u201D\
    \ tie\u2011breaker.**  \n  The `active_metric` from a chiplet\u2019s node attribute\
    \ is used only as a tertiary sort key after distance and memory. It does not adapt\
    \ to real\u2011time conditions (NoC load, thermal state) and has no correlation\
    \ with actual performance or energy efficiency, rendering the preference mechanism\
    \ ineffective.\n\n- **Coarse allocation logic hides CMOS weight\u2011capacity\
    \ subtleties.**  \n  For CMOS, the method treats `crossbars_required` (the layer\u2019\
    s total weight count) as a unit of measure and uses proportional scaling. While\
    \ mathematically consistent, it ignores that different weight distributions (due\
    \ to channel partitioning) may not align perfectly with the chiplet\u2019s physical\
    \ memory banks, leading to subtle under\u2011 or over\u2011estimation of actual\
    \ capacity usage.\n\n- **No attempt to minimise chiplet count per layer.**  \n\
    \  Spreading a layer across more chiplets increases multicast fan\u2011out and\
    \ partial\u2011sum aggregation traffic. The current algorithm has no penalty for\
    \ using many chiplets; it happily splits a layer into tiny fragments just to use\
    \ up available capacity, even when fewer, slightly more\u2011loaded chiplets would\
    \ be better.\n\n## 2. Specific opportunities for improvement given this config\n\
    \nThe 10\xD710 mesh of homogeneous CMOS compute chiplets with corner I/O nodes\
    \ offers clear avenues for optimisation:\n\n- **Model\u2011graph\u2011aware global\
    \ placement.**  \n  Build an internal representation of the DNN as a weighted\
    \ directed graph (nodes = layers, edges = activation sizes). Use iterative methods\
    \ (simulated annealing, force\u2011directed placement, or integer linear programming)\
    \ to assign layers to chiplets while minimising total communication cost \\(\\\
    sum_{e} \\text{data\\_volume}(e) \\times \\text{distance}(\\text{src}, \\text{dst})\\\
    ), subject to capacity constraints.\n\n- **Pack layers to minimise chiplet count.**\
    \  \n  Favour placements that keep each layer on as few chiplets as possible,\
    \ even if that increases occupancy on a few chiplets. A bin\u2011packing heuristic\
    \ with a distance penalty can achieve this, reducing multicast and aggregation\
    \ overhead.\n\n- **I/O\u2011guided first/last layer placement.**  \n  Explicitly\
    \ constrain the first layer to lie within a small Manhattan\u2011distance radius\
    \ of one of the four corner I/O chiplets. Likewise, place the final classification\
    \ layer near an I/O chiplet to shorten result off\u2011loading. In this checkerboard\
    \ of 96 compute + 4 I/O, the four corners are natural entry/exit points.\n\n-\
    \ **Volume\u2011weighted distance metric.**  \n  Instead of simple hop count,\
    \ use the product of calculated communication volume and hop distance. Pre\u2011\
    compute pairwise distances and, for each potential placement, sum the data\u2011\
    volume\xD7distance over all consumer layers.\n\n- **Dynamic NoC\u2011load anticipation.**\
    \  \n  Introduce a simple load model based on the injection rate each chiplet\
    \ will generate (proportional to its allocated compute). Use that to inflate effective\
    \ distances when many flows share the same mesh links, discouraging placements\
    \ that create hotspots.\n\n- **Refined CMOS partitioning granularity.**  \n  Use\
    \ the actual weight capacity of each chiplet in weight\u2011units (here 2.46M\
    \ weights) directly, and map the exact number of output channels/neurons that\
    \ can fit, without rounding to a \u201Cpercentage\u201D abstraction. This yields\
    \ more accurate partitioning and avoids channel under\u2011flow.\n\n## 3. What\
    \ data/signals the mapper currently ignores that it should use\n\nThe following\
    \ information is readily available but not exploited by the nearest\u2011neighbor\
    \ mapper:\n\n- **Full layer dependency graph** \u2013 all edges (including skip\
    \ connections in ResNet\u201150) annotated with **activation sizes** (in bytes/frames)\
    \ that travel between layers.  \n- **Per\u2011chiplet available weight units**\
    \ (real\u2011time) \u2013 not merely a capacity flag, but the exact number of\
    \ free parameters, so the allocator can pack as many channels/neurons as each\
    \ chiplet can hold.  \n- **I/O chiplet locations and bandwidth** \u2013 which\
    \ corners host I/O, and the distance from candidate chiplet to the nearest I/O\
    \ node.  \n- **Multicast fan\u2011out of splitted layers** \u2013 when a layer\
    \ is placed on \\(k\\) chiplets, the input must be sent to all \\(k\\); the mapper\
    \ should account for this extra traffic.  \n- **Injection\u2011rate estimation**\
    \ \u2013 each chiplet\u2019s expected packets\u2011per\u2011cycle for both computation\
    \ results and weight/input traffic, to predict congestion.  \n- **Actual compute\u2011\
    chiplet type (CMOS) memory hierarchy constraints** \u2013 beyond total weight\
    \ count, details like SRAM banks, weight\u2011stationarity handling, and the cost\
    \ of reloading weights could influence the mapping when `weight_stationary` is\
    \ true.  \n- **Real\u2011time thermal or utilisation feedback** \u2013 the `active_metric`\
    \ could be replaced with dynamic indicators (e.g., utilisation level, temperature)\
    \ to balance load and avoid hot spots, making it a true preference parameter.\
    \  \n\nIncorporating these signals would move the mapper from a myopic, greedy\
    \ assignment toward a globally\u2011optimised, communication\u2011aware and I/O\u2011\
    conscious mapping, directly benefitting latency and energy efficiency in the simulation."
