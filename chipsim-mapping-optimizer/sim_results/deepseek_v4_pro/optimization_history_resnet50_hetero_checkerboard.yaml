- change_summary: "1. **Key weaknesses of the current nearest-neighbor approach**\n\
    \   - **Sequential, greedy, per\u2011layer placement without global optimization.**\
    \ The mapper processes layers one by one, only using the previous layer\u2019\
    s dominant chiplet as a seed. It never sees the full model graph, so it cannot\
    \ trade off chiplet assignments across multiple layers to reduce end\u2011to\u2011\
    end communication.\n   - **Ignores inter\u2011layer communication cost and traffic\
    \ patterns.** Although it tries to keep consecutive layers close by starting from\
    \ the last layer\u2019s main chiplet, it does not account for data dependencies\
    \ like residual connections, input multicast to split layers, or aggregation of\
    \ partial sums. The cost of moving feature maps is not modeled.\n   - **Over\u2011\
    simplified chiplet selection criteria.** After sorting by distance, it prefers\
    \ chiplets with *more* available memory (i.e., less utilized) and then by a static,\
    \ abstract metric. This can scatter a layer across distant chiplets if the nearest\
    \ ones run out of capacity, but it doesn\u2019t weigh the extra hop count against\
    \ the benefit of using a less\u2011loaded chiplet.\n   - **Fragmentation\u2011\
    prone allocation.** The greedy filling of the nearest chiplet first, then spilling\
    \ to the next nearest, can fragment chiplet capacity, leaving many partially\u2011\
    filled chiplets. Later large layers may then be forced to use many disjoint chiplets,\
    \ increasing communication diameter.\n   - **No awareness of the I/O chiplet positions.**\
    \ Input and output layers must communicate with off\u2011chip memory via the four\
    \ corner I/O chiplets, but the mapper ignores this. Layers far from corners will\
    \ suffer higher latency and congestion.\n   - **Static \u201Cperformance\u201D\
    \ metric is unused meaningfully.** The `active_metric` is taken from node attributes\
    \ but never adjusted based on runtime conditions (e.g., NoC load). It serves only\
    \ as a tie\u2011breaker and does not reflect actual communication or computation\
    \ efficiency.\n   - **Unrealistic assumption for CMOS capacity units.** For CMOS\
    \ chiplets, the method computes `units_needed_for_resources = ceil(resources_remaining)`\
    \ (because `units_needed_full == crossbars_required`), which effectively treats\
    \ each 1\u2011weight\u2011unit as equivalent to 1 percent of the layer. This loses\
    \ any nuance about how many chiplet weight units are actually consumed per neuron/channel,\
    \ and may lead to inaccurate splitting.\n\n2. **Specific opportunities for improvement\
    \ given this 10\xD710 mesh, CMOS\u2011compute configuration**\n   - **Incorporate\
    \ the model topology as a graph.** Use the workload\u2019s adjacency structure\
    \ and per\u2011edge activation sizes to define a communication cost that the mapper\
    \ should minimize. For ResNet\u201150, explicitly account for residual connections.\n\
    \   - **Use a global placement algorithm.** Instead of a single pass, apply iterative\
    \ optimization (e.g., simulated annealing, force\u2011directed placement) that\
    \ jointly assigns layers to chiplets to reduce total communication distance, weighted\
    \ by data volume.\n   - **Pack layers to minimize chiplet spread.** Prefer to\
    \ keep each layer on as few chiplets as possible (even if they are slightly more\
    \ utilized) to lower multicast and aggregation overhead. A bin\u2011packing variant\
    \ with a distance penalty could achieve this.\n   - **Treat the first and last\
    \ layers with I/O\u2011aware placement.** Place the first Conv layer and the last\
    \ FC layer near corner I/O chiplets to reduce off\u2011chip traffic latency.\n\
    \   - **Integrate NoC load estimation.** Use a simple model of injection rate\
    \ and contention to adjust the distance cost, so the mapper can react to \u201C\
    hot\u201D regions on the mesh.\n   - **Refine the CMOS allocation granularity.**\
    \ Use the actual weight count and chiplet weight capacity directly to distribute\
    \ weights in a way that better respects on\u2011chip memory constraints (the current\
    \ logic works but is needlessly opaque).\n\n3. **What data/signals the mapper\
    \ currently ignores that it should use**\n   - **The full layer dependency graph**\
    \ \u2013 which layers supply inputs to which subsequent layers (including branches\
    \ and skip connections), and the size of those activations.\n   - **Per\u2011\
    edge communication volume** \u2013 bytes/frames flowing between layers, which\
    \ directly impacts the cost of a particular chiplet placement.\n   - **Chiplet\u2011\
    level workload state** \u2013 current memory occupancy, number of active flows,\
    \ and projected injection rates that could cause congestion.\n   - **I/O chiplet\
    \ locations and bandwidth** \u2013 the distance from first/last layers to corner\
    \ I/O chiplets, which matters for activation loading and results offloading.\n\
    \   - **Multicast cost when a layer is split** \u2013 the fan\u2011out cost of\
    \ sending the same input tile to multiple target chiplets, which grows with the\
    \ number of destination nodes and their displacement.\n   - **Network link capacities\
    \ and latency** \u2013 the mapper uses only hop count from precomputed shortest\
    \ paths; it does not consider that different paths may have different bandwidth/load,\
    \ although for a uniform mesh this is less critical.\n   - **The real\u2011time\
    \ performance/energy trade\u2011off** \u2013 the current `active_metric` node\
    \ attribute is a static constant; a dynamic metric that reflects the current chiplet\u2019\
    s computational efficiency (e.g., utilisation, temperature) could guide better\
    \ scheduling."
