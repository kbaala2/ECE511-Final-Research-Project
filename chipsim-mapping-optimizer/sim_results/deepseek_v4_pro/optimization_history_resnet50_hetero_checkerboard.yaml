- change_summary: "### 1. Key weaknesses of the current nearest\u2011neighbor approach\n\
    *(Compounded with previous optimisation attempts)*\n\nThe `_nearest_neighbor_mapper_v3`\
    \ has already been analysed; the most damaging weaknesses for this 10\xD710 mesh\
    \ with corner I/O remain:\n\n- **No structural awareness of the model\u2019s staging.**\
    \ ResNet\u201150 has clear stages (initial conv, four bottleneck blocks, final\
    \ pooling/FC). The mapper treats every layer independently, ignoring the fact\
    \ that communication is **intense within a stage** but lighter across stage boundaries.\
    \ This leads to layers from the same stage being scattered across the entire mesh,\
    \ inflating NoC traffic.\n- **I/O\u2011blind start and end placement**. Input\
    \ activations must enter from one of the four corner I/O chiplets, and final results\
    \ must exit the same way. Placing the first layer far from any corner (as the\
    \ greedy seed does) adds unnecessary latency for every inference.\n- **Uncontrolled\
    \ chiplet fragmentation.** Greedy fill\u2011by\u2011nearest spreads a layer across\
    \ many chiplets because it favours whichever has the most free memory at that\
    \ instant. That creates a \u201Cpepper\u2011pot\u201D layout where subsequent\
    \ layers find fewer contiguous blocks, forcing them to fragment even more.\n-\
    \ **No penalty for large multicast/aggregation fan\u2011out.** When a layer is\
    \ split across *k* chiplets, the preceding layer must multicast its activations\
    \ to all *k*, and the following layer must collect partial sums from *k* sources.\
    \ The algorithm has no notion of this cost, so it happily creates high\u2011fan\u2011\
    out mappings.\n\nPrevious suggestions (global simulated annealing, volume\u2011\
    weighted distance, etc.) are powerful but remain monolithic optimisers that do\
    \ not exploit the repetitive block structure of ResNet\u201150 nor the fact that\
    \ the chiplet array is large and homogeneous. A **different** strategy should\
    \ exploit this structure explicitly.\n\n### 2. A different optimisation strategy:\
    \ Stage\u2011Region Mapping with I/O Anchors\n\nThe core idea is to partition\
    \ the 10\xD710 mesh into **geometric regions** that are aligned with the model\u2019\
    s natural stages, and then to map each stage as a contiguous unit into its assigned\
    \ region. This approach directly addresses the structural and fragmentation weaknesses\
    \ while keeping I/O distance under control.\n\n#### 2.1 Pre\u2011compute stage\
    \ requirements and region dimensions\n- Analyse the workload\u2019s layer list\
    \ to identify stage boundaries (using layer index and skip connection patterns).\
    \ For ResNet\u201150, the four main bottleneck stages (`layer1`\u2013`layer4`)\
    \ each contain several residual blocks.\n- For each stage, compute:\n  - Total\
    \ weight memory required (sum of `num_weights` for all layers in the stage).\n\
    \  - Total computation intensity (total MACs).\n  - Communication pattern: data\
    \ volumes between layers, especially the output of the last layer of a stage that\
    \ feeds the next stage.\n\n#### 2.2 Divide the mesh into contiguous, rectangular\
    \ regions\nGiven the 96 compute chiplets are on a 10\xD710 grid, create 4 **core\
    \ regions** (one per bottleneck stage) + 2 **IO\u2011adjacent regions** for the\
    \ initial and final layers. The regions are designed so that:\n\n- Each region\u2019\
    s total weight capacity (number of chiplets \xD7 2.46M weights) can accommodate\
    \ its stage\u2019s weight requirement with a small headroom (say 10%).\n- Regions\
    \ are placed to **minimise the Manhattan distance** from the nearest I/O chiplet\
    \ for the first and last region, and to minimise inter\u2011region distance for\
    \ consecutive stages.\n- Regions are **compact** (ideally rectangles) to keep\
    \ intra\u2011stage communication hops low.\n\nThe assignment of regions to coordinates\
    \ can be solved once with a simple heuristic: sort stages by weight demand, then\
    \ place them in a spiral fashion starting from the four corners. For instance:\n\
    \  - **Region 0** (initial conv + first few layers) \u2192 anchored to corner\
    \ (0,0) (north\u2011west I/O).\n  - **Region 1** (layer1) \u2192 adjacent eastward.\n\
    \  - **Region 2** (layer2) \u2192 south of Region 1.\n  - **Region 3** (layer3)\
    \ \u2192 west of Region 2.\n  - **Region 4** (layer4) \u2192 adjacent to the second\
    \ I/O corner (0,9) or (9,0) depending on traffic flow.\n  - **Region 5** (final\
    \ FC layers) \u2192 anchored to the remaining nearest I/O corner.\n\nThe specific\
    \ geometry can be refined based on the actual stage weight demands, but the principle\
    \ is to keep **heavy communication inside a region confined to a small, rectangular\
    \ block**.\n\n#### 2.3 Map individual layers inside each region using a modified\
    \ nearest\u2011neighbor packer\nOnce each stage is confined to its region, the\
    \ internal mapping becomes:\n\n- The first layer of a stage is placed on the chiplet\
    \ in that region that has the **smallest Manhattan distance to the centroid of\
    \ the previous stage\u2019s output chiplet(s)** (for inter\u2011stage communication)\
    \ or to the nearest I/O chiplet (for the first stage).  \n- Subsequent layers\
    \ are packed within the region using a **capacity\u2011constrained nearest\u2011\
    neighbor fill**, but with a hard constraint: they **may only use chiplets inside\
    \ the region**. This eliminates distant spills.\n- Inside the region, the mapper\
    \ still sorts neighbouring chiplets by hop count and then available memory, but\
    \ now the search space is drastically smaller and contiguous, preventing fragmentation\
    \ from spilling into far\u2011away chiplets.\n- If a layer cannot fit within the\
    \ region (unlikely if the region was sized correctly), the mapper may \u201Cborrow\u201D\
    \ chiplets from adjacent unused regions, but with a heavy distance penalty that\
    \ is only accepted when absolutely necessary, preserving the compact layout.\n\
    \n#### 2.4 Explicit multicast/aggregation cost for split layers\nWithin a region,\
    \ when a layer must be split across multiple chiplets (because it is too large\
    \ for one), the mapper adds a penalty proportional to the product of the number\
    \ of target chiplets and the average Manhattan distance among them. This penalty\
    \ is used to break ties when choosing between placing the rest of the layer on\
    \ a slightly more distant chiplet versus splitting it over many nearby ones, favouring\
    \ a smaller fan\u2011out even if it means higher occupancy on a few chiplets.\n\
    \n#### 2.5 Expected benefits\n- **Dramatically reduced NoC hop count** for the\
    \ majority of data transfers because the most voluminous stage\u2011internal traffic\
    \ stays within a small rectangle (e.g., 4\xD74 or 5\xD75).\n- **I/O latency nearly\
    \ minimised** because the first and last layers are forced to be close to corner\
    \ chiplets.\n- **Less fragmentation** \u2013 each region\u2019s chiplet capacity\
    \ is dedicated to one stage, so subsequent stages do not interfere and layers\
    \ are naturally packed tighter.\n- **Simpler multicast** \u2013 because the region\
    \ is rectangular and small, multicast destinations remain close, reducing fan\u2011\
    out cost.\n- **The mapping remains a one\u2011pass algorithm**, avoiding the runtime\
    \ of global SA/ILP while still capturing the most important structural constraints.\n\
    \n### 3. Data and signals the new strategy uses that the old mapper ignored\n\n\
    - **Model stage partitioning** \u2013 derived from the workload\u2019s layer list\
    \ and skip connections, a grouping of layers that belong to the same bottleneck\
    \ block.\n- **Stage\u2011level weight memory sum** \u2013 required to size regions\
    \ correctly; the old mapper only looked at layer\u2011level requirements in isolation.\n\
    - **Actual chiplet weight capacity** (2.46M weights) used to layout region dimensions,\
    \ rather than treating it as an abstract \u201Ccapacity unit\u201D.\n- **I/O chiplet\
    \ coordinates** \u2013 used to anchor the start and end regions, which the greedy\
    \ nearest\u2011neighbour completely overlooked.\n- **Multicast fan\u2011out count**\
    \ \u2013 used inside regions to penalise excessive splitting, enabling a controlled\
    \ trade\u2011off between capacity and communication.\n- **Geometric adjacency**\
    \ \u2013 the mapper now respects a predefined spatial partition of the chiplet\
    \ grid, which ensures that layers that communicate a lot are physically co\u2011\
    located even before distance\u2011based tie\u2011breaking kicks in.\n\nThis stage\u2011\
    region approach is a structural optimisation that complements, rather than duplicates,\
    \ previous proposals (SA, volume\u2011weighted distance). It leverages the homogeneous\
    \ checkerboard layout and the natural hierarchy of ResNet\u201150 to achieve low\u2011\
    latency mappings with minimal algorithmic complexity."
