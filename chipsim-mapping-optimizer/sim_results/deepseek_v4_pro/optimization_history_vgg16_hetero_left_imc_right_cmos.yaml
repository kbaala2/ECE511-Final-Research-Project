- change_summary: "### 1. Key Weaknesses of the Current Nearest-Neighbour Approach\
    \ (Recap)\n\nThe `_nearest_neighbor_mapper_v3` suffers from **layer\u2011by\u2011\
    layer myopia**, **propagation of a poor initial seed**, and **fragmentation driven\
    \ by a shifting anchor**.  \n- After the first layer, the \u201Cstarting chiplet\u201D\
    \ is always the one that held the largest fraction of the **previous** layer\u2019\
    s output channels.  \n- This causes the spatial centre of the mapping to drift\
    \ with every layer, especially when a layer is heavily split or when the maximum\u2011\
    percentage chiplet lies at the border of the mesh.  \n- Consequently, even though\
    \ each layer\u2019s allocations are individually near\u2011neighbour\u2013optimal,\
    \ the global placement spreads across the mesh, increasing average hop distance\
    \ for activation traffic and stranding useful capacity in isolated pockets.\n\n\
    ### 2. Opportunities Given the Homogeneous CMOS Mesh\n\nThe system provides 96\
    \ identical CMOS compute chiplets on a 10\xD710 mesh, running a weight\u2011stationary,\
    \ all\u2011at\u2011once weight\u2011loading scheme.  \n- **No heterogeneity**\
    \ \u2192 the mapper does not need to differentiate chiplet types.  \n- **Weight\u2011\
    stationary** \u2192 activation communication dominates; keeping all layer partitions\
    \ within a compact region is paramount.  \n- **VGG16** \u2192 early layers have\
    \ small weight footprints but large activation volumes; the huge FC layers have\
    \ enormous weight requirements.  \n\nA simple yet powerful improvement is to **anchor\
    \ the entire model around a single, central chiplet** and only expand outward\
    \ when that anchor and its immediate neighbours are exhausted. This creates a\
    \ contiguous, low\u2011diameter placement \u201Cblob\u201D that minimizes activation\
    \ movement across the whole network.\n\n### 3. Data the Mapper Currently Ignores\n\
    \n- **The very concept of a \u201Cmodel anchor\u201D** \u2013 the mapper resets\
    \ its reference point per layer, discarding the benefit of a persistent, spatially\
    \ central location.  \n- **The uniform capacity of chiplets** \u2013 because all\
    \ compute chiplets are identical, the choice of anchor can be made once based\
    \ on topological centrality without worrying about type\u2011specific constraints.\
    \  \n- **Total activation volume per layer** \u2013 while not strictly required\
    \ for a fixed\u2011anchor strategy, using it could further refine which layers\
    \ should be placed at the core of the blob, but is secondary to fixing the anchor\
    \ itself.  \n\n### \U0001F527 Proposed Optimization: Fixed Anchor with Controlled\
    \ Expansion\n\n**Strategy**  \n- Select a **single seed chiplet** for the **entire\
    \ model** \u2013 the one with the best centrality (minimum average hop distance\
    \ to all other compute chiplets) and highest available capacity among central\
    \ nodes.  \n- For **every layer**, start the nearest\u2011neighbour search from\
    \ this *same seed*.  \n- Only if the seed and all its immediate neighbours (e.g.,\
    \ distance \u2264 1) are fully occupied does the search radius increase.  \n-\
    \ This turns the mapping into a **region\u2011growing** process that naturally\
    \ maintains a tight cluster.\n\n**Concrete code modification in `_nearest_neighbor_mapper_v3`**\
    \  \n\n```python\ndef _nearest_neighbor_mapper_v3(self, model_layer_info, system,\
    \ preference,\n                                current_available_crossbars, layer_mappings=None,\n\
    \                                shortest_paths=None):\n    # ... (beginning unchanged)\n\
    \    \n    # NEW: Persist a model\u2011level anchor chiplet\n    if not hasattr(self,\
    \ '_model_anchor_chiplet'):\n        # Compute centrality once for the whole model\n\
    \        centralities = {}\n        for chiplet_id in available_chiplet_ids:\n\
    \            dists = shortest_paths[chiplet_id]\n            # average distance\
    \ to all other compute chiplets\n            avg_dist = sum(d for cid, d in dists.items()\n\
    \                           if not system.is_io_chiplet(cid)) / (len(compute_indices)\
    \ - 1)\n            centralities[chiplet_id] = avg_dist\n        # pick most central\
    \ among those with highest capacity (tie\u2011break by free memory)\n        best_anchor\
    \ = min(centralities, key=lambda cid: (centralities[cid], -avail_memory_list[cid-1]))\n\
    \        self._model_anchor_chiplet = best_anchor\n    \n    # For the first layer,\
    \ use the model anchor; for subsequent layers, still use it\n    if not layer_mappings:\n\
    \        starting_chiplet = self._model_anchor_chiplet\n    else:\n        # Instead\
    \ of last layer\u2019s max chiplet, keep the anchor\n        starting_chiplet\
    \ = self._model_anchor_chiplet\n        # Optionally, if the anchor and its neighbours\
    \ are completely exhausted,\n        # fall back to the old behaviour as a safety\
    \ net.\n        # (Simple check: if remaining_capacity[starting_chiplet-1] <=\
    \ 0 and\n        #  all d=1 neighbours also have capacity <= 0, then pick the\
    \ old anchor)\n    \n    # ... rest of allocation loop remains identical\n```\n\
    \n**Why it\u2019s different from the previous attempt**  \nThe prior suggestion\
    \ proposed **weighted centroids** and **global two\u2011phase pre\u2011reservation**,\
    \ both of which require non\u2011trivial changes to the mapping pipeline (global\
    \ layer sizing, forward\u2011looking capacity checks). In contrast, the fixed\u2011\
    anchor strategy is a **local change** that reuses the existing nearest\u2011neighbour\
    \ logic, making it far less brittle while directly attacking the root cause of\
    \ fragmentation: the drifting starting point.\n\n**Expected Impact**  \n- Average\
    \ communication distance for activations will drop sharply because most layers\
    \ will reside in a compact radius around the central anchor.  \n- Fewer mapping\
    \ failures from stranded capacity, as the algorithm grows outward in a controlled\
    \ fashion.  \n- Implementation risk is minimal; the change can be toggled with\
    \ a single flag and rolled back if necessary."
