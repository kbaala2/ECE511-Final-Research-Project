- change_summary: "### 1. Key Weaknesses of the Current Nearest\u2011Neighbor Approach\n\
    \nThe core `_nearest_neighbor_mapper_v3` algorithm, even after the fixed\u2011\
    anchor improvement (Iteration 2), still suffers from a **data\u2011oblivious placement\
    \ pattern** that inflates activation traffic on the 10\xD710 mesh:\n\n- **No inter\u2011\
    layer locality preservation**  \n  Each layer is mapped independently: the algorithm\
    \ always starts from the anchor (Iteration 2) and expands outward. It **never\
    \ considers which chiplets already hold the previous layer\u2019s partitions**,\
    \ forfeiting the opportunity to reuse the same physical locations and eliminate\
    \ network communication between consecutive layers. In VGG16, many consecutive\
    \ Conv layers have similar dimensions; placing them on the same chiplet where\
    \ possible would completely avoid activation movement.\n\n- **Excessive layer\
    \ fragmentation**  \n  The algorithm splits layers across multiple chiplets as\
    \ soon as one chiplet runs out of capacity, but it does not try to **pack a layer\
    \ into as few chiplets as possible**. A layer scattered over 5 or 6 chiplets requires\
    \ multicast of its input activation to all those chiplets and then a reduce of\
    \ partial outputs for the next layer. In weight\u2011stationary mode, this multicast\
    \ becomes the dominant cost, and the current mapper inadvertently maximises it\
    \ by spreading layers thinly.\n\n- **Greedy, capacity\u2011driven expansion ignores\
    \ communication topology of the current layer**  \n  Chiplets are sorted by (distance\
    \ from anchor, free memory, metric). Because free memory is the secondary key,\
    \ a chiplet that is slightly farther but can accommodate the entire layer is often\
    \ skipped in favour of a nearer chiplet that can only take a fraction. This produces\
    \ a fragmented layout where a layer\u2019s partitions are scattered across many\
    \ near\u2011by but insufficiently large nodes, even though a single slightly\u2011\
    farther chiplet could have co\u2011located the whole computation.\n\n- **The anchor\
    \ mechanism still allows \u201Cdrift\u201D when the anchor is exhausted**  \n\
    \  When the anchor and its immediate neighbourhood are full, the algorithm reverts\
    \ to the farthest ends of the sorted list, which may be in a completely different\
    \ region of the mesh, leading to isolated islands of computation that communicate\
    \ over long distances.\n\n### 2. Specific Opportunities for Improvement Given\
    \ This Config\n\nThe combination of a **homogeneous CMOS compute mesh**, **weight\u2011\
    stationary mode**, **all\u2011at\u2011once weight loading**, and a **deep feed\u2011\
    forward network (VGG16)** invites a fundamentally different tactic:  \n**Maximise\
    \ consecutive\u2011layer colocation and minimise partition fragmentation.**\n\n\
    - **Colocate subsequent layers on the same chiplets**  \n  After mapping layer\
    \ *N*, the partitions of *N* reside on a set of chiplets *C<sub>N</sub>*. For\
    \ layer *N+1*, the mapper should first attempt to place its partitions **exactly\
    \ on *C<sub>N</sub>***, using whatever capacity remains. Only when those chiplets\
    \ are completely full should it spill to the nearest neighbours of the set *C<sub>N</sub>*.\
    \ This directly exploits the weight\u2011stationary property: weights never move,\
    \ so if two layers reside on the same chiplet, their activations never enter the\
    \ network at all.\n\n- **Layer packing: try to fit the entire layer on one chiplet**\
    \  \n  For each layer, compute the required capacity units needed to host it entirely.\
    \ Sort candidate chiplets by **whether they can hold the whole layer** (capacitors\
    \ that can fully accommodate get a huge priority boost, then by distance to the\
    \ layer\u2019s preferred center). This cuts multicast endpoints dramatically for\
    \ compute\u2011intensive layers. For VGG16\u2019s large FC layers that cannot\
    \ fit on a single chiplet (they require ~4.9M weights), they will still be split,\
    \ but the early Conv layers with small weight footprints can often be consolidated\
    \ on 1\u20132 chiplets.\n\n- **Use the set of previous layer chiplets as a \u201C\
    warm\u201D starting set**  \n  Instead of a single global anchor, the mapper can\
    \ maintain a **\u201Cworking set\u201D** \u2013 the chiplets that just processed\
    \ the previous layer. For the first layer, the working set can be a single central\
    \ chiplet (as done now). For every subsequent layer, the working set is the union\
    \ of chiplets that held any partition of the previous layer. The mapping then\
    \ expands from this set in a minimal\u2011spanning\u2011tree fashion. This ensures\
    \ that the spatial centre of the model naturally follows the data flow, while\
    \ still keeping the overall footprint compact.\n\n- **Weight the sorting by capacity\u2011\
    to\u2011need ratio**  \n  When deciding which chiplet to assign the remaining\
    \ fraction of a layer, prefer chiplets whose remaining capacity matches the needed\
    \ fraction closely, to avoid leaving tiny stranded capacities that can\u2019t\
    \ be used later. This reduces fragmentation of unit capacity and helps future\
    \ layers fit entirely on a single chiplet.\n\n### 3. Data/Signals the Mapper Currently\
    \ Ignores That It Should Use\n\n| Ignored Data | Why It Matters |\n|-------------|----------------|\n\
    | **The exact chiplet IDs of the previous layer\u2019s partitions** (not just\
    \ the max\u2011percentage one) | Placing the next layer on the same chiplets eliminates\
    \ activation movement entirely for those partition pairs. |\n| **Whether a single\
    \ chiplet can hold the whole layer** | Fragmented layouts multiply multicast traffic;\
    \ packing the layer onto one chiplet removes that layer from the network entirely.\
    \ |\n| **Remaining capacity after partial allocation of a layer** (stranded fragments)\
    \ | The mapper could avoid creating tiny, unusable capacity pockets by selecting\
    \ chiplets whose remaining capacity aligns well with the needed workload, preserving\
    \ larger contiguous blocks for future layers. |\n| **The exact activation tensor\
    \ size** (height \xD7 width \xD7 channels) for the current layer | The cost of\
    \ broadcasting an activation to multiple chiplets is proportional to its volume.\
    \ The mapper could prioritise keeping large\u2011activation layers (early VGG\
    \ convs) on fewer, larger chiplets, even if they are slightly farther from the\
    \ anchor. |\n| **Future large\u2011layer weight requirements** (a simple \u201C\
    look\u2011ahead\u201D of the model) | VGG16\u2019s FC layers dominate weight capacity.\
    \ Pre\u2011reserving a handful of central, high\u2011capacity chiplets (e.g.,\
    \ 4\u20136 nodes) for these layers prevents them from being strangled by early\
    \ Conv allocations, guaranteeing compact placement of the biggest communication\
    \ generators. |\n\n### Proposed Improvement Strategy (Different from Iteration\
    \ 2)\n\n**\u201CColocate & Pack\u201D** \u2013 a locality\u2011first scheme with\
    \ greedy layer consolidation.\n\n1. **Initialise working set** for layer 0 as\
    \ {most central chiplet with enough free capacity}.\n2. **For each subsequent\
    \ layer L**:  \n   a. Calculate how many capacity units are required to host L\
    \ *entirely*.  \n   b. First, try to place L **fully** on any chiplet from the\
    \ working set that has enough capacity. If multiple, pick the one with maximum\
    \ free capacity (to leave room for further colocation).  \n   c. If no single\
    \ chiplet from the working set can hold L entirely, try to place it on a **subset**\
    \ of working set chiplets *without involving any new chiplet*. (i.e., partition\
    \ only within the working set, keep partitions as few as possible).  \n   d. If\
    \ the working set is insufficient, expand to the **nearest neighbours** of the\
    \ working set, prioritizing those that can take the largest fraction of the remaining\
    \ requirement in one shot (to minimise partition count).  \n   e. After placing\
    \ L, update the working set to be the set of chiplets that actually received partitions\
    \ of L.  \n\nThis approach does not require a global pre\u2011reservation plan;\
    \ it is a greedy **data\u2011flow\u2011following expansion** that naturally clusters\
    \ the entire VGG16 pipeline into a small region while aggressively reducing on\u2011\
    chip network hops. Because it prioritises complete colocation, activation multicast\
    \ is minimised and many layers will run entirely within a single chiplet. The\
    \ computational cost of the mapper itself is negligible, as it only evaluates\
    \ chiplets in the vicinity of the working set.\n\n**Why it is different from Iteration\
    \ 2**  \nIteration 2 introduced a fixed global anchor to stop the spatial drift,\
    \ but still scattered layers uniformly around that anchor without regard for inter\u2011\
    layer locality. This proposal **replaces the static anchor with a dynamic working\
    \ set** and adds explicit checks for full\u2011layer packing, directly addressing\
    \ the communication cost that the weight\u2011stationary config makes paramount."
