- change_summary: "### 1. Key Weaknesses of the Current Nearest-Neighbor Approach\n\
    \n**a. Greedy, myopic layer\u2011by\u2011layer placement**  \nEach layer is placed\
    \ in isolation with no look\u2011ahead to future layers. The algorithm commits\
    \ to a chiplet selection based solely on the current state, which can fragment\
    \ memory and strand large amounts of capacity on far\u2011away chiplets. Deep\
    \ networks like VGG16, with its large early layers and smaller later ones, are\
    \ particularly vulnerable: heavy early allocations may exhaust nearby chiplets,\
    \ forcing later layers to use remote nodes or fail entirely even when total capacity\
    \ is sufficient.\n\n**b. Over\u2011reliance on the previous layer\u2019s maximum\u2011\
    percentage chiplet**  \nFor all layers after the first, the starting chiplet is\
    \ fixed to the one that hosted the largest fraction of the preceding layer\u2019\
    s output channels. This creates a rigid chain that can propagate a poor initial\
    \ choice across the entire model. If that chiplet sits at a topological edge or\
    \ is already surrounded by exhausted neighbours, subsequent layers are forced\
    \ into suboptimal placements regardless of better alternatives.\n\n**c. Distance\
    \ metric is only hop\u2011count, not weighted by data volume**  \nThe mapper sorts\
    \ candidates by shortest\u2011path length to the starting chiplet, but completely\
    \ ignores the size of activation tensors flowing between layers. Two placements\
    \ with the same hop count but vastly different communication costs (because of\
    \ different output tensor dimensions) are treated identically, missing opportunities\
    \ to re\u2011order allocations to reduce actual traffic.\n\n**d. Ignores the full\
    \ distribution of the previous layer**  \nOnly the single most\u2011occupied chiplet\
    \ is used to anchor the next layer. In reality, a layer\u2019s output partitions\
    \ are spread across multiple chiplets (e.g., 40% on A, 30% on B, 30% on C). The\
    \ next layer\u2019s input must collect data from **all** of them, so the optimal\
    \ placement should minimise the distance to the entire set, weighted by the data\
    \ volume from each. The current heuristic discards this critical structure.\n\n\
    **e. Capacity\u2011first, topology\u2011second ordering masks spatial fragmentation**\
    \  \nThe first layer starts on the chiplet with the largest free memory (plus\
    \ a small tie\u2011break metric), without regard for network centrality. Subsequent\
    \ layers always fill the nearest available chiplet until capacity is exhausted.\
    \ This often fills compact local clusters, leaving large, isolated pockets of\
    \ capacity far from where later layers would most benefit from them.\n\n**f. Preference\
    \ for performance/energy is cosmetic**  \nThe `active_metric` stored on network\
    \ nodes is used only as a tertiary sorting key (after distance and free memory).\
    \ In practice, its influence on chiplet ranking is negligible, so the mapping\
    \ is essentially insensitive to the user\u2019s stated performance/energy\u2011\
    efficiency preference.\n\n---\n\n### 2. Specific Opportunities for Improvement\
    \ Given This Config\n\n**a. Cluster\u2011based, region\u2011growing placement**\
    \  \nWith a 10\xD710 mesh of 96 homogeneous CMOS compute chiplets and 4 corner\
    \ I/Os, a natural improvement is to place the entire VGG16 model in a compact,\
    \ contiguous region. For example, start at a central chiplet and grow a breadth\u2011\
    first \u201Cblob\u201D for all layers, only expanding outward when internal capacity\
    \ is exhausted. This drastically reduces average hop\u2011distance for inter\u2011\
    layer communication and avoids fragmented islands of free capacity.\n\n**b. Weighted\
    \ centroid for inter\u2011layer placement**  \nFor each layer, compute the **centroid**\
    \ (center of mass) of the previous layer\u2019s chiplet distribution, weighted\
    \ by the partition percentages. Use that centroid as the starting point for the\
    \ next layer\u2019s nearest\u2011neighbour search, rather than the single max\u2011\
    percentage chiplet. This directly minimises the total activation traffic, which\
    \ is the dominant communication cost in weight\u2011stationary mode.\n\n**c. Global\
    \ planning for VGG16\u2019s known structure**  \nVGG16 has large early convolutional\
    \ blocks followed by huge fully\u2011connected layers. A one\u2011pass allocator\
    \ can reserve the highest\u2011capacity chiplets for the FC layers (which have\
    \ the most weights) and map the smaller\u2011weight early layers to perimeter\
    \ chiplets, keeping the core free for later demands. This can be implemented as\
    \ a simple two\u2011phase strategy: first, estimate total capacity needed per\
    \ layer group; second, pre\u2011assign regions of the mesh to each group.\n\n\
    **d. Activate the weight\u2011stationary hint**  \nBecause `weight_stationary:\
    \ true`, weights never move after loading. The mapper should therefore prioritise\
    \ minimising activation communication. It could directly use per\u2011layer output\
    \ tensor sizes (input_activation dimensions) when computing weighted distances,\
    \ favouring chiplet assignments that keep large activation flows short.\n\n**e.\
    \ Use mesh coordinates for smarter \u201Cseed\u201D selection**  \nInstead of\
    \ starting at the chiplet with the most free memory, select a central node (e.g.,\
    \ one with minimal average Manhattan distance to all other compute chiplets) for\
    \ the first layer. This statistically reduces the chance that the entire mapping\
    \ drifts toward a corner and isolates capacity.\n\n---\n\n### 3. Data/Signals\
    \ the Mapper Currently Ignores That It Should Use\n\n| Ignored Data | Why It Matters\
    \ |\n|-------------|----------------|\n| **Activation tensor sizes** (height,\
    \ width, channels) of each layer | Communication cost is proportional to activation\
    \ volume, not just hop count. Large tensors should be kept close together across\
    \ consecutive layers. |\n| **Full chiplet distribution of the previous layer**\
    \ (all chiplet IDs and their percentages) | The next layer needs data from **all**\
    \ previous partitions. Using the weighted centroid or minimum\u2011spanning\u2011\
    tree distance to the whole set reduces total traffic. |\n| **Future layer resource\
    \ requirements** (weight/weight\u2011unit counts of upcoming layers) | Enables\
    \ reservation of suitable chiplets for large layers (e.g., VGG16\u2019s FC layers)\
    \ and avoids stranding capacity that will be needed later. |\n| **Chiplet physical\
    \ positions (x,y coordinates) and network centrality** | Central nodes minimise\
    \ average hop distance to the rest of the mesh, making them better seeds for the\
    \ first layer and for any layer that will later be widely connected. |\n| **Dataflow\
    \ mode (weight\u2011stationary)** | In weight\u2011stationary mode, activation\
    \ movement dominates. The mapper could explicitly optimise for multicast or reduction\
    \ patterns rather than treating network distance uniformly. |\n| **Detailed link\
    \ bandwidth/latency information** (from the YAML chiplet mapping or mesh definition)\
    \ | While the simulation uses Garnet with a fixed flit size, the mapper could\
    \ pre\u2011compute link capacities to avoid congesting low\u2011bandwidth edges,\
    \ even on a simple mesh where all links are equal. |\n| **Output channel partitioning\
    \ granularity** | The layer partitioner splits output channels proportionally,\
    \ but the mapper does not evaluate whether a coarser or finer split would pack\
    \ better into available capacity units, leading to unused crossbar rows/columns\
    \ and potential mapping failures. |\n\nBy incorporating these signals, the mapper\
    \ could evolve from a simplistic nearest\u2011neighbor heuristic into a topology\u2011\
    \ and traffic\u2011aware placement tool that is far more robust for large, deep\
    \ networks like VGG16 on a 10\xD710 mesh."
