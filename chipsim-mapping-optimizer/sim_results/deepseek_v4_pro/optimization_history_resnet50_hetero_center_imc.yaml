- change_summary: "## 1. Key Weaknesses of the Current Nearest\u2011Neighbor Approach\n\
    \n### 1.1 Linear\u2011only mapping \u2013 ignores layer dependency graph\n- The\
    \ mapper processes layers sequentially (`layer_mappings[-1]`) and uses the last\
    \ layer\u2019s \u201Cmaximum\u2011percentage chiplet\u201D as the seed for the\
    \ next layer.  \n- **Consequence:** Skip/residual connections (abundant in ResNet\u2011\
    50) are completely invisible. Layers that must communicate large activations across\
    \ a skip path may end up placed far apart, inflating latency and energy.\n\n###\
    \ 1.2 Greedy, capacity\u2011blind splitting\n- It always first tries to fill the\
    \ nearest chiplet to capacity, then spills over to the next nearest, etc.  \n\
    - **Consequence:** A layer that could easily fit *entirely* on a slightly farther\
    \ chiplet is unnecessarily split into many small pieces \u2192 huge increase in\
    \ inter\u2011chiplet communication for every inference step.\n\n### 1.3 \u201C\
    Last layer\u2019s heaviest chiplet\u201D is a poor seed\n- Selecting the chiplet\
    \ that holds the largest fraction of the previous layer ignores where the *rest*\
    \ of the previous layer is located. Data must be gathered from *all* previous\u2011\
    layer chiplets, not just the majority one.  \n- **Consequence:** The algorithm\
    \ does not minimise the weighted average distance to the previous layer\u2019\
    s actual distribution; it just pulls the next layer toward a single point, often\
    \ leaving the aggregate communication cost high.\n\n### 1.4 Ignores communication\
    \ cost (volume \xD7 distance)\n- Sorting only by hop distance, then by available\
    \ memory, treats every bit equally.  \n- **Consequence:** A layer that will receive\
    \ a huge activation tensor (e.g., early conv layers) may be placed several hops\
    \ away, while a tiny layer gets the closest chiplet \u2013 a poor cost/benefit\
    \ ratio.\n\n### 1.5 No awareness of I/O chiplet positions\n- I/O chiplets are\
    \ correctly excluded from mapping, but their locations (corners of the 10\xD7\
    10 mesh) are not used to reduce off\u2011chip traffic.  \n- **Consequence:** The\
    \ first and last layers of the network may land far from any I/O chiplet, increasing\
    \ the latency and energy of loading weights and streaming input/output data.\n\
    \n### 1.6 Preference weighting is not implemented\n- The `preference` dictionary\
    \ picks the `active_metric` (performance vs. energy), but the numeric weights\
    \ (1.0 vs. 0.0) are never used to scale cost functions.  \n- **Consequence:**\
    \ The \u201Cperformance\u201D vs. \u201Cenergy\u2011efficiency\u201D trade\u2011\
    off has no effect; the mapping behaves identically regardless of user preference.\n\
    \n### 1.7 Fragmentation\u2011inducing first\u2011layer selection\n- For the first\
    \ layer, the mapper sorts available chiplets by capacity only, then chooses the\
    \ top one.  \n- **Consequence:** It may burn the largest contiguous capacity on\
    \ a small layer, leaving later large layers with only fragmented space, forcing\
    \ many splits.\n\n---\n\n## 2. Specific Opportunities for Improvement Given This\
    \ Config\n\n### 2.1 Leverage the fact that most ResNet\u201150 layers fit on a\
    \ single CMOS chiplet\n- Chiplet capacity: **2.46\u202FM weights**.  \n  - `conv1`\
    \ (7\xD77, 3\u219264): 9\u202F408 weights  \n  - `conv2_x` blocks (3\xD73, 64\u2192\
    64): 36\u202F864 weights  \n  - `conv3_x` (3\xD73, 128\u2192128): 147\u202F456\
    \ weights  \n  - `conv4_x` (3\xD73, 256\u2192256): 589\u202F824 weights  \n  -\
    \ `conv5_x` (3\xD73, 512\u2192512): 2\u202F359\u202F296 weights (fits with margin).\
    \  \n- **Improvement:** Modify the mapper to **prefer placing a whole layer onto\
    \ a single chiplet** whenever possible. Scan all chiplets that can hold the layer\u2019\
    s total weights, and use a cost function that weighs the benefit of no splitting\
    \ against slightly higher hop distance.\n\n### 2.2 Build a communication\u2011\
    cost\u2011aware cost function\n- Compute the data volume between layers from the\
    \ workload (total MACs / input\u2011activation size / output size).  \n- For each\
    \ candidate chiplet, calculate `cost = \u03A3\u1D62 (volume_i \xD7 distance_to_chiplet_i)`,\
    \ where `i` runs over all chiplets that hold portions of the previous layer (or\
    \ previous layers for multiple inputs).  \n- Select the chiplet that minimises\
    \ this weighted communication cost while still offering enough capacity for the\
    \ layer (or for a large fraction if splitting is unavoidable).\n\n### 2.3 Honour\
    \ skip connections with a dependency graph\n- Parse the model definition (or workload)\
    \ to identify which layers\u2019 outputs feed into which layers.  \n- When placing\
    \ a layer, consider the **union** of all its direct predecessors, using the same\
    \ volume\u2011weighted distance criterion.\n\n### 2.4 Co\u2011locate input and\
    \ output layers near I/O chiplets\n- For `conv1` (first layer) and the final classifier\
    \ (`fc`), add a penalty term for distance to the nearest I/O chiplet.  \n- This\
    \ reduces the cost of loading initial activations and final results, as well as\
    \ the weight\u2011loading cost for those layers.\n\n### 2.5 Implement a look\u2011\
    ahead or backtracking step\n- Greedy placement often suffers from myopia. A simple\
    \ two\u2011pass approach would help:  \n  1. First pass \u2013 estimate which\
    \ layers can be kept whole and tentatively assign them to chiplet regions.  \n\
    \  2. Second pass \u2013 resolve fragmentation and minor splits using a local\
    \ search (e.g., simulated annealing on the per\u2011layer chiplet assignments).\n\
    \n### 2.6 Utilise the preference weights meaningfully\n- Incorporate a \u03BB\
    \ factor: `total_cost = \u03BB\xB7latency + (1\u2011\u03BB)\xB7energy`. Use the\
    \ network topology and chiplet energy models (if available) to estimate both components.\n\
    \n---\n\n## 3. Data/Signals the Mapper Currently Ignores That It Should Use\n\n\
    | Ignored Signal | Why It Matters | How to Use It |\n|---------------|----------------|----------------|\n\
    | **Activation sizes** (input/output width, height, channels) | Determines the\
    \ volume of data transferred between layers; essential for balancing communication\
    \ cost. | Weight distances by data volume when choosing a chiplet for the next\
    \ layer. |\n| **Layer dependency graph / skip connections** | Residual sums, concat\
    \ layers, etc. create data flows that do not follow the linear layer order. |\
    \ Use topological ordering and multi\u2011predecessor distance calculations. |\n\
    | **Distance to I/O chiplets** | Affects off\u2011chip bandwidth/latency for weight\
    \ loading and for frame input/output. | Add an I/O\u2011proximity bonus for the\
    \ first and last layers, and weight\u2011loading penalty proportional to layer\u2019\
    s weight count \xD7 hop distance. |\n| **Chiplet\u2011to\u2011chiplet link bandwidth\
    \ / latency** | Not all hops are equal; congestion is a concern in a large mesh.\
    \ | Simple model: cost = hops \xD7 data_volume / link_bw. Could consider maximum\
    \ injection rate. |\n| **Chiplet occupancy/fragmentation pattern across layers**\
    \ | A greedy algorithm that ignores future layers can paint itself into a corner.\
    \ | Track occupancy per chiplet and prefer to keep large contiguous capacity available\
    \ for future heavy layers. |\n| **Weight\u2011loading strategy (\u201Call_at_once\u201D\
    )** | Weights are loaded once from off\u2011chip memory; spreading a layer\u2019\
    s weights across many chiplets increases loading time. | Penalise placements that\
    \ split a layer when a unified placement is possible. |\n| **Chiplet performance\
    \ / energy efficiency per MAC** | If chiplets are heterogeneous, this should steer\
    \ mapping. Even for homogeneous CMOS, energy per MAC may differ based on utilisation.\
    \ | If available, use metric to break ties and to quantify energy cost of splitting.\
    \ |\n\nBy incorporating these missing signals, the mapper could dramatically reduce\
    \ inter\u2011chiplet traffic, avoid unnecessary layer splitting, and produce a\
    \ mapping tuned both to the application graph (ResNet\u201150) and the specific\
    \ hardware (10\xD710 mesh, 96 CMOS chiplets)."
