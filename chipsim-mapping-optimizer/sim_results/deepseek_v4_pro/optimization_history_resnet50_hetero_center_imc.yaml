- change_summary: "## 1. Key Weaknesses of the Current Nearest\u2011Neighbor Approach\n\
    \nThe `_nearest_neighbor_mapper_v3` has several critical flaws that severely degrade\
    \ performance on a 96\u2011chiplet CMOS mesh running weight\u2011stationary ResNet\u2011\
    50:\n\n1. **Linear layer processing ignores ResNet\u201150\u2019s residual topology**\
    \  \n   Only the \u201Clast layer\u2019s heaviest chiplet\u201D serves as the\
    \ anchor for the next layer. Skip connections (which feed a layer\u2019s output\
    \ many steps ahead) are completely invisible, so layers that must exchange large\
    \ activation tensors across blocks often end up on opposite sides of the mesh.\n\
    \n2. **Greedy splitting that wastes chiplet contiguity**  \n   The mapper always\
    \ fills the nearest chiplet first, even if the entire layer could reside **unsplit**\
    \ on a slightly farther chiplet. Since nearly every ResNet\u201150 layer fits\
    \ within 2.46\u202FM weights, this policy creates unnecessary multi\u2011chiplet\
    \ partitions that multiply inter\u2011chiplet activation traffic per inference\
    \ step.\n\n3. **Distance metric is blind to activation volume**  \n   Hops are\
    \ treated as a uniform cost, ignoring the fact that early layers carry hundreds\
    \ of thousands of bytes of activations while later layers transfer only a few\
    \ thousand. High\u2011volume links thus often traverse many hops, while low\u2011\
    volume links get the closest chiplet \u2013 the opposite of what a cost\u2011\
    effective mapping should do.\n\n4. **First\u2011layer placement maximises fragmentation**\
    \  \n   The very first layer is placed on the chiplet with the largest free capacity,\
    \ disregarding the needs of future heavy layers (e.g., `conv5_x` blocks with 2.36\u202F\
    M weights). This often consumes the ideal location for a later large layer, forcing\
    \ that layer to split or move to a distant chiplet.\n\n5. **Ignorance of I/O chiplet\
    \ positions**  \n   With weight\u2011stationary, all\u2011at\u2011once loading,\
    \ the distance from I/O chiplets (corners) to the chiplet that holds a layer\u2019\
    s weights directly impacts weight\u2011loading latency and the latency of streaming\
    \ input/output frames. The mapper never uses this information to pull the first\
    \ and last layers toward the corners.\n\n6. **Preference mechanism is defunct**\
    \  \n   The numeric `performance`/`energy_efficiency` weights are parsed but never\
    \ factored into chiplet selection. The mapping outcome is identical regardless\
    \ of the user\u2019s desired trade\u2011off.\n\n7. **No capacity reservation or\
    \ look\u2011ahead**  \n   The mapper commits decisions layer\u2011by\u2011layer\
    \ without forecasting which future layers will need large contiguous blocks. This\
    \ fragments free space, making it impossible to place later large layers without\
    \ expensive splits.\n\n## 2. Specific Opportunities for Improvement Given This\
    \ Config\n\nThe 96 CMOS chiplets (each 2.46\u202FM weights) on a 10\xD710 mesh,\
    \ plus weight\u2011stationary execution, offer clear optimisation targets:\n\n\
    - **Whole\u2011layer placement**: Because most ResNet\u201150 layers fit entirely\
    \ on a single chiplet, the mapper should prefer an unsplit placement even if it\
    \ means using a chiplet 1\u20112 hops farther away. A layer split across N chiplets\
    \ requires N\u2011way unicast/multicast of input activations and N\u2011way reduction\
    \ of outputs, which is far costlier than moving the activations an extra hop.\n\
    \n- **Activation\u2011volume\u2011weighted distance**: Use the actual tensor dimensions\
    \ (input image size, channels) to estimate byte volume per edge. When selecting\
    \ a chiplet for layer L, minimise the **weighted sum of distances to all chiplet(s)\
    \ holding predecessor layers**, where the weight is the volume of data flowing\
    \ from that predecessor to L. This automatically places high\u2011volume edges\
    \ on short paths.\n\n- **I/O\u2011proximity seeding**: Place the first convolutional\
    \ layer and the final fully\u2011connected layer as close as possible to any I/O\
    \ chiplet (corners). This reduces the distance for off\u2011chip weight loads\
    \ and frame I/O, cutting total simulation latency.\n\n- **Capacity reservation\
    \ for heavy layers**: Identify the heaviest layers (conv4_x, conv5_x) and reserve\
    \ intact chiplet(s) for them **before** mapping lighter layers. By scheduling\
    \ large layers first, the mapper avoids fragmentation and guarantees that no heavy\
    \ layer needs to be split.\n\n- **Skip\u2011connection awareness**: Build a dependency\
    \ graph from the workload/model definition. For layers with multiple predecessors\
    \ (e.g., element\u2011wise addition after a shortcut), compute the cost as the\
    \ sum over all direct predecessors, not just the immediate predecessor. This encourages\
    \ co\u2011locating layers that share skip connections.\n\n- **Make preference\
    \ operational**: Incorporate the \u03BB from preference into the cost function:\
    \ `cost = \u03BB \xD7 hops + (1-\u03BB) \xD7 hops \xD7 data_volume`, allowing\
    \ the user to trade latency (hops) against energy (hops \xD7 volume).\n\n## 3.\
    \ What Data/Signals the Mapper Currently Ignores That It Should Use\n\n| Ignored\
    \ Signal | Why It Matters | How to Use It |\n|----------------|----------------|----------------|\n\
    | **Activation tensor sizes** (input/output width, height, channels) | Determines\
    \ actual byte volume transferred per inference step; critical for prioritising\
    \ short paths for high\u2011volume edges. | Multiply hop distance by data volume\
    \ when evaluating candidate chiplet cost for a layer. |\n| **Layer dependency\
    \ graph (especially skip connections)** | Residual networks have non\u2011sequential\
    \ data flows; multiple predecessors must be considered. | Build a DAG; for layer\
    \ L, sum weighted distances from all predecessor\u2011holding chiplets. |\n| **Distance\
    \ to I/O chiplets** | Directly affects weight\u2011loading (all\u2011at\u2011\
    once) and frame I/O latency/energy. | Add a penalty proportional to the layer\u2019\
    s weight count multiplied by the shortest distance to any I/O chiplet. |\n| **Weight\
    \ count per layer** | In \u201Call\u2011at\u2011once\u201D loading, loading time\
    \ scales with (weight bits \xD7 hops from I/O). | Use weight count to scale the\
    \ I/O\u2011proximity penalty, especially for first/last layers and heavy blocks.\
    \ |\n| **Chiplet fragmentation and remaining contiguous capacity** | Greedy mapping\
    \ can shatter free space, forcing later large layers to split. | Track \u201C\
    largest contiguous block of free weight units\u201D per chiplet; prefer placements\
    \ that preserve large blocks for future use (add a fragmentation penalty). |\n\
    | **Mesh link bandwidth characteristics** | Treating all hops as equal ignores\
    \ serialisation delay and congestion in a 10\xD710 mesh. | Use a simple model:\
    \ cost = data_volume \xD7 hops / link_bandwidth, or penalise routes that share\
    \ heavily used links. |\n| **Preference weights (\u03BB)** | The user\u2019s desire\
    \ for low latency vs. low energy is ignored. | Combine the above costs with a\
    \ linear blend controlled by the preference parameter. |\n\n## 4. Proposed Different\
    \ Optimization Strategy\n\nInstead of iterative nearest\u2011neighbor or local\
    \ search, I propose a **Hierarchical Residual\u2011Block Graph\u2011Partitioning\
    \ Mapper** (HRBGP). This strategy exploits the regular block structure of ResNet\u2011\
    50 and the large mesh to produce a mapping that minimises inter\u2011block communication\
    \ and eliminates unnecessary layer splits.\n\n### Algorithm Outline\n\n1. **Build\
    \ the DNN communication graph**  \n   Parse the workload file to create a directed\
    \ acyclic graph where nodes are layers and edges are weighted by activation volume\
    \ (bytes per inference). Include shortcut edges from each residual block\u2019\
    s input to its output.\n\n2. **Identify residual blocks**  \n   ResNet\u201150\
    \ consists of 4 stages, each containing several bottleneck blocks. Each block\
    \ is a small subgraph with a natural internal communication pattern. Treat the\
    \ entire network as a **hierarchy of subgraphs**: stages \u2192 blocks \u2192\
    \ layers.\n\n3. **Allocate sub\u2011meshes to blocks using graph partitioning**\
    \  \n   Use a recursive min\u2011cut/metis\u2011like algorithm that maps **blocks**\
    \ (not individual layers) to contiguous regions of the 10\xD710 mesh. The objective\
    \ is to minimise the total weighted cut between blocks, which corresponds to inter\u2011\
    block activation traffic, while ensuring each block\u2019s total weight memory\
    \ requirement fits inside the chiplet capacity of its assigned region. The number\
    \ of chiplets assigned to a block is roughly proportional to its total weight\
    \ count, with a preference to keep each block inside a small (3\xD73, 2\xD72,\
    \ etc.) sub\u2011mesh if possible.\n\n4. **Within each block, place layers on\
    \ the assigned sub\u2011region**  \n   Once a block is allocated a set of chiplets,\
    \ map its layers **whole** (since each layer fits on a single chiplet) using a\
    \ cost\u2011minimising assignment within that sub\u2011region. The cost function\
    \ for placing layer L on chiplet c inside the region is:\n   ```\n   cost(c) =\
    \ \u03A3_{p\u2208pred(L)} vol(p\u2192L) \xD7 dist(chiplet(p), c) \n          \
    \ + \u03BB_w \xD7 weight_count(L) \xD7 dist_to_nearest_IO(c)\n           + \u03BB\
    _frag \xD7 fragmentation_penalty(c)\n   ```\n   \u2013 `chiplet(p)` is the chiplet\
    \ where predecessor p is already placed (if multiple, use average distance weighted\
    \ by partition).  \n   \u2013 `dist_to_nearest_IO` accounts for weight\u2011loading\
    \ cost.  \n   \u2013 `fragmentation_penalty` rewards placements that leave large\
    \ free capacity on other chiplets for later layers.\n\n5. **Global first/last\
    \ layer anchoring**  \n   The initial input conv layer (`conv1`) and the final\
    \ classifier are mapped **before** block partitioning, preferentially on corner\u2011\
    adjacent chiplets to minimise off\u2011chip traffic. Their assigned chiplets serve\
    \ as seeds for the partition boundaries of adjacent blocks.\n\n6. **Preference\
    \ integration**  \n   The \u03BB from `preference` is used to blend the I/O\u2011\
    penalty and communication volume weighting, steering the entire partitioning toward\
    \ latency\u2011optimised (minimise hops) or energy\u2011optimised (minimise hops\xD7\
    volume) solutions.\n\n7. **Capacity feasibility**  \n   For each block, if the\
    \ total weight memory exceeds the capacity of the assigned sub\u2011mesh, we allow\
    \ one layer to be split (preferably the largest layer) using a minimal\u2011split\
    \ heuristic, but this case is rare for ResNet\u201150 given 2.46\u202FM weight\
    \ chiplets. The algorithm prioritises whole\u2011layer placement far above any\
    \ other consideration.\n\n### Why This Strategy Is Different and Better\n\n- **Respects\
    \ skip connections intrinsically** \u2013 the block\u2011level partitioning sees\
    \ the heavy communication within a residual block and keeps all those layers together\
    \ on adjacent chiplets, eliminating the multi\u2011hop penalties caused by the\
    \ linear mapper.\n- **Eliminates unnecessary splits** \u2013 layers are kept whole\
    \ inside a block\u2019s reserved region; the mapper need not greedily fragment\
    \ space.\n- **Exploits the mesh regularity** \u2013 contiguous rectangular sub\u2011\
    meshes map cleanly to the 10\xD710 topology, reducing routing complexity and contention.\n\
    - **Combines global (block\u2011level) and local (layer\u2011level) optimisation**\
    \ \u2013 the two\u2011level approach is both computationally efficient and effective.\n\
    - **Uses all critical signals** \u2013 activation volumes, weight counts, I/O\
    \ distances, fragmentation avoidance, and user preference, none of which are used\
    \ by the current mapper.\n\nThis hierarchical mapper should dramatically cut the\
    \ total communication volume and latency for ResNet\u201150 on the 96\u2011CMOS\
    \ mesh, and can be implemented as a new `_hierarchical_graph_partitioning_mapper`\
    \ method that replaces the nearest\u2011neighbor routine."
