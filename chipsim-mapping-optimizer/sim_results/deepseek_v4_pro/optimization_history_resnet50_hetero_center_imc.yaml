- change_summary: "## 1. Key Weaknesses of the Current Nearest\u2011Neighbor Approach\n\
    \nThe `_nearest_neighbor_mapper_v3` exhibits several structural issues that are\
    \ particularly damaging for a ResNet\u201150 mapped onto 96 CMOS chiplets with\
    \ weight\u2011stationary execution and all\u2011at\u2011once weight loading:\n\
    \n1. **Linear processing of layers \u2013 total blindness to residual connections**\
    \  \n   The mapper only looks at the most recent layer\u2019s \u201Cheaviest chiplet\u201D\
    . ResNet\u201150\u2019s skip connections create many layers that must communicate\
    \ with distant predecessors, yet the mapper cannot group dependent layers close\
    \ together. This inflates activation transfer distance dramatically.\n\n2. **Greedy,\
    \ capacity\u2011blind splitting that wastes chiplet contiguity**  \n   For each\
    \ layer the algorithm floods the nearest chiplet with whatever capacity it can,\
    \ then spills over to the next\u2011nearest. Many ResNet layers could fit whole\
    \ on one CMOS chiplet (2.46\u202FM weights), but the mapper often splits them\
    \ because it sees that the nearest chiplet lacks enough free weight units. The\
    \ resulting multi\u2011chiplet partitions multiply the total activation communication\
    \ volume.\n\n3. **Ignoring the actual communication volume between layers**  \n\
    \   The hop distance to the previous layer\u2019s main chiplet is used as a cost\
    \ metric, but it is never multiplied by the amount of data that must flow. Early\
    \ conv layers have huge activation tensors; later layers have small ones. Treating\
    \ all hops equally leads to high\u2011volume traffic traversing many hops while\
    \ low\u2011volume traffic gets the closest spots \u2013 a suboptimal trade\u2011\
    off.\n\n4. **First\u2011layer placement that maximises fragmentation**  \n   The\
    \ first layer is placed on the chiplet with the most free capacity, regardless\
    \ of that chiplet\u2019s location or the needs of later layers. This often forces\
    \ a large, early layer onto a central chiplet that would be better preserved for\
    \ later, even larger layers, causing unnecessary splits later.\n\n5. **No use\
    \ of I/O chiplet positions**  \n   I/O chiplets are excluded from mapping, but\
    \ their corner locations are never exploited to reduce off\u2011chip traffic for\
    \ the first and last layers. In weight\u2011stationary mode with all\u2011at\u2011\
    once loading, the distance to load weights and stream input/output frames directly\
    \ affects startup latency and energy.\n\n6. **Preference weights are parsed but\
    \ never applied to the cost function**  \n   The `preference` dict selects an\
    \ `active_metric`, but the numeric performance/energy weights are unused. The\
    \ mapping output is identical regardless of whether the user prioritises latency\
    \ or energy efficiency.\n\n7. **No look\u2011ahead or backtracking to avoid fragmentation**\
    \  \n   The mapper commits layers one by one and never revisits earlier decisions.\
    \ As the mapping progresses, large contiguous free spaces are broken into small\
    \ fragments, forcing later large layers to split unnecessarily.\n\n## 2. Specific\
    \ Opportunities for Improvement Given This Config\n\nBecause all compute chiplets\
    \ are identical CMOS with 2.46\u202FM weight capacity and the workload is ResNet\u2011\
    50, several concrete improvements can be made:\n\n- **Whole\u2011layer placement\
    \ preference**: The vast majority of ResNet\u201150 layers (all except the final\
    \ FC, which is tiny) can fit entirely on a single chiplet. Modify the mapper to\
    \ **prefer complete, unsplit placements**, even if that means using a slightly\
    \ farther chiplet. A layer split across N chiplets requires N\u2011way fan\u2011\
    out of the previous layer\u2019s activations and an N\u2011way reduction, multiplying\
    \ communication cost. Keeping a layer whole eliminates that overhead.\n\n- **Volume\u2011\
    weighted distance optimisation**: Compute the activation volume between each pair\
    \ of layers using the model definition (input size \xD7 channels for conv, etc.).\
    \ When choosing a chiplet for layer L, calculate the total communication cost\
    \ as the sum over all predecessors P of (activation volume from P to L) \xD7 (average\
    \ distance from chiplets holding P to the candidate chiplet). Select the chiplet\
    \ that minimises this cost subject to available capacity. For skip connections,\
    \ include all direct predecessors.\n\n- **I/O\u2011proximity seeding**: Place\
    \ the first conv layer as close as possible to an I/O chiplet (corners) to minimise\
    \ weight\u2011loading and input streaming latency. Place the final classification\
    \ layer similarly near an I/O chiplet. For intermediate layers, use a cost function\
    \ that blends communication to predecessors and, for output layers, to successors\
    \ (if known).\n\n- **Layered\u2011scheduling with capacity reservation**: Before\
    \ mapping, sort layers by their weight requirements (largest first). Reserve large\
    \ contiguous regions on the mesh for the heaviest layers (e.g., conv5_x blocks)\
    \ and map them early, ensuring they fit whole. Smaller layers then fill the gaps\
    \ without forcing splits on the large ones.\n\n- **Incorporate weight\u2011loading\
    \ cost**: Since weight loading is \u201Call at once\u201D before inference, the\
    \ latency to load a layer\u2019s weights from off\u2011chip memory scales with\
    \ the sum of distances from the I/O chiplets to the selected compute chiplets,\
    \ weighted by the number of weights fetched to each. The mapper can penalise placements\
    \ far from I/O chiplets for layers with many weights.\n\n- **Use the preference\
    \ weights in a multi\u2011objective cost**: Define `cost = \u03BB\xB7t_comm +\
    \ (1\u2011\u03BB)\xB7E_comm`, where t_comm is estimated latency and E_comm is\
    \ estimated energy, using simple models (e.g., latency = hops, energy = hops *\
    \ data volume). The \u03BB comes from the `preference` dict. This makes the mapping\
    \ tunable.\n\n## 3. What Data/Signals the Mapper Currently Ignores That It Should\
    \ Use\n\n| Ignored Signal | Why It Matters | How to Integrate |\n|---------------|----------------|-------------------|\n\
    | **Activation tensor sizes** (input/output dimensions) | Determines the actual\
    \ byte volume transferred per inference step. | Use to weight distances when placing\
    \ layers, giving priority to minimise movement of large tensors. |\n| **Layer\
    \ connectivity graph (skip connections)** | Residual networks have non\u2011sequential\
    \ data flows; layers may have multiple predecessors. | Model the DNN as a DAG\
    \ and calculate placement cost by summing over all direct predecessors. |\n| **Distance\
    \ to I/O chiplets** | Directly affects weight\u2011loading and frame I/O latency,\
    \ especially for first/last layers. | Add a distance penalty from I/O chiplets\
    \ to candidate chiplet, scaled by layer weight count or frame size. |\n| **Chiplet\
    \ utilisation / future fragmentation** | Greedy mapping can fragment contiguous\
    \ free space, making later large layers impossible to place whole. | Maintain\
    \ a fragmentation score per chiplet; prefer placements that leave large contiguous\
    \ free blocks. |\n| **Weight count per layer** | In \u201Call\u2011at\u2011once\u201D\
    \ weight loading, loading cost is proportional to total weight bits \xD7 hops\
    \ from I/O. | Use to prioritise proximity to I/O for layers with large weight\
    \ counts. |\n| **Link bandwidth / latency characteristics** | In a mesh, congestion\
    \ and serialisation delay matter; not all hops are equal. | Use a simple model:\
    \ cost = data_volume \xD7 hops / link_BW, or consider maximum injection rate as\
    \ a constraint. |\n| **Preference weights (energy vs. latency)** | The user\u2019\
    s desired trade\u2011off should influence chiplet selection. | Blend the two objectives\
    \ using \u03BB from the preference dict, as described above. |\n\n## 4. Proposed\
    \ Different Optimization Strategy\n\nInstead of patching the nearest\u2011neighbor\
    \ greedy algorithm, adopt an **iterative volume\u2011aware placement with skip\u2011\
    connection support and capacity reservation**, implemented as a new mapper function\
    \ (e.g., `_volume_aware_mapper`). The core idea is:\n\n1. **Pre\u2011compute data\
    \ flow volumes**: For every edge in the ResNet\u201150 computation graph (including\
    \ skip connections), calculate the number of activation bytes transferred per\
    \ inference. This uses the model parameters (input size, channels, etc.) and the\
    \ data format (8\u2011bit activations).\n\n2. **Sort layers by \u201Ccriticality\u201D\
    **: Rank layers according to their weight size. The top\u2011N heaviest layers\
    \ (e.g., conv5_x blocks) are flagged as \u201Cmust\u2011fit\u2011whole\u201D candidates\
    \ because they strain chiplet capacity. The mapper will reserve whole chiplets\
    \ for them.\n\n3. **Capacity reservation**: Maintain a set of reserved chiplet\
    \ IDs for heavy layers. For any layer that can fit whole on a single chiplet,\
    \ the mapper selects the chiplet that minimises the volume\u2011weighted distance\
    \ to the layer\u2019s predecessors (all of them, not just the last one\u2019s\
    \ max chiplet). The cost function for chiplet `c` for layer `L` is:\n   ```\n\
    \   cost(c) = \u03A3_{p\u2208pred(L)} vol(p\u2192L) \xD7 avg_dist(chiplets_holding(p),\
    \ c)\n            + \u03BB_w \xD7 weight_count(L) \xD7 dist_to_nearest_IO(c)\n\
    \   ```\n   where `\u03BB_w` is a tuneable coefficient balancing inter\u2011layer\
    \ communication against weight\u2011loading cost. For the first layer, `pred(L)`\
    \ is the input I/O chiplet; for the last, the output I/O chiplet. If no single\
    \ chiplet can hold the whole layer, the layer is split minimally, with the mapper\
    \ still minimising the same cost function across the set of selected chiplets,\
    \ but adding a penalty proportional to the number of splits.\n\n4. **Iterative\
    \ refinement**: After an initial placement, run a local search (e.g., pairwise\
    \ swap of chiplet assignments for two layers) to further reduce total communication\
    \ cost. Only swaps that reduce the overall cost (estimated via the same volume\u2011\
    weighted distance) are accepted. This step can fix fragmentation mistakes and\
    \ exploit skip\u2011connection locality.\n\n5. **Incorporate user preference**:\
    \ The cost function includes a blend factor \u03BB from the `preference` dict:\
    \ `cost = \u03BB\xB7hops + (1\u2011\u03BB)\xB7hops\xB7data_volume` (latency vs.\
    \ energy approximation).\n\nThis strategy directly addresses the identified weaknesses:\n\
    - It respects skip connections (multiple predecessors).\n- It prefers whole\u2011\
    layer placements and reserves space for heavy layers, reducing splits and subsequent\
    \ communication.\n- It weights distances by actual data volumes, not arbitrary\
    \ hop counts.\n- It uses I/O proximity to minimise off\u2011chip traffic.\n- It\
    \ provides a mechanism for user\u2011specified performance/energy trade\u2011\
    offs.\n- It avoids fragmentation via reservation and iterative refinement.\n\n\
    The result should yield significantly lower inference latency and energy compared\
    \ to the current nearest\u2011neighbor mapper for the given CHIPSIM configuration."
