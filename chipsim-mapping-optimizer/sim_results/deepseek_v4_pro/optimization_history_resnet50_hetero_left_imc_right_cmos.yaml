- change_summary: "## 1. Key Weaknesses of the Current Nearest\u2011Neighbour Approach\n\
    \nThe `_nearest_neighbor_mapper_v3` method defines a greedy, layer\u2011by\u2011\
    layer placement that suffers from several structural limitations:\n\n### 1.1 Single\u2011\
    Source Expansion Creates Brittle Chains\nFor the **first layer**, the starting\
    \ chiplet is chosen as the one with the most free capacity and the highest static\
    \ `performance` metric. For all subsequent layers, the pivot is simply **the chiplet\
    \ that received the largest percentage of the previous layer**. This creates a\
    \ strictly sequential chain:\n\n- The mapping is forced to grow outward from a\
    \ single focal point, producing a narrow \u201Cworm\u201D of allocated chiplets.\n\
    - Chiplets far from this chain remain completely unused, while nearby chiplets\
    \ fill up quickly. This concentrates memory, compute, and future communication\
    \ into a small cluster, leaving the majority of the 10\xD710 mesh under\u2011\
    utilised and causing early capacity exhaustion.\n- If the \u201Clargest previous\u201D\
    \ chiplet is at the edge of the mesh, expansion can only proceed inward, further\
    \ squashing the available search space.\n\n### 1.2 Purely Greedy with Zero Global\
    \ View\nEach layer is placed in isolation with no look\u2011ahead to subsequent\
    \ layers:\n\n- The mapper cannot anticipate that a short\u2011distance placement\
    \ now will create a badly connected placement later.\n- No cost is assigned to\
    \ inter\u2011layer communication volume or residual connections. The algorithm\
    \ only minimises hop count from a single pivot point, treating every layer transition\
    \ as equally important.\n- ResNet\u201150 contains skip connections where a layer\
    \ must communicate with a non\u2011adjacent predecessor. The mapper\u2019s sequential\
    \ view completely ignores these edges, forcing high\u2011volume residual tensors\
    \ to traverse many extra hops, doubling NoC pressure.\n\n### 1.3 Load Imbalance\
    \ and Hotspot Creation\nThe chiplet sorting for each layer uses three keys: `(distance,\
    \ -available_memory, -metric)`:\n- **Distance** dominates. This strongly prefers\
    \ nearby chiplets, even if they are already heavily loaded, and pushes the algorithm\
    \ to \u201Cpack\u201D layers densely. The result is a small set of chiplets that\
    \ run at near\u2011full capacity while the rest stay idle.\n- **Available memory**\
    \ acts only as a tie\u2011breaker after distance, so a slightly more distant chiplet\
    \ with significantly more free capacity is rarely chosen. Consequently, the mapper\
    \ fails to balance the overall utilisation across the 96 CMOS chiplets, creating\
    \ artificial memory and network bottlenecks.\n\n### 1.4 No Inter\u2011Layer Communication\
    \ Cost\nThe mapper only considers a single distance (`distance from the starting\
    \ chiplet`). It does **not** incorporate:\n- The size of the tensor that must\
    \ flow from the previous layer (activation volume).\n- The number of such flows\
    \ (multiple input tensors for branching layers).\n- The cumulative effect of multiple\
    \ layers being placed on the same link.\n\nThus, a chiplet that is one hop away\
    \ but whose link will later become saturated is treated identically to one with\
    \ abundant link capacity. The all\u2011at\u2011once weight loading strategy also\
    \ ignores the distance from I/O corners, which could become a hidden bottleneck.\n\
    \n### 1.5 Topology Blindness \u2013 I/O Chiplet Ignorance\nThe 10\xD710 mesh has\
    \ I/O chiplets at the four corners. The mapper:\n- Excludes I/O chiplets from\
    \ the pool of compute candidates, but never uses their positions to bias placement\
    \ toward the mesh corners or edges where external data enters/exits.\n- The first\
    \ layer (closest to input) could benefit from being near an I/O corner to reduce\
    \ initial weight\u2011loading latency and input streaming; similarly, the final\
    \ classification layer should be near an output I/O chiplet.\n- The `weight_loading_strategy:\
    \ all_at_once` means all weights are pushed into chiplets before execution; if\
    \ those chiplets are far from any corner, loading time (and potentially simulation\
    \ warm\u2011up) increases dramatically.\n\n### 1.6 First\u2011Layer Selection\
    \ is Crude and Potentially Suboptimal\nThe initial chiplet is selected purely\
    \ by `max(available_memory, metric)`. This:\n- Might pick a chiplet at a mesh\
    \ corner, which then forces all subsequent expansions to radiate inward, actually\
    \ increasing average hop distance for later layers that need to reach other quadrants.\n\
    - Ignores the fact that in a weight\u2011stationary system, the position of the\
    \ first layer sets the communication \u201Ccentre of mass\u201D for the entire\
    \ model.\n\n### 1.7 Partitioning\u2011Induced Mismatches\nAfter placement, the\
    \ layer partitioner splits output channels proportionally. The mapper allocates\
    \ capacity units (weights) but the partitioner modifies the logical layer definition\
    \ by channel count. Small rounding errors can leave a chiplet with slightly more\
    \ or fewer weights than the capacity it was allocated, causing waste or insufficient\
    \ memory. The `_adjust_for_rounding_errors` only tweaks one partition, which may\
    \ still leave other partitions unbalanced relative to their real weight footprints.\n\
    \n### 1.8 No Concept of Communication\u2011Cost Gradient\nThe algorithm evaluates\
    \ candidates only once per layer (a static sort). It never backtracks or adjusts\
    \ earlier decisions once later layers reveal congestion. Even a simple iterative\
    \ improvement (e.g., swapping a fraction of a layer between chiplets to reduce\
    \ total communication distance) is absent.\n\n---\n\n## 2. Specific Opportunities\
    \ for Improvement Given This Config\n\nGiven the 96 homogeneous CMOS chiplets,\
    \ 10\xD710 mesh, corner I/O, and a ResNet\u201150 workload with weight stationarity,\
    \ the following targeted improvements can be made:\n\n### 2.1 Spreading the First\
    \ Layer Across a \u201CStarter Set\u201D\nInstead of picking a single chiplet\
    \ for the first layer, **distribute the first convolutional layer across multiple\
    \ chiplets** (e.g., 2\u20114) located near the mesh centre or near the midpoint\
    \ of the four I/O corners. This:\n- Creates a small, balanced cluster early.\n\
    - Prevents the rest of the network from being pulled into a corner.\n\n### 2.2\
    \ Multi\u2011Source Expansion with Capacity\u2011Aware Scoring\nFor subsequent\
    \ layers, consider **all chiplets that already host the previous layer** as candidate\
    \ sources, not just the maximal one. Score each candidate chiplet `c_i` for a\
    \ new layer `L` by a weighted sum:\n\n```\nscore(c_i, chiplet_j) = \u03B1 \xD7\
    \ distance(c_i, chiplet_j) \n                       + \u03B2 \xD7 (used_capacity_ratio(chiplet_j))\n\
    \                       + \u03B3 \xD7 distance_to_nearest_io(chiplet_j)\n    \
    \                   + \u03B4 \xD7 current_injected_traffic_estimate(chiplet_j)\n\
    ```\n\n- \u03B1 encourages proximity to the source.\n- \u03B2 penalises chiplets\
    \ that are already highly utilised, promoting load balance.\n- \u03B3 biases placement\
    \ toward corners for layers that are close to the input or output.\n- \u03B4 (if\
    \ estimated) avoids already\u2011congested chiplets.\n\nThis simple multi\u2011\
    criteria ranking would distribute layers more evenly across the mesh and avoid\
    \ the \u201Cpacking\u201D trap.\n\n### 2.3 Incorporate ResNet\u201150 Residual\
    \ Connections Explicitly\nThe workload file (`workload_resnet50.csv`) describes\
    \ the model graph, including residual branches. The mapper should:\n- Pre\u2011\
    parse the residual edges (`layer_i` \u2192 `layer_i+2` for residual blocks).\n\
    - When placing a layer that is the *end* of a residual block, add a **proximity\
    \ penalty** to chiplets that are far from the chiplet(s) hosting the *beginning*\
    \ of that block.\n- A simple implementation: for a residual block (conv\u2011\
    bn\u2011relu \xD7 2), ensure the output chiplet is within a small hop radius (e.g.,\
    \ \u2264 3) of the input chiplet. This can be done by adding a high penalty for\
    \ distances > threshold in the scoring function.\n\n### 2.4 Soft Capacity Caps\
    \ to Avoid Exhaustion\nInstead of filling a chiplet to 100% before moving on,\
    \ impose a **soft upper bound** during allocation (e.g., 70% of total capacity).\
    \ Once a chiplet reaches this bound, its score is strongly penalised. This leaves\
    \ headroom for future layers and naturally spreads the mapping across more chiplets.\n\
    \n### 2.5 I/O\u2011Aware Anchor Points\nIdentify the **first and last few layers**\
    \ (input stem, final pooling/FC) and bias their placement toward the nearest I/O\
    \ corner. For example:\n- The first layer (conv1) should be within 2 hops of any\
    \ IO chiplet.\n- The last layer (fc1000) should be within 2 hops of an IO chiplet,\
    \ preferably the same corner used for input to minimise overall data movement.\n\
    \nThe configuration already knows which chiplets are I/O; their coordinates can\
    \ be retrieved from the network graph.\n\n### 2.6 Simple Congestion\u2011Aware\
    \ Routing Heuristic\nEven without full\u2011blown cycle\u2011accurate simulation,\
    \ maintain a **link utilisation counter** as layers are placed:\n- Each time a\
    \ layer is placed on chiplet `j` and must communicate with its predecessor on\
    \ chiplet `i`, increment a counter for all links on the shortest path between\
    \ `i` and `j` by the activation tensor size.\n- When evaluating chiplet candidates,\
    \ include a penalty term proportional to the sum of existing loads on the path.\
    \ This prevents oversubscribing certain mesh edges and naturally distributes communication.\n\
    \n### 2.7 Post\u2011Placement Local Search for Communication Reduction\nAfter\
    \ greedy placement, run a lightweight iterative improvement:\n- Randomly select\
    \ a layer and try to move a small percentage (e.g., 5%) of its output channels\
    \ from one chiplet to another.\n- Accept if total weighted communication distance\
    \ (distance \xD7 tensor size) decreases.\n- This can be done with a few hundred\
    \ trials without major runtime overhead and can significantly lower average hop\
    \ count.\n\n---\n\n## 3. Data / Signals the Mapper Currently Ignores That It Should\
    \ Use\n\n1. **Inter\u2011layer activation volumes** \u2013 The output tensor size\
    \ of each layer (e.g., H\xD7W\xD7C) and the number of elements transferred per\
    \ inference. This is available from `model_metrics` and is the dominant NoC traffic;\
    \ ignoring it leads to placement that minimises hop count without regard to the\
    \ actual communication load.\n2. **Residual connection edges** \u2013 The network\
    \ definition (e.g., from workload CSV) contains the skip connections. The mapper\
    \ treats the model as a linear sequence, completely missing the need to keep residual\
    \ endpoints close.\n3. **Physical I/O chiplet positions** \u2013 The tile coordinates\
    \ of the four corner I/O chiplets are known; they should be used to guide placement\
    \ of layers that load weights or stream input/output.\n4. **Per\u2011chiplet compute\
    \ capability (if heterogeneous)** \u2013 The `performance` metric exists but is\
    \ only a tiebreaker. Even for homogeneous CMOS chiplets, balancing the total MACs\
    \ assigned to each chiplet could equalise execution time and avoid compute stragglers.\n\
    5. **Current link traffic load (or estimate)** \u2013 As layers are mapped, the\
    \ cumulative bytes that will traverse each NoC link can be approximated and used\
    \ to avoid hotspots.\n6. **Activation buffer memory requirements** \u2013 While\
    \ the mapper tracks weight capacity, it ignores the memory needed for input/output\
    \ feature maps (activations). Large layers can exceed chiplet SRAM, causing runtime\
    \ spilling or stalls, which could be avoided by leaving sufficient buffer capacity.\n\
    7. **Weight\u2011loading path distance** \u2013 Under `all_at_once` loading, the\
    \ distance from the chiplet to the nearest I/O corner directly impacts initial\
    \ loading time. The mapper should bias placement toward the corners to minimise\
    \ this startup cost.\n8. **Layer depth (distance from input/output)** \u2013 Early\
    \ layers consume raw input data (likely arriving from an I/O corner), while late\
    \ layers produce final outputs. Incorporating this sequential position could improve\
    \ the overall communication shape.\n\nIncorporating these signals would transform\
    \ the mapper from a simple nearest\u2011neighbour heuristic into a more intelligent,\
    \ network\u2011aware placement that balances memory, compute, and communication\
    \ across the entire chiplet array, directly addressing the weaknesses observed\
    \ in the current configuration."
