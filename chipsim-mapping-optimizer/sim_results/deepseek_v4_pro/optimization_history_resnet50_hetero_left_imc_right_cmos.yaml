- change_summary: "## 1. Key weaknesses of the current nearest\u2011neighbor approach\n\
    \n1. **Single\u2011point pivot per layer**  \n   The mapper always starts from\
    \ the chiplet that hosted the largest portion of the previous layer. This creates\
    \ a chain\u2011like growth that can collapse the mapping into a narrow cluster,\
    \ leaving many chiplets unused and creating long communication tails for deeper\
    \ layers.\n\n2. **Greedy, one\u2011layer\u2011at\u2011a\u2011time with no global\
    \ view**  \n   Each layer is placed independently; there is no look\u2011ahead\
    \ to see how current choices affect future layers or how inter\u2011layer communication\
    \ will accumulate. A small local gain (e.g., shortest distance from one pivot)\
    \ may lead to very expensive global communication later.\n\n3. **Ignores inter\u2011\
    layer communication volume**  \n   The cost is only hop count from the starting\
    \ chiplet. It does not weight distances by how much data must flow between successive\
    \ layers (tensor sizes, residual connections in ResNet\u201150). As a result,\
    \ high\u2011volume transfers may be placed over long paths, wasting NoC bandwidth.\n\
    \n4. **Load\u2011balancing and hotspot blindness**  \n   The sorter ranks chiplets\
    \ by distance, then by available memory, then by a static performance metric.\
    \ It makes no attempt to spread allocated workloads evenly across the 10\xD710\
    \ mesh to avoid creating traffic hotspots. A few nearby chiplets will be filled\
    \ to capacity, concentrating all future communication in a small region.\n\n5.\
    \ **No accounting for topology irregularities**  \n   The 10\xD710 mesh has I/O\
    \ chiplets at the four corners. The mapper treats all chiplets equally; it does\
    \ not prioritise placements closer to I/O for layers that must load weights or\
    \ stream input/output data. This can cause extra hops for weight loading (even\
    \ though weights are stationary, they must be transported to memory initially).\n\
    \n6. **Rudimentary start\u2011chiplet selection for the first layer**  \n   The\
    \ first layer picks the chiplet with the most available memory and highest static\
    \ metric. This may land on an edge or corner, forcing later layers to spread only\
    \ in one direction, limiting the usable array and increasing average path lengths.\n\
    \n7. **No notion of residual / skip connections**  \n   ResNet\u201150 contains\
    \ many residual branches where layer *i+2* needs data from layer *i*. The mapper\
    \ only considers sequential dependency; it cannot co\u2011locate the two ends\
    \ of a skip connection, so the residual data must traverse many hops, doubling\
    \ the required NoC traffic for those paths.\n\n8. **Partitioning accuracy risk**\
    \  \n   Allocation is done in capacity units (weights) but the layer partitioner\
    \ splits output channels proportionally. Rounding in the partition step can cause\
    \ a chiplet\u2019s weight demand to deviate slightly from the allocated capacity,\
    \ potentially leading to wasted or insufficient capacity, though the current implementation\
    \ handles this only by a simple adjustment.\n\n---\n\n## 2. Specific opportunities\
    \ for improvement given this config\n\n- **Integrate a communication\u2011cost\u2011\
    driven objective**  \n  Extend the cost function to be `distance \xD7 data_volume_between_layers`\
    \ for each logical edge. Use a force\u2011directed or annealing pass after greedy\
    \ placement to reduce total weighted communication distance.\n\n- **Balance utilisation\
    \ across the 96 CMOS chiplets**  \n  Instead of always starting from the previous\
    \ largest chiplet, consider multiple candidate expansion points and score them\
    \ by a combination of **available capacity + proximity to the previous layer\u2019\
    s centroid + distance to I/O corners**. This spreads the mapping and reduces hotspot\
    \ formation.\n\n- **Place layers with residual connections close together**  \n\
    \  Detect skip connections from the workload (e.g., ResNet\u201150 blocks) and\
    \ add a penalty for placing the feeding layer and the receiving layer far apart.\
    \ Even a simple rule: for a residual branch, choose a chiplet that is near both\
    \ the previous layer and the start of the residual head.\n\n- **Quota\u2011based\
    \ expansion that respects the mesh shape**  \n  Instead of consuming one chiplet\
    \ completely before moving on, set a soft limit e.g., \u201Cfill any chiplet to\
    \ at most 80%\u201D to leave room for later layers. In a 10\xD710 grid, this naturally\
    \ distributes the model and keeps communication paths shorter on average.\n\n\
    - **Leverage I/O corner placement**  \n  For the first layer (nearest to input)\
    \ and the last layer (nearest to output), prefer chiplets close to the corner\
    \ I/O chiplets to minimise access latency and potential congestion. This is especially\
    \ valuable under the \u201Call_at_once\u201D weight loading strategy, where initial\
    \ weight distribution could be a bottleneck.\n\n- **Use the `active_metric` more\
    \ effectively**  \n  The config defines nodes with a `performance` metric. If\
    \ different chiplets have different clock frequencies or compute capabilities,\
    \ the mapper should bias high\u2011performance chiplets for layers with high MAC\
    \ counts, not just use the metric as a tiebreaker. Weight requirements and compute\
    \ throughput should be jointly considered.\n\n- **Anticipate network congestion**\
    \  \n  Even without full\u2011fledged simulation, maintain a running \u201Ctraffic\
    \ density\u201D map (accumulated data volumes per link from already\u2011mapped\
    \ layers) and avoid placing new layers that would overload already\u2011saturated\
    \ links, especially around the starting pivot.\n\n---\n\n## 3. Data / signals\
    \ the mapper currently ignores that it should use\n\n1. **Inter\u2011layer data\
    \ volumes**  \n   The output tensor size of each layer (input activation size\
    \ \xD7 number of activations) determines the actual NoC traffic. The mapper only\
    \ sees weight counts; it ignores the huge activation traffic that must move between\
    \ layers.\n\n2. **Residual / skip connection topology**  \n   The workload file\
    \ specifies the model graph. The mapper treats it as a linear sequence, completely\
    \ overlooking branching structures that are fundamental to ResNet\u201150.\n\n\
    3. **Physical positions of I/O chiplets**  \n   Corner\u2011located I/O chiplets\
    \ are visible in the network definition but never influence the placement decision.\
    \ Weight loading and input/output streaming could be much cheaper if placed near\
    \ them.\n\n4. **Network injection rate and link bandwidth**  \n   The config gives\
    \ `gem5_injection_rate` and `network_operation_frequency_hz`. Even a coarse estimate\
    \ of link saturation could help avoid placing two high\u2011volume consecutive\
    \ layers on chiplets that share the same bottleneck link.\n\n5. **Activation buffer\
    \ memory**  \n   Chiplet memory is consumed by both weight storage and activation\
    \ buffers. The mapper only tracks weight capacity, potentially overcommitting\
    \ memory if activation footprints are large. This can cause runtime stalls that\
    \ could be avoided.\n\n6. **Computational load (MACs / layer)**  \n   The `total_macs`\
    \ is available but not used. Chiplets with higher compute capability (if heterogeneous)\
    \ should get a larger share of heavy layers. Even in a homogeneous CMOS array,\
    \ balancing MACs across chiplets could improve throughput by avoiding compute\
    \ bottlenecks.\n\n7. **Chiplet utilisation history (run\u2011time load)**  \n\
    \   Beyond static available capacity, tracking how \u201Cbusy\u201D each chiplet\
    \ already is (in terms of injected packets per cycle) from prior layers could\
    \ guide new placement to unloaded regions, further reducing congestion.\n\n8.\
    \ **Weight\u2011stationary loading cost**  \n   The `weight_loading_strategy:\
    \ all_at_once` means all weights are pre\u2011loaded. The mapper could minimise\
    \ total weight loading time by preferring chiplets with the shortest aggregate\
    \ distance from the storage or I/O chiplets, especially if weights are loaded\
    \ from the corners."
