- change_summary: "## 1. Key Weaknesses of the Current Nearest\u2011Neighbor Approach\n\
    \n### 1.1 Single\u2011Pivot Chaining leads to Worm\u2011shaped, Unbalanced Placements\n\
    The mapper selects **one** chiplet per layer as the \u201Csource\u201D from which\
    \ to expand:\n\n- For the **first layer**, the source is either a user\u2011specified\
    \ `preferred_start_chiplet_id` or the chiplet with the largest available memory\
    \ (tie\u2011broken by the static `performance` metric).\n- For **every subsequent\
    \ layer**, the source is simply the chiplet that received the **highest percentage**\
    \ of the previous layer.\n  \nThis creates a strictly sequential chain: layer\u202F\
    2 is placed near the largest chiplet of layer\u202F1; layer\u202F3 near the largest\
    \ chiplet of layer\u202F2, etc. The mapping grows like a worm that cannot branch.\
    \  \n**Consequence:** The worm inevitably runs out of nearby capacity, forcing\
    \ the algorithm to leave large portions of the 10\u202F\xD7\u202F10 mesh completely\
    \ idle while a small cluster becomes oversubscribed. This artificially creates\
    \ memory and communication bottlenecks.\n\n### 1.2 Greedy, One\u2011Layer\u2011\
    at\u2011a\u2011Time with Zero Global View\nEach layer\u2019s placement is decided\
    \ in isolation by sorting candidate chiplets with the key `(distance_from_source,\
    \ -available_memory, -metric)`.  \n- There is **no look\u2011ahead** to know how\
    \ today\u2019s choice affects tomorrow\u2019s layers.  \n- The mapper ignores\
    \ the **cumulative communication graph**; it only cares about hop count from a\
    \ single pivot point, treating every layer transition as equally important.  \n\
    - ResNet\u201150 contains skip connections where a layer depends on a non\u2011\
    adjacent predecessor. The mapper\u2019s linear view completely misses these branches,\
    \ forcing residual tensors to traverse many extra hops, doubling NoC pressure.\n\
    \n### 1.3 Distance\u2011Dominated Ranking Causes Draw\u2011Back and Hotspot Concentration\n\
    The sorting tuple `(distance, -available_memory, -metric)` makes **distance the\
    \ primary key**.  \n- This strongly prefers chiplets that are physically close\
    \ to the source, even if they are already heavily loaded.  \n- Available memory\
    \ only acts as a tie\u2011breaker after distance is equal; a slightly more distant\
    \ chiplet with significantly more free capacity is rarely chosen.  \n- The result\
    \ is a dense packing of layers into a small region, creating both memory fragmentation\
    \ and future communication hotspots while leaving the majority of the mesh under\u2011\
    utilised.\n\n### 1.4 No Communication Volume Weighting\nThe only cost used is\
    \ hop distance, completely ignoring **how much data** must flow:  \n- The output\
    \ tensor size of each layer (the activation volume) is known but never used. \
    \ \n- A 1\u2011hop move of a huge feature map is treated the same as a tiny tensor;\
    \ this can place the heaviest communication on the busiest links without penalty.\
    \  \n- The `weight_loading_strategy: all_at_once` also disregards the distance\
    \ from the I/O corners, which will be traversed by weight streams before execution\
    \ starts.\n\n### 1.5 Topology Blindness \u2013 I/O Chiplet Positions Are Ignored\n\
    The 10\u202F\xD7\u202F10 mesh has four I/O chiplets at the corners. The mapper\
    \ correctly excludes them from the compute pool but **never uses their locations**\
    \ to bias placement:  \n- The first layers (closest to input) would benefit from\
    \ being near an I/O corner to reduce weight\u2011loading latency and input streaming.\
    \  \n- The final classification layer should similarly be near an I/O corner to\
    \ minimise output transfer time.  \n- With `all_at_once` loading, chips far from\
    \ any corner suffer extended loading phases, yet the mapper is oblivious.\n\n\
    ### 1.6 Crude First\u2011Layer Selection Can Anchor Suboptimal Trees\nThe choice\
    \ of the first chiplet is based solely on `max(available_memory, metric)`.  \n\
    - This may pick a corner chiplet, after which all subsequent expansions can only\
    \ proceed inward, artificially limiting the available search space and increasing\
    \ average hop distances.  \n- In a weight\u2011stationary system, the first layer\
    \ sets the \u201Ccommunication centroid\u201D for the entire model; an edge anchor\
    \ forces long paths for later layers.\n\n### 1.7 No Iterative Improvement or Backtracking\n\
    Once a layer is placed, the decision is final. The mapper never revisits earlier\
    \ choices, even when later layers reveal severe congestion or unbalanced utilisation.\
    \ A lightweight local search (e.g., swapping a fraction of channels between chiplets)\
    \ could reduce total communication cost without heavy computational overhead.\n\
    \n---\n\n## 2. Specific Opportunities for Improvement Given This Config\n\nGiven\
    \ the **96 homogeneous CMOS chiplets**, **10\u202F\xD7\u202F10 mesh**, corner\
    \ I/O, **ResNet\u201150 workload** with weight stationarity, and **all\u2011at\u2011\
    once weight loading**, several low\u2011risk, high\u2011impact improvements can\
    \ be implemented:\n\n### 2.1 Multi\u2011Source Expansion with Load\u2011Balancing\
    \ Score\nInstead of using only the single largest previous chiplet, consider **all\
    \ chiplets that host the previous layer** as candidate sources. For a new layer,\
    \ evaluate each candidate placement chiplet `j` with a composite score:\n\n```\n\
    score(j) = \u03B1\xB7<distance from source centroid> + \u03B2\xB7<capacity utilisation\
    \ of j>\n           + \u03B3\xB7<distance to nearest I/O corner> + \u03B4\xB7\
    <estimated link congestion>\n```\n\n- **\u03B1** ensures proximity, but not dictatorial.\
    \  \n- **\u03B2** penalises already highly\u2011filled chiplets, encouraging even\
    \ spread across the 96 tiles.  \n- **\u03B3** biases toward corners for layers\
    \ at the beginning/end of the network.  \n- **\u03B4** (even a simple hop\u2011\
    count increment per link) prevents overloading the same links.\n\nThis small change\
    \ would break the worm pattern and naturally distribute the model.\n\n### 2.2\
    \ Residual\u2011Aware Placement for ResNet\u201150\nThe workload definition contains\
    \ the skip connections. The mapper can pre\u2011parse these branches and add a\
    \ **proximity constraint**: for each residual block\u2019s input and output layers,\
    \ enforce that the distance between their primary hosting chiplets is \u2264\u202F\
    3\u202Fhops.  \nDuring candidate scoring, apply a heavy penalty to any chiplet\
    \ outside this radius when placing the output of a residual block.  \nThis directly\
    \ targets the main source of extra NoC traffic in ResNet\u201150 and can significantly\
    \ reduce overall communication.\n\n### 2.3 Soft Capacity Caps to Preserve Headroom\n\
    Instead of filling a chiplet to 100\u202F% before moving on, impose a **soft upper\
    \ bound** (e.g., 70\u202F% of its weight capacity). Once a chiplet reaches this\
    \ threshold, its score is strongly penalised, leaving headroom for future layers.\
    \  \nThis forces the mapper to spread early, making better use of the entire mesh.\n\
    \n### 2.4 I/O\u2011Aware Anchor Points\nIdentify the **first and last few layers**\
    \ (input stem and final classifier) and bias their placements toward the nearest\
    \ I/O corner.  \n- For the first layer: score candidates by `min(distance to any\
    \ IO chiplet)` and pick the closest.  \n- For the last layer: similarly prefer\
    \ proximity to an I/O corner (can be the same corner to keep data flow local).\
    \  \nGiven the corner layout, this will dramatically reduce weight\u2011loading\
    \ time and final output latency.\n\n### 2.5 Lightweight Congestion\u2011Aware\
    \ Scoring\nMaintain a simple **link utilisation accumulator** as layers are placed.\
    \ Each time a layer is assigned to chiplet `j` that must communicate with a predecessor\
    \ on chiplet `i`, increment a counter for all links on the shortest path between\
    \ `i` and `j` by the activation tensor size.  \nWhen evaluating candidate chiplets,\
    \ add a penalty proportional to the sum of existing link loads on the shortest\
    \ path from the source. This avoids placing two high\u2011volume layers on the\
    \ same bottleneck links and naturally balances NoC traffic.\n\n### 2.6 Post\u2011\
    Placement Local Search for Communication Reduction\nAfter the greedy placement,\
    \ run a few hundred trials of **stochastic improvement**:\n- Randomly select a\
    \ layer and move a small fraction (5\u202F%) of its output channels from one chiplet\
    \ to another.\n- Accept if the total weighted communication distance (`distance\
    \ \xD7 tensor_size`) decreases.\n- This is computationally cheap and can fine\u2011\
    tune the placement to escape local minima, especially for residual connections.\n\
    \n---\n\n## 3. Data / Signals the Mapper Currently Ignores That It Should Use\n\
    \n1. **Inter\u2011layer tensor (activation) volumes**  \n   The size of the output\
    \ feature map (H\u202F\xD7\u202FW\u202F\xD7\u202FC) determines the actual NoC\
    \ traffic. The mapper has access to `total_macs` and can infer activation size\
    \ from layer parameters, yet it discards this information.\n\n2. **Residual /\
    \ skip connection topology**  \n   The workload file or model definition contains\
    \ the full compute graph, including branches. The mapper treats the model as a\
    \ linear sequence; the residual edges are completely ignored, wasting a major\
    \ opportunity for co\u2011location.\n\n3. **Physical coordinates of I/O chiplets**\
    \  \n   The four corners are known; their distances could be used to minimise\
    \ weight\u2011loading and I/O streaming overhead.\n\n4. **Weight\u2011loading\
    \ path distance**  \n   Under `all_at_once` loading, the number of hops from a\
    \ chiplet to the nearest I/O corner directly impacts initialisation time. This\
    \ can be estimated and minimised.\n\n5. **Per\u2011chiplet compute capability\
    \ (the `performance` metric)**  \n   Although all chips are homogeneous in this\
    \ config, the `performance` metric exists and could be used to balance MACs per\
    \ chiplet, avoiding compute stragglers. Currently it is only a tiebreaker.\n\n\
    6. **Estimated link utilisation (traffic loads)**  \n   The cumulative data that\
    \ will traverse each NoC link can be approximated as layers are placed, enabling\
    \ congestion\u2011aware placement.\n\n7. **Activation buffer memory requirements**\
    \  \n   The mapper tracks only weight capacity; it does not account for the SRAM\
    \ needed to hold input/output feature maps. Large layers risk overflowing chiplet\
    \ memories, causing runtime stalls. This can be prevented by leaving a safety\
    \ margin.\n\n8. **Layer depth (distance from input/output)**  \n   Early layers\
    \ are input\u2011bound, late layers output\u2011bound. Knowing this sequential\
    \ position would allow smarter I/O\u2011aware biasing.\n\n9. **Current utilisation\
    \ imbalance (variance of used capacity)**  \n   The mapper could monitor the distribution\
    \ of used weights across chiplets and actively push new layers toward under\u2011\
    utilised regions, rather than only reacting to local available memory.\n\nIncorporating\
    \ these signals would transform the mapper from a blind nearest\u2011neighbour\
    \ heuristic into a network\u2011aware, communication\u2011driven placer that better\
    \ exploits the available chiplet array, directly addressing the shortcomings observed\
    \ in the current configuration."
