- change_summary: "## Proposed New Mapper: `_communication_aware_global_mapper`\n\n\
    Given the crippling latency of **707190.9 cycles** and the total failure of the\
    \ greedy nearest-neighbor approach to improve, we must abandon incremental fixes.\
    \ The core reason is that `_nearest_neighbor_mapper_v3` treats placement as a\
    \ sequence of local, capacity\u2011driven decisions **without any model of data\
    \ movement cost**. In a non\u2011pipelined, weight\u2011stationary execution on\
    \ a 10\xD710 mesh, latency is dominated by the **sum of (hop distance \xD7 activation\
    \ volume)** across all adjacent layer pairs. The mapper must explicitly minimise\
    \ this quantity while respecting per\u2011chiplet weight capacities.\n\nThe new\
    \ mapper employs a **communication\u2011volume\u2011aware, top\u2011down recursive\
    \ bipartitioning of the DNN\u2019s layer graph**, directly embedding the placement\
    \ into the physical mesh. This is a well\u2011known technique in VLSI floorplanning\
    \ and parallel processing, and it directly solves the shortcomings listed in the\
    \ analysis.\n\n---\n\n### Algorithm Overview\n\n1. **Build the Weighted Communication\
    \ Graph**  \n   - Nodes: every layer in the workload (VGG16).  \n   - Directed\
    \ edges: from layer `i` to layer `j` if `j` consumes `i`\u2019s output.  \n  \
    \ - Edge weight = number of bytes of the output activation of layer `i` (derived\
    \ from `input_activation` of the next layer or computed from dimensions).  \n\
    \   - Add two pseudo\u2011nodes, `IN_IO` and `OUT_IO`, connected to the first\
    \ layer and from the last layer respectively, with weights equal to the input\
    \ image size and final output size. This anchors the placement to the I/O chiplets.\n\
    \n2. **Normalise Layer Weights to Chiplet Capacity**  \n   - For each layer, compute\
    \ its total weight storage requirement (in weight units, as already done by `_calculate_layer_requirements`).\
    \  \n   - The total system weight capacity is 96 chiplets \xD7 2.46\u202FM weights\
    \ \xD7 bits_per_weight/8.  \n   - If any layer exceeds a single chiplet\u2019\
    s capacity, pre\u2011partition it along output channels into roughly equal\u2011\
    sized chunks. Each chunk becomes a separate node in the graph, with edges duplicated\
    \ from the original predecessors and to all successors (since a split layer forces\
    \ all consumers to receive from all chunks). This turns the fragmentation into\
    \ a graph\u2011partitioning problem that will keep the chunks close.\n\n3. **Recursive\
    \ Bipartitioning onto the Mesh**  \n   - The 10\xD710 mesh is recursively bisected:\
    \ first horizontally (top 5 rows vs. bottom 5 rows), then vertically, alternating.\
    \  \n   - At each step, the current sub\u2011mesh has a set of chiplets with total\
    \ capacity `C`. The sub\u2011set of layers (nodes) assigned to this region is\
    \ bipartitioned into two subsets `A` and `B` such that:  \n     * **Capacity balance**:\
    \ the total weight of `A` is as close as possible to half of `C`, and same for\
    \ `B`.  \n     * **Minimum edge\u2011cut weight**: the sum of edge weights crossing\
    \ from `A` to `B` (including edges to nodes already assigned to other regions)\
    \ is minimised.  \n   - This minimises the total volume of activations that must\
    \ traverse the cut, which directly translates to minimising the latency contribution\
    \ of hops across that bisection line.  \n   - The bipartitioning can be solved\
    \ using spectral graph theory (Fiedler vector) or an iterative Kernighan\u2013\
    Lin algorithm that works on weighted hypergraphs. Because the number of nodes\
    \ is small (VGG16 has ~21 layers), even an exact branch\u2011and\u2011bound with\
    \ a cut\u2011weight lower bound is feasible.\n\n4. **Mapping Partitioned Sets\
    \ to Chiplet Regions**  \n   - After ~7 bisections (log\u2082 100 \u2248 6.6),\
    \ each leaf region contains 1\u20132 chiplets. The set of layer chunks assigned\
    \ to that leaf is mapped to those specific chiplets, respecting the capacity that\
    \ was used during partitioning.  \n   - If a leaf has two chiplets and the set\
    \ still exceeds one chiplet\u2019s capacity, a simple greedy bin\u2011packing\
    \ within the pair completes the assignment.\n\n5. **Post\u2011Placement Local\
    \ Refinement**  \n   - Perform a few hundred iterations of simulated annealing:\
    \  \n     * **Move**: swap two layer chunks between nearby chiplets (within Manhattan\
    \ distance \u2264 2).  \n     * **Cost function**: total weighted communication\
    \ cost = `\u03A3 (hop_distance \xD7 activation_bytes)` over all edges plus a penalty\
    \ for exceeding capacity.  \n     * **Temperature schedule**: exponential decay.\
    \  \n   - This polishes out any sub\u2011optimalities from the top\u2011down cuts\
    \ without altering the global structure.\n\n6. **Output Format**  \n   - Once\
    \ all layer chunks are assigned, the mapper produces the same `action` array format\
    \ expected by the system (percentage of each layer on each chiplet). For layers\
    \ that were split into multiple chunks, the percentages are aggregated.\n\n---\n\
    \n### Why This Addresses the Weaknesses\n\n| Weakness | How the New Mapper Fixes\
    \ It |\n|----------|-----------------------------|\n| Greedy, myopic placement\
    \ | Global bipartitioning considers all layers simultaneously. |\n| Communication\
    \ volume ignored | Edge weights explicitly model activation sizes; cut minimises\
    \ total data movement. |\n| Fragmentation / scattered placement | Pre\u2011partitioning\
    \ turns splitting into graph nodes; bipartitioning keeps chunks spatially clustered.\
    \ |\n| Only one predecessor anchor used | The graph includes all predecessors;\
    \ the partitioner balances closeness to *all* producers. |\n| First\u2011layer\
    \ arbitrary | Pseudo\u2011IO nodes steer the first and last layers toward I/O\
    \ chiplets. |\n| No load balancing | Capacity balance constraint prevents hot\u2011\
    spots. |\n| IO chiplets ignored | Pseudo\u2011edges anchor the whole placement\
    \ to the I/O corners. |\n\n---\n\n### Expected Impact on Latency\n\nIn a non\u2011\
    pipelined, weight\u2011stationary execution, moving the majority of large activations\
    \ (e.g., VGG16\u2019s early conv layers) over short distances (1\u20132 hops)\
    \ will dramatically reduce the overall communication time. The recursive bipartitioning\
    \ directly minimises the sum of `distance \xD7 volume`, which is the exact quantity\
    \ that dictates runtime. The previous greedy approach produced a latency of ~707k\
    \ cycles largely because critical activations were traversing 5\u201310 hops;\
    \ this new mapper should shrink the average hop distance to 2\u20133, potentially\
    \ cutting latency by **50\u201370%**.\n\n---\n\n### Implementation Notes\n\n-\
    \ The new mapper will be added as a method `_communication_aware_global_mapper`\
    \ in `ModelMapper` and registered under a name like `\"global_comm_aware\"`.\n\
    - The recursive partitioning requires the weighted graph; we can use `networkx`\
    \ for graph manipulation and `scipy.sparse.linalg.eigsh` for the Fiedler vector\
    \ (spectral bipartitioning). Alternatively, a simpler Kernighan\u2013Lin implementation\
    \ is straightforward and does not require external libraries.\n- The mapper will\
    \ compute the entire model placement in one call (not layer\u2011by\u2011layer\
    \ as `generate_mapping` currently does). The `generate_mapping` method will be\
    \ modified to support a \u201Cglobal\u201D mapper that receives all layer metrics\
    \ at once.\n- Since the previous attempts showed no improvement, we must ensure\
    \ the new mapper does not simply reproduce the old one; it must be a **different**\
    \ optimization strategy, which this bipartitioning approach definitely is."
