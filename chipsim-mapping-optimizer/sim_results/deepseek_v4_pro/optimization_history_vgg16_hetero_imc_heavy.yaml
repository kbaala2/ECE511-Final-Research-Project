- change_summary: "**1. Key weaknesses of the current nearest\u2011neighbour approach**\n\
    \n- **Greedy, myopic placement**  \n  Each layer is placed only with respect to\
    \ the previous layer\u2019s most\u2011used chiplet. The algorithm never looks\
    \ ahead to future layers, so it cannot prevent a layer from being placed far from\
    \ its consumers. This leads to long activation paths, especially damaging in a\
    \ non\u2011pipelined execution where every hop adds directly to end\u2011to\u2011\
    end latency.\n\n- **No global communication\u2011cost model**  \n  The mapper\
    \ ignores the volume of data flowing between layers. A convolutional layer that\
    \ sends huge activation tensors to the next layer is treated exactly like a small\
    \ FC layer. Without weighting edge distances by the activation size, the algorithm\
    \ fails to co\u2011locate heavy communication pairs.\n\n- **Fragmented, capacity\u2011\
    driven packing**  \n  When a layer does not fit on a single chiplet, the code\
    \ consumes the nearest chiplet\u2019s entire remaining capacity, then moves to\
    \ the next nearest chiplet, and so on. This can spread a single layer across chiplets\
    \ that are far apart (due to distance ordering), forcing the layer\u2019s input\
    \ activations to be broadcast over many hops and its output activations to be\
    \ collected from multiple distant points.\n\n- **Only one prior layer\u2019s placement\
    \ matters**  \n  After the first layer, the start chiplet is always the chiplet\
    \ that held the largest *portion* of the previous layer. If the previous layer\
    \ was fragmented across many chiplets, the algorithm may pick a poorly positioned\
    \ chiplet as the anchor, ignoring the fact that other producers (from earlier\
    \ layers) also send data to the current layer. In residual or multi\u2011path\
    \ networks this completely breaks locality.\n\n- **First\u2011layer placement\
    \ is arbitrary**  \n  The first chiplet is chosen purely by \u201Cmost available\
    \ memory, then highest (undefined) performance metric\u201D. No consideration\
    \ is given to final output consumers, IO chiplet locations, or overall chiplet\
    \ occupancy. This can seed the whole mapping in a corner of the mesh, causing\
    \ later layers to drift across the entire die.\n\n- **No load\u2011balancing across\
    \ the mesh**  \n  The mapper fills one chiplet completely before touching the\
    \ next. This creates hot\u2011spots of weight storage and leaves other chiplets\
    \ empty, increasing the average distance for subsequent layers that need resources\
    \ and for the data they must exchange.\n\n- **IO chiplet positions are ignored**\
    \  \n  Four IO chiplets sit at mesh corners, but the mapper never tries to place\
    \ the first input layer near an IO chiplet or the final output layer close to\
    \ an IO chiplet. Off\u2011chip data (DRAM accesses) must then traverse the whole\
    \ network, adding unnecessary latency and energy.\n\n**2. Specific improvement\
    \ opportunities for this config (96 CMOS_Compute, 10\xD710 mesh, weight\u2011\
    stationary, non\u2011pipelined communication)**\n\n- **Global placement / floorplanning**\
    \  \n  Since the number of compute chiplets is moderate (96) and the model is\
    \ a known DAG (VGG16), a one\u2011off global optimization is feasible. Approaches\
    \ like force\u2011directed placement, spectral bipartitioning, or simulated annealing\
    \ could minimise the sum of (distance \xD7 activation volume) across all layer\
    \ dependencies while respecting per\u2011chiplet weight capacity.\n\n- **Activation\u2011\
    weighted proximity**  \n  Modify the cost metric to include the *product* of the\
    \ Manhattan distance and the output activation size (`input_activation` from the\
    \ layer info). This naturally pulls together layers that exchange the most data.\n\
    \n- **Look\u2011ahead placement**  \n  Instead of only looking backwards, maintain\
    \ a \u201Cfrontier\u201D of the next few layers and place each one at the centroid\
    \ of all its predecessors, weighted by the data each predecessor sends. This reduces\
    \ the chance of isolating a layer from its multiple producers.\n\n- **Contiguous\
    \ region allocation**  \n  Use a breadth\u2011first flood\u2011fill from a seed\
    \ chiplet (e.g., the one nearest to the expected IO location) to keep the entire\
    \ model inside a compact sub\u2011mesh. Only spill to larger distances when capacity\
    \ forces it. This drastically reduces the average number of hops.\n\n- **IO\u2011\
    aware seeding**  \n  For input\u2011dominant models, seed the mapping near an\
    \ input IO chiplet; for output\u2011dominant, near an output IO chiplet. In a\
    \ VGG16\u2011like model, both the first and last layers are important, so a central\
    \ starting point or a \u201Ctwo\u2011end\u201D approach (start from both ends\
    \ and meet) could work.\n\n- **Bipartition for fragmented layers**  \n  When a\
    \ layer must be split, use a max\u2011flow min\u2011cut or a clustering algorithm\
    \ to partition it across a *set* of chiplets that are close to each other *and*\
    \ close to the layer\u2019s producers/consumers, rather than greedily soaking\
    \ up nearby capacity one chiplet at a time.\n\n- **Incorporate network non\u2011\
    pipelining constraint**  \n  Because layers execute sequentially in non\u2011\
    pipelined mode, the *maximum* hop distance between any two dependent layers becomes\
    \ the performance bottleneck. A min\u2011max formulation (minimise the worst\u2011\
    case distance \xD7 activation volume) would directly target this config\u2019\
    s latency.\n\n**3. Data / signals currently ignored that the mapper should exploit**\n\
    \n- **Layer connectivity graph** \u2013 The full DAG of producers and consumers\
    \ is available but used only indirectly through `layer_mappings`; the algorithm\
    \ never examines the *next* layer\u2019s requirements or the flow of activations\
    \ between non\u2011adjacent layers (e.g., in residual connections).\n\n- **Activation\
    \ tensor sizes** \u2013 `layer_info` contains `'input_activation'` (the size of\
    \ the layer\u2019s input). Output activation size can be computed from layer parameters.\
    \ This volume is crucial to weight communication costs but is completely ignored.\n\
    \n- **IO chiplet positions** \u2013 The system knows which chiplets are IO (corners\
    \ of the mesh) but the mapper never uses that information to steer the placement\
    \ of the first/last layer.\n\n- **Per\u2011chiplet \u201Cperformance\u201D metric**\
    \ \u2013 The code reads `chiplet_network.nodes[chiplet_id].get(active_metric,\
    \ 0)` but the network nodes likely never have a meaningful `performance` attribute.\
    \ This metric is a dead signal.\n\n- **Available bandwidth / injection rate**\
    \ \u2013 The config specifies 128\u2011bit packets and a 1\u202FGHz network; these\
    \ could be used to estimate link congestion, but the mapper has no model of traffic\
    \ demand and therefore cannot avoid creating hotspots.\n\n- **Layer output channel\
    \ partitioning effect** \u2013 When a layer is split across multiple chiplets\
    \ (each gets a subset of output channels), the mapper does not account for the\
    \ resulting communication pattern: all producers of layer N must send to *all*\
    \ chiplets holding parts of layer N+1. This all\u2011to\u2011all pattern\u2019\
    s cost scales with the product of producer and consumer counts, which the current\
    \ algorithm does not control.\n\n- **Weight\u2011stationary re\u2011activation\
    \ cost** \u2013 In weight\u2011stationary mode, weights are loaded once; therefore\
    \ the *run\u2011time* cost is entirely due to activation movement. The mapper\
    \ should treat the placement of a layer purely as an activation\u2011flow problem,\
    \ not as a weight\u2011loading problem, yet the code only cares about weight storage\
    \ capacity, not about the recurring data flow that the placement induces."
