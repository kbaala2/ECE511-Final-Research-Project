- change_summary: "## Analysis of `_nearest_neighbor_mapper_v3` Weaknesses\n\n###\
    \ 1. Key weaknesses of the current nearest\u2011neighbour approach\n\n1. **Greedy,\
    \ backward\u2011only placement**  \n   Each layer is placed starting from the\
    \ chiplet that held the largest portion of the *previous* layer only. It never\
    \ looks ahead to the consumers of the current layer. This easily creates long\
    \ communication paths, especially when a layer is pushed far away because the\
    \ previous layer\u2019s anchor is in a corner.\n\n2. **Communication volume ignored**\
    \  \n   The mapper treats all layer\u2011to\u2011layer edges equally. A convolutional\
    \ layer that produces a huge activation tensor is placed with the same priority\
    \ as a tiny fully\u2011connected layer. Because the cost model uses only hop distance,\
    \ not `distance \xD7 bytes`, high\u2011volume edges are not co\u2011located, inflating\
    \ latency.\n\n3. **Fragmentation leads to scattered placement**  \n   When a layer\
    \ doesn\u2019t fit on one chiplet, the code consumes the nearest chiplet\u2019\
    s *entire* remaining capacity, then moves to the next nearest, etc. This can spread\
    \ a single layer\u2019s weights across chiplets that are far apart (because distance\
    \ ordering is used, not spatial compactness), creating broadcast/all\u2011reduce\
    \ patterns that traverse the whole mesh.\n\n4. **Only one previous layer\u2019\
    s anchor is used**  \n   For layers with multiple predecessors (e.g., in residual\
    \ connections), the mapper ignores all but the last\u2011mapped parent. This completely\
    \ breaks locality in multi\u2011path networks.\n\n5. **First\u2011layer seed is\
    \ arbitrary**  \n   The initial chiplet is chosen only by most available memory,\
    \ then by an unused \u201Cperformance\u201D metric. The 4 IO chiplets at the mesh\
    \ corners are never considered, so input activations from DRAM and final outputs\
    \ may have to cross the entire die.\n\n6. **No load\u2011balancing or congestion\
    \ awareness**  \n   It fills one chiplet completely before touching another, creating\
    \ hot spots and leaving many chiplets idle. In non\u2011pipelined execution, the\
    \ worst\u2011case hop count between any two dependent layers dominates latency,\
    \ but the mapper never tries to bound this maximum.\n\n---\n\n### 2. Specific\
    \ improvement opportunities given this config\n\n- **Global placement with a communication\
    \ graph**  \n  The DNN\u2019s layers form a directed acyclic graph (DAG). We can\
    \ build a weighted graph where nodes are layers (or potential partitions) and\
    \ edge weights are activation sizes. Then solve a floorplanning / quadratic placement\
    \ problem to assign nodes to chiplet locations, minimizing `\u03A3 distance \xD7\
    \ activations`.\n\n- **Activation\u2011weighted proximity**  \n  Modify the cost\
    \ function to `Manhattan distance * output_activation_size`. This directly pulls\
    \ together heavy communication pairs.\n\n- **IO\u2011aware seeding and termination**\
    \  \n  Place the first layer near an input IO chiplet (e.g., nearest available\
    \ chiplet to the top\u2011left corner) and the final layer near an output IO chiplet.\
    \ For VGG16, this shortens the data\u2011transfer paths to/from DRAM.\n\n- **Contiguous\
    \ region allocation**  \n  Use a BFS flood\u2011fill from a seed that respects\
    \ the model\u2019s natural order, only spilling into distance\u20112 neighbours\
    \ when capacity forces it. This keeps the entire model inside a compact sub\u2011\
    mesh and reduces average latency.\n\n- **Partition layers that span multiple chiplets\
    \ with spatial clustering**  \n  When a layer must be split, use a clustering\
    \ algorithm to assign the layer\u2019s weight chunks to a *set* of nearby chiplets\
    \ that are also close to its producers/consumers, instead of greedily filling\
    \ the nearest available chiplet.\n\n- **Min\u2011max formulation for non\u2011\
    pipelined execution**  \n  Since layers execute sequentially, minimize the *worst\u2011\
    case* (distance \xD7 bytes) across all adjacent layers. This can be trivially\
    \ approximated by a global optimization that penalises large distances proportionally.\n\
    \n---\n\n### 3. Data/signals the mapper currently ignores that it should use\n\
    \n| Ignored Signal               | Where it exists                         | How\
    \ it could improve placement |\n|-------------------------------|-----------------------------------------|----------------------------------|\n\
    | **Activation tensor sizes**   | `layer_info['input_activation']`        | Weight\
    \ edges in the communication graph; co\u2011locate heavy edges. |\n| **Full layer\
    \ DAG**            | Entire `model_metrics` list             | Look ahead/behind\
    \ to place layers near *all* their predecessors/successors. |\n| **IO chiplet\
    \ positions**      | `system.is_io_chiplet(id)`              | Steer first/last\
    \ layer placement to minimise DRAM\u2011network latency. |\n| **Output channel\
    \ counts**     | `layer_info['out_channels']`            | Estimate volume of\
    \ data flowing *out* of a layer; used for weighted distance. |\n| **Network bandwidth\
    \ / injection rate** | `simulation.hardware_parameters`   | Could inform congestion\u2011\
    aware placement, but not essential. |\n| **Chiplet \u201Cperformance\u201D metric**\
    \ | `chiplet_network.nodes` (likely unused) | Dead data; the mapper should ignore\
    \ it or define a meaningful metric. |\n| **Layer splitting effect on communication**\
    \ | Not captured                          | Splitting a layer turns a unicast\
    \ into a multicast to all consumers, increasing traffic quadratically; the mapper\
    \ should penalise fragmentation. |\n\n---\n\n## Proposed Different Optimization\
    \ Strategy\n\nGiven that the previous attempt (`nearest_neighbor_v3`) yields no\
    \ improvement and high latency (707\u202F190.9), a fundamentally different placement\
    \ algorithm is required. The new strategy will be a **communication\u2011volume\u2011\
    aware, global graph partitioner** that respects weight\u2011storage capacity and\
    \ mesh topology.\n\n### Strategy: **Weighted Graph Partitioning with Recursive\
    \ Bipartitioning**\n\nThe core idea is to treat the DNN as a weighted DAG, split\
    \ it into layer groups that fit within chiplet capacity, then assign those groups\
    \ to mesh regions using a top\u2011down bipartitioning that minimizes cross\u2011\
    region communication volume.\n\n#### Steps (to be implemented as a new mapper\
    \ method, e.g., `_weighted_spectral_mapper`):\n\n1. **Build an extended communication\
    \ graph**  \n   - Nodes: all layers from the workload (VGG16).  \n   - Edges:\
    \ for each layer `i` that feeds layer `j`, add a directed edge with weight = `output_activation_size(i)`.\
    \  \n   - (Optionally, add pseudo\u2011edges from input IO to first layer and\
    \ from last layer to output IO, with weights equal to the respective external\
    \ data volumes.)\n\n2. **Estimate chiplet capacity in a common unit**  \n   -\
    \ For all chiplets, compute `capacity_units` = total weight storage (bytes). For\
    \ CMOS, this is 2.46\u202FM weights \xD7 bits_per_weight / 8.  \n   - The mapper\
    \ must ensure the sum of layer weights assigned to a chiplet \u2264 capacity.\
    \  \n   - Layers larger than a single chiplet must be partitioned (see Step 5).\n\
    \n3. **Perform recursive bipartitioning of the DAG**  \n   - Recursively split\
    \ the set of layers into two subsets of approximately equal total weight (or to\
    \ match the capacity of halves of the mesh), minimising the total weight of edges\
    \ crossing the cut.  \n   - Each split corresponds to a vertical or horizontal\
    \ bisection of the mesh (10\xD710 \u2192 2\xD75\xD710, etc.).  \n   - Use a spectral\
    \ partitioner (e.g., Fiedler vector) or a Kernighan\u2011Lin style algorithm to\
    \ find the cut with minimal edge\u2011weight crossing. This effectively co\u2011\
    locates communicating layers.\n\n4. **Map sub\u2011partitions to physical chiplet\
    \ regions**  \n   - After log\u2082(100) \u2248 7 bisections, the original 10\xD7\
    10 mesh is divided into leaf regions of 1\u20132 chiplets. Assign each leaf subgraph\
    \ to the chiplet(s) in that region.  \n   - If a leaf subgraph still contains\
    \ more weights than the chiplet capacity, split layers further (see next step).\
    \  \n   - Rotate the cut direction (alternate horizontal/vertical) to keep regions\
    \ square\u2011ish.\n\n5. **Layer partitioning for oversized layers**  \n   - For\
    \ any single layer whose weight count exceeds a chiplet\u2019s capacity, split\
    \ it along the output channel dimension (as the current `LayerPartitioner` already\
    \ does) across a *set* of chiplets that belong to the same partitioned region.\
    \  \n   - The split is performed *before* final assignment, so the partitioner\
    \ treats each channel chunk as a separate node with edges to its producers/consumers\
    \ duplicated.  \n   - Ensure that all chunks of the same layer are placed on chiplets\
    \ that are as close as possible (within the same partition leaf or adjacent leaves).\n\
    \n6. **IO\u2011aligned seeding**  \n   - During the first bisection, bias the\
    \ partition to place the set containing input layers near the input IO chiplet\
    \ corner, and the set containing output layers near an output IO corner. This\
    \ can be done by artificially increasing the weight of the edge from the first\
    \ layer to the input IO.\n\n7. **Post\u2011placement reshuffling (local search)**\
    \  \n   - After initial assignment, perform a few rounds of simulated annealing\
    \ / pairwise swaps of layer chunks between chiplets within a small radius to further\
    \ reduce `\u03A3 distance \xD7 activations` while respecting capacities. This\
    \ smooths out imperfections from the top\u2011down cut.\n\n### Expected Impact\n\
    \n- **Locality**: By minimising edge\u2011cut weight at each bipartition, heavy\
    \ communication edges are pulled inside small mesh regions, slashing multi\u2011\
    hop transfers.\n- **Capacity\u2011aware**: The recursive split naturally balances\
    \ weight across chiplet groups.\n- **IO proximity**: Inputs/outputs travel short\
    \ distances, reducing DRAM\u2011related latency.\n- **Reduced fragmentation**:\
    \ Layers are partitioned only when unavoidable, and their pieces stay spatially\
    \ clustered.\n- **Scalable**: Works for any mesh size and can be adapted to other\
    \ DNNs.\n\nThis strategy directly addresses the weaknesses of the current greedy\
    \ mapper and is tailored to the non\u2011pipelined, weight\u2011stationary CMOS\
    \ setting. Implementation would reside in a new mapper function in `ModelMapper`,\
    \ called via `mapping_function=\"weighted_spectral_mapper\"`, and would utilise\
    \ `system.chiplet_network` for distances, `layer_info` for weights and activations,\
    \ and `system.chiplets` for capacity."
