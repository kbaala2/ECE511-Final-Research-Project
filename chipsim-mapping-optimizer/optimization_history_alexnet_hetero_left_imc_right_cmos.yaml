- change_summary: "Looking at the previous optimization attempts and the specific\
    \ weaknesses of the current nearest-neighbor mapper, I'll propose a different\
    \ optimization strategy that directly addresses the core limitations while being\
    \ practical to implement.\n\n## NEW OPTIMIZATION STRATEGY: **Weighted Cost-Based\
    \ Placement with Layer Affinity Clustering**\n\n### Core Insight\nThe fundamental\
    \ issue is that the current algorithm only considers **distance to the previous\
    \ layer** and **available capacity**. It misses:\n1. **Weight transfer costs**\
    \ - crucial for CMOS chiplets where weights are loaded from memory\n2. **Layer\
    \ affinity groups** - layers with similar characteristics should cluster\n3. **Spatial\
    \ spreading** - to avoid network hotspots in the mesh\n\n### Specific Implementation\
    \ Changes\n\n#### 1. **Weight Transfer-Aware Cost Function**\nFor CMOS chiplets,\
    \ weight loading is a major bottleneck. We should track where weights are stored:\n\
    \n```python\ndef _calculate_weight_transfer_cost(self, chiplet_id, layer_info,\
    \ weight_locations):\n    \"\"\"\n    Calculate cost of transferring weights to\
    \ a chiplet.\n    weight_locations: dict mapping layer_id -> list of (chiplet_id,\
    \ weight_fraction)\n    \"\"\"\n    if not weight_locations:\n        return 0\n\
    \    \n    total_cost = 0\n    for prev_layer_id, locations in weight_locations.items():\n\
    \        for prev_chiplet_id, fraction in locations:\n            if prev_chiplet_id\
    \ == chiplet_id:\n                continue  # Same chiplet, no transfer cost\n\
    \            distance = self.shortest_paths[prev_chiplet_id][chiplet_id]\n   \
    \         # Weight cost proportional to fraction and distance\n            total_cost\
    \ += fraction * distance * layer_info.get('weight_reuse_factor', 1.0)\n    \n\
    \    return total_cost\n```\n\n#### 2. **Layer Affinity Groups for AlexNet**\n\
    AlexNet has natural clusters:\n- **Early conv layers** (1-2): Large activations,\
    \ benefit from IO proximity\n- **Middle conv layers** (3-5): Moderate activations,\
    \ can be placed centrally\n- **FC layers** (6-8): Massive weights, should cluster\
    \ together\n\n```python\ndef _identify_layer_affinity_group(self, layer_idx, layer_info,\
    \ total_layers):\n    \"\"\"Assign layer to an affinity group based on its characteristics.\"\
    \"\"\n    layer_type = layer_info['layer_type']\n    weights = layer_info.get('num_weights',\
    \ 0)\n    macs = layer_info.get('total_macs', 0)\n    \n    if layer_type == 'conv':\n\
    \        if layer_idx < 2:  # First 2 conv layers\n            return 'early_conv'\n\
    \        elif layer_idx < 5:  # Next 3 conv layers\n            return 'mid_conv'\n\
    \        else:  # Last conv layer\n            return 'late_conv'\n    elif layer_type\
    \ == 'fc':\n        return 'fc_cluster'\n    else:\n        return 'other'\n```\n\
    \n#### 3. **Enhanced Nearest-Neighbor with Multi-Factor Scoring**\nReplace the\
    \ current distance-only sorting with a weighted scoring system:\n\n```python\n\
    def _enhanced_nearest_neighbor_v4(self, model_layer_info, system, preference,\
    \ \n                                 current_available_capacity, layer_mappings=None,\
    \ \n                                 shortest_paths=None, layer_idx=0, affinity_groups=None):\n\
    \    \"\"\"\n    Enhanced mapper with multi-factor cost optimization.\n    \"\"\
    \"\n    # ... existing initialization ...\n    \n    # Calculate scores for each\
    \ available chiplet\n    chiplet_scores = []\n    \n    for chiplet_id in available_chiplet_ids:\n\
    \        idx = chiplet_id - 1\n        score = 0\n        \n        # 1. Distance\
    \ to previous layer (existing logic, but weighted)\n        if layer_mappings\
    \ and layer_idx > 0:\n            prev_centroid = self._find_layer_centroid(layer_mappings[-1][1])\n\
    \            if prev_centroid:\n                distance = shortest_paths[prev_centroid][chiplet_id]\n\
    \                # Weight by activation size between layers\n                activation_weight\
    \ = self._estimate_activation_weight(layer_idx-1, layer_idx)\n               \
    \ score -= distance * activation_weight * 10  # Penalty for distance\n       \
    \ \n        # 2. Available capacity (positive factor)\n        capacity_ratio\
    \ = remaining_capacity[idx] / chiplets[idx].get_total_capacity()\n        score\
    \ += capacity_ratio * 50\n        \n        # 3. Weight transfer cost (NEW)\n\
    \        weight_cost = self._calculate_weight_transfer_cost(chiplet_id, model_layer_info,\
    \ \n                                                          self.weight_locations)\n\
    \        score -= weight_cost * 5\n        \n        # 4. Affinity group clustering\
    \ (NEW)\n        if affinity_groups and layer_idx in affinity_groups:\n      \
    \      group = affinity_groups[layer_idx]\n            group_chiplets = self.affinity_group_placements.get(group,\
    \ [])\n            if group_chiplets:\n                # Calculate average distance\
    \ to group members\n                avg_distance = np.mean([shortest_paths[g_id][chiplet_id]\
    \ \n                                       for g_id in group_chiplets])\n    \
    \            score -= avg_distance * 20  # Penalize distance from group\n    \
    \        else:\n                # First in group - prefer regions with empty neighbors\n\
    \                empty_neighbors = self._count_empty_neighbors(chiplet_id, \n\
    \                                                             remaining_capacity)\n\
    \                score += empty_neighbors * 15\n        \n        # 5. Mesh hotspot\
    \ avoidance (NEW)\n        row, col = self._chiplet_to_coords(chiplet_id)\n  \
    \      # Penalize center of mesh (rows/cols 4-5) to avoid congestion\n       \
    \ if 3 <= row <= 6 and 3 <= col <= 6:\n            score -= 25  # Center penalty\n\
    \        elif row < 2 or row > 7 or col < 2 or col > 7:\n            score +=\
    \ 10  # Edge bonus\n        \n        # 6. IO proximity for first/last layers\n\
    \        if layer_idx == 0 or layer_idx == self.total_layers - 1:\n          \
    \  io_distance = self._distance_to_nearest_io(chiplet_id)\n            score +=\
    \ 100 / (io_distance + 1)\n        \n        chiplet_scores.append((chiplet_id,\
    \ score))\n    \n    # Sort by score (highest first)\n    chiplet_scores.sort(key=lambda\
    \ x: x[1], reverse=True)\n    sorted_chiplets_ids = [cid for cid, _ in chiplet_scores]\n\
    \    \n    # ... rest of allocation logic ...\n```\n\n#### 4. **Batch-Aware Weight\
    \ Preloading**\nFor CMOS chiplets, we can optimize weight loading by tracking\
    \ where weights are stored:\n\n```python\nclass WeightLocationTracker:\n    def\
    \ __init__(self):\n        self.weight_locations = {}  # layer_id -> [(chiplet_id,\
    \ weight_fraction)]\n    \n    def update(self, layer_idx, layer_mapping):\n \
    \       \"\"\"Track where each layer's weights are placed.\"\"\"\n        self.weight_locations[layer_idx]\
    \ = []\n        for chiplet_id, percentage in layer_mapping:\n            if percentage\
    \ > 0:\n                self.weight_locations[layer_idx].append((chiplet_id, percentage/100))\n\
    \    \n    def get_optimal_placement(self, chiplet_id, layer_info, next_layer_info=None):\n\
    \        \"\"\"Suggest optimal chiplet for weight reuse.\"\"\"\n        # Check\
    \ if this layer shares weights with previous layers\n        reuse_candidates\
    \ = []\n        for prev_layer_id, locations in self.weight_locations.items():\n\
    \            # Simple heuristic: layers with similar dimensions might share weights\n\
    \            if self._layers_share_weights(prev_layer_id, layer_info):\n     \
    \           for loc_chiplet_id, fraction in locations:\n                    if\
    \ fraction > 0.3:  # Significant weight fraction\n                        reuse_candidates.append((loc_chiplet_id,\
    \ fraction))\n        \n        if reuse_candidates:\n            # Prefer chiplets\
    \ with existing weights\n            return max(reuse_candidates, key=lambda x:\
    \ x[1])[0]\n        return None\n```\n\n#### 5. **Dynamic Load Balancing with\
    \ Capacity Reservation**\nReserve capacity for future layers based on their requirements:\n\
    \n```python\ndef _predict_future_demand(self, layer_idx, model_metrics):\n   \
    \ \"\"\"Predict capacity needs for upcoming layers.\"\"\"\n    lookahead = 3\n\
    \    future_demand = {}\n    \n    for i in range(layer_idx + 1, min(layer_idx\
    \ + lookahead + 1, len(model_metrics))):\n        layer = model_metrics[i]\n \
    \       layer_type = layer['layer_type']\n        \n        # Different capacity\
    \ patterns\n        if layer_type == 'fc':\n            # FC layers need more\
    \ weight capacity\n            future_demand.setdefault('weight_intensive', 0)\n\
    \            future_demand['weight_intensive'] += 1\n        else:\n         \
    \   # Conv layers need more compute\n            future_demand.setdefault('compute_intensive',\
    \ 0)\n            future_demand['compute_intensive'] += 1\n    \n    return future_demand\n\
    ```\n\n### 6. **Mesh Region-Based Placement**\nGiven the 10\xD710 mesh with corner\
    \ IO, create strategic regions:\n\n```python\ndef _get_mesh_region(self, chiplet_id):\n\
    \    \"\"\"Get the mesh region for a chiplet.\"\"\"\n    row, col = self._chiplet_to_coords(chiplet_id)\n\
    \    \n    if row < 5:\n        if col < 5:\n            return 'NW'\n       \
    \ else:\n            return 'NE'\n    else:\n        if col < 5:\n           \
    \ return 'SW'\n        else:\n            return 'SE'\n\ndef _balance_regions(self,\
    \ remaining_capacity):\n    \"\"\"Ensure load is balanced across mesh regions.\"\
    \"\"\n    region_capacity = {'NW': 0, 'NE': 0, 'SW': 0, 'SE': 0}\n    \n    for\
    \ idx, capacity in enumerate(remaining_capacity):\n        if capacity > 0 and\
    \ not self.system.is_io_chiplet(idx + 1):\n            region = self._get_mesh_region(idx\
    \ + 1)\n            region_capacity[region] += capacity\n    \n    return region_capacity\n\
    ```\n\n### Implementation Strategy:\n\n1. **Phase 1: Layer Analysis**\n   - Analyze\
