- change_summary: "We need a fundamentally different approach because the previous\
    \ tweak to the nearest\u2011neighbor heuristic (Iteration\u202F1) did not change\
    \ the resulting mapping at all \u2013 latency remained identical at 311633.13.\
    \ My analysis shows the root cause is that the mapper ignores inter\u2011layer\
    \ communication cost entirely and uses only a single\u2011point anchor. Simply\
    \ patching the anchor selection (e.g., by preferring I/O closeness) is insufficient\
    \ for VGG\u201116 on a 10\xD710 mesh. We must introduce a global cost function\
    \ that explicitly models activation traffic and then optimise the allocation.\n\
    \nI propose a **communication\u2011aware post\u2011optimisation** built on top\
    \ of the existing greedy placement. The steps:\n\n1. **Run the current greedy\
    \ mapper to obtain an initial feasible solution.**  \n   This gives us a set of\
    \ layer\u2011to\u2011chiplet percentage assignments that respect all capacity\
    \ constraints. We keep the same allocation for the initial pass so that the base\
    \ solution always exists.\n\n2. **Define a synthetic communication cost for the\
    \ whole network.**  \n   For each pair of consecutive layers \\((L_k, L_{k+1})\\\
    ), compute the total number of activation elements that flow from every producer\
    \ chiplet to every consumer chiplet.  \n   - Let \\(f_{k,i}\\) be the fraction\
    \ (0\u2011100 scale, normalised) of layer \\(k\\) placed on chiplet \\(i\\). \
    \ \n   - Let \\(V_k\\) be the total number of output activation elements of layer\
    \ \\(k\\) \u2013 easily derived from layer parameters (e.g., for Conv2d: \\(H\
    \ \\times W \\times C_{out}\\)).  \n   - The cost contribution of this edge is:\
    \  \n     \\[\n     C_{k,k+1} = V_k \\cdot \\sum_{i} \\sum_{j} f_{k,i} \\cdot\
    \ f_{k+1,j} \\cdot d(i,j)\n     \\]\n     where \\(d(i,j)\\) is the pre\u2011\
    computed shortest\u2011path hop distance between chiplet \\(i\\) and \\(j\\).\n\
    \n   The total mapping cost is the sum over all consecutive layer pairs, plus\
    \ **I/O penalties**:\n   - Add a term for the first layer: \\(V_{input} \\cdot\
    \ \\sum_{i} f_{1,i} \\cdot d_{IO}(i)\\), using the average distance to the four\
    \ corner I/O chiplets (or the nearest one, depending on how external data enters).\n\
    \   - Add a symmetric term for the last layer\u2019s output to I/O.\n   \n   This\
    \ cost directly reflects the volume of bit\u2011hops that the activation traffic\
    \ will generate in the mesh.\n\n3. **Apply simulated annealing (SA) to minimise\
    \ this cost while maintaining capacity constraints.**  \n   The state is the set\
    \ of percentage vectors for all layers. We perturb it by moving a small fraction\
    \ (e.g., 5\u201110%) of one layer from one chiplet to another, provided the receiving\
    \ chiplet has sufficient available weight capacity (in CMOS units). We recompute\
    \ the cost and accept/reject according to the Metropolis criterion. Because VGG\u2011\
    16 has only 16 layers and the mesh has 96 compute chiplets, even a few thousand\
    \ iterations are computationally cheap.\n\n   *Implementation details:*\n   -\
    \ Initial temperature set to a fraction of the initial cost, cooling schedule\
    \ \\(T_{new} = 0.95 \\cdot T\\).\n   - At each step, randomly pick a layer, its\
    \ current non\u2011zero allocation, and a candidate target chiplet that fits the\
    \ moved weight units.\n   - To escape local minima efficiently, allow occasional\
    \ moves that increase cost, and restrict the target chiplets to those within a\
    \ reasonable distance (e.g., \u22645 hops) from the current allocation centre.\n\
    \   - Before accepting any move, verify that the total weight units on the target\
    \ chiplet do not exceed its capacity; if they do, reduce the move size or re\u2011\
    select.\n   - Track the best\u2011observed state throughout and return it.\n\n\
    4. **Replace the last step of `generate_mapping` with this SA refinement.**  \n\
    \   The existing code first builds the greedy solution, then commits it. We will\
    \ insert a call to an optimiser *after* the greedy pass but *before* committing\
    \ to the system. The optimiser returns an improved set of percentages; we then\
    \ write those into the temporary capacity state and commit as before.\n\nThis\
    \ strategy attacks the communication problem head\u2011on and can automatically\
    \ discover mappings where, for instance, the first layer clusters near the corner\
    \ I/O nodes, heavy convolution layers stay centrally co\u2011located, and large\
    \ FC layers are placed to minimise data movement from preceding pools. It does\
    \ not modify the greedy heuristic at all, making it a genuinely different approach\
    \ with a high chance of substantial latency reduction.\n\nIf the team prefers\
    \ a lighter\u2011weight change, a simpler variant would be to replace only the\
    \ anchor selection rule with the **volume\u2011weighted centroid**. After greedy\
    \ placement of layer \\(k\\), compute the chiplet \\(c^* = \\arg\\min_c \\sum_i\
    \ f_{k,i} \\cdot d(i,c)\\). Use \\(c^*\\) as the starting point for the next layer\
    \ (instead of the single maximum chiplet). While less powerful than full SA, it\
    \ still uses the communication volume signal and should yield a different mapping\
    \ than Iteration\u202F1. I recommend starting with the SA, however, as it directly\
    \ optimises the cost we care about."
