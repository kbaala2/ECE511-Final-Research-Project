- change_summary: "1. Key Weaknesses of the Current Nearest-Neighbor Approach  \n\
    \   - **Myopic, greedy allocation without communication cost modeling**  \n  \
    \   The mapper places each layer independently, filling the nearest chiplets (by\
    \ hop distance) from the previous layer\u2019s most allocated chiplet. It does\
    \ not estimate or optimize the activation communication volume between layers.\
    \ For weight\u2011stationary pipelines, this can easily produce high\u2011volume\
    \ traffic that traverses many hops because producer and consumer partitions end\
    \ up far apart.  \n\n   - **No awareness of I/O placement**  \n     The 10\xD7\
    10 mesh has four I/O chiplets at the corners. The initial layer\u2019s input must\
    \ come from an I/O node, and the final layer\u2019s output must go to an I/O node,\
    \ yet the mapper ignores this. The first layer is arbitrarily placed on the chiplet\
    \ with the most free memory, which may be deep in the mesh, adding unnecessary\
    \ latency and energy for input data movement.  \n\n   - **Anchor\u2011only chaining\
    \ between layers**  \n     Only the chiplet that received the largest percentage\
    \ of the current layer is used as the starting point for the next layer. This\
    \ single\u2011point heuristic discards the spatial distribution of the current\
    \ layer\u2019s output and can lead to inefficient mappings when the current layer\
    \ is spread over many chiplets \u2013 the next layer\u2019s \u201Ccenter\u201D\
    \ may not align well with its actual input sources.  \n\n   - **Capacity fragmentation\
    \ over time**  \n     The algorithm fills the nearest available chiplets without\
    \ any load balancing. Over many layers, the central region becomes heavily occupied\
    \ while far\u2011away chiplets remain underutilised. Later large layers are then\
    \ forced to spread far from the rest of the pipeline, increasing network distances\
    \ and making some memory capacity unreachable for practical use.  \n\n   - **Ignores\
    \ potential for single\u2011chiplet mapping**  \n     Although a layer that fits\
    \ entirely in one chiplet *is* assigned to a single chiplet (good), the algorithm\
    \ does not globally consider the benefit of keeping certain layers whole to avoid\
    \ inter\u2011chiplet communication. It never re\u2011evaluates earlier decisions\
    \ to enable later layers to be placed contiguously.  \n\n   - **No look\u2011\
    ahead or global optimisation**  \n     The sequential, greedy nature with no backtracking\
    \ means the mapper cannot trade off memory occupation against communication cost\
    \ across the whole model. A suboptimal early placement can degrade the mapping\
    \ quality for all subsequent layers.  \n\n2. Specific Opportunities for Improvement\
    \ Given This Configuration  \n   - **I/O\u2011aware first/last layer anchoring**\
    \  \n     With corner I/O chiplets, the first (and sometimes last) layer should\
    \ be placed as close as possible to those corners. One could bias the start chiplet\
    \ selection by adding a penalty proportional to the distance to the nearest I/O\
    \ chiplet. This would reduce input/output activation latency with almost no change\
    \ to the algorithm\u2019s structure.  \n\n   - **Communication\u2011volume\u2011\
    weighted distance minimisation**  \n     Since the layer parameters are known\
    \ (number of output channels, input activation size), the mapper can compute the\
    \ expected amount of data flowing between layer *i* and layer *i+1*. During placement\
    \ of layer *i+1*, instead of anchoring on the single max\u2011percentage chiplet\
    \ of layer *i*, compute a weighted centroid of layer *i*\u2019s output *channels*\
    \ and *volume*, then select the start chiplet that minimises the sum of (distance\
    \ \xD7 partial volume) to all producer chiplets.  \n\n   - **Load\u2011balanced\
    \ placement to preserve central capacity**  \n     Introduce a soft occupation\
    \ cap or a repulsion term in the chiplet sorting to prevent the centre from filling\
    \ up too quickly. For example, when two chiplets are equally distant, prefer the\
    \ one with lower occupancy. This leaves room near the pipeline core for intermediate\
    \ layers that benefit from proximity.  \n\n   - **Layer packing:** For small layers,\
    \ explicitly try to pack them onto chiplets that already contain previous layers\u2019\
    \ weights (reusing same chiplets) as long as they fit, even if they are slightly\
    \ farther. This reduces fragmentation and conserves fresh memory for giant layers.\
    \  \n\n   - **Global optimisation pass**  \n     After the initial greedy placement,\
    \ run a lightweight post\u2011pass (e.g., simulated annealing or a few swap moves)\
    \ that exchanges layer partitions between chiplets to reduce the overall weighted\
    \ communication distance while keeping memory constraints satisfied. With only\
    \ 16 layers in VGG\u201116 and 10\xD710 mesh, a few hundred iterations of a local\
    \ search could yield a significantly better mapping.  \n\n3. Data / Signals the\
    \ Mapper Currently Ignores That It Should Use  \n   - **Inter\u2011layer activation\
    \ volume matrix**  \n     For each pair of consecutive layers, the mapper knows\
    \ the output activation dimensions and the number of output channels. It can estimate\
    \ the total data (in bytes) that must be communicated from each producer partition\
    \ to each consumer partition. This matrix is the fundamental cost that placement\
    \ should minimise.  \n\n   - **I/O chiplet locations and bandwidth**  \n     The\
    \ system knows which chiplets are I/O and their network positions. The mapper\
    \ should read this from `system.chiplet_network` and incorporate a bias toward\
    \ I/O nodes for layers that interface with external data (first/last).  \n\n \
    \  - **Chiplet topology beyond hop count**  \n     While hop distance is used,\
    \ the adjacency matrix (provided via `adj_matrix_10x10_mesh.csv`) can reveal bisection\
    \ bandwidth limitations or uneven connectivity. Even in a regular mesh, corners\
    \ have degree 2, edges degree 3, interior degree 4. The mapper could favour higher\u2011\
    degree nodes for heavily communicating partitions to reduce contention.  \n\n\
    \   - **Layer execution order and pipeline parallelism**  \n     The workload\
    \ description (`workload_vgg16.csv`) likely contains layer execution order. If\
    \ the simulator supports pipelining (weight\u2011stationary, all weights loaded\
    \ once), the mapper could try to co\u2011locate layers that are active simultaneously\
    \ to exploit temporal locality, not merely spatial proximity.  \n\n   - **Per\u2011\
    chiplet memory pressure over time**  \n     Instead of just the remaining capacity,\
    \ the mapper should track which chiplets are already heavily loaded with many\
    \ small layers versus those that are lightly loaded. A metric like **weight utilization\
    \ ratio** can guide future allocations to avoid starving later layers of contiguous\
    \ large memory blocks.  \n\nIn summary, the nearest\u2011neighbor mapper is a\
    \ reasonable starting heuristic, but it treats placement as a simple packing problem\
    \ and ignores the dominant cost in a weight\u2011stationary architecture: activation\
    \ communication. Incorporating even a rudimentary communication volume model and\
    \ I/O awareness would yield substantial improvements in latency and energy for\
    \ the given 10\xD710 mesh with corner I/O and VGG\u201116 workload."
