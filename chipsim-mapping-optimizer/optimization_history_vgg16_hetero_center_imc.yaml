- function_name: volume_centric_nn_mapper
  iteration: 3
  outcome: RUNTIME_SUCCESS
  runtime_attempt: 1
- change_summary: "Given the previous attempts (Iteration\u202F1\u2019s description-only\
    \ analysis and Iteration\u202F2\u2019s successful simulated\u2011annealing (SA)\
    \ post\u2011optimisation that reduced latency by about 4%), a **fundamentally\
    \ different strategy** is required that addresses the root weaknesses *inside\
    \ the greedy placement itself* rather than relying on a separate global search.\
    \ The SA approach, while effective, treats mapping as a black\u2011box optimisation\
    \ and may still miss large, obvious structural improvements that could be captured\
    \ by a smarter, communication\u2011aware heuristic. I propose a **Volume\u2011\
    Centric Nearest\u2011Neighbour (VC\u2011NN)** algorithm that directly integrates\
    \ inter\u2011layer activation traffic, I/O proximity, and load\u2011balancing\
    \ into every placement decision, without the computational overhead of SA.\n\n\
    ---\n### 1. Key Weaknesses Revisited\nThe current `_nearest_neighbor_mapper_v3`:\n\
    \n- Ignores the **volume of activation data** that must travel between consecutive\
    \ layers.\n- Anchors the search for the next layer on only the **single chiplet\
    \ with the largest fraction** of the current layer.\n- Chooses the **first layer\u2019\
    s start chiplet** based solely on raw memory availability and an arbitrary metric,\
    \ completely ignoring the location of the four corner I/O chiplets.\n- Fills nearby\
    \ chiplets greedily without considering that **central chiplets become congested**,\
    \ forcing later layers to spread far away.\n- Has no notion of **producer\u2011\
    consumer \u201Cdistance\u201D** beyond a one\u2011hot anchor point.\n\nSA can\
    \ mitigate these to some extent, but a **deterministic, efficient heuristic**\
    \ that internalises the communication cost can yield even better initial solutions\
    \ and serve as a stronger base for any future refinement.\n\n---\n### 2. Proposed\
    \ Algorithm: Volume\u2011Centric Nearest\u2011Neighbour (VC\u2011NN)\n\n#### 2.1\
    \ Pre\u2011computed Data\nBefore mapping begins, the mapper can compute:\n\n-\
    \ **Inter\u2011layer activation volume** \\(V_k\\) for each layer \\(k\\) (in\
    \ number of elements, e.g., \\(H_k \\times W_k \\times C_{k}^{out}\\)). For convolutional\
    \ and FC layers, these are readily available from the model definition.\n- **Distances\
    \ to I/O chiplets**: For each compute chiplet, compute the shortest\u2011path\
    \ distance to the **nearest corner I/O chiplet** (or an average distance to all\
    \ four, depending on the data\u2011flow model). Let \\(d_{\\text{IO}}(i)\\) be\
    \ that distance for chiplet \\(i\\).\n\n#### 2.2 First\u2011Layer Placement \u2013\
    \ I/O\u2011Aware Start\nFor the initial layer, we must minimise the latency of\
    \ bringing input activations from an I/O node. Instead of picking the chiplet\
    \ with the most free memory, we choose the **start chiplet** that minimises a\
    \ combined cost:\n\n\\[\n\\text{cost}_{\\text{start}}(i) = w_{\\text{IO}} \\cdot\
    \ d_{\\text{IO}}(i) \\;-\\; w_{\\text{mem}} \\cdot \\text{avail\\_mem}(i)\n\\\
    ]\n\nwhere \\(w_{\\text{IO}}\\) and \\(w_{\\text{mem}}\\) are tunable weights\
    \ (e.g., both 1.0 normalised). This biases the start toward a corner, ensuring\
    \ the input data travels a short distance. If the first layer is too large for\
    \ a single chiplet, the allocation then spreads outward from that start point\
    \ according to the standard nearest\u2011neighbour fill (Step 2.4). This simple\
    \ change eliminates the arbitrary start\u2011chiplet selection of the original\
    \ mapper.\n\n#### 2.3 Inter\u2011Layer Anchoring via Volume\u2011Weighted Centroid\n\
    For layer \\(L_{k+1}\\), instead of anchoring on the chiplet that received the\
    \ largest percentage of \\(L_k\\), we compute the **volume\u2011weighted centre\
    \ of mass** of \\(L_k\\)\u2019s output. Let \\(f_{k,i}\\) be the fraction (0\u2013\
    100) of layer \\(k\\) placed on chiplet \\(i\\). The ideal chiplet to **start**\
    \ allocating \\(L_{k+1}\\) is the one that minimises the total communication volume\
    \ from all producer partitions:\n\n\\[\nc^* = \\underset{c \\in \\text{compute\\\
    _chiplets}}{\\arg\\min} \\sum_{i} f_{k,i} \\cdot V_k \\cdot d(i, c)\n\\]\n\nBecause\
    \ \\(V_k\\) is a constant factor for a given layer pair, this is equivalent to\
    \ minimising \\(\\sum_i f_{k,i} \\cdot d(i, c)\\). The **centroid chiplet** \\\
    (c^*\\) is the best single point to concentrate the next layer\u2019s allocations\
    \ and can be found efficiently by evaluating this sum for each candidate (or,\
    \ if the topology permits, by selecting the chiplet that minimises the weighted\
    \ sum, which on a mesh can be approximated by weighted medians\u2014but brute\u2011\
    force over 96 chiplets is trivial).\n\nThis method properly accounts for the **spatial\
    \ distribution** of the previous layer and avoids the \u201Cmax\u2011chiplet\u201D\
    \ blind spot when the output is spread over several distant chiplets.\n\n####\
    \ 2.4 Capacity\u2011Aware, Load\u2011Balanced Nearest\u2011Neighbour Fill\nOnce\
    \ the optimal start chiplet \\(c^*\\) is determined, we proceed to allocate the\
    \ required percentage of layer \\(L_{k+1}\\) across available compute chiplets.\
    \ The original algorithm sorts candidate chiplets by distance from the start chiplet,\
    \ then by available memory. This tends to saturate the central region over time.\
    \ We **augment the sorting key** with a soft occupancy penalty:\n\n\\[\n\\text{priority}(i)\
    \ = d(i, c^*) \\;+\\; \\alpha \\cdot \\text{occupancy}(i)\n\\]\n\nwhere \\(\\\
    text{occupancy}(i)\\) is the fraction of the chiplet\u2019s total weight capacity\
    \ already consumed (or the fraction fill level, 0\u20131). \\(\\alpha\\) is a\
    \ small coefficient (e.g., 0.5\u20131.0) that gently encourages the mapper to\
    \ use slightly farther chiplets if the nearest ones are already heavily loaded.\
    \ This **preserves central capacity** for later, possibly large layers that gain\
    \ the most from proximity. The remainder of the fill logic (allocating whole capacity\
    \ units and tracking percentages) remains unchanged.\n\n#### 2.5 Final\u2011Layer\
    \ I/O Bias\nA similar volume\u2011based cost can be applied when placing the very\
    \ last layer: we want its output to be close to an I/O corner. After the initial\
    \ greedy placement of the last layer (using the centroid anchor from the penultimate\
    \ layer), we can optionally **re\u2011evaluate** the start chiplet for the last\
    \ layer by minimising:\n\n\\[\n\\text{cost}_{\\text{last}}(i) = \\sum_{j} f_{\\\
    text{penult},j} \\cdot d(j, i) \\;+\\; \\beta \\cdot d_{\\text{IO}}(i)\n\\]\n\n\
    with a small \\(\\beta\\) (e.g., 0.1\u20130.2) that nudges the final layer\u2019\
    s placement toward an I/O node without sacrificing too much communication volume\
    \ from the previous layer. This can be implemented as a final\u2011step refinement,\
    \ or integrated into the centroid calculation for the last layer by adding a dummy\
    \ \u201Coutput sink\u201D at the nearest I/O chiplet.\n\n---\n### 3. Why This\
    \ is Different and Expected to Improve Further\n\n- **SA is reactive** \u2013\
    \ it starts from a greedy solution and tries local moves to lower a global cost.\
    \ VC\u2011NN **proactively** embeds the same inter\u2011layer volume metric into\
    \ every decision, arriving at a solution that is already near-optimal without\
    \ expensive post\u2011processing.\n- **I/O anchoring for the first layer** can\
    \ cut a large, constant source of latency that SA may not explore aggressively\
    \ because it requires moving a large fraction of the first layer over many hops.\n\
    - **The centroid anchor** uses the full output distribution, which SA would have\
    \ to discover step\u2011by\u2011step. The deterministic heuristic is guaranteed\
    \ to produce a locally communication\u2011efficient inter\u2011layer link.\n-\
    \ **Load\u2011balancing via occupancy** prevents fragmentation, which is hard\
    \ for SA to fix in a high\u2011temperature phase without violating capacity constraints.\n\
    - The algorithm retains the efficiency of the greedy pass (O(L\xB7C\xB2) where\
    \ L is layers, C is chiplets) and remains **deterministic, reproducible, and easy\
    \ to tune** with a few weights.\n\nTogether, these changes directly attack the\
    \ weaknesses identified in Iteration\u202F1, and because they operate inside the\
    \ greedy mapper, they provide a clean, modular alternative to SA. They can be\
    \ implemented as a new mapper function (e.g., `_volume_centric_nearest_neighbor`)\
    \ and integrated into `ModelMapper._get_mapper_function`. No external optimisation\
    \ library is needed.\n\n---\n### 4. Expected Impact\nOn the VGG\u201116 workload\
    \ with the 10\xD710 mesh, we anticipate:\n\n- Substantial reduction in input\u2011\
    activation latency from the I/O\u2011aware first layer placement.\n- Shorter average\
    \ hop\u2011count for the inter\u2011layer communication that dominates the pipeline\
    \ because the centroid alignment minimises weighted distance.\n- Better long\u2011\
    range capacity usage, preventing later fully\u2011connected layers from being\
    \ forced to remote chiplets.\n- A **further latency reduction beyond the 4% observed\
    \ from SA**, possibly pushing into the 5\u201310% range, while maintaining a deterministic\
    \ and fast mapping step.\n\nThis new strategy complements the SA approach (the\
    \ output of VC\u2011NN could even serve as a superior initial solution for SA\
    \ if even more optimisation is desired), but it addresses the problem from a completely\
    \ different angle\u2014making the greedy algorithm itself aware of what it previously\
    \ ignored."
